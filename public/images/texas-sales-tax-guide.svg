<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Texas sales tax guide illustration</title>
  <desc id="desc">A stylized Texas receipt with state and local sales tax lines, a calculator, and the outline of Texas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e7e5e4"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="130" r="210" fill="#b91c1c" opacity=".24"/>
  <circle cx="180" cy="780" r="260" fill="#1d4ed8" opacity=".2"/>
  <path d="M1090 180l75 24 52-18 32 54 73 24-20 72 52 40-37 53 2 68-77 10-37 66-66-27-57 43-42-63-78-1 8-73-56-47 46-54-14-72 75-13 39-66z" fill="#f8fafc" opacity=".13"/>
  <g transform="translate(245 105)">
    <path d="M0 0h650v650l-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18-25-18-25 18V0z" fill="url(#paper)"/>
    <text x="325" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#111827">TEXAS RECEIPT</text>
    <text x="325" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#475569">Understanding the final price</text>
    <line x1="65" y1="145" x2="585" y2="145" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10"/>
    <g font-family="Arial,sans-serif" font-size="27" fill="#1f2937">
      <text x="70" y="205">Purchase subtotal</text><text x="570" y="205" text-anchor="end">$100.00</text>
      <text x="70" y="270">Texas state tax</text><text x="570" y="270" text-anchor="end">+</text>
      <text x="70" y="335">City / county / district</text><text x="570" y="335" text-anchor="end">+</text>
      <text x="70" y="400">Exemptions, if applicable</text><text x="570" y="400" text-anchor="end">−</text>
    </g>
    <line x1="65" y1="440" x2="585" y2="440" stroke="#0f172a" stroke-width="4"/>
    <text x="70" y="505" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#991b1b">FINAL TOTAL</text>
    <text x="570" y="505" text-anchor="end" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#991b1b">VARIES</text>
    <text x="325" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#475569">Rate + item + location + exemption</text>
  </g>
  <g transform="translate(1010 515)">
    <rect width="320" height="245" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="8"/>
    <rect x="36" y="28" width="248" height="55" rx="8" fill="#dbeafe"/>
    <g fill="#64748b">
      <rect x="38" y="110" width="55" height="35" rx="6"/><rect x="108" y="110" width="55" height="35" rx="6"/><rect x="178" y="110" width="55" height="35" rx="6"/><rect x="248" y="110" width="35" height="35" rx="6"/>
      <rect x="38" y="158" width="55" height="35" rx="6"/><rect x="108" y="158" width="55" height="35" rx="6"/><rect x="178" y="158" width="55" height="35" rx="6"/><rect x="248" y="158" width="35" height="35" rx="6"/>
    </g>
    <rect x="38" y="206" width="195" height="22" rx="6" fill="#94a3b8"/><rect x="248" y="206" width="35" height="22" rx="6" fill="#b91c1c"/>
  </g>
  <text x="1110" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#f8fafc">STATE + LOCAL</text>
  <text x="1110" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#cbd5e1">Rates, exemptions, online sales</text>
  <text x="1110" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#cbd5e1">permits and use tax</text>
</svg>
