<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Texas camping checklist</title>
  <desc id="desc">An illustrated checklist for reservations, weather, water, shelter, fire rules, food, lighting, and first aid.</desc>
  <rect width="1400" height="900" rx="36" fill="#f3ead8"/>
  <rect x="70" y="70" width="1260" height="760" rx="28" fill="#fffaf0" stroke="#8b3f2b" stroke-width="8"/>
  <text x="120" y="155" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#26382c">Texas Camping Checklist</text>
  <text x="120" y="205" font-family="Arial,sans-serif" font-size="26" fill="#6d5d4c">Verify the campsite, conditions, and essentials before leaving home.</text>
  <g font-family="Arial,sans-serif" font-size="30" fill="#26382c">
    <g transform="translate(120 285)">
      <rect width="48" height="48" rx="8" fill="#dfe8dc" stroke="#31553b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#31553b" stroke-width="6"/><text x="75" y="35">Reservation and exact site details</text>
    </g>
    <g transform="translate(120 370)">
      <rect width="48" height="48" rx="8" fill="#dfe8dc" stroke="#31553b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#31553b" stroke-width="6"/><text x="75" y="35">Weather, wind, heat, and overnight lows</text>
    </g>
    <g transform="translate(120 455)">
      <rect width="48" height="48" rx="8" fill="#dfe8dc" stroke="#31553b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#31553b" stroke-width="6"/><text x="75" y="35">Drinking water and emergency reserve</text>
    </g>
    <g transform="translate(120 540)">
      <rect width="48" height="48" rx="8" fill="#dfe8dc" stroke="#31553b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#31553b" stroke-width="6"/><text x="75" y="35">Tent, stakes, sleeping gear, and rain cover</text>
    </g>
    <g transform="translate(760 285)">
      <rect width="48" height="48" rx="8" fill="#f1dfd5" stroke="#8b3f2b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#8b3f2b" stroke-width="6"/><text x="75" y="35">Burn bans and cooking rules</text>
    </g>
    <g transform="translate(760 370)">
      <rect width="48" height="48" rx="8" fill="#f1dfd5" stroke="#8b3f2b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#8b3f2b" stroke-width="6"/><text x="75" y="35">Food storage and wildlife safety</text>
    </g>
    <g transform="translate(760 455)">
      <rect width="48" height="48" rx="8" fill="#f1dfd5" stroke="#8b3f2b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#8b3f2b" stroke-width="6"/><text x="75" y="35">Headlamps, batteries, and backup light</text>
    </g>
    <g transform="translate(760 540)">
      <rect width="48" height="48" rx="8" fill="#f1dfd5" stroke="#8b3f2b" stroke-width="5"/><path d="M12 25 l10 10 18-24" fill="none" stroke="#8b3f2b" stroke-width="6"/><text x="75" y="35">First aid, medications, and trip contact</text>
    </g>
  </g>
  <g transform="translate(515 660)">
    <path d="M0 100 L100 0 L205 100 Z" fill="#c75a34" stroke="#8b3f2b" stroke-width="6"/>
    <path d="M100 0 L120 100 L205 100 Z" fill="#913e2d"/>
    <path d="M78 100 L104 48 L135 100 Z" fill="#26382c"/>
    <path d="M255 105 c18-38 18-65 0-88 c38 15 55 43 45 82 c-7 29-30 46-45 53 c-15-7-38-24-45-53 c-8-33 5-61 38-78 c-13 26-10 51 7 84z" fill="#e07b3f"/>
  </g>
</svg>