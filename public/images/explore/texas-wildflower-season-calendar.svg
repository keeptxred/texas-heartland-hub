<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Texas wildflower season calendar</title>
  <desc id="desc">An illustrated calendar showing winter rosettes, spring bluebonnets and paintbrush, summer sunflowers, and fall golden blooms.</desc>
  <rect width="1400" height="780" rx="28" fill="#f7f3e8"/>
  <text x="70" y="85" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#173b2c">Texas wildflowers through the year</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 145)">
      <rect width="290" height="520" rx="24" fill="#dce9ee"/>
      <text x="30" y="58" font-size="30" font-weight="700" fill="#24485a">Winter</text>
      <text x="30" y="98" font-size="20" fill="#365d6d">December–February</text>
      <path d="M70 400 C120 300 190 300 230 400" fill="none" stroke="#4e7554" stroke-width="14"/>
      <ellipse cx="105" cy="345" rx="42" ry="18" fill="#718e62" transform="rotate(-28 105 345)"/>
      <ellipse cx="190" cy="345" rx="42" ry="18" fill="#718e62" transform="rotate(28 190 345)"/>
      <text x="30" y="470" font-size="18" fill="#365d6d">Look for basal growth,</text><text x="30" y="498" font-size="18" fill="#365d6d">early desert blooms, and</text><text x="30" y="526" font-size="18" fill="#365d6d">rain-dependent starts.</text>
    </g>
    <g transform="translate(390 145)">
      <rect width="290" height="520" rx="24" fill="#e5e2f5"/>
      <text x="30" y="58" font-size="30" font-weight="700" fill="#3b3f7a">Spring</text>
      <text x="30" y="98" font-size="20" fill="#565b8d">March–May</text>
      <g fill="#4967bd"><circle cx="145" cy="250" r="28"/><circle cx="110" cy="292" r="24"/><circle cx="180" cy="294" r="24"/><circle cx="145" cy="335" r="22"/></g>
      <path d="M145 350v80" stroke="#4f7449" stroke-width="12"/>
      <path d="M80 390 l22 -70 l22 70 l-22 45z" fill="#d94a36"/>
      <text x="30" y="470" font-size="18" fill="#565b8d">Peak bluebonnets, paintbrush,</text><text x="30" y="498" font-size="18" fill="#565b8d">phlox, verbena, and broad</text><text x="30" y="526" font-size="18" fill="#565b8d">roadside color.</text>
    </g>
    <g transform="translate(710 145)">
      <rect width="290" height="520" rx="24" fill="#f7e5b7"/>
      <text x="30" y="58" font-size="30" font-weight="700" fill="#785417">Summer</text>
      <text x="30" y="98" font-size="20" fill="#8c6a2c">June–August</text>
      <circle cx="145" cy="285" r="72" fill="#edc542"/>
      <circle cx="145" cy="285" r="32" fill="#755027"/>
      <path d="M145 357v90" stroke="#537442" stroke-width="13"/>
      <text x="30" y="470" font-size="18" fill="#8c6a2c">Sunflowers, coneflowers,</text><text x="30" y="498" font-size="18" fill="#8c6a2c">prairie blooms, and higher-</text><text x="30" y="526" font-size="18" fill="#8c6a2c">elevation color continue.</text>
    </g>
    <g transform="translate(1030 145)">
      <rect width="290" height="520" rx="24" fill="#ead9bd"/>
      <text x="30" y="58" font-size="30" font-weight="700" fill="#6f451d">Fall</text>
      <text x="30" y="98" font-size="20" fill="#805c37">September–November</text>
      <g fill="#d7a82e"><circle cx="145" cy="275" r="25"/><circle cx="105" cy="310" r="21"/><circle cx="185" cy="310" r="21"/><circle cx="145" cy="345" r="20"/></g>
      <path d="M145 365v80" stroke="#65723d" stroke-width="12"/>
      <text x="30" y="470" font-size="18" fill="#805c37">Goldeneye, sunflowers, asters,</text><text x="30" y="498" font-size="18" fill="#805c37">and post-rain blooms brighten</text><text x="30" y="526" font-size="18" fill="#805c37">prairies and roadsides.</text>
    </g>
  </g>
</svg>