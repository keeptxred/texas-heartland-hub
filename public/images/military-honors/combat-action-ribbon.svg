<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">U.S. Navy and Marine Corps Combat Action Ribbon</title>
  <desc id="desc">Combat Action Ribbon shown as a regulation-style ribbon bar with navy blue, gold, red, white and blue vertical bands. No devices.</desc>
  <defs>
    <pattern id="rib" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <path d="M0 2H8M0 6H8" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <clipPath id="clip"><rect x="200" y="300" width="1200" height="300" rx="18"/></clipPath>
    <g clip-path="url(#clip)">
      <!-- Pattern verified against current U.S. Navy awards precedence imagery: navy blue, gold, narrow red/white/navy center, gold, red -->
      <rect x="200" y="300" width="220" height="300" fill="#1b2b52"/>
      <rect x="420" y="300" width="350" height="300" fill="#f0b51f"/>
      <rect x="770" y="300" width="24" height="300" fill="#b11f2a"/>
      <rect x="794" y="300" width="24" height="300" fill="#f5f4ec"/>
      <rect x="818" y="300" width="24" height="300" fill="#1b2b52"/>
      <rect x="842" y="300" width="338" height="300" fill="#f0b51f"/>
      <rect x="1180" y="300" width="220" height="300" fill="#b11f2a"/>
      <rect x="200" y="300" width="1200" height="300" fill="url(#rib)"/>
      <rect x="200" y="300" width="1200" height="300" fill="url(#edge)"/>
    </g>
    <rect x="200" y="300" width="1200" height="300" rx="18" fill="none" stroke="#2c2516" stroke-opacity="0.55" stroke-width="5"/>
  </g>
</svg>