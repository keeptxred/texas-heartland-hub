<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Texas school district governance</title>
  <desc id="desc">Diagram connecting Texas voters, school board trustees, superintendent, campuses, property taxes, and state oversight.</desc>
  <rect width="1600" height="900" fill="#f6f1e8"/>
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#fffdf8" stroke="#1f2937" stroke-width="6"/>
  <text x="800" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#7f1d1d">HOW A TEXAS ISD WORKS</text>
  <text x="800" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#4b5563">Local elections • board governance • administration • state law</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="125" y="285" width="300" height="170" rx="24" fill="#dbeafe" stroke="#1e3a8a" stroke-width="5"/>
    <text x="275" y="345" font-size="34" font-weight="700" fill="#1e3a8a">VOTERS</text>
    <text x="275" y="390" font-size="23" fill="#1f2937">Elect trustees</text>
    <text x="275" y="425" font-size="23" fill="#1f2937">Approve bonds</text>

    <rect x="650" y="250" width="300" height="205" rx="24" fill="#fee2e2" stroke="#7f1d1d" stroke-width="5"/>
    <text x="800" y="315" font-size="34" font-weight="700" fill="#7f1d1d">SCHOOL BOARD</text>
    <text x="800" y="360" font-size="23" fill="#1f2937">Policy • budget • tax rate</text>
    <text x="800" y="397" font-size="23" fill="#1f2937">Hires superintendent</text>

    <rect x="1175" y="285" width="300" height="170" rx="24" fill="#dcfce7" stroke="#166534" stroke-width="5"/>
    <text x="1325" y="345" font-size="31" font-weight="700" fill="#166534">STATE OF TEXAS</text>
    <text x="1325" y="390" font-size="23" fill="#1f2937">Education Code • TEA</text>
    <text x="1325" y="425" font-size="23" fill="#1f2937">Funding • accountability</text>

    <rect x="650" y="545" width="300" height="140" rx="24" fill="#fef3c7" stroke="#92400e" stroke-width="5"/>
    <text x="800" y="605" font-size="31" font-weight="700" fill="#92400e">SUPERINTENDENT</text>
    <text x="800" y="647" font-size="23" fill="#1f2937">Runs daily operations</text>

    <rect x="185" y="650" width="300" height="115" rx="24" fill="#ede9fe" stroke="#5b21b6" stroke-width="5"/>
    <text x="335" y="700" font-size="29" font-weight="700" fill="#5b21b6">PROPERTY TAXES</text>
    <text x="335" y="738" font-size="21" fill="#1f2937">M&amp;O + voter-approved debt</text>

    <rect x="1115" y="650" width="300" height="115" rx="24" fill="#e0f2fe" stroke="#075985" stroke-width="5"/>
    <text x="1265" y="700" font-size="29" font-weight="700" fill="#075985">CAMPUSES</text>
    <text x="1265" y="738" font-size="21" fill="#1f2937">Principals • teachers • students</text>
  </g>
  <g stroke="#374151" stroke-width="7" fill="none" marker-end="url(#arrow)">
    <path d="M425 365 H635"/>
    <path d="M1175 365 H965"/>
    <path d="M800 455 V530"/>
    <path d="M650 615 H500 Q430 615 390 640"/>
    <path d="M950 615 H1100 Q1170 615 1210 640"/>
  </g>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
</svg>
