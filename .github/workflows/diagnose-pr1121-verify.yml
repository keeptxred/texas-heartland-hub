name: Diagnose PR 1121 Verify

on:
  push:
    branches:
      - fix/issue-guide-final-wave-current-main-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build development bundle
        run: bun run build:dev

      - name: Capture TypeScript diagnostics
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          bunx tsc --noEmit --pretty false 2>&1 | tee tsc-errors.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1121-tsc-diagnostics
          path: tsc-errors.txt
          if-no-files-found: error

      - name: Validate required generated routes
        run: |
          grep -q 'path: "/about"' src/routeTree.gen.ts
          grep -q 'path: "/contact"' src/routeTree.gen.ts
          grep -q 'path: "/issues"' src/routeTree.gen.ts
          grep -q 'path: "/news"' src/routeTree.gen.ts

      - name: Fail if TypeScript failed
        if: steps.tsc.outcome != 'success'
        run: exit 1
