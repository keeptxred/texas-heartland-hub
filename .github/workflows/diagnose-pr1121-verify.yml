name: Diagnose PR 1121 Verify

on:
  push:
    branches:
      - fix/issue-guide-final-wave-current-main-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build development bundle
        run: bun run build:dev

      - name: Capture TypeScript diagnostics
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          bunx tsc --noEmit --pretty false 2>&1 | tee tsc-errors.txt

      - name: Capture route diagnostics
        id: routes
        continue-on-error: true
        run: |
          : > route-status.txt
          failed=0
          for route in about contact issues news; do
            if grep -q "path: \"/$route\"" src/routeTree.gen.ts; then
              echo "$route=present" >> route-status.txt
            else
              echo "$route=MISSING" >> route-status.txt
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1121-verify-diagnostics
          path: |
            tsc-errors.txt
            route-status.txt
            src/routeTree.gen.ts
          if-no-files-found: error

      - name: Fail if diagnostics failed
        if: steps.tsc.outcome != 'success' || steps.routes.outcome != 'success'
        run: exit 1
