name: Candidate photo enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/data/elections/2026/candidate-photos.json"
      - "src/data/elections/2026/candidates.json"
      - "scripts/elections/candidate-photo-enrichment.mjs"
      - "scripts/elections/discover-candidate-photos.mjs"
      - ".github/workflows/candidate-photo-enrichment.yml"

permissions:
  contents: write

concurrency:
  group: candidate-photo-enrichment
  cancel-in-progress: false

jobs:
  discover-and-apply-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover verified candidate portraits
        run: node scripts/elections/discover-candidate-photos.mjs

      - name: Apply approved candidate photos
        run: node scripts/elections/candidate-photo-enrichment.mjs --apply

      - name: Commit enriched candidate records and reports
        run: |
          if git diff --quiet -- src/data/elections/2026/candidate-photos.json src/data/elections/2026/candidates.json artifacts/elections/candidate-photo-report.json artifacts/elections/candidate-photo-discovery-report.json; then
            echo "No candidate photo changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026/candidate-photos.json src/data/elections/2026/candidates.json artifacts/elections/candidate-photo-report.json artifacts/elections/candidate-photo-discovery-report.json
          git commit -m "Discover and apply candidate photos"
          git push
