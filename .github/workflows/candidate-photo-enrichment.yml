name: Candidate photo enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/candidate-photo-enrichment.yml"
      - "scripts/elections/merge-approved-candidate-photo-assets.mjs"
      - "scripts/elections/apply-direct-web-photo-findings.mjs"
      - "scripts/elections/apply-verified-photo-findings-2026-07-31.mjs"
      - "scripts/elections/apply-automation-verified-photo-findings.mjs"
      - "scripts/elections/apply-official-government-photo-findings-2026-08-21.mjs"
      - "scripts/elections/apply-official-federal-photo-findings-2026-08-21-wave2.mjs"
      - "scripts/elections/apply-public-domain-congress-photo-findings-2026-08-21-wave3.mjs"
      - "scripts/elections/apply-public-domain-congress-photo-findings-2026-08-22-wave4.mjs"
      - "scripts/elections/apply-verified-candidate-photo-findings-2026-08-22-wave6.mjs"
      - "scripts/elections/apply-official-judicial-photo-findings-2026-08-21-wave2.mjs"
      - "scripts/elections/discover-candidate-photo-sources.mjs"
      - "scripts/elections/discover-candidate-photos-house-clerk.mjs"
      - "scripts/elections/discover-candidate-photos-congress-gov.mjs"
      - "scripts/elections/discover-candidate-photos-tcta.mjs"
      - "scripts/elections/discover-candidate-photos-texas-archives.mjs"
      - "src/data/elections/2026/candidate-photo-assets.json"
      - "src/data/elections/2026/candidate-photo-source-registry.json"
      - "src/data/elections/2026/candidate-photo-source-registry-texas-archives.json"
      - "src/data/elections/2026/candidate-photo-source-registry-wave6.json"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: candidate-photo-enrichment
  cancel-in-progress: true

jobs:
  discover-and-apply-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Merge approved candidate photo assets
        run: node scripts/elections/merge-approved-candidate-photo-assets.mjs
      - name: Apply direct verified web findings
        run: node scripts/elections/apply-direct-web-photo-findings.mjs
      - name: Apply July 31 verified campaign findings
        run: node scripts/elections/apply-verified-photo-findings-2026-07-31.mjs
      - name: Apply automation-verified candidate-guide findings
        run: node scripts/elections/apply-automation-verified-photo-findings.mjs
      - name: Apply verified official government portraits
        run: node scripts/elections/apply-official-government-photo-findings-2026-08-21.mjs
      - name: Apply verified official federal portrait wave 2
        run: node scripts/elections/apply-official-federal-photo-findings-2026-08-21-wave2.mjs
      - name: Apply verified public-domain congressional portrait wave 3
        run: node scripts/elections/apply-public-domain-congress-photo-findings-2026-08-21-wave3.mjs
      - name: Apply verified public-domain congressional portrait wave 4
        run: node scripts/elections/apply-public-domain-congress-photo-findings-2026-08-22-wave4.mjs
      - name: Apply verified statewide and SBOE portrait wave 6
        run: node scripts/elections/apply-verified-candidate-photo-findings-2026-08-22-wave6.mjs
      - name: Apply verified Texas appellate portrait wave 2
        run: node scripts/elections/apply-official-judicial-photo-findings-2026-08-21-wave2.mjs
      - name: Discover previously unseen candidate photo source domains
        run: node scripts/elections/discover-candidate-photo-sources.mjs
      - name: Discover Congress.gov member portraits
        run: node scripts/elections/discover-candidate-photos-congress-gov.mjs
      - name: Discover U.S. House Clerk member portraits
        run: node scripts/elections/discover-candidate-photos-house-clerk.mjs
      - name: Discover TCTA-linked official campaign portraits
        run: node scripts/elections/discover-candidate-photos-tcta.mjs
      - name: Discover Texas and national archive portrait leads
        run: node scripts/elections/discover-candidate-photos-texas-archives.mjs
      - name: Discover directory candidate portraits
        run: node scripts/elections/discover-candidate-photos-directories.mjs
      - name: Discover linked and public-source candidate portraits
        run: node scripts/elections/discover-candidate-photos.mjs
      - name: Discover alternate search-provider candidate portraits
        run: node scripts/elections/discover-candidate-photos-search-providers.mjs
      - name: Discover expanded voter-guide and public-directory portraits
        run: node scripts/elections/discover-candidate-photos-expanded.mjs
      - name: Discover race-aware multi-engine portraits
        run: node scripts/elections/discover-candidate-photos-race-aware.mjs
      - name: Discover county media finance and professional portraits
        run: node scripts/elections/discover-candidate-photos-source-wave.mjs
      - name: Discover deep-web document image and archived portraits
        run: node scripts/elections/discover-candidate-photos-deep-web.mjs
      - name: Discover local public-record and biography portraits
        run: node scripts/elections/discover-candidate-photos-local-records.mjs
      - name: Discover verified Wikidata and Wikimedia Commons portraits
        run: node scripts/elections/discover-candidate-photos-wikimedia.mjs
      - name: Discover portraits from previously unused domains only
        run: node scripts/elections/discover-candidate-photos-new-domains.mjs
      - name: Discover second-wave portraits from unused campaign and local domains
        run: node scripts/elections/discover-candidate-photos-new-domains-wave2.mjs
      - name: Apply approved candidate photos
        run: node scripts/elections/candidate-photo-enrichment.mjs --apply

      - name: Publish enriched candidate records and reports as protected PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Discover and apply verified candidate photos
          PR_BODY: Automated candidate-photo enrichment from approved, verified, official, public-domain, and review-queued sources. Existing source verification and candidate-photo validation are unchanged; protected verify gates merge and deployment.
          COMMIT_MESSAGE: Discover and apply candidate photos from expanded sources
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=(
            src/data/elections/2026/candidate-photos.json
            src/data/elections/2026/candidates.json
            artifacts/elections/candidate-photo-report.json
            artifacts/elections/candidate-photo-discovery-report.json
            artifacts/elections/candidate-photo-source-discovery-report.json
            artifacts/elections/candidate-photo-congress-gov-report.json
            artifacts/elections/candidate-photo-house-clerk-report.json
            artifacts/elections/candidate-photo-tcta-report.json
            artifacts/elections/candidate-photo-texas-archives-report.json
            artifacts/elections/candidate-photo-search-provider-report.json
            artifacts/elections/candidate-photo-expanded-report.json
            artifacts/elections/candidate-photo-race-aware-report.json
            artifacts/elections/candidate-photo-source-wave-report.json
            artifacts/elections/candidate-photo-deep-web-report.json
            artifacts/elections/candidate-photo-local-records-report.json
            artifacts/elections/candidate-photo-wikimedia-report.json
            artifacts/elections/candidate-photo-new-domains-report.json
            artifacts/elections/candidate-photo-new-domains-wave2-report.json
            artifacts/elections/candidate-photo-source-cache.json
            artifacts/elections/candidate-photo-review-queue.json
          )
          if git diff --quiet -- "${TRACKED[@]}"; then
            echo "No candidate photo changes to publish."
            exit 0
          fi
          changed="$(git status --short | awk '{print $2}')"
          unexpected_files="$(grep -vE '^(src/data/elections/2026/(candidate-photos|candidates)\.json|artifacts/elections/candidate-photo-[a-z0-9-]+\.json)$' <<<"$changed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the candidate-photo allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh candidate-photo-enrichment "${TRACKED[@]}"
