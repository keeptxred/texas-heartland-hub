name: Verify neutral production payment pages
# rerun after Link disabled
# rerun after Stripe Link was disabled in production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-neutral-production-payment-pages.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install verifier dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Verify KTR-hosted checkout has neutral visible copy
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --location --silent --show-error --fail-with-body             --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30             'https://keeptxred.com/shop/checkout')"
          KTR_CHECKOUT_HTML="$html" python3 - <<'PY'
          import os, re
          html = os.environ["KTR_CHECKOUT_HTML"]
          text = re.sub(r"<script\b[^>]*>.*?</script>", " ", html, flags=re.I|re.S)
          text = re.sub(r"<style\b[^>]*>.*?</style>", " ", text, flags=re.I|re.S)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)
          for phrase in ("Keep TX Red", "Keep Texas Red", "Texas Defined"):
              if phrase.lower() in text.lower():
                  raise SystemExit(f"Visible storefront branding remains on KTR checkout: {phrase}")
          if "Secure Checkout" not in html:
              raise SystemExit("Neutral Secure Checkout title not found.")
          print("KTR checkout visible copy is brand neutral.")
          PY

      - name: Create no-charge TexasDefined live Checkout Session
        shell: bash
        run: |
          set -euo pipefail
          products_file="$RUNNER_TEMP/td-products.json"
          payload_file="$RUNNER_TEMP/td-checkout-payload.json"
          response_file="$RUNNER_TEMP/td-checkout-response.json"
          stripe_html="$RUNNER_TEMP/stripe-checkout.html"

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Origin: https://texasdefined.com' \
            'https://keeptxred.com/api/public/store-products?site=texasdefined&limit=50' \
            -o "$products_file"

          python3 - "$products_file" "$payload_file" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if data.get("ok") is not True:
              raise SystemExit(data)
          for product in data.get("products", []):
              for variant in product.get("variants") or []:
                  if variant.get("is_enabled", True) and variant.get("id") is not None:
                      payload = {
                          "items": [{
                              "productId": product["id"],
                              "variantId": int(variant["id"]),
                              "quantity": 1,
                          }]
                      }
                      pathlib.Path(sys.argv[2]).write_text(json.dumps(payload), encoding="utf-8")
                      raise SystemExit(0)
          raise SystemExit("No enabled TexasDefined shop variant found.")
          PY

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Origin: https://texasdefined.com' \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload_file" \
            'https://keeptxred.com/api/public/texasdefined-checkout' \
            -o "$response_file"

          checkout_url="$(python3 - "$response_file" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if data.get("ok") is not True:
              raise SystemExit(data)
          url = data.get("url") or ""
          if not url.startswith("https://checkout.stripe.com/"):
              raise SystemExit(f"Unexpected Checkout URL: {url!r}")
          print(url)
          PY
          )"

          echo "Created live Checkout Session without submitting payment."

          CHECKOUT_URL="$checkout_url" node --input-type=module <<'JS'
          import { chromium } from "@playwright/test";

          const url = process.env.CHECKOUT_URL;
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto(url, { waitUntil: "domcontentloaded", timeout: 90000 });
            await page.waitForTimeout(5000);
            const bodyText = await page.locator("body").innerText();
            const visible = bodyText.toLowerCase();
            const forbidden = [
              "keep tx red",
              "keep texas red",
              "keeptxred",
              "texas defined",
              "texasdefined",
            ];
            for (const phrase of forbidden) {
              if (visible.includes(phrase)) {
                const lines = bodyText
                  .split("\n")
                  .map((line) => line.trim())
                  .filter((line) => line.toLowerCase().includes(phrase));
                console.log("VISIBLE_BRANDING_MATCH=" + JSON.stringify({ phrase, lines }));
                throw new Error(`Storefront identification remains visible on Stripe Checkout: ${phrase}`);
              }
            }
            console.log("Stripe-hosted Checkout contains no visible storefront identification.");
          } finally {
            await browser.close();
          }
          JS
