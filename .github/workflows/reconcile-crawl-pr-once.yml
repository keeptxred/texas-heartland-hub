name: One-shot reconcile crawl cleanup with main

on:
  push:
    branches:
      - seo/public-crawl-leaks-20260909-b2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main without weakening history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/reconcile-crawl-pr-once.yml
          git commit -m "Remove one-shot reconciliation workflow"
          git push origin HEAD:seo/public-crawl-leaks-20260909-b2
