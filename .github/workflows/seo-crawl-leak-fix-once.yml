name: One-shot public crawl leak cleanup

on:
  push:
    branches:
      - seo/public-crawl-leaks-20260909-b2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Canonicalize emitted public links
        shell: python
        run: |
          from pathlib import Path

          replacements = 0
          for path in Path("src/routes").glob("*.tsx"):
              text = path.read_text()
              updated = text.replace('href="/find-my-dmv"', 'href="https://texasdefined.com/find-my-dmv"')
              if updated != text:
                  replacements += text.count('href="/find-my-dmv"')
                  path.write_text(updated)

          if replacements < 14:
              raise SystemExit(f"Expected at least 14 emitted /find-my-dmv links, found {replacements}")

          exact = {
              Path("src/routes/elections.districts.$districtSlug.tsx"): (
                  '<DistrictLink href="/voting-locations"',
                  '<DistrictLink href="/elections/voting"',
              ),
              Path("src/components/texas-supreme-court-history-page.tsx"): (
                  '"/texas-government/texas-court-of-criminal-appeals-history"',
                  '"/texas-government/court-of-criminal-appeals-history"',
              ),
              Path("src/routes/vehicles.new-residents.tsx"): (
                  'href="/texas-moving-cost-calculator"',
                  'href="https://texasdefined.com/texas-moving-cost-calculator"',
              ),
              Path("src/lib/elections/districtAuthority.test.ts"): (
                  '"/voting-locations"',
                  '"/elections/voting"',
              ),
          }

          for path, (old, new) in exact.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {old!r} in {path}, found {count}")
              path.write_text(text.replace(old, new))

          print(f"Canonicalized {replacements} emitted /find-my-dmv links plus election, court, and moving-tool links")
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run targeted tests
        run: bunx vitest run src/lib/elections/districtAuthority.test.ts src/lib/canonical-internal-redirects.test.ts src/lib/migrated-tool-canonical.test.ts
      - name: Run SEO validation
        run: bun run seo:validate
      - name: Commit cleaned public links and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-crawl-leak-fix-once.yml
          git add src
          git diff --cached --check
          git commit -m "Canonicalize remaining public redirect-hop links"
          git push origin HEAD:seo/public-crawl-leaks-20260909-b2
