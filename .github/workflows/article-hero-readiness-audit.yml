name: KeepTXRed Article Hero Readiness Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy verified KeepTXRed to Cloudflare"
      - "Deploy KeepTXRed to Cloudflare Workers"
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/force-article-hero-readiness-audit'

permissions:
  contents: read
  id-token: write

concurrency:
  group: article-hero-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate stored article heroes through the common visual gate
        shell: bash
        run: |
          set -euo pipefail

          endpoint='https://keeptxred-site.freddy-coppola.workers.dev/api/public/hooks/article-hero-readiness-audit'
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-newsroom"

          issue_oidc_token() {
            local token
            token=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$oidc_url" | jq -r '.value // empty')
            if [[ -z "$token" ]]; then
              echo 'GitHub Actions did not issue the newsroom OIDC token.' >&2
              return 1
            fi
            printf '%s' "$token"
          }

          ready=-1
          for attempt in $(seq 1 12); do
            oidc_token=$(issue_oidc_token)
            status=$(curl -sS -X POST -o /tmp/hero-readiness-dry.json -w '%{http_code}' \
              --max-time 60 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${endpoint}?dry=1" || echo 000)
            echo "hero-readiness probe ${attempt}/12 HTTP ${status}"
            cat /tmp/hero-readiness-dry.json 2>/dev/null || true
            echo
            if [[ "$status" == "200" ]] && jq -e '.ok == true and .dryRun == true' /tmp/hero-readiness-dry.json >/dev/null 2>&1; then
              ready=$(jq -r '.ready // 0' /tmp/hero-readiness-dry.json)
              break
            fi
            sleep 20
          done

          if [[ "$ready" -lt 0 ]]; then
            echo 'Article hero readiness endpoint never became ready after deployment.' >&2
            exit 1
          fi
          if [[ "$ready" -eq 0 ]]; then
            echo 'ARTICLE_HERO_READINESS_SUCCESS ready=0; every published hero has governed provenance.'
            exit 0
          fi

          max_per_run=4
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            max_per_run=6
          fi
          if [[ "$ready" -lt "$max_per_run" ]]; then
            max_per_run="$ready"
          fi

          mapfile -t slugs < <(jq -r --argjson max "$max_per_run" '.slugs[0:$max][]' /tmp/hero-readiness-dry.json)
          echo "ARTICLE_HERO_READINESS_START ready=${ready} batch=${#slugs[@]} primary_subject=$(jq -r '.primarySubjectRemediations // 0' /tmp/hero-readiness-dry.json) candidates=$(jq -r '.candidates // 0' /tmp/hero-readiness-dry.json)"

          processed=0
          accepted=0
          repaired=0
          quarantined=0
          failures=0

          for slug in "${slugs[@]}"; do
            oidc_token=$(issue_oidc_token)
            encoded_slug=$(jq -rn --arg value "$slug" '$value|@uri')
            output="/tmp/hero-readiness-${processed}.json"
            status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time 600 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${endpoint}?slug=${encoded_slug}&repair=1" || echo 000)
            echo "hero slug=${slug} HTTP ${status}"
            cat "$output" 2>/dev/null || true
            echo
            processed=$((processed + 1))

            if [[ "$status" != "200" ]] || ! jq -e '.ok == true' "$output" >/dev/null 2>&1; then
              failures=$((failures + 1))
              continue
            fi
            if jq -e '.accepted == true' "$output" >/dev/null 2>&1; then
              accepted=$((accepted + 1))
            elif jq -e '.repaired == true' "$output" >/dev/null 2>&1; then
              repaired=$((repaired + 1))
            else
              quarantined=$((quarantined + 1))
            fi
          done

          echo "ARTICLE_HERO_READINESS_TOTAL ready_at_start=${ready} processed=${processed} accepted=${accepted} repaired=${repaired} quarantined=${quarantined} failures=${failures}"
          if [[ "$failures" -gt 0 ]]; then
            echo 'One or more audit requests failed at the endpoint level; successful rows remain committed and the next hourly pass will continue.' >&2
            exit 1
          fi
