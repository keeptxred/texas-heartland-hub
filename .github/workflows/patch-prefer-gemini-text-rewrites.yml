name: Patch Gemini Rewrite Routing

on:
  push:
    branches: [agent/prefer-gemini-text-rewrites]
    paths: ['.github/workflows/patch-prefer-gemini-text-rewrites.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prefer-gemini-text-rewrites
      - name: Patch routing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/server.ts')
          s = p.read_text()

          old_model = '  const model = process.env.AI_VALIDATION_MODEL || "gemini-3.5-flash";'
          new_model = '  const model = hasImageInput(body)\n    ? process.env.AI_VALIDATION_MODEL || "gemini-3.5-flash"\n    : process.env.AI_REWRITE_MODEL || "gemini-3.5-flash";'
          if old_model not in s:
              raise SystemExit('Gemini model selection block not found')
          s = s.replace(old_model, new_model, 1)

          pattern = re.compile(r'''    if \(!cf\) \{\n      return Response\.json\(\{ error: \{ message: "Cloudflare Workers AI text rewriting is not configured\.[^\n]+\n    \}\n\n    return directCloudflareTextResponse\(chatBody, cf, init\?\.signal\);''')
          replacement = '''    if (geminiApiKey) {
      return directGeminiVisionResponse(chatBody, geminiApiKey, init?.signal);
    }

    if (!cf) {
      return Response.json({ error: { message: "No direct text rewrite provider is configured. Set GEMINI_API_KEY (preferred) or Cloudflare credentials; Lovable fallback is disabled." } }, { status: 503 });
    }

    return directCloudflareTextResponse(chatBody, cf, init?.signal);'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Text routing block replacement count={count}')

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          git rm .github/workflows/patch-prefer-gemini-text-rewrites.yml
          git commit -m "Prefer direct Gemini for text rewrites"
          git push origin HEAD:agent/prefer-gemini-text-rewrites
