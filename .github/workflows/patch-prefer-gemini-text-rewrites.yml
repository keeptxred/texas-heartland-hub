name: Patch Gemini Rewrite Routing

on:
  push:
    branches: [agent/prefer-gemini-text-rewrites]
    paths: ['.github/workflows/patch-prefer-gemini-text-rewrites.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prefer-gemini-text-rewrites
      - name: Patch routing
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          a = '  const model = process.env.AI_VALIDATION_MODEL || "gemini-3.5-flash";'
          b = '  const model = hasImageInput(body)\n    ? process.env.AI_VALIDATION_MODEL || "gemini-3.5-flash"\n    : process.env.AI_REWRITE_MODEL || "gemini-3.5-flash";'
          assert a in s
          s = s.replace(a, b, 1)
          a = '''    if (!cf) {
              return Response.json({ error: { message: "Cloudflare Workers AI text rewriting is not configured. CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required; Lovable and Gemini text fallbacks are disabled." } }, { status: 503 });
            }

            return directCloudflareTextResponse(chatBody, cf, init?.signal);'''
          a = a.replace('            ', '')
          b = '''    if (geminiApiKey) {
              return directGeminiVisionResponse(chatBody, geminiApiKey, init?.signal);
            }

            if (!cf) {
              return Response.json({ error: { message: "No direct text rewrite provider is configured. Set GEMINI_API_KEY (preferred) or Cloudflare credentials; Lovable fallback is disabled." } }, { status: 503 });
            }

            return directCloudflareTextResponse(chatBody, cf, init?.signal);'''
          b = b.replace('            ', '')
          assert a in s
          s = s.replace(a, b, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          git rm .github/workflows/patch-prefer-gemini-text-rewrites.yml
          git commit -m "Prefer direct Gemini for text rewrites"
          git push origin HEAD:agent/prefer-gemini-text-rewrites
