name: Verify Supabase Free Tier Retention
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261011233913_cron_success_history_rollup_and_safe_retention.sql'
      - 'supabase/migrations/20261011234016_schedule_hourly_successful_cron_retention.sql'
      - 'scripts/ci/verify-supabase-free-tier-retention.mjs'
      - 'scripts/ops/monitor-supabase-free-tier.mjs'
      - '.github/workflows/supabase-free-tier-capacity-alert.yml'
      - 'supabase/migrations/20261012122533_service_only_capacity_alert_probe.sql'
      - 'supabase/migrations/20261012123032_stage_21day_unpublished_feed_for_verified_private_archive.sql'
      - 'supabase/migrations/20261012123541_guard_verified_stale_feed_retirement_by_storage_manifest.sql'
      - 'supabase/migrations/20261012124433_stage_dormant_unpublished_newsroom_for_verified_archival.sql'
      - 'supabase/migrations/20261012124522_guard_verified_dormant_newsroom_retirement_by_storage_manifest.sql'
      - 'scripts/data/export-supabase-cold-archives.mjs'
      - 'supabase/migrations/20261011234405_create_private_legislative_editorial_cold_archive.sql'
      - 'supabase/migrations/20261011234848_create_private_newsroom_cold_archive.sql'
      - 'supabase/migrations/20261011235331_create_private_old_feed_cold_archive.sql'
      - 'supabase/migrations/20261012000443_monitor_shared_free_tier_database_capacity.sql'
      - '.github/workflows/verify-supabase-free-tier-retention.yml'
  push:
    paths:
      - 'supabase/migrations/20261011233913_cron_success_history_rollup_and_safe_retention.sql'
      - 'supabase/migrations/20261011234016_schedule_hourly_successful_cron_retention.sql'
      - 'scripts/ci/verify-supabase-free-tier-retention.mjs'
      - 'scripts/ops/monitor-supabase-free-tier.mjs'
      - '.github/workflows/supabase-free-tier-capacity-alert.yml'
      - 'supabase/migrations/20261012122533_service_only_capacity_alert_probe.sql'
      - 'supabase/migrations/20261012123032_stage_21day_unpublished_feed_for_verified_private_archive.sql'
      - 'supabase/migrations/20261012123541_guard_verified_stale_feed_retirement_by_storage_manifest.sql'
      - 'supabase/migrations/20261012124433_stage_dormant_unpublished_newsroom_for_verified_archival.sql'
      - 'supabase/migrations/20261012124522_guard_verified_dormant_newsroom_retirement_by_storage_manifest.sql'
      - 'scripts/data/export-supabase-cold-archives.mjs'
      - 'supabase/migrations/20261011234405_create_private_legislative_editorial_cold_archive.sql'
      - 'supabase/migrations/20261011234848_create_private_newsroom_cold_archive.sql'
      - 'supabase/migrations/20261011235331_create_private_old_feed_cold_archive.sql'
      - 'supabase/migrations/20261012000443_monitor_shared_free_tier_database_capacity.sql'
      - '.github/workflows/verify-supabase-free-tier-retention.yml'
jobs:
  retention-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check scripts/data/export-supabase-cold-archives.mjs
      - run: node --check scripts/ops/monitor-supabase-free-tier.mjs
      - run: node scripts/ci/verify-supabase-free-tier-retention.mjs
