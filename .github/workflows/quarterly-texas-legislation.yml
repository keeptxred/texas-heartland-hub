name: Quarterly Texas Legislature full-session reconciliation
on:
  workflow_dispatch:
  # One initial reconciliation when importer correctness changes are merged.
  # Ordinary editorial/site pushes do not trigger expensive statewide scans.
  push:
    branches: [main]
    paths:
      - 'scripts/legislature/session-identity.mjs'
      - 'scripts/legislature/sync-texas-legislation.mjs'
      - 'scripts/legislature/sync-bill-subjects.mjs'
      - 'scripts/legislature/status-normalization.mjs'
  schedule:
    # January, April, July, October — in addition to daily regular-session sync.
    - cron: '35 15 1 1,4,7,10 *'
permissions:
  contents: read
  actions: read
concurrency:
  group: texas-legislation-imports
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.plan.outputs.sessions }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.15.0'
      - name: Check session planning and normalization regressions
        run: node --test scripts/legislature/plan-sessions.check.mjs scripts/legislature/status-normalization.check.mjs scripts/legislature/session-identity.check.mjs
      - name: Discover regular and called sessions from official TLO FTP
        id: plan
        run: node scripts/legislature/plan-sessions.mjs --quarterly --github-output
  reconcile:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        session: ${{ fromJSON(needs.plan.outputs.sessions) }}
    env:
      # Fit within the 90-minute runner while allowing substantial checkpoint progress.
      TLO_MAX_SECONDS: '2300'
      TLO_SUBJECT_MAX_SECONDS: '1800'
      SUPABASE_URL: https://keeptxred.com/api/admin/legislation-sync-proxy
      SUPABASE_SERVICE_ROLE_KEY: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Reconcile official bill history, subjects and relationships
        run: bun run legislature:sync -- --sessions=${{ matrix.session }} --recheck-days=7 --skip-relationships
      - name: Summary
        if: always()
        run: echo "Session ${{ matrix.session }} — checkpointed bill/subject ingestion only. Global relationships deliberately deferred due to statement-timeout risk. Verify manifest cursor and legislative_sync_runs before claiming full reconciliation." >> "$GITHUB_STEP_SUMMARY"
