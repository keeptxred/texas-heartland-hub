name: Patch News Rewrite Diagnostics V2

on:
  push:
    branches:
      - agent/news-rewrite-diagnostics-v2
    paths:
      - .github/workflows/patch-news-rewrite-diagnostics-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/news-rewrite-diagnostics-v2
      - name: Apply diagnostics patch
        run: python3 .github/scripts/patch-news-rewrite-diagnostics-v2.py
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/public/hooks/generate-news.ts
          git rm .github/workflows/patch-news-rewrite-diagnostics-v2.yml
          git rm .github/scripts/patch-news-rewrite-diagnostics-v2.py
          git commit -m "Surface automated news rewrite rejection diagnostics"
          git push origin HEAD:agent/news-rewrite-diagnostics-v2
