name: Apply admin feed visibility fixes

on:
  push:
    paths:
      - .github/workflows/apply-admin-feed-visibility.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply panel fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          viral = 'src/components/admin/ViralRadarPanel.tsx'
          replace_once(viral, 'const FETCH_LIMIT = 150;', 'const FETCH_LIMIT = 500;\nconst PAGE_SIZE = 75;')
          replace_once(
              viral,
              '''  // Persisted preflight means extraction already ran. Any persisted
  // non-ready result is terminal and must leave the publish queue.
  if (row.preflight_json) return false;

  if (result.reason !== "PENDING_EXTRACTION") return false;

  // Keep Viral Radar useful as a manual-review queue. The stricter score and
  // confidence thresholds belong to the Ready for Rewrite filter, not to the
  // entire panel. Pending rows still must be Texas-focused and credible.
  return (
    (row.texas_relevance_score ?? 0) >= 40 &&
    (row.source_reputation_score ?? 0) >= 55
  );''',
              '''  // Keep completed non-ready preflights visible for manual review instead
  // of silently removing them from the panel. Publishing remains disabled by
  // canAttemptPublish unless the item is READY or pending extraction.
  return (
    (row.texas_relevance_score ?? 0) >= 25 &&
    (row.source_reputation_score ?? 0) >= 40
  );'''
          )
          replace_once(
              viral,
              '  const [imageWorking, setImageWorking] = useState<Record<number, boolean>>({});',
              '  const [imageWorking, setImageWorking] = useState<Record<number, boolean>>({});\n  const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);'
          )
          replace_once(
              viral,
              '  }, [publishableRows, filter, preflightById]);\n\n  return (',
              '''  }, [publishableRows, filter, preflightById]);

  useEffect(() => {
    setVisibleCount(PAGE_SIZE);
  }, [filter]);

  const visibleRows = filtered.slice(0, visibleCount);

  return ('''
          )
          replace_once(
              viral,
              '        Articles disappear after source extraction confirms they cannot pass the rewrite gate.',
              '        Showing manual-review candidates with Texas relevance ≥25 and source reputation ≥40. Blocked items remain visible but cannot publish.'
          )
          replace_once(viral, '{filtered.map((row) => {', '{visibleRows.map((row) => {')
          replace_once(
              viral,
              '''          </table>
        </div>
      )}
    </div>''',
              '''          </table>
          {visibleCount < filtered.length ? (
            <div className="flex justify-center pt-4">
              <button
                type="button"
                onClick={() => setVisibleCount((count) => count + PAGE_SIZE)}
                className="px-4 py-2 border-2 border-primary text-primary text-[11px] font-bold uppercase tracking-widest"
              >
                Load more ({filtered.length - visibleCount} remaining)
              </button>
            </div>
          ) : null}
        </div>
      )}
    </div>'''
          )

          opp = 'src/components/admin/ContentOpportunityPanel.tsx'
          replace_once(
              opp,
              '  const [previewId, setPreviewId] = useState<number | null>(null);',
              '  const [previewId, setPreviewId] = useState<number | null>(null);\n  const [visibleCount, setVisibleCount] = useState(75);'
          )
          replace_once(
              opp,
              '''function shouldShowOpportunity(item: FeedItem): boolean {
  if (item.id < 0 || item.internal_slug) return true;
  if (!item.preflight_json) return true;
  return effectivePreflight(item).rewriteable;
}''',
              '''function shouldShowOpportunity(item: FeedItem): boolean {
  // Keep blocked and completed preflight rows visible. Filters and action
  // controls communicate readiness without silently discarding opportunities.
  return Boolean(item.title?.trim());
}'''
          )
          replace_once(
              opp,
              '  }, [scored, filter, statuses, preflightById]);\n\n  const previewRow = useMemo(',
              '''  }, [scored, filter, statuses, preflightById]);

  useEffect(() => {
    setVisibleCount(75);
  }, [filter]);

  const visibleRows = filtered.slice(0, visibleCount);

  const previewRow = useMemo('''
          )
          replace_once(opp, '{filtered.slice(0, 75).map((r) => {', '{visibleRows.map((r) => {')
          replace_once(
              opp,
              '''          </table>
        </div>
      )}''',
              '''          </table>
          {visibleCount < filtered.length ? (
            <div className="flex justify-center pt-4">
              <button
                type="button"
                onClick={() => setVisibleCount((count) => count + 75)}
                className="px-4 py-2 border-2 border-primary text-primary text-[11px] font-bold uppercase tracking-widest"
              >
                Load more ({filtered.length - visibleCount} remaining)
              </button>
            </div>
          ) : null}
        </div>
      )}'''
          )

          sources = 'src/components/admin/ContentSourceManager.tsx'
          replace_once(
              sources,
              '''  const statsByKey = useMemo(() => {''',
              '''  const sourceDiagnostics = useMemo(() => {
    const enabled = rows.filter((row) => row.enabled);
    const ingestible = enabled.filter((row) => Boolean(row.rss_url?.trim()));
    const manualOnly = enabled.length - ingestible.length;
    return { enabled: enabled.length, ingestible: ingestible.length, manualOnly };
  }, [rows]);

  const statsByKey = useMemo(() => {'''
          )
          replace_once(
              sources,
              '''          <p className="text-xs text-muted-foreground">
            Track trusted accounts and sites. Stats pulled from Reel Radar by matching platform + source name.
          </p>''',
              '''          <p className="text-xs text-muted-foreground">
            Track trusted accounts and sites. Enabled does not always mean ingestible.
          </p>
          <p className="text-[11px] text-muted-foreground mt-1">
            {sourceDiagnostics.enabled} enabled · {sourceDiagnostics.ingestible} RSS ingestible · {sourceDiagnostics.manualOnly} manual/social only
          </p>'''
          )
          replace_once(
              sources,
              '{p.rss_url ? " · RSS" : ""}',
              '{p.rss_url ? " · RSS ingestible" : " · Manual only"}'
          )
          PY
      - name: Validate
        run: |
          npm ci
          npm run build
      - name: Commit fixes and remove workflow
        run: |
          rm .github/workflows/apply-admin-feed-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ViralRadarPanel.tsx src/components/admin/ContentOpportunityPanel.tsx src/components/admin/ContentSourceManager.tsx .github/workflows/apply-admin-feed-visibility.yml
          git commit -m "Fix admin feed visibility and source diagnostics"
          git push
