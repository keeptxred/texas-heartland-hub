name: Apply vague attribution sanitizer patch

on:
  push:
    branches:
      - fix/sanitize-vague-attribution
    paths:
      - 'scripts/apply-vague-attribution-sanitizer.py'
      - '.github/workflows/apply-vague-attribution-sanitizer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanitize-vague-attribution
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-vague-attribution-sanitizer.py
      - name: Commit patched files
        run: |
          if git diff --quiet -- src/routes/api/public/hooks/generate-news.ts src/routes/api/public/hooks/generate-news.word-budget.test.ts; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/api/public/hooks/generate-news.ts src/routes/api/public/hooks/generate-news.word-budget.test.ts
          git commit -m 'Sanitize vague attribution before editorial validation'
          git push origin HEAD:fix/sanitize-vague-attribution
