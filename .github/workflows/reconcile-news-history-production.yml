name: Apply Verified News History Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-news-history-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-news-history-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://keeptxred.com
      RECONCILE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify reconciliation credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RECONCILE_SERVICE_ROLE_KEY:-}" ]]; then
            echo 'Missing SUPABASE_SERVICE_ROLE_KEY GitHub secret.' >&2
            exit 1
          fi

      - name: Apply verified deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$PRODUCTION_URL/api/public/hooks/reconcile-news-history?days=30&limit=5000"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error --max-time 40 \
              -o "$response_file" -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              -H "x-reconcile-service-role-key: $RECONCILE_SERVICE_ROLE_KEY" \
              --data '{}' \
              "$endpoint" || true)"

            if [[ "$code" == "401" ]]; then
              echo "Production has not activated the verified reconciliation credential yet (attempt $attempt)."
              sleep 15
              continue
            fi

            if [[ "$code" != "200" ]]; then
              echo "Reconciliation endpoint returned HTTP $code" >&2
              cat "$response_file" >&2
              exit 1
            fi

            python3 - "$response_file" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as fh:
              data = json.load(fh)
          if data.get('ok') is not True or data.get('mode') != 'apply':
              raise SystemExit(f"Unexpected reconciliation response: {data!r}")
          for key in ('aiCalls', 'articleWrites', 'slugChanges'):
              if data.get(key) != 0:
                  raise SystemExit(f"Safety invariant failed: {key}={data.get(key)!r}")
          print(json.dumps({
              'mode': data.get('mode'),
              'scanned': data.get('scanned'),
              'planned': data.get('planned'),
              'safe': data.get('safe'),
              'held': data.get('held'),
              'holdsQueued': data.get('holdsQueued'),
              'results': data.get('results'),
              'aiCalls': data.get('aiCalls'),
              'articleWrites': data.get('articleWrites'),
              'slugChanges': data.get('slugChanges'),
          }, indent=2))
          PY
            exit 0
          done

          echo 'Production reconciliation credential did not become active.' >&2
          exit 1
