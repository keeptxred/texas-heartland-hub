name: One-shot Texas Register human documentary patch

on:
  push:
    branches:
      - fix/texas-register-human-documentary-20260903
    paths:
      - .github/workflows/one-shot-texas-register-human-documentary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/texas-register-human-documentary-20260903
      - name: Apply narrow prompt and regression update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/featured-image.functions.ts')
          text = source.read_text()
          old_title = 'title: "Office desk with printed binders and paper files",'
          new_title = 'title: "Public records reading-room reference volume",'
          old_scene = 'concreteSubject: "A close documentary photograph of an ordinary office desk in daylight with several thick ring binders opened to dense printed pages angled away from the camera, loose paper stacks, tabbed folders, binder clips, pens, and shelves of bound volumes behind the desk. Focus on paper texture, binder hardware, the desk surface, soft natural shadows, and shallow photographic depth of field.",'
          new_scene = 'concreteSubject: "A close DSLR photograph of one adult hand turning a thick cream-colored page in a heavy clothbound reference volume at a plain wooden public-records reading-room desk. Printed lines on the page are deliberately out of focus and unreadable. A metal binder clip and a capped pen rest beside the volume, while shelves of matching hardbound reference volumes fall softly out of focus in the background. Natural window light, visible skin texture, paper fibers, wood grain, realistic lens blur, and an unposed documentary camera angle.",'
          if text.count(old_title) != 1 or text.count(old_scene) != 1:
              raise SystemExit('Expected Texas Register generation subject was not found exactly once')
          source.write_text(text.replace(old_title, new_title).replace(old_scene, new_scene))

          test = Path('src/lib/featured-image-generation-safe-subject.test.ts')
          text = test.read_text()
          replacements = {
              'it("removes abstract civic cues from Texas Register generation while keeping a literal records-desk photograph", () => {': 'it("removes abstract civic cues from Texas Register generation while keeping a human documentary reading-room photograph", () => {',
              'expect(safe.title).toBe("Office desk with printed binders and paper files");': 'expect(safe.title).toBe("Public records reading-room reference volume");',
              'expect(safe.concreteSubject).toMatch(/office desk|ring binders|printed pages|paper stacks|tabbed folders|bound volumes/i);': 'expect(safe.concreteSubject).toMatch(/adult hand|turning a .*page|clothbound reference volume|wooden public-records reading-room desk|shelves of matching hardbound reference volumes/i);',
              'expect(prompt).toContain("Office desk with printed binders and paper files");': 'expect(prompt).toContain("Public records reading-room reference volume");',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected regression text not found exactly once: {old}')
              text = text.replace(old, new)
          test.write_text(text)
          PY
      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/one-shot-texas-register-human-documentary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/featured-image.functions.ts src/lib/featured-image-generation-safe-subject.test.ts .github/workflows/one-shot-texas-register-human-documentary.yml
          git commit -m 'Make Texas Register image scene human documentary'
          git push origin HEAD:fix/texas-register-human-documentary-20260903
