name: Update Election Central forecasts

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-forecast-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Recalculate forecasts
        run: pnpm elections:forecast

      - name: Validate election data
        run: pnpm elections:validate

      - name: Run election QA
        run: pnpm elections:qa

      - name: Commit changed forecast snapshots
        shell: bash
        run: |
          if git diff --quiet -- src/data/elections/2026/forecasts.json; then
            echo "No forecast changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026/forecasts.json
          git commit -m "Update daily election forecast snapshots"
          git push origin HEAD:main
