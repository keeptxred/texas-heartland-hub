name: Update Election Central forecasts

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/elections/forecast.ts"
      - "scripts/elections/validate-forecast-pipeline.mjs"
      - "scripts/elections/polling-averages.ts"
      - "src/data/elections/2026/polls.json"
      - "src/data/elections/2026/candidates.json"
      - "src/data/elections/2026/races.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/update-election-forecasts.yml"

permissions:
  contents: write

concurrency:
  group: election-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Recalculate forecasts from latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          bun run elections:polling-averages
          bun run elections:forecast

      - name: Validate election data and forecast invariants
        run: |
          bun run elections:validate
          bun run elections:qa

      - name: Generate routes and typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit changed forecast snapshots
        shell: bash
        run: |
          git add \
            src/data/elections/2026/forecasts.json \
            src/data/elections/2026/forecast-diagnostics.json \
            src/data/elections/2026/polling-averages.json \
            src/data/elections/2026/sources.json \
            src/data/elections/2026/readiness.json
          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily election forecast snapshots"
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo "Main advanced during forecast generation; refusing to publish stale snapshots."
            exit 1
          fi
          git push origin HEAD:main
