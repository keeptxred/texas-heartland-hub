name: Election Central Launch Readiness

on:
  pull_request:
    paths:
      - "src/**/election*"
      - "src/**/elections/**"
      - "src/data/elections/**"
      - "scripts/elections/**"
      - "public/images/elections/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-launch-readiness.yml"
  push:
    branches: [main]
    paths:
      - "src/**/election*"
      - "src/**/elections/**"
      - "src/data/elections/**"
      - "scripts/elections/**"
      - "public/images/elections/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-launch-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Election Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate election data
        run: bun run elections:validate

      - name: Run election QA with source-link checks
        env:
          ELECTION_QA_CHECK_LINKS: "true"
        run: bun run elections:qa

      - name: Run full public-launch audit
        run: bun scripts/elections/public-launch-audit.mjs

      - name: Lint changed district routes
        run: bunx eslint src/routes/elections.districts.tsx src/routes/elections.districts.index.tsx

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Production build
        run: bun run build
