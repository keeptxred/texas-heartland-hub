# Revalidated after branch reconciliation
name: Election Central Launch Readiness

on:
  pull_request:
    paths:
      - "src/**/election*"
      - "src/**/elections/**"
      - "src/data/elections/**"
      - "scripts/elections/**"
      - "public/images/elections/**"
      - "package.json"
      - ".github/workflows/election-central-launch-readiness.yml"
  push:
    branches: [main]
    paths:
      - "src/**/election*"
      - "src/**/elections/**"
      - "src/data/elections/**"
      - "scripts/elections/**"
      - "public/images/elections/**"
      - "package.json"
      - ".github/workflows/election-central-launch-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Election Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Validate election data
        run: npm run elections:validate

      - name: Run election QA with source-link checks
        env:
          ELECTION_QA_CHECK_LINKS: "true"
        run: npm run elections:qa

      - name: Run full public-launch audit
        run: node scripts/elections/public-launch-audit.mjs

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD" \
            | grep -E '\.(ts|tsx)$' > /tmp/changed-ts-files.txt || true
          if [[ -s /tmp/changed-ts-files.txt ]]; then
            xargs pnpm exec eslint --rule 'prettier/prettier: off' < /tmp/changed-ts-files.txt
          else
            echo "No changed TypeScript files to lint."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: pnpm exec vitest run --exclude 'src/data/__tests__/**'

      - name: Production build
        run: npm run build


