name: Apply verified candidate photos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/candidate-photo-verified-apply.yml"
      - "scripts/elections/apply-authoritative-candidate-filing-status.mjs"
      - "scripts/elections/candidate-photo-enrichment.mjs"
      - "scripts/elections/remove-generic-candidate-photo-entries.mjs"
      - "scripts/elections/apply-official-senate-photo-replacements-2026-08-30.mjs"
      - "scripts/elections/merge-approved-candidate-photo-assets.mjs"
      - "scripts/elections/apply-direct-web-photo-findings.mjs"
      - "scripts/elections/apply-verified-photo-findings-2026-07-31.mjs"
      - "scripts/elections/apply-automation-verified-photo-findings.mjs"
      - "scripts/elections/apply-official-government-photo-findings-2026-08-21.mjs"
      - "scripts/elections/apply-official-federal-photo-findings-2026-08-21-wave2.mjs"
      - "scripts/elections/apply-public-domain-congress-photo-findings-2026-08-21-wave3.mjs"
      - "scripts/elections/apply-public-domain-congress-photo-findings-2026-08-22-wave4.mjs"
      - "scripts/elections/apply-verified-candidate-photo-findings-*.mjs"
      - "scripts/elections/apply-official-judicial-photo-findings-2026-08-21-wave2.mjs"
      - "src/data/elections/2026/candidate-filing-status-authority.json"
      - "src/data/elections/2026/candidate-photo-assets.json"
      - "src/data/elections/2026/candidate-supreme-court-media.json"
      - "src/data/elections/2026/candidate-photo-source-registry*.json"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: candidate-photo-verified-apply
  cancel-in-progress: true

jobs:
  apply-verified-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reconcile authoritative candidate filing status
        run: node scripts/elections/apply-authoritative-candidate-filing-status.mjs
      - name: Merge approved candidate photo assets
        run: node scripts/elections/merge-approved-candidate-photo-assets.mjs
      - name: Apply direct verified web findings
        run: node scripts/elections/apply-direct-web-photo-findings.mjs
      - name: Apply July 31 verified campaign findings
        run: node scripts/elections/apply-verified-photo-findings-2026-07-31.mjs
      - name: Apply automation-verified candidate-guide findings
        run: node scripts/elections/apply-automation-verified-photo-findings.mjs
      - name: Apply verified official government portraits
        run: node scripts/elections/apply-official-government-photo-findings-2026-08-21.mjs
      - name: Apply verified official federal portrait wave 2
        run: node scripts/elections/apply-official-federal-photo-findings-2026-08-21-wave2.mjs
      - name: Apply verified public-domain congressional portrait wave 3
        run: node scripts/elections/apply-public-domain-congress-photo-findings-2026-08-21-wave3.mjs
      - name: Apply verified public-domain congressional portrait wave 4
        run: node scripts/elections/apply-public-domain-congress-photo-findings-2026-08-22-wave4.mjs
      - name: Apply all verified candidate portrait waves
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/elections/apply-verified-candidate-photo-findings-*.mjs)
          for script in "${scripts[@]}"; do
            echo "Applying $script"
            node "$script"
          done
      - name: Apply verified Texas appellate portrait wave 2
        run: node scripts/elections/apply-official-judicial-photo-findings-2026-08-21-wave2.mjs
      - name: Remove known generic and placeholder candidate images
        run: node scripts/elections/remove-generic-candidate-photo-entries.mjs
      - name: Apply verified Texas Senate member portrait replacements
        run: node scripts/elections/apply-official-senate-photo-replacements-2026-08-30.mjs
      - name: Apply canonical verified-photo manifest
        run: node scripts/elections/candidate-photo-enrichment.mjs --apply

      - name: Close superseded candidate-photo materialization PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json number,headRefName --jq '.[] | select(.headRefName | startswith("automation/candidate-photo-verified-apply-")) | .number' \
            | while read -r pr_number; do
                [[ -z "$pr_number" ]] && continue
                echo "Closing superseded candidate-photo materialization PR #$pr_number before publishing run ${GITHUB_RUN_ID}."
                gh pr close "$pr_number" --repo "${GITHUB_REPOSITORY}" --comment "Superseded by newer candidate-photo materialization run ${GITHUB_RUN_ID} from current main. Closing the stale generated PR instead of stacking duplicate materialization branches." || true
              done

      - name: Publish verified candidate records as protected PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Apply verified candidate photos to canonical manifest
          PR_BODY: Applies authoritative candidate filing-status reconciliation and already verified candidate-photo assets/waves to the canonical candidate dataset. Rejected or withdrawn filings remain in the dataset but are excluded from photo-coverage math only through supported lifecycle fields. Known generic and placeholder images are removed before coverage is calculated, and verified Texas Senate member portraits replace the historical generic Senate social image when the official image validates at runtime. No discovery-only or review-only image is promoted. Existing provenance, rights, validation, protected verify, and deployment gates remain unchanged.
          COMMIT_MESSAGE: Apply verified candidate photos and filing status
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=(
            src/data/elections/2026/candidate-photos.json
            src/data/elections/2026/candidates.json
            artifacts/elections/candidate-photo-report.json
            artifacts/elections/candidate-photo-generic-image-audit.json
            artifacts/elections/candidate-photo-eligibility-reconciliation.json
          )
          if git diff --quiet -- "${TRACKED[@]}"; then
            echo "No verified candidate photo or filing-status changes to publish."
            exit 0
          fi
          changed="$(git status --short | awk '{print $2}')"
          unexpected_files="$(grep -vE '^(src/data/elections/2026/(candidate-photos|candidates)\.json|artifacts/elections/candidate-photo-(report|generic-image-audit|eligibility-reconciliation)\.json)$' <<<"$changed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the verified candidate-photo allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh candidate-photo-verified-apply "${TRACKED[@]}"
