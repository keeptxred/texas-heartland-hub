name: Reapply TexasDefined Facebook dry run

on:
  push:
    branches:
      - texasdefined-facebook-safe-dry-run-v2
    paths:
      - '.github/workflows/reapply-texasdefined-facebook-dry-run.yml'

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: texasdefined-facebook-safe-dry-run-v2
          fetch-depth: 0
      - name: Copy focused dry-run changes onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin texasdefined-facebook-safe-dry-run
          git checkout origin/texasdefined-facebook-safe-dry-run -- \
            src/routes/api/public/hooks/auto-facebook-post-texasdefined-smart.ts \
            .github/workflows/auto-facebook-posts.yml
          git rm .github/workflows/reapply-texasdefined-facebook-dry-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/api/public/hooks/auto-facebook-post-texasdefined-smart.ts .github/workflows/auto-facebook-posts.yml
          git commit -m 'Add safe TexasDefined Facebook dry-run verification'
          git push origin HEAD:texasdefined-facebook-safe-dry-run-v2
