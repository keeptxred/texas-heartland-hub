name: Diagnose PR 1136 typecheck

on:
  push:
    branches:
      - fix/government-authority-wave2-current-main-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          bun run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "$status" > typecheck.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr1136-typecheck
          path: |
            typecheck.log
            typecheck.status
