name: Probe official candidate API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/elections/probe-official-candidate-api.mjs"
      - ".github/workflows/probe-official-candidate-api.yml"

permissions:
  contents: write

concurrency:
  group: official-candidate-api-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture official API payload
        run: node scripts/elections/probe-official-candidate-api.mjs

      - name: Upload official API payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-candidate-api-schema
          path: /tmp/official-candidate-api-payload.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish safe schema summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026/candidate-api-schema.json
          if git diff --cached --quiet; then
            echo "Official candidate API schema is unchanged."
            exit 0
          fi
          git commit -m "Record official candidate API schema"
          git pull --rebase origin main
          git push origin HEAD:main
