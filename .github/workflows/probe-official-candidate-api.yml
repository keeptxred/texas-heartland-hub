name: Probe official candidate API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/elections/probe-official-candidate-api.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/probe-official-candidate-api.yml"

permissions:
  contents: write

concurrency:
  group: official-candidate-api-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Capture official API payload
        id: capture
        continue-on-error: true
        run: bun run scripts/elections/probe-official-candidate-api.mjs

      - name: Upload official API payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-candidate-api-schema
          path: /tmp/official-candidate-api-payload.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish verified schema summary
        if: always()
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          if [[ "$CAPTURE_OUTCOME" != "success" ]]; then
            echo "Candidate API capture failed; refusing to publish a partial or stale schema."
            exit 1
          fi
          if [[ ! -s src/data/elections/2026/candidate-api-schema.json ]]; then
            echo "Capture succeeded but produced no schema summary."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026/candidate-api-schema.json
          if git diff --cached --quiet; then
            echo "Candidate API schema is already current."
            exit 0
          fi
          unexpected=$(git diff --cached --name-only | grep -v '^src/data/elections/2026/candidate-api-schema.json$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Refusing to publish unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "Record official candidate API schema"
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo "Main advanced during candidate API probing; refusing stale schema publication."
            exit 1
          fi
          git push origin HEAD:main
