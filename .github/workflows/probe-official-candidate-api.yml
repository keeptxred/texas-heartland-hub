name: Probe official candidate API

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-candidate-api-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Capture official API payload
        id: capture
        continue-on-error: true
        run: bun run scripts/elections/probe-official-candidate-api.mjs
      - name: Upload official API payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-candidate-api-schema
          path: /tmp/official-candidate-api-payload.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish verified schema summary as protected PR
        if: always()
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Record official candidate API schema
          PR_BODY: Manual official-candidate API probe. The raw capture remains a short-lived workflow artifact; the verified schema summary must pass protected verify before merge and deployment.
          COMMIT_MESSAGE: Record official candidate API schema
        run: |
          set -euo pipefail
          if [[ "$CAPTURE_OUTCOME" != "success" ]]; then
            echo "Candidate API capture failed; refusing to publish a partial or stale schema."
            exit 1
          fi
          target='src/data/elections/2026/candidate-api-schema.json'
          if [[ ! -s "$target" ]]; then
            echo "Capture succeeded but produced no schema summary."
            exit 1
          fi
          if git diff --quiet -- "$target"; then
            echo "Candidate API schema is already current."
            exit 0
          fi
          changed="$(git status --short | awk '{print $2}')"
          unexpected="$(grep -v '^src/data/elections/2026/candidate-api-schema.json$' <<<"$changed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Refusing to publish unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh candidate-api-schema "$target"
