name: Agent cap featured image retries

on:
  push:
    branches: [agent/facebook-hard-duplicate-guard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/facebook-hard-duplicate-guard
          fetch-depth: 0
      - name: Limit one corrected image retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/featured-image.functions.ts')
          text = path.read_text()
          old = 'for (let attempt = 1; !verdict.matches && attempt <= 3; attempt += 1) {'
          new = 'for (let attempt = 1; !verdict.matches && attempt <= 1; attempt += 1) {'
          if old not in text:
            raise SystemExit('featured-image retry loop not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('src/lib/featured-image-retry-budget.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(new URL("./featured-image.functions.ts", import.meta.url), "utf8");\n\ndescribe("featured image retry budget", () => {\n  it("allows only the initial image plus one corrected composition", () => {\n    expect(source).toContain("attempt <= 1");\n    expect(source).not.toContain("attempt <= 3");\n  });\n\n  it("still validates both the initial and corrected image", () => {\n    expect(source).toContain("let verdict = await validateImageMatchesArticle(bytes, subject)");\n    expect(source).toContain("verdict = await validateImageMatchesArticle(bytes, subject)");\n    expect(source).toContain("if (!verdict.matches) throw new Error");\n  });\n});\n''')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/featured-image.functions.ts src/lib/featured-image-retry-budget.test.ts
          git rm .github/workflows/agent-cap-image-retries.yml
          git commit -m 'Cap featured image generation retries'
          git push origin HEAD:agent/facebook-hard-duplicate-guard
