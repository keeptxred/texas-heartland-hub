name: Apply Content Opportunities preflight fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-content-opportunity-preflight-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch ContentOpportunityPanel
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/ContentOpportunityPanel.tsx')
          text = path.read_text()

          text = text.replace(
          '''  description: string | null;\n  // When set, this row is an already-published daily_articles piece surfaced''',
          '''  description: string | null;\n  extracted_body?: string | null;\n  preflight_json?: {\n    status?: string;\n    reason?: string;\n    message?: string;\n    sourceWordCount?: number;\n    factualSignalCount?: number;\n  } | null;\n  // When set, this row is an already-published daily_articles piece surfaced'''
          )

          marker = '''function OpportunityStatusBadges({ status }: { status?: OpportunityStatus }) {'''
          helper = '''function effectivePreflight(item: FeedItem): RewritePreflightResult {\n  const snapshot = item.preflight_json;\n  const persistedReason = snapshot?.reason ?? snapshot?.status;\n  if (persistedReason) {\n    return {\n      rewriteable: persistedReason === "READY",\n      reason: persistedReason as RewritePreflightResult["reason"],\n      message: snapshot?.message ?? "Source preflight completed",\n      sourceWordCount: snapshot?.sourceWordCount ?? 0,\n      factualSignalCount: snapshot?.factualSignalCount ?? 0,\n      hasClearNewsEvent: null,\n    };\n  }\n\n  return assessRewritePreflight({\n    title: item.title,\n    description: item.extracted_body?.trim() || item.description,\n    link: item.link,\n  });\n}\n\nfunction shouldShowOpportunity(item: FeedItem): boolean {\n  if (item.id < 0 || item.internal_slug) return true;\n  if (!item.preflight_json) return true;\n  return effectivePreflight(item).rewriteable;\n}\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker)

          text = text.replace(
          '''.select("id,title,source,pub_date,internal_slug,link,description")''',
          '''.select("id,title,source,pub_date,internal_slug,link,description,extracted_body,preflight_json")'''
          )

          old = '''          : assessRewritePreflight({\n              title: it.title,\n              description: it.description,\n              link: it.link,\n            });'''
          new = '''          : effectivePreflight(it);'''
          if old not in text:
              raise SystemExit('preflight calculation block not found')
          text = text.replace(old, new)

          text = text.replace(
          '''      items\n        .filter((it) => !ignored.has(ignoreKey(it)))''',
          '''      items\n        .filter(shouldShowOpportunity)\n        .filter((it) => !ignored.has(ignoreKey(it)))'''
          )

          text = text.replace(
          '''      } else {\n        setArticleMsg((s) => ({ ...s, [r.id]: { ok: false, text: res.error } }));\n      }''',
          '''      } else {\n        setArticleMsg((s) => ({ ...s, [r.id]: { ok: false, text: res.error } }));\n        if (/does not contain enough text|not enough factual/i.test(res.error)) {\n          setItems((current) => current.filter((item) => item.id !== r.id));\n        }\n      }''',
          1
          )

          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-content-opportunity-preflight-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ContentOpportunityPanel.tsx .github/workflows/apply-content-opportunity-preflight-fix.yml
          git commit -m "Hide terminal failed preflights from Content Opportunities"
          git push origin main
