name: One-time legacy tiered expansion fix

on:
  push:
    paths:
      - .github/workflows/one-time-fix-legacy-tiered-expansion.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch legacy tiered rewrite expansion
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/ingest-feeds-legacy.ts")
          text = path.read_text()
          old = '''  const currentWords = rewriteMainProseWordCount(prior);\n  const need = NON_EVERGREEN_MIN_MAIN_WORDS - currentWords;\n'''
          new = '''  const currentWords = rewriteMainProseWordCount(prior);\n  const target = minWordsForItem(it, prior);\n  const need = target - currentWords;\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one legacy expansion target match, found {count}")
          text = text.replace(old, new)
          path.write_text(text)

          test = Path("src/lib/ingest-feeds-legacy-tier.test.ts")
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(new URL("./ingest-feeds-legacy.ts", import.meta.url), "utf8");\n\ndescribe("legacy ingest tiered rewrite expansion", () => {\n  it("calculates expansion need from the item tier instead of the 800-word baseline", () => {\n    expect(source).toContain("const target = minWordsForItem(it, prior);");\n    expect(source).toContain("const need = target - currentWords;");\n    expect(source).not.toContain("const need = NON_EVERGREEN_MIN_MAIN_WORDS - currentWords;");\n  });\n\n  it("keeps the downstream tiered publication floor", () => {\n    expect(source).toContain("const target = minWordsForItem(item, rw);");\n    expect(source).toContain("Rewrite below tiered minimum (${words}/${target} words). Try again.");\n  });\n});\n''')

          workflow = Path(".github/workflows/one-time-fix-legacy-tiered-expansion.yml")
          workflow.unlink()

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ingest-feeds-legacy.ts src/lib/ingest-feeds-legacy-tier.test.ts .github/workflows/one-time-fix-legacy-tiered-expansion.yml
          git commit -m "Fix legacy tier-aware rewrite expansion"
          git push
