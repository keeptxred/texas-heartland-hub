name: Agent tune newsroom throughput

on:
  push:
    branches: [agent/facebook-hard-duplicate-guard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/facebook-hard-duplicate-guard
          fetch-depth: 0
      - name: Tune daily article and image recovery ceilings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          endpoint = Path('src/routes/api/public/hooks/publish-overdue-gap.ts')
          text = endpoint.read_text()
          old = 'const MAX_PUBLISHED = 2;'
          if old not in text:
            raise SystemExit('MAX_PUBLISHED=2 marker not found')
          endpoint.write_text(text.replace(old, 'const MAX_PUBLISHED = 1;', 1))

          workflow = Path('.github/workflows/adsense-image-backfill.yml')
          text = workflow.read_text()
          old = '          max_per_run=24'
          if old not in text:
            raise SystemExit('max_per_run=24 marker not found')
          workflow.write_text(text.replace(old, '          max_per_run=8', 1))
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/api/public/hooks/publish-overdue-gap.ts .github/workflows/adsense-image-backfill.yml
          git rm .github/workflows/agent-tune-throughput.yml
          git commit -m 'Tune newsroom and image recovery throughput'
          git push origin HEAD:agent/facebook-hard-duplicate-guard
