name: One-time KeepTXRed Cloudflare apex cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-apex-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-apex-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_HOSTNAME: keeptxred.com
      PRODUCTION_ZONE_NAME: keeptxred.com

    steps:
      - name: Verify cutover credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Cloudflare credential::$name is not configured in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Worker preview before touching DNS
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          account_subdomain="$(python3 - "$subdomain_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("success") is not True:
              raise SystemExit(f"Unable to resolve workers.dev subdomain: {data.get('errors')!r}")
          print((data.get("result") or {}).get("subdomain") or "")
          PY
          )"
          if [[ -z "$account_subdomain" ]]; then
            echo "::error title=Worker preview unavailable::Cloudflare did not return the account workers.dev subdomain. DNS was not touched."
            exit 1
          fi
          health_url="https://$WORKER_NAME.$account_subdomain.workers.dev/api/public/hooks/health"
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error "$health_url")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok": failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True: failures.append("AI provider is not ready")
          if failures:
              raise SystemExit("Worker preview health verification failed: " + "; ".join(failures))
          print("Worker preview is healthy: database=ok, ai_provider_ready=true")
          PY

      - name: Resolve Cloudflare zone and back up conflicting apex DNS
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          zone_id="${CLOUDFLARE_ZONE_ID:-}"

          if [[ -z "$zone_id" ]]; then
            zone_file="$(mktemp)"
            trap 'rm -f "$zone_file"' EXIT
            set +e
            zone_http="$(curl --silent --show-error -o "$zone_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --get --data-urlencode "name=$PRODUCTION_ZONE_NAME" \
              --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
              "$api/zones")"
            zone_curl=$?
            set -e
            if [[ "$zone_curl" -ne 0 || "$zone_http" -ge 400 ]]; then
              echo "::error title=Cloudflare Zone Read permission required::Add Zone > Zone > Read and Zone > DNS > Edit for keeptxred.com to CLOUDFLARE_DEPLOY_API_TOKEN. No DNS records were changed."
              cat "$zone_file" >&2 || true
              exit 1
            fi
            zone_id="$(python3 - "$zone_file" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [z for z in (data.get("result") or []) if z.get("name") == os.environ["PRODUCTION_ZONE_NAME"] and (z.get("account") or {}).get("id") == os.environ["CLOUDFLARE_ACCOUNT_ID"]]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one matching Cloudflare zone; found {len(matches)}")
          if matches[0].get("status") != "active":
              raise SystemExit(f"Cloudflare zone is not active: {matches[0].get('status')!r}")
          print(matches[0]["id"])
          PY
            )"
          fi

          records_file="$(mktemp)"
          set +e
          records_http="$(curl --silent --show-error -o "$records_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --get --data-urlencode "name=$PRODUCTION_HOSTNAME" --data-urlencode "per_page=100" \
            "$api/zones/$zone_id/dns_records")"
          records_curl=$?
          set -e
          if [[ "$records_curl" -ne 0 || "$records_http" -ge 400 ]]; then
            echo "::error title=Cloudflare DNS Edit permission required::Unable to read the existing apex DNS records. Add Zone > DNS > Edit for keeptxred.com to CLOUDFLARE_DEPLOY_API_TOKEN. No DNS records were changed."
            cat "$records_file" >&2 || true
            exit 1
          fi

          backup="$RUNNER_TEMP/keeptxred-apex-dns-backup.json"
          python3 - "$records_file" "$backup" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("success") is not True:
              raise SystemExit(f"DNS record lookup failed: {data.get('errors')!r}")
          hostname = os.environ["PRODUCTION_HOSTNAME"].rstrip(".").lower()
          conflicts = []
          for r in data.get("result") or []:
              if str(r.get("name") or "").rstrip(".").lower() == hostname and r.get("type") in {"A", "AAAA", "CNAME"}:
                  conflicts.append({
                      "id": r.get("id"), "type": r.get("type"), "name": r.get("name"),
                      "content": r.get("content"), "ttl": r.get("ttl", 1),
                      "proxied": r.get("proxied"), "comment": r.get("comment"),
                      "tags": r.get("tags") or [],
                  })
          if not conflicts:
              raise SystemExit("No exact-host A/AAAA/CNAME record was found. Refusing to delete anything.")
          json.dump(conflicts, open(sys.argv[2], "w", encoding="utf-8"))
          print("Backed up conflicting apex web DNS records:")
          for r in conflicts:
              print(f"- {r['type']} {r['name']} -> {r['content']} (proxied={r['proxied']})")
          PY
          rm -f "$records_file"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"

      - name: Replace apex web DNS with Worker Custom Domain
        id: cutover
        shell: bash
        env:
          ZONE_ID: ${{ steps.dns.outputs.zone_id }}
          BACKUP: ${{ steps.dns.outputs.backup }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          restore_dns() {
            python3 - "$BACKUP" <<'PY' | while IFS= read -r payload; do
          import json, sys
          for r in json.load(open(sys.argv[1], encoding="utf-8")):
              payload = {k: r.get(k) for k in ("type", "name", "content", "ttl", "proxied", "comment", "tags") if r.get(k) is not None}
              print(json.dumps(payload, separators=(",", ":")))
          PY
              restore_file="$workdir/restore.json"
              restore_http="$(curl --silent --show-error -o "$restore_file" -w '%{http_code}' \
                -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                --data "$payload" "$api/zones/$ZONE_ID/dns_records")"
              if [[ "$restore_http" -ge 400 ]]; then
                echo "::error title=DNS rollback failed::Cloudflare returned HTTP $restore_http while restoring an apex record."
                cat "$restore_file" >&2
                return 1
              fi
            done
          }

          while IFS= read -r record_id; do
            delete_file="$workdir/delete-$record_id.json"
            set +e
            delete_http="$(curl --silent --show-error -o "$delete_file" -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/zones/$ZONE_ID/dns_records/$record_id")"
            delete_curl=$?
            set -e
            if [[ "$delete_curl" -ne 0 || "$delete_http" -ge 400 ]]; then
              echo "::error title=Cloudflare DNS deletion failed::Failed to remove one conflicting apex web record (HTTP $delete_http). Rolling back."
              restore_dns || true
              exit 1
            fi
          done < <(python3 - "$BACKUP" <<'PY'
          import json, sys
          for r in json.load(open(sys.argv[1], encoding="utf-8")):
              print(r["id"])
          PY
          )

          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"hostname": os.environ["PRODUCTION_HOSTNAME"], "service": os.environ["WORKER_NAME"], "zone_name": os.environ["PRODUCTION_ZONE_NAME"]}))
          PY
          )"
          attach_file="$workdir/attach.json"
          set +e
          attach_http="$(curl --silent --show-error -o "$attach_file" -w '%{http_code}' \
            -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "$payload" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          attach_curl=$?
          set -e

          cutover_ok="$(python3 - "$attach_file" <<'PY'
          import json, os, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("false"); raise SystemExit
          r = data.get("result") or {}
          ok = data.get("success") is True and r.get("hostname") == os.environ["PRODUCTION_HOSTNAME"] and r.get("service") == os.environ["WORKER_NAME"]
          print("true" if ok else "false")
          PY
          )"
          if [[ "$attach_curl" -ne 0 || "$attach_http" -ge 400 || "$cutover_ok" != "true" ]]; then
            echo "Worker Custom Domain attach failed after DNS removal; restoring previous web DNS immediately."
            restore_dns
            cat "$attach_file" >&2 || true
            exit 1
          fi

          domain_id="$(python3 - "$attach_file" <<'PY'
          import json, sys
          print((json.load(open(sys.argv[1], encoding="utf-8")).get("result") or {}).get("id") or "")
          PY
          )"
          if [[ -z "$domain_id" ]]; then
            echo "Custom Domain response omitted its ID; restoring old DNS rather than leaving an unverified cutover."
            restore_dns
            exit 1
          fi
          echo "domain_id=$domain_id" >> "$GITHUB_OUTPUT"
          echo "Worker Custom Domain attached successfully."

      - name: Verify production and rollback if unhealthy
        shell: bash
        env:
          ZONE_ID: ${{ steps.dns.outputs.zone_id }}
          BACKUP: ${{ steps.dns.outputs.backup }}
          DOMAIN_ID: ${{ steps.cutover.outputs.domain_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          curl --retry 60 --retry-delay 5 --retry-all-errors --fail-with-body --silent --show-error \
            -o "$response_file" "https://$PRODUCTION_HOSTNAME/api/public/hooks/health"
          curl_status=$?
          set -e

          health_ok=false
          if [[ "$curl_status" -eq 0 ]]; then
            health_ok="$(python3 - "$response_file" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
              ok = data.get("database") == "ok" and data.get("ai_provider_ready") is True
          except Exception:
              ok = False
          print("true" if ok else "false")
          PY
            )"
          fi

          if [[ "$health_ok" == "true" ]]; then
            curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error -o /dev/null "https://$PRODUCTION_HOSTNAME/"
            echo "Production health passed and homepage is reachable. KeepTXRed is now served by Cloudflare Workers."
            exit 0
          fi

          echo "Production health failed after the provisioning window. Rolling back to the previous web DNS."
          detach_file="$(mktemp)"
          detach_http="$(curl --silent --show-error -o "$detach_file" -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$DOMAIN_ID")"
          if [[ "$detach_http" -ge 400 ]]; then
            echo "::error title=Automatic rollback blocked::Could not detach the failed Worker Custom Domain (HTTP $detach_http)."
            cat "$detach_file" >&2
            exit 1
          fi

          restore_failed=0
          while IFS= read -r payload; do
            restore_file="$(mktemp)"
            restore_http="$(curl --silent --show-error -o "$restore_file" -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$payload" "$api/zones/$ZONE_ID/dns_records")"
            if [[ "$restore_http" -ge 400 ]]; then
              echo "::error title=DNS rollback failed::Could not restore an apex record (HTTP $restore_http)."
              cat "$restore_file" >&2
              restore_failed=1
            fi
            rm -f "$restore_file"
          done < <(python3 - "$BACKUP" <<'PY'
          import json, sys
          for r in json.load(open(sys.argv[1], encoding="utf-8")):
              payload = {k: r.get(k) for k in ("type", "name", "content", "ttl", "proxied", "comment", "tags") if r.get(k) is not None}
              print(json.dumps(payload, separators=(",", ":")))
          PY
          )
          [[ "$restore_failed" -eq 0 ]] || exit 1
          echo "::error title=Cloudflare cutover rolled back::Production health failed, so the previous apex DNS records were restored."
          exit 1
