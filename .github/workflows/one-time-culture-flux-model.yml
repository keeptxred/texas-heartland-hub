name: One-time culture FLUX image model fix

on:
  push:
    branches:
      - fix/culture-flux-image-model

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/culture-flux-image-model
      - name: Route culture images through Cloudflare FLUX
        shell: python
        run: |
          from pathlib import Path

          cf = Path('src/lib/featured-image-cloudflare.ts')
          s = cf.read_text()
          old = '''export const CLOUDFLARE_IMAGE_MODEL = "@cf/lykon/dreamshaper-8-lcm";\nexport const CLOUDFLARE_VISION_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct";'''
          new = '''export const CLOUDFLARE_IMAGE_MODEL = "@cf/lykon/dreamshaper-8-lcm";\nexport const CLOUDFLARE_CULTURE_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell";\nexport const CLOUDFLARE_VISION_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct";\n\nexport type CloudflareImageModel =\n  | typeof CLOUDFLARE_IMAGE_MODEL\n  | typeof CLOUDFLARE_CULTURE_IMAGE_MODEL;'''
          if s.count(old) != 1:
              raise SystemExit(f'model constant match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old2 = '''export async function generateImageBytes(prompt: string, negativePrompt: string): Promise<Uint8Array> {\n  const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;\n  const apiToken = process.env.CLOUDFLARE_API_TOKEN;\n  if (!accountId || !apiToken) throw new Error("Missing Cloudflare Workers AI credentials: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required");\n\n  const res = await fetch(cloudflareEndpoint(accountId, CLOUDFLARE_IMAGE_MODEL), {\n    method: "POST",\n    headers: { Authorization: `Bearer ${apiToken}`, "Content-Type": "application/json" },\n    body: JSON.stringify({\n      prompt,\n      negative_prompt: negativePrompt,\n      width: 1024,\n      height: 576,\n      num_steps: 20,\n      guidance: 7.5,\n      seed: Math.floor(Math.random() * 2_147_483_646) + 1,\n    }),\n  });'''
          new2 = '''export async function generateImageBytes(\n  prompt: string,\n  negativePrompt: string,\n  model: CloudflareImageModel = CLOUDFLARE_IMAGE_MODEL,\n): Promise<Uint8Array> {\n  const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;\n  const apiToken = process.env.CLOUDFLARE_API_TOKEN;\n  if (!accountId || !apiToken) throw new Error("Missing Cloudflare Workers AI credentials: CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required");\n\n  const seed = Math.floor(Math.random() * 2_147_483_646) + 1;\n  const requestBody = model === CLOUDFLARE_CULTURE_IMAGE_MODEL\n    ? {\n        // FLUX.1 Schnell uses its own compact Workers AI schema. Put the most\n        // important negative constraints into the text prompt because the model\n        // does not accept DreamShaper's negative_prompt parameter.\n        prompt: `${prompt} Avoid all of the following: ${negativePrompt}`.slice(0, 2048),\n        steps: 8,\n        seed,\n      }\n    : {\n        prompt,\n        negative_prompt: negativePrompt,\n        width: 1024,\n        height: 576,\n        num_steps: 20,\n        guidance: 7.5,\n        seed,\n      };\n\n  const res = await fetch(cloudflareEndpoint(accountId, model), {\n    method: "POST",\n    headers: { Authorization: `Bearer ${apiToken}`, "Content-Type": "application/json" },\n    body: JSON.stringify(requestBody),\n  });'''
          if s.count(old2) != 1:
              raise SystemExit(f'generator function match count={s.count(old2)}')
          cf.write_text(s.replace(old2, new2, 1))

          functions = Path('src/lib/featured-image.functions.ts')
          f = functions.read_text()
          old_import = 'import { generateImageBytes, validateImageMatchesArticle } from "./featured-image-cloudflare";'
          new_import = 'import { CLOUDFLARE_CULTURE_IMAGE_MODEL, generateImageBytes, validateImageMatchesArticle } from "./featured-image-cloudflare";'
          if f.count(old_import) != 1:
              raise SystemExit(f'functions import match count={f.count(old_import)}')
          f = f.replace(old_import, new_import, 1)

          old_start = '''  try {\n    let negativePrompt = buildNegativeImagePrompt(subject);\n    let bytes = await generateImageBytes(prompt, negativePrompt);\n    let verdict = await validateImageMatchesArticle(bytes, subject);\n    let usedPrompt = prompt;'''
          new_start = '''  try {\n    let negativePrompt = buildNegativeImagePrompt(subject);\n    const imageModel = subject.domain === "culture" ? CLOUDFLARE_CULTURE_IMAGE_MODEL : undefined;\n    let bytes = await generateImageBytes(prompt, negativePrompt, imageModel);\n    let verdict = await validateImageMatchesArticle(bytes, subject);\n    let usedPrompt = prompt;'''
          if f.count(old_start) != 1:
              raise SystemExit(f'initial generation match count={f.count(old_start)}')
          f = f.replace(old_start, new_start, 1)

          old_retry = '      bytes = await generateImageBytes(stronger, negativePrompt);'
          new_retry = '      bytes = await generateImageBytes(stronger, negativePrompt, imageModel);'
          if f.count(old_retry) != 1:
              raise SystemExit(f'retry generation match count={f.count(old_retry)}')
          functions.write_text(f.replace(old_retry, new_retry, 1))

          test = Path('src/lib/culture-image-model-routing.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\nimport { CLOUDFLARE_CULTURE_IMAGE_MODEL, CLOUDFLARE_IMAGE_MODEL } from "./featured-image-cloudflare";\n\nconst functionsSource = readFileSync(new URL("./featured-image.functions.ts", import.meta.url), "utf8");\nconst cloudflareSource = readFileSync(new URL("./featured-image-cloudflare.ts", import.meta.url), "utf8");\n\ndescribe("culture image model routing", () => {\n  it("keeps DreamShaper as the general default and uses hosted FLUX for culture", () => {\n    expect(CLOUDFLARE_IMAGE_MODEL).toBe("@cf/lykon/dreamshaper-8-lcm");\n    expect(CLOUDFLARE_CULTURE_IMAGE_MODEL).toBe("@cf/black-forest-labs/flux-1-schnell");\n    expect(functionsSource).toContain('subject.domain === "culture" ? CLOUDFLARE_CULTURE_IMAGE_MODEL : undefined');\n    expect(functionsSource).toContain("generateImageBytes(stronger, negativePrompt, imageModel)");\n  });\n\n  it("uses FLUX native steps schema instead of DreamShaper-only fields", () => {\n    expect(cloudflareSource).toContain("model === CLOUDFLARE_CULTURE_IMAGE_MODEL");\n    expect(cloudflareSource).toContain("steps: 8");\n    expect(cloudflareSource).toContain("Avoid all of the following");\n    expect(cloudflareSource).toContain("negative_prompt: negativePrompt");\n  });\n});\n''')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-culture-flux-model.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/featured-image-cloudflare.ts src/lib/featured-image.functions.ts src/lib/culture-image-model-routing.test.ts .github/workflows/one-time-culture-flux-model.yml
          git commit -m 'Route culture images through Cloudflare FLUX'
          git push origin HEAD:fix/culture-flux-image-model
