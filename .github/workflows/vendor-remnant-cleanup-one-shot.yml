name: One-shot first-party cleanup

on:
  push:
    branches:
      - remove-lovable-remnants-current-main-20260822
    paths:
      - .github/workflows/vendor-remnant-cleanup-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: remove-lovable-remnants-current-main-20260822
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Rewrite active vendor remnants and migrate hosted assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import mimetypes
          import re
          import urllib.request

          INTERNAL_CHAT = "https://ai.internal.keeptxred.local/v1/chat/completions"
          INTERNAL_IMAGES = "https://ai.internal.keeptxred.local/v1/images/generations"

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # Direct AI router: first-party internal endpoints only. No legacy
          # gateway aliases or legacy availability variables remain.
          path = Path("src/lib/direct-ai-fetch.ts")
          text = path.read_text()
          text = text.replace('const LEGACY_CHAT = "https://ai.gateway.lovable.dev/v1/chat/completions";\n', '')
          text = text.replace('const LEGACY_IMAGES = "https://ai.gateway.lovable.dev/v1/images/generations";\n', '')
          text = text.replace(
              '''  if (cf || geminiKey) {\n    process.env.KTR_AI_PROVIDER_READY = "direct-provider";\n    // Temporary compatibility for old callers that only use this variable as\n    // an availability gate. The value is never sent to any external service.\n    if (!process.env.LOVABLE_API_KEY) process.env.LOVABLE_API_KEY = "direct-provider";\n  }\n''',
              '''  if (cf || geminiKey) process.env.KTR_AI_PROVIDER_READY = "direct-provider";\n''',
          )
          text = text.replace('    const isLegacyChat = url === LEGACY_CHAT;\n', '')
          text = text.replace('    const isLegacyImages = url === LEGACY_IMAGES;\n', '')
          text = text.replace(
              '    if (!isInternalChat && !isInternalImages && !isLegacyChat && !isLegacyImages) {\n',
              '    if (!isInternalChat && !isInternalImages) {\n',
          )
          text = text.replace('    if (isInternalImages || isLegacyImages) {\n', '    if (isInternalImages) {\n')
          if 'lovable' in text.lower():
              raise SystemExit('direct-ai-fetch.ts still contains vendor text')
          path.write_text(text)

          # Active AI callers now talk only to the internal router. The readiness
          # gate is first-party and no external gateway credential header is sent.
          for name in [
              "src/lib/ingest-feeds-legacy.ts",
              "src/routes/api/public/hooks/generate-sports.ts",
              "src/lib/expand-cached-rewrite.ts",
              "src/lib/ctr-loop.functions.ts",
              "src/services/contentAI.functions.ts",
          ]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace('https://ai.gateway.lovable.dev/v1/chat/completions', INTERNAL_CHAT)
              text = text.replace('https://ai.gateway.lovable.dev/v1/images/generations', INTERNAL_IMAGES)
              text = text.replace('_lovableApiKey', '_aiProviderReady')
              text = text.replace('lovableApiKey', 'aiProviderReady')
              text = text.replace('LOVABLE_API_KEY', 'KTR_AI_PROVIDER_READY')
              text = re.sub(r'\s*["\']Lovable-API-Key["\']\s*:\s*aiProviderReady,?', '', text)
              text = text.replace('Missing KTR_AI_PROVIDER_READY', 'AI provider is not configured')
              text = text.replace('Lovable gateway', 'external AI gateway')
              text = text.replace('Lovable AI', 'external AI')
              text = text.replace('Lovable', 'legacy platform')
              p.write_text(text)

          # Tests and validation contracts should check the first-party router,
          # not the retired gateway or retired environment-variable name.
          for name in [
              "src/lib/living-story-update.test.ts",
              "src/lib/ingest-feeds-legacy-tier.test.ts",
              "src/lib/newsroom-legacy-fallback-budget.test.ts",
              "src/routes/api/public/hooks/generate-news.word-budget.test.ts",
              "src/routes/api/public/hooks/reconcile-news-history.test.ts",
              "scripts/shared/validate-publication-writers.mjs",
          ]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace('https://ai.gateway.lovable.dev/v1/chat/completions', INTERNAL_CHAT)
              text = text.replace('ai.gateway.lovable.dev', 'ai.internal.keeptxred.local')
              text = text.replace('LOVABLE_API_KEY', 'KTR_AI_PROVIDER_READY')
              text = text.replace('Lovable-API-Key', 'X-Internal-AI-Provider')
              text = text.replace('Lovable Cloud', 'Keep TX Red server')
              text = text.replace('Lovable', 'legacy platform')
              p.write_text(text)

          # Remove obsolete vendor route assumptions from crawl/indexability rules.
          p = Path("scripts/seo/validate-indexability.mjs")
          if p.exists():
              text = p.read_text().replace(', /^\\/lovable\\//', '')
              p.write_text(text)

          # Deployment/workflow copy only; operational behavior stays unchanged.
          for name in [
              ".github/workflows/sync-texas-legislation.yml",
              ".github/workflows/apply-supabase-migrations.yml",
              "src/routes/admin/bills/backfill.tsx",
              "src/routes/api/admin/legislation-sync-proxy.ts",
              "src/routes/api/admin/legislation-sync-proxy.$.ts",
          ]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace('Lovable Cloud', 'the deployed Keep TX Red server')
              text = text.replace('Lovable server', 'application server')
              text = text.replace('Lovable', 'legacy platform')
              p.write_text(text)

          # Historical migration source should remain reproducible without a
          # retired hosting hostname. This edits repository history inputs only;
          # it does not execute or reschedule production jobs.
          p = Path('supabase/migrations/20260627133555_f934a17f-5d3a-432f-95b6-47ef8fcaba77.sql')
          if p.exists():
              text = p.read_text()
              text = re.sub(r'https://project--[a-z0-9-]+\.lovable\.app', 'https://keeptxred.com', text)
              p.write_text(text)

          # Copy every still-referenced hosted asset into the repository and
          # rewrite its metadata/path to a first-party static URL.
          mapping = {}
          for meta in sorted(Path('src/assets').rglob('*.asset.json')):
              try:
                  data = json.loads(meta.read_text())
              except Exception:
                  continue
              old = str(data.get('url') or '')
              if not old.startswith('/__l5e/'):
                  continue
              rel = meta.relative_to('src/assets').as_posix().removesuffix('.asset.json')
              destination = Path('public/assets/migrated') / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(
                  'https://keeptxred.com' + old,
                  headers={'User-Agent': 'KeepTXRed asset migration/1.0'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
                  content_type = response.headers.get_content_type() or mimetypes.guess_type(destination.name)[0] or 'application/octet-stream'
              if not content:
                  raise SystemExit(f'empty asset response for {old}')
              destination.write_bytes(content)
              new_url = '/assets/migrated/' + rel
              mapping[old] = new_url
              meta.write_text(json.dumps({
                  'version': 1,
                  'url': new_url,
                  'original_filename': data.get('original_filename') or destination.name,
                  'size': len(content),
                  'content_type': content_type,
              }, indent=2) + '\n')

          # One old BBQ image was referenced only by a migration, not metadata.
          extra_old = '/__l5e/assets-v1/154c83ac-b244-4741-9260-6f3fdab8e374/bbq.jpg'
          if any(extra_old in p.read_text(errors='ignore') for p in Path('.').rglob('*.sql')):
              destination = Path('public/assets/migrated/bbq.jpg')
              destination.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request('https://keeptxred.com' + extra_old, headers={'User-Agent': 'KeepTXRed asset migration/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
              if not content:
                  raise SystemExit('empty BBQ asset response')
              destination.write_bytes(content)
              mapping[extra_old] = '/assets/migrated/bbq.jpg'

          if mapping:
              text_suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.sql', '.md', '.yml', '.yaml', '.toml', '.txt'}
              for p in Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in text_suffixes:
                      continue
                  try:
                      text = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  changed = text
                  for old, new in mapping.items():
                      changed = changed.replace(old, new)
                  if changed != text:
                      p.write_text(changed)

          # The historical publisher-logo asset metadata is no longer needed;
          # current schema points to /keep-tx-red-icon.svg.
          unused_logo_meta = Path('src/assets/red-texas-icon.png.asset.json')
          if unused_logo_meta.exists():
              unused_logo_meta.unlink()

          # Remove remaining purely textual vendor wording in the two workflow
          # comments that do not participate in runtime behavior.
          for p in [Path('.github/workflows/sync-texas-legislation.yml'), Path('.github/workflows/apply-supabase-migrations.yml')]:
              if p.exists():
                  text = p.read_text().replace('Lovable', 'third-party hosting').replace('lovable', 'third-party-hosting')
                  p.write_text(text)
          PY

      - name: Regenerate dependency lock from the public registry
        shell: bash
        run: |
          rm -f bun.lock
          bun install --lockfile-only --registry=https://registry.npmjs.org

      - name: Install and regenerate TanStack route tree
        shell: bash
        run: |
          bun install --frozen-lockfile --registry=https://registry.npmjs.org
          bun run build

      - name: Remove one-shot workflow and verify forbidden remnants
        shell: bash
        run: |
          rm -f .github/workflows/vendor-remnant-cleanup-one-shot.yml
          set +e
          git grep -n -i -E 'lovable|ai\.gateway\.lovable\.dev|/__l5e|lovable-core-prod' -- ':!supabase/.temp/**' > /tmp/vendor-remnants.txt
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'Remaining vendor markers:'
            cat /tmp/vendor-remnants.txt
            exit 1
          fi
          echo 'No forbidden vendor markers remain in tracked text.'

      - name: Commit generated cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Complete first-party vendor-remnant cleanup'
          git push origin HEAD:remove-lovable-remnants-current-main-20260822
