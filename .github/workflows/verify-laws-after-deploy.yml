name: Verify deployed laws routes

on:
  workflow_run:
    workflows:
      - "Deploy verified KeepTXRed to Cloudflare"
      - "Deploy KeepTXRed to Cloudflare Workers"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-laws-runtime-smoke
  cancel-in-progress: true

jobs:
  verify-laws:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://keeptxred-site.freddy-coppola.workers.dev
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify deployed law route ownership, H1s, and canonicals
        run: python3 scripts/verify-deployed-laws-runtime.py
