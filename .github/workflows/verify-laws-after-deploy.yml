name: Verify deployed laws routes

on:
  workflow_run:
    workflows:
      - "Deploy verified KeepTXRed to Cloudflare"
      - "Deploy KeepTXRed to Cloudflare Workers"
      - "Ensure Cloudflare Production Matches Main"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-laws-runtime-smoke
  cancel-in-progress: true

jobs:
  verify-laws:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://keeptxred-site.freddy-coppola.workers.dev
    steps:
      - name: Checkout verified law smoke checks
        uses: actions/checkout@v5

      - name: Verify all laws routes and shared guide on workers.dev
        shell: bash
        env:
          SITE_URL: https://keeptxred-site.freddy-coppola.workers.dev
        run: |
          set -euo pipefail
          python3 scripts/verify-deployed-laws-runtime.py
          python3 scripts/verify-deployed-law-guide-rendering.py

      - name: Verify all laws routes and shared guide on canonical domain
        shell: bash
        env:
          SITE_URL: https://keeptxred.com
        run: |
          set -euo pipefail
          python3 scripts/verify-deployed-laws-runtime.py
          python3 scripts/verify-deployed-law-guide-rendering.py
