name: Patch TexasDefined Facebook dry run

on:
  push:
    branches:
      - texasdefined-facebook-safe-dry-run
    paths:
      - '.github/workflows/patch-texasdefined-facebook-dry-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: texasdefined-facebook-safe-dry-run
          fetch-depth: 0
      - name: Add non-destructive dry-run path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/routes/api/public/hooks/auto-facebook-post-texasdefined-smart.ts')
          text = path.read_text()

          old = '''  const mode = request.headers.get("x-ktr-facebook-mode")?.trim().toLowerCase() || "scheduled";\n  const now = new Date();'''
          new = '''  const mode = request.headers.get("x-ktr-facebook-mode")?.trim().toLowerCase() || "scheduled";\n  const dryRunHeader = request.headers.get("x-ktr-facebook-dry-run")?.trim().toLowerCase() ?? "";\n  const dryRun = dryRunHeader === "1" || dryRunHeader === "true" || dryRunHeader === "yes";\n  const now = new Date();'''
          assert old in text, 'mode marker not found'
          text = text.replace(old, new, 1)

          old = '''  const decision = postingDecision({ now, seed: adminSeed, recentRows });\n  if (mode !== "manual" && !decision.shouldPost) {'''
          new = '''  const decision = postingDecision({ now, seed: adminSeed, recentRows });\n  if (!dryRun && mode !== "manual" && !decision.shouldPost) {'''
          assert old in text, 'schedule marker not found'
          text = text.replace(old, new, 1)

          old = '''  const hardGuard = hardPostingGuard({ now, recentRows, livePosts });\n  if (!hardGuard.allowed) {'''
          new = '''  const hardGuard = hardPostingGuard({ now, recentRows, livePosts });\n  if (!dryRun && !hardGuard.allowed) {'''
          assert old in text, 'hard guard marker not found'
          text = text.replace(old, new, 1)

          old = '''  const kind = selectKind(adminSeed, decision.dateKey, Math.max(decision.postsToday, hardGuard.postsToday));\n  if (kind === "article") return forwardArticlePost(token);'''
          new = '''  const kind = selectKind(adminSeed, decision.dateKey, Math.max(decision.postsToday, hardGuard.postsToday));\n  if (kind === "article") {\n    if (dryRun) {\n      return Response.json({\n        ok: true,\n        posted: false,\n        dry_run: true,\n        site: "TexasDefined",\n        kind: "article",\n        would_post: decision.shouldPost && hardGuard.allowed,\n        would_forward_article: true,\n        schedule_decision: decision,\n        hard_guard: hardGuard,\n        note: "Dry run: no Facebook post, article forward, or database write occurred",\n      });\n    }\n    return forwardArticlePost(token);\n  }'''
          assert old in text, 'article marker not found'
          text = text.replace(old, new, 1)

          old = '''  const graphUrl = `https://graph.facebook.com/${GRAPH_VERSION}/${encodeURIComponent(String(connection.account_id))}/feed`;'''
          new = '''  if (dryRun) {\n    return Response.json({\n      ok: true,\n      posted: false,\n      dry_run: true,\n      site: "TexasDefined",\n      kind: post.kind,\n      title: post.title,\n      message: post.message,\n      article_url: null,\n      would_post: decision.shouldPost && hardGuard.allowed,\n      schedule_decision: decision,\n      hard_guard: hardGuard,\n      content_mix: { engagement: 40, article: 30, fact: 15, seasonal: 10, shop: 5 },\n      duplicate_policy: {\n        history_days: HISTORY_DAYS,\n        exact_and_near_duplicate_guard: true,\n        sources: ["facebook", "publishing_queue"],\n      },\n      lake_level_policy: {\n        enabled: true,\n        source: "Water Data for Texas",\n        source_order: ["recent-conditions.json", "1year.csv", "reservoir page"],\n        max_age_days: LAKE_LEVEL_MAX_AGE_DAYS,\n      },\n      note: "Dry run: no Facebook post or database write occurred",\n    });\n  }\n\n  const graphUrl = `https://graph.facebook.com/${GRAPH_VERSION}/${encodeURIComponent(String(connection.account_id))}/feed`;'''
          assert old in text, 'graph marker not found'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/patch-texasdefined-facebook-dry-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/api/public/hooks/auto-facebook-post-texasdefined-smart.ts
          git commit -m 'Add safe TexasDefined Facebook dry-run mode'
          git push origin HEAD:texasdefined-facebook-safe-dry-run
