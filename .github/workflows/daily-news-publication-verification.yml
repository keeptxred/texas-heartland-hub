name: Verify Daily News Publication

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/news/validate-daily-news-migration.mjs'
      - '.github/workflows/daily-news-publication-verification.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/news/validate-daily-news-migration.mjs'
      - '.github/workflows/daily-news-publication-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news-publication-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed daily news migrations
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD^..HEAD"
          fi

          mapfile -t candidates < <(git diff --name-only --diff-filter=AM "$RANGE" -- 'supabase/migrations/*.sql' || true)
          : > /tmp/daily-news-migrations.txt
          for file in "${candidates[@]}"; do
            [[ -f "$file" ]] || continue
            if grep -Eqi '(INSERT[[:space:]]+INTO|UPDATE)[[:space:]]+public\.daily_articles' "$file"; then
              echo "$file" >> /tmp/daily-news-migrations.txt
            fi
          done

          if [[ -s /tmp/daily-news-migrations.txt ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo 'Daily news publication migrations:'
            cat /tmp/daily-news-migrations.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo 'No changed daily_articles publication migrations.'
          fi

      - name: Validate publication contract
        if: steps.changed.outputs.found == 'true'
        shell: bash
        run: |
          mapfile -t files < /tmp/daily-news-migrations.txt
          node scripts/news/validate-daily-news-migration.mjs "${files[@]}"

  live-publication:
    if: github.event_name == 'push'
    needs: migration-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract article slugs and image URLs from changed migrations
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$RANGE" -- 'supabase/migrations/*.sql' || true)
          : > /tmp/article-slugs.txt
          : > /tmp/article-images.txt
          bulk=0

          extract_from_file() {
            local file="$1"
            grep -Eo "\('20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+'[[:space:]]*," "$file" \
              | sed -E "s/^\('//; s/'[[:space:]]*,$//" >> /tmp/article-slugs.txt || true
            grep -Eio "SELECT[[:space:]]+'20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+'[[:space:]]*::[[:space:]]*text[[:space:]]+slug" "$file" \
              | sed -E "s/^SELECT[[:space:]]+'//I; s/'[[:space:]]*::[[:space:]]*text[[:space:]]+slug$//I" >> /tmp/article-slugs.txt || true
            grep -Eio 'SELECT[[:space:]]+\$slug\$20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\$slug\$[[:space:]]*::[[:space:]]*text[[:space:]]+slug' "$file" \
              | sed -E 's/^SELECT[[:space:]]+\$slug\$//I; s/\$slug\$[[:space:]]*::[[:space:]]*text[[:space:]]+slug$//I' >> /tmp/article-slugs.txt || true
          }

          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            extract_from_file "$file"
            if grep -Eq '^\s*--\s*BULK_IMAGE_REMEDIATION\s*$' "$file"; then
              bulk=1
            fi
            grep -Eo "https://[^'[:space:]]+|/images/news/[^'[:space:]]+" "$file" \
              | grep -Ei '\.(png|jpg|jpeg|webp)([?#&].*)?$' >> /tmp/article-images.txt || true
          done

          if [[ "$bulk" == "1" ]]; then
            echo 'Bulk image remediation detected; expanding live audit to Aug. 8-9 daily news migrations.'
            for file in supabase/migrations/20260808*.sql supabase/migrations/20260809*.sql; do
              [[ -f "$file" ]] || continue
              grep -Eqi '(INSERT[[:space:]]+INTO|UPDATE)[[:space:]]+public\.daily_articles' "$file" || continue
              extract_from_file "$file"
            done
          fi

          sort -u -o /tmp/article-slugs.txt /tmp/article-slugs.txt
          sort -u -o /tmp/article-images.txt /tmp/article-images.txt
          if [[ -s /tmp/article-slugs.txt ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo 'Article slugs:'
            cat /tmp/article-slugs.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo 'No daily news slugs found in this push.'
          fi
          if [[ -s /tmp/article-images.txt ]]; then
            echo 'Migration-declared raster image URLs:'
            cat /tmp/article-images.txt
          fi

      - name: Verify every published article resolves and emits a raster social image
        if: steps.publication.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          : > /tmp/live-article-images.txt
          while IFS= read -r slug; do
            url="https://keeptxred.com/news/$slug"
            ok=0
            for attempt in {1..10}; do
              code=$(curl -L -sS -o /tmp/article.html -w '%{http_code}' --max-time 20 "$url" || echo 000)
              social_image=""
              if [[ "$code" == "200" ]] && ! grep -Eqi '(^|>)404([^0-9]|<)|page not found|article not found' /tmp/article.html; then
                social_image=$(grep -Eio '<meta[^>]+(property|name)="(og:image|twitter:image)"[^>]*>' /tmp/article.html \
                  | head -n 1 \
                  | sed -E 's/.*content="([^"]+)".*/\1/I' || true)
                if [[ -n "$social_image" && ! "$social_image" =~ \.svg([?#].*)?$ ]]; then
                  echo "LIVE WITH RASTER SOCIAL IMAGE: $url -> $social_image"
                  printf '%s\n' "$social_image" >> /tmp/live-article-images.txt
                  ok=1
                  break
                fi
              fi
              echo "Waiting for live raster article state ($attempt/10): $url returned $code, social_image='$social_image'"
              sleep 30
            done
            if [[ "$ok" != "1" ]]; then
              echo "ERROR: article missing or still emits a missing/SVG social image: $url" >&2
              failed=1
            fi
          done < /tmp/article-slugs.txt

          if [[ -s /tmp/live-article-images.txt ]]; then
            cat /tmp/live-article-images.txt >> /tmp/article-images.txt
            sort -u -o /tmp/article-images.txt /tmp/article-images.txt
          fi

          if [[ "$failed" != "0" ]]; then
            echo 'One or more database-backed news articles are missing from production or still expose a non-raster social image. Do not report this publication batch as successful.' >&2
            exit 1
          fi

      - name: Verify every published hero image is a real raster image
        if: steps.publication.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/article-images.txt ]]; then
            echo 'ERROR: no raster hero image URLs were found from the migration or live article metadata.' >&2
            exit 1
          fi
          failed=0
          while IFS= read -r image; do
            if [[ "$image" == /* ]]; then
              url="https://keeptxred.com$image"
            else
              url="$image"
            fi
            ok=0
            for attempt in {1..10}; do
              headers=$(mktemp)
              code=$(curl -L -sS -D "$headers" -o /tmp/hero-image.bin -w '%{http_code}' --max-time 20 "$url" || echo 000)
              content_type=$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); print tolower(value)}')
              bytes=$(wc -c < /tmp/hero-image.bin 2>/dev/null || echo 0)
              rm -f "$headers"
              if [[ "$code" == "200" \
                    && "$content_type" == image/* \
                    && "$content_type" != image/svg+xml* \
                    && "$bytes" -gt 10000 ]]; then
                echo "RASTER IMAGE LIVE: $url ($content_type, $bytes bytes)"
                ok=1
                break
              fi
              echo "Waiting for raster hero image ($attempt/10): $url returned $code, content-type='$content_type', bytes=$bytes"
              sleep 30
            done
            if [[ "$ok" != "1" ]]; then
              echo "ERROR: hero image is missing, SVG, tiny, or not renderable: $url" >&2
              failed=1
            fi
          done < /tmp/article-images.txt

          if [[ "$failed" != "0" ]]; then
            echo 'One or more published hero images failed the real-raster-image gate. Do not report this publication batch as successful.' >&2
            exit 1
          fi

      - name: Publication verified
        if: steps.publication.outputs.found == 'true'
        run: echo 'All article rows and live social hero images are reachable as real raster images on the production site. This batch may be reported as successfully published.'
