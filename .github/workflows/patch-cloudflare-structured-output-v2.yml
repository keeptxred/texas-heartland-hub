name: Patch Cloudflare Structured Output V2

on:
  push:
    branches:
      - agent/cloudflare-structured-output
    paths:
      - '.github/workflows/patch-cloudflare-structured-output-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-structured-output
          fetch-depth: 0

      - name: Patch structured output passthrough and schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          server = Path('src/server.ts')
          s = server.read_text()
          if 'response_format?: { type?: string; json_schema?: unknown };' not in s:
              s, count = re.subn(
                  r'(type OpenAiCompatBody = \{[\s\S]*?\n\s*max_tokens\?: number;)\n(\s*\};)',
                  r'\1\n  response_format?: { type?: string; json_schema?: unknown };\n\2',
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not add response_format to OpenAiCompatBody')
          s, count = re.subn(
              r'response_format:\s*\{\s*type:\s*"json_object"\s*\},\s*\n\s*max_tokens:\s*maxTokens,',
              'response_format: body.response_format ?? { type: "json_object" },\n        max_tokens: maxTokens,',
              s,
              count=1,
          )
          if count != 1 and 'response_format: body.response_format ??' not in s:
              raise SystemExit('Could not forward response_format to Cloudflare')
          server.write_text(s)

          news = Path('src/routes/api/public/hooks/generate-news.ts')
          n = news.read_text()
          schema = '''response_format: {
        type: "json_schema",
        json_schema: {
          type: "object",
          additionalProperties: false,
          properties: {
            articles: {
              type: "array",
              maxItems: 3,
              items: {
                type: "object",
                additionalProperties: false,
                properties: {
                  brief: {
                    type: "object",
                    additionalProperties: true,
                    properties: { hasClearNewsEvent: { type: "boolean" } },
                    required: ["hasClearNewsEvent"],
                  },
                  source_index: { type: "integer", minimum: 1, maximum: 3 },
                  category: { type: "string", enum: CATEGORIES },
                  title: { type: "string" },
                  dek: { type: "string" },
                  summary: { type: "string" },
                  relevance: { type: "string" },
                  sections: {
                    type: "array",
                    minItems: 5,
                    maxItems: 8,
                    items: {
                      type: "object",
                      additionalProperties: false,
                      properties: {
                        heading: { type: "string" },
                        paragraphs: {
                          type: "array",
                          minItems: 2,
                          maxItems: 4,
                          items: { type: "string" },
                        },
                      },
                      required: ["heading", "paragraphs"],
                    },
                  },
                  keyTakeaways: {
                    type: "array",
                    minItems: 3,
                    maxItems: 5,
                    items: { type: "string" },
                  },
                  faq: {
                    type: "array",
                    minItems: 4,
                    maxItems: 6,
                    items: {
                      type: "object",
                      additionalProperties: false,
                      properties: { q: { type: "string" }, a: { type: "string" } },
                      required: ["q", "a"],
                    },
                  },
                },
                required: ["brief", "source_index", "category", "title", "dek", "summary", "relevance", "sections", "keyTakeaways", "faq"],
              },
            },
          },
          required: ["articles"],
        },
      },'''
          n, count = re.subn(
              r'response_format:\s*\{\s*type:\s*"json_object"\s*\},',
              schema,
              n,
              count=1,
          )
          if count != 1 and 'type: "json_schema"' not in n:
              raise SystemExit('Could not apply generate-news JSON schema')

          # Give validation the actual source material so supported names/relationships
          # are not rejected merely because batch mode omitted sourceText.
          old = '''    const v = validateArticle(
      {
        title: a.title,
        dek: a.dek,
        summary: a.summary,
        relevance: a.relevance,
        sections: (a as { sections?: NewsSection[] }).sections,
        faq: a.faq,
        keyTakeaways: a.keyTakeaways,
      },
      a.brief,
    );'''
          new = '''    const source = items[a.source_index - 1];
    const sourceText = source ? `${source.title} ${source.description}` : undefined;
    const v = validateArticle(
      {
        title: a.title,
        dek: a.dek,
        summary: a.summary,
        relevance: a.relevance,
        sections: (a as { sections?: NewsSection[] }).sections,
        faq: a.faq,
        keyTakeaways: a.keyTakeaways,
      },
      a.brief,
      sourceText,
    );'''
          if old in n:
              n = n.replace(old, new, 1)
          news.write_text(n)
          PY

      - name: Validate focused diff
        run: |
          git diff --check
          grep -q 'response_format?: { type?: string; json_schema?: unknown }' src/server.ts
          grep -q 'body.response_format ??' src/server.ts
          grep -q 'type: "json_schema"' src/routes/api/public/hooks/generate-news.ts
          grep -q 'sourceText,' src/routes/api/public/hooks/generate-news.ts

      - name: Commit structured output fix
        run: |
          git config user.name 'keeptxred-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/server.ts src/routes/api/public/hooks/generate-news.ts
          git commit -m 'Use Cloudflare structured output schema'
          git push origin HEAD:agent/cloudflare-structured-output
