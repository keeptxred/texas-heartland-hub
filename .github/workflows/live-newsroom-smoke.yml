name: Live Newsroom Smoke Check

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/routes/api/public/hooks/ingest-feeds.ts'
      - 'src/routes/api/public/hooks/health.ts'
      - 'src/routes/api/public/newsroom-health.ts'
      - 'src/lib/multi-source-publish.ts'
      - 'src/lib/ingest-feeds-legacy.ts'
      - 'scripts/news/smoke-live-newsroom.mjs'
      - '.github/workflows/live-newsroom-smoke.yml'

permissions:
  contents: read

concurrency:
  group: live-newsroom-smoke
  cancel-in-progress: true

jobs:
  smoke-live-newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check live ingestion and newsroom QA routes
        env:
          KTR_BASE_URL: https://keeptxred.com
        run: node scripts/news/smoke-live-newsroom.mjs
