name: Repository test and build health

on:
  push:
    branches:
      - main
    paths:
      - "src/components/**"
      - "src/routes/**"
      - "src/shared/platform-core/**"
      - "src/shared/texas-platform/**"
      - "src/lib/**"
      - "scripts/**"
      - "vitest.config.*"
      - "vite.config.*"
      - "tsconfig*.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/shared-vitest.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin CI to the repository's known-good runtime instead of allowing
          # a new Bun release to change behavior between otherwise identical runs.
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fast blocking gate for pull requests and main. These checks catch the
      # problems most likely to break the application before expensive domain work.
      - name: ESLint
        run: bun run lint
      - name: Full Vitest suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run typecheck

      # SEO validation is lightweight and must run before merge because the SEO
      # validator itself and sitemap/canonical rules are part of this PR gate.
      - name: SEO validation
        run: bun run seo:validate

      # The required repository-health check validates the final accumulated PR
      # diff. A missing or path-skipped companion workflow must not create a gap.
      - name: Production build
        run: bun run build

      # Run repository-wide policy validators before merge as part of the same
      # required check, not only after changes have already landed on main.
      - name: Shared platform validation
        run: bun run shared:validate
      - name: Shared entity validation
        run: bun run shared:entities:validate
      - name: Publication boundary validation
        run: bun run publication:validate
      - name: Election validation
        run: bun run elections:validate
      - name: Legislature validation
        run: bun run legislature:validate
