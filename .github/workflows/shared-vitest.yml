name: Repository test and build health

on:
  push:
    branches:
      - main
    paths:
      - "src/components/**"
      - "src/routes/**"
      - "src/shared/platform-core/**"
      - "src/shared/texas-platform/**"
      - "src/lib/**"
      - "scripts/**"
      - "vitest.config.*"
      - "vite.config.*"
      - "tsconfig*.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/shared-vitest.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: repository-health-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Publish required verify status as pending
        env:
          GH_TOKEN: ${{ github.token }}
          # For pull_request runs, github.sha is refs/pull/<n>/merge: the exact
          # synthetic merge commit GitHub evaluates at the merge gate. Publishing
          # to the head SHA caused stale green statuses after main advanced.
          STATUS_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d '{"state":"pending","context":"verify","description":"Repository health validation is running"}'

      # On pull_request, checkout's default ref is refs/pull/<n>/merge, so all
      # validation runs against the same merge commit that receives the status.
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Full Vitest suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run typecheck
      - name: SEO validation
        run: bun run seo:validate
      - name: Production build
        run: bun run build
      - name: Shared platform validation
        run: bun run shared:validate
      - name: Shared entity validation
        run: bun run shared:entities:validate
      - name: Publication boundary validation
        run: bun run publication:validate
      - name: Election validation
        run: bun run elections:validate
      - name: Legislature validation
        run: bun run legislature:validate

      - name: Publish required verify status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION="Repository health validation passed" ;;
            failure) STATE=failure; DESCRIPTION="Repository health validation failed" ;;
            *) STATE=error; DESCRIPTION="Repository health validation did not complete" ;;
          esac
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"verify\",\"description\":\"$DESCRIPTION\"}"

  # Every merge to main can invalidate the synthetic merge commit for other open
  # PRs. Bring same-repository PR branches up to date so GitHub emits synchronize
  # and reruns verify against each newly generated refs/pull/<n>/merge commit.
  refresh-open-prs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update open PR branches from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "keeptxred-verify-refresh",
          }

          def request(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, method=method, data=data, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          pulls = request(f"{api}/repos/{repo}/pulls?state=open&base=main&per_page=100")
          for pr in pulls:
              # Never write to forks. All normal automation branches in this repo
              # are same-repository branches and are safe to update automatically.
              if pr.get("head", {}).get("repo", {}).get("full_name") != repo:
                  continue
              number = pr["number"]
              try:
                  request(
                      f"{api}/repos/{repo}/pulls/{number}/update-branch",
                      method="PUT",
                      body={"expected_head_sha": pr["head"]["sha"]},
                  )
                  print(f"Updated PR #{number} with latest main")
              except urllib.error.HTTPError as exc:
                  # 422 commonly means the PR is already current or cannot be
                  # updated automatically because of a conflict. Do not make a
                  # successful main push fail because one PR needs manual rebasing.
                  detail = exc.read().decode(errors="replace")
                  print(f"PR #{number} update skipped: HTTP {exc.code} {detail}")
          PY
