name: Repository test and build health

on:
  push:
    branches:
      - main
    paths:
      - "src/components/**"
      - "src/routes/**"
      - "src/shared/platform-core/**"
      - "src/shared/texas-platform/**"
      - "src/lib/**"
      - "scripts/**"
      - "vitest.config.*"
      - "vite.config.*"
      - "tsconfig*.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/shared-vitest.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose synthetic merge commit should be verified"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: repository-health-${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout dispatched PR merge commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - name: Checkout event commit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.pr_number == '' }}
        uses: actions/checkout@v5

      - name: Publish required verify status as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS_SHA="$(git rev-parse HEAD)"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d '{"state":"pending","context":"verify","description":"Repository health validation is running"}'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Full Vitest suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run typecheck
      - name: SEO validation
        run: bun run seo:validate
      - name: Production build
        run: bun run build
      - name: Shared platform validation
        run: bun run shared:validate
      - name: Shared entity validation
        run: bun run shared:entities:validate
      - name: Publication boundary validation
        run: bun run publication:validate
      - name: Election validation
        run: bun run elections:validate
      - name: Legislature validation
        run: bun run legislature:validate

      - name: Publish required verify status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATUS_SHA="$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")"
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION="Repository health validation passed" ;;
            failure) STATE=failure; DESCRIPTION="Repository health validation failed" ;;
            *) STATE=error; DESCRIPTION="Repository health validation did not complete" ;;
          esac
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"verify\",\"description\":\"$DESCRIPTION\"}"

  # Every merge to main can invalidate the synthetic merge commit for other open
  # PRs. Bring same-repository PR branches up to date, then explicitly dispatch
  # verification for each PR because GITHUB_TOKEN branch updates do not emit a
  # normal pull_request synchronize workflow event.
  refresh-open-prs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update open PR branches from main and dispatch verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "keeptxred-verify-refresh",
          }

          def request(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, method=method, data=data, headers=headers)
              with urllib.request.urlopen(req) as response:
                  if response.status == 204:
                      return None
                  return json.load(response)

          pulls = request(f"{api}/repos/{repo}/pulls?state=open&base=main&per_page=100")
          for pr in pulls:
              if pr.get("head", {}).get("repo", {}).get("full_name") != repo:
                  continue
              number = pr["number"]
              head_ref = pr["head"]["ref"]
              try:
                  request(
                      f"{api}/repos/{repo}/pulls/{number}/update-branch",
                      method="PUT",
                      body={"expected_head_sha": pr["head"]["sha"]},
                  )
                  print(f"Updated PR #{number} with latest main")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  if exc.code != 422:
                      print(f"PR #{number} update failed: HTTP {exc.code} {detail}")
                      continue
                  print(f"PR #{number} update skipped: HTTP 422 {detail}")

              try:
                  request(
                      f"{api}/repos/{repo}/actions/workflows/shared-vitest.yml/dispatches",
                      method="POST",
                      body={"ref": head_ref, "inputs": {"pr_number": str(number)}},
                  )
                  print(f"Dispatched verify for PR #{number}")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  print(f"PR #{number} verify dispatch failed: HTTP {exc.code} {detail}")
          PY
