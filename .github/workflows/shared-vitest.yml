name: Repository test and build health

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Temporary live payment runtime diagnostic
        run: |
          set -euo pipefail
          response="$(curl --retry 5 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://keeptxred.com/api/public/payments/health)"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          safe = {
              "status": data.get("status"),
              "bindings": data.get("bindings"),
              "stripe_api": data.get("stripe_api"),
              "stripe_error": data.get("stripe_error"),
          }
          rendered = json.dumps(safe, sort_keys=True)
          print(rendered)
          with open("payment-runtime-diagnostic.json", "w", encoding="utf-8") as fh:
              fh.write(rendered + "\n")
          PY

      - name: Upload sanitized payment diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: payment-runtime-diagnostic
          path: payment-runtime-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: ESLint
        run: bun run lint

      - name: Full Vitest suite
        run: bun run test

      - name: Route generation and TypeScript
        run: bun run typecheck

      - name: SEO validation
        run: bun run seo:validate

      - name: Production build
        run: bun run build

      - name: Shared platform validation
        run: bun run shared:validate

      - name: Shared entity validation
        run: bun run shared:entities:validate

      - name: Publication boundary validation
        run: bun run publication:validate

      - name: Election validation
        run: bun run elections:validate

      - name: Legislature validation
        run: bun run legislature:validate
