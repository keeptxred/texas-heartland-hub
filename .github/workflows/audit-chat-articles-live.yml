name: Audit All News Articles Live

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-chat-articles-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover every published daily article slug
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/slugs.txt
          : > /tmp/source-migrations.txt

          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            if grep -Eqi 'INSERT[[:space:]]+INTO[[:space:]]+public\.daily_articles' "$file"; then
              echo "$file" >> /tmp/source-migrations.txt
              grep -Eo "\('20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+'[[:space:]]*," "$file" \
                | sed -E "s/^\('//; s/'[[:space:]]*,$//" >> /tmp/slugs.txt || true
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          sort -u -o /tmp/slugs.txt /tmp/slugs.txt
          sort -u -o /tmp/source-migrations.txt /tmp/source-migrations.txt

          migrations=$(wc -l < /tmp/source-migrations.txt | tr -d ' ')
          count=$(wc -l < /tmp/slugs.txt | tr -d ' ')
          echo "Daily article migrations: $migrations"
          echo "Unique published article slugs: $count"

          if [[ "$count" -eq 0 ]]; then
            echo 'ERROR: no daily article slugs were discovered.' >&2
            exit 1
          fi

      - name: Verify every discovered article in production
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/results.txt

          check_url() {
            slug="$1"
            url="https://keeptxred.com/news/$slug"
            body=$(mktemp)
            code=000

            for attempt in 1 2 3; do
              code=$(curl -L -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 25 "$url" || echo 000)
              if [[ "$code" == "200" ]] && ! grep -Eqi 'ARTICLE NOT FOUND|page not found|article not found|That article may have moved or never existed|(^|>)404([^0-9]|<)' "$body"; then
                printf 'PASS\t%s\t%s\n' "$code" "$url"
                rm -f "$body"
                return 0
              fi
              sleep $((attempt * 2))
            done

            printf 'FAIL\t%s\t%s\n' "$code" "$url"
            rm -f "$body"
            return 0
          }
          export -f check_url

          xargs -r -n1 -P8 bash -c 'check_url "$1"' _ < /tmp/slugs.txt | sort > /tmp/results.txt

          total=$(wc -l < /tmp/results.txt | tr -d ' ')
          passed=$(grep -c '^PASS' /tmp/results.txt || true)
          failed=$(grep -c '^FAIL' /tmp/results.txt || true)

          echo "Total checked: $total"
          echo "Passed: $passed"
          echo "Failed: $failed"
          echo '--- Failures ---'
          grep '^FAIL' /tmp/results.txt || true

          {
            echo '## Keep TX Red archive-wide news audit'
            echo
            echo "- Total checked: $total"
            echo "- Passed: $passed"
            echo "- Failed: $failed"
            if [[ "$failed" -gt 0 ]]; then
              echo
              echo '### Failed URLs'
              echo '```'
              grep '^FAIL' /tmp/results.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo 'ERROR: one or more historical news articles are not resolving in production.' >&2
            exit 1
          fi
