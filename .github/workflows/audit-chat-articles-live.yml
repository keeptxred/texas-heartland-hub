name: Audit ChatGPT News Articles Live

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-chat-articles-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Extract all article slugs created in this chat
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20260808174500_publish_daily_texas_news_afternoon_batch.sql
            supabase/migrations/20260808215000_publish_daily_texas_news_evening_batch.sql
            supabase/migrations/20260809012500_publish_daily_texas_news_night_batch.sql
          )
          : > /tmp/slugs.txt
          for file in "${files[@]}"; do
            test -f "$file"
            grep -Eo "\('20[0-9]{2}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+'[[:space:]]*," "$file" \
              | sed -E "s/^\('//; s/'[[:space:]]*,$//" >> /tmp/slugs.txt
          done
          sort -u -o /tmp/slugs.txt /tmp/slugs.txt
          count=$(wc -l < /tmp/slugs.txt | tr -d ' ')
          echo "Found $count article slugs"
          cat /tmp/slugs.txt
          if [[ "$count" != "30" ]]; then
            echo "ERROR: expected 30 article slugs from the three chat-created batches, found $count" >&2
            exit 1
          fi
      - name: Verify every article is accessible in production
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          passed=0
          : > /tmp/results.txt
          while IFS= read -r slug; do
            url="https://keeptxred.com/news/$slug"
            code=$(curl -L -sS -o /tmp/article.html -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [[ "$code" == "200" ]] && ! grep -Eqi 'ARTICLE NOT FOUND|page not found|article not found|That article may have moved or never existed' /tmp/article.html; then
              echo "PASS $code $url" | tee -a /tmp/results.txt
              passed=$((passed+1))
            else
              echo "FAIL $code $url" | tee -a /tmp/results.txt
              failed=$((failed+1))
            fi
          done < /tmp/slugs.txt
          echo "Passed: $passed"
          echo "Failed: $failed"
          echo '--- Results ---'
          cat /tmp/results.txt
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
