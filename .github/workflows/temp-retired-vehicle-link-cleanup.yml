name: Temporary retired vehicle link cleanup

on:
  push:
    branches:
      - seo/vehicle-renewal-fees-handoff-2026-09-14

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: seo/vehicle-renewal-fees-handoff-2026-09-14
          fetch-depth: 0

      - name: Patch retired vehicle and DMV crosslinks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('href="/vehicles/registration-fees-taxes"', 'href="https://texasdefined.com/texas-vehicle-registration-fees-taxes"'),
              ('href="/vehicles/registration"', 'href="https://texasdefined.com/texas-vehicle-registration"'),
              ('href="/vehicles/renewal"', 'href="https://texasdefined.com/texas-vehicle-registration-renewal"'),
              ('href="/dmv"', 'href="https://texasdefined.com/texas-dmv"'),
              ('`${SITE_URL}/vehicles/registration-fees-taxes`', '"https://texasdefined.com/texas-vehicle-registration-fees-taxes"'),
              ('`${SITE_URL}/vehicles/registration`', '"https://texasdefined.com/texas-vehicle-registration"'),
              ('`${SITE_URL}/vehicles/renewal`', '"https://texasdefined.com/texas-vehicle-registration-renewal"'),
              ('`${SITE_URL}/dmv`', '"https://texasdefined.com/texas-dmv"'),
          ]

          candidates = sorted(Path('src/routes').glob('vehicles.*.tsx'))
          candidates.append(Path('src/routes/dmv.texas-dmv-vs-dps.tsx'))

          changed = []
          for path in candidates:
              original = path.read_text()
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if path.name == 'vehicles.bonded-titles.tsx':
                  updated = updated.replace('<main>vehicles.bonded-titles.tsx', '<main>')
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))

          print('Updated files:')
          print('\n'.join(changed) if changed else '(none)')
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run retired vehicle regression test
        run: bun run test -- src/routes/retired-vehicle-crosslinks.test.ts

      - name: Commit cleanup if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routes/vehicles.*.tsx src/routes/dmv.texas-dmv-vs-dps.tsx; then
            echo "Vehicle and DMV crosslinks already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/vehicles.*.tsx src/routes/dmv.texas-dmv-vs-dps.tsx
          git commit -m "Remove final retired DMV redirect hops"
          git push origin HEAD:seo/vehicle-renewal-fees-handoff-2026-09-14
