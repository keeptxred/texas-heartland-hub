name: KeepTXRed News URL Integrity

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    branches: [main, diagnostic/ktr-final-check-20261025]
    paths:
      - 'scripts/news/audit-published-url-integrity.mjs'
      - '.github/workflows/news-url-integrity.yml'

permissions:
  contents: read

concurrency:
  group: ktr-news-url-integrity
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'keeptxred/texas-heartland-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KTR_VERIFY_LIVE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/diagnostic/ktr-final-check-20261025' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify live registry, article bodies and feed links
        run: bun scripts/news/audit-published-url-integrity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-url-integrity
          path: artifacts/news-url-integrity.json
          if-no-files-found: warn
          retention-days: 30
