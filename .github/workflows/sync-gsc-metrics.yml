name: Sync Google Search Console metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-gsc-metrics.yml"
      - "scripts/seo/sync-gsc-metrics.mjs"
      - "src/lib/gsc.ts"
      - "src/routes/api/admin/gsc-sync.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-gsc-metrics.yml"
      - "scripts/seo/sync-gsc-metrics.mjs"
      - "src/lib/gsc.ts"
      - "src/routes/api/admin/gsc-sync.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: gsc-metric-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Search Console sync script without credentials
        run: node --check scripts/seo/sync-gsc-metrics.mjs

  sync:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
      GSC_SITE_URL: sc-domain:keeptxred.com
      GSC_SYNC_ENDPOINT: https://keeptxred.com/api/admin/gsc-sync
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync final 28-day Search Console page metrics
        run: node scripts/seo/sync-gsc-metrics.mjs
