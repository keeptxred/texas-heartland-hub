name: Apply source sufficiency preflight patch

on:
  push:
    branches:
      - fix/source-sufficiency-preflight
    paths:
      - 'scripts/apply-source-sufficiency-preflight.py'
      - '.github/workflows/apply-source-sufficiency-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-sufficiency-preflight
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-source-sufficiency-preflight.py
      - name: Commit patched generator
        run: |
          if git diff --quiet -- src/routes/api/public/hooks/generate-news.ts; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/api/public/hooks/generate-news.ts
          git commit -m 'Filter thin verified sources before AI rewrite'
          git push origin HEAD:fix/source-sufficiency-preflight
