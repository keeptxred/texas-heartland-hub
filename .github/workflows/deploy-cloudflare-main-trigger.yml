name: Trigger Cloudflare Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'wrangler.jsonc'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-cloudflare-main-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: keeptxred-cloudflare-production-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production Cloudflare workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare-production.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f activate_custom_domain=false \
            -f production_hostname=keeptxred.com
