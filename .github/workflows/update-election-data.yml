name: Refresh Election Central data

on:
  schedule:
    - cron: "37 10 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/elections/import-races.ts"
      - "scripts/elections/scrape-official-candidates.ts"
      - "scripts/elections/scrape-official-primary-winners.mjs"
      - "scripts/elections/import-candidates.ts"
      - "scripts/elections/fec-candidate-resolver.ts"
      - "scripts/elections/resolve-fec-ids.ts"
      - "scripts/elections/import-finance.ts"
      - "scripts/elections/import-tpor-may-poll.ts"
      - "scripts/elections/import-ut-june-poll.ts"
      - "scripts/elections/generate-official-geography.ts"
      - "scripts/elections/import-geography.ts"
      - "scripts/elections/normalize-imports.mjs"
      - "scripts/elections/validate-enums.mjs"
      - "scripts/elections/validate.mjs"
      - "scripts/elections/qa.mjs"
      - "scripts/elections/routes-qa.mjs"
      - "scripts/elections/sitemap-qa.mjs"
      - "scripts/elections/launch-readiness.mjs"
      - "scripts/elections/import/**"
      - ".github/workflows/update-election-data.yml"

permissions:
  contents: write

concurrency:
  group: election-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Install election-source browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh official race directory
        run: pnpm elections:import:races

      - name: Extract official March primary winners
        id: primary_winner_scrape
        continue-on-error: true
        env:
          ELECTION_PRIMARY_WINNERS_OUTPUT: /tmp/texas-primary-winners.json
        run: pnpm elections:scrape:primary-winners

      - name: Upload primary-result extraction diagnostics
        if: steps.primary_winner_scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: official-primary-result-extraction-diagnostics
          path: |
            /tmp/official-primary-results-debug.json
            /tmp/official-primary-results-debug.html
            /tmp/official-primary-results-debug.png
          if-no-files-found: warn
          retention-days: 14

      - name: Extract official candidate listing
        id: candidate_scrape
        continue-on-error: true
        env:
          ELECTION_CANDIDATE_SCRAPE_OUTPUT: /tmp/texas-candidates.html
        run: pnpm elections:scrape:candidates

      - name: Upload candidate extraction diagnostics
        if: steps.candidate_scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: official-candidate-extraction-diagnostics
          path: |
            /tmp/official-candidate-debug.html
            /tmp/official-candidate-debug.png
          if-no-files-found: warn
          retention-days: 14

      - name: Refresh authoritative candidate records
        shell: bash
        run: |
          imported=false
          if [[ -s /tmp/texas-primary-winners.json ]]; then
            ELECTION_CANDIDATE_IMPORT=/tmp/texas-primary-winners.json pnpm elections:import:candidates
            imported=true
          fi
          if [[ -s /tmp/texas-candidates.html ]]; then
            ELECTION_CANDIDATE_IMPORT=/tmp/texas-candidates.html pnpm elections:import:candidates
            imported=true
          fi
          if [[ "$imported" == "false" ]]; then
            echo "Official browser extraction was unavailable; preserving verified runoff, independent, and repository-maintained sources."
            pnpm elections:import:candidates
          fi

      - name: Resolve federal candidate FEC identifiers
        run: pnpm elections:resolve:fec

      - name: Refresh selective finance records
        run: pnpm elections:import:finance

      - name: Refresh verified public polls
        run: pnpm elections:import:polls

      - name: Refresh authoritative geography records
        run: pnpm elections:import:geography

      - name: Normalize imported records
        run: pnpm elections:normalize

      - name: Recalculate eligible forecasts
        run: pnpm elections:forecast

      - name: Validate election data
        run: pnpm elections:validate

      - name: Run election launch QA and write readiness report
        env:
          ELECTION_WRITE_READINESS: "true"
          ELECTION_QA_CHECK_LINKS: "true"
        run: pnpm elections:qa

      - name: Record refresh conclusion and publish safe changes
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_STATUS" != "success" ]]; then
            git restore src/data/elections/2026 || true
          fi
          cat > src/data/elections/2026/workflow-status.json <<EOF
          {
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "conclusion": "$JOB_STATUS",
            "runId": "$RUN_ID",
            "runAttempt": "$RUN_ATTEMPT",
            "triggerCommit": "$RUN_SHA",
            "runUrl": "$RUN_URL"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$JOB_STATUS" == "success" ]]; then
            git add src/data/elections/2026
            message="Refresh verified 2026 election data"
          else
            git add src/data/elections/2026/workflow-status.json
            message="Record failed election data refresh"
          fi
          if git diff --cached --quiet; then
            echo "No refresh status or election data changes to commit."
            exit 0
          fi
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
