name: Refresh Election Central data

on:
  schedule:
    - cron: "37 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: election-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install election-source browser
        run: bun x playwright install --with-deps chromium

      - name: Refresh official race directory
        run: bun run elections:import:races

      - name: Extract official March primary winners
        id: primary_winner_scrape
        continue-on-error: true
        env:
          ELECTION_PRIMARY_WINNERS_OUTPUT: /tmp/texas-primary-winners.json
        run: bun run elections:scrape:primary-winners

      - name: Upload primary-result extraction diagnostics
        if: steps.primary_winner_scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: official-primary-result-extraction-diagnostics
          path: |
            /tmp/official-primary-results-debug.json
            /tmp/official-primary-results-debug.html
            /tmp/official-primary-results-debug.png
          if-no-files-found: warn
          retention-days: 14

      - name: Extract official candidate listing
        id: candidate_scrape
        continue-on-error: true
        env:
          ELECTION_CANDIDATE_SCRAPE_OUTPUT: /tmp/texas-candidates.html
        run: bun run elections:scrape:candidates

      - name: Upload candidate extraction diagnostics
        if: steps.candidate_scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: official-candidate-extraction-diagnostics
          path: |
            /tmp/official-candidate-debug.html
            /tmp/official-candidate-debug.png
            /tmp/official-candidate-debug-network.json
          if-no-files-found: warn
          retention-days: 14

      - name: Refresh authoritative candidate records
        shell: bash
        run: |
          imported=false
          if [[ -s /tmp/texas-primary-winners.json ]]; then
            ELECTION_CANDIDATE_IMPORT=/tmp/texas-primary-winners.json bun run elections:import:candidates
            imported=true
          fi
          if [[ -s /tmp/texas-candidates.html ]]; then
            ELECTION_CANDIDATE_IMPORT=/tmp/texas-candidates.html bun run elections:import:candidates
            imported=true
          fi
          if [[ "$imported" == "false" ]]; then
            echo "Official browser extraction was unavailable; preserving verified runoff, independent, and repository-maintained sources."
            bun run elections:import:candidates
          fi

      - name: Resolve federal candidate FEC identifiers
        run: bun run elections:resolve:fec

      - name: Refresh selective finance records
        run: bun run elections:import:finance

      - name: Refresh verified public polls
        run: bun run elections:import:polls

      - name: Refresh authoritative geography records
        run: bun run elections:import:geography

      - name: Normalize imported records
        run: bun run elections:normalize

      - name: Migrate retired source URLs
        run: bun run elections:migrate-sources

      - name: Rebuild canonical source catalog
        run: bun run elections:sources

      - name: Generate weighted polling averages
        run: bun run elections:polling-averages

      - name: Recalculate eligible forecasts
        run: bun run elections:forecast

      - name: Validate refreshed election data
        id: validation
        shell: bash
        run: |
          set -o pipefail
          bun run elections:validate 2>&1 | tee /tmp/election-validation.log

      - name: Run structural launch QA
        id: launch_qa
        shell: bash
        env:
          ELECTION_WRITE_READINESS: "true"
        run: |
          set -o pipefail
          bun run elections:qa 2>&1 | tee /tmp/election-qa.log

      - name: Upload refresh diagnostics
        if: always() && (steps.validation.outcome == 'failure' || steps.launch_qa.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: election-refresh-diagnostics
          path: |
            /tmp/election-validation.log
            /tmp/election-qa.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record refresh conclusion and publish safe changes
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "cancelled" ]]; then
            echo "Superseded refresh cancelled; preserving the last completed workflow status."
            exit 0
          fi
          if [[ "$JOB_STATUS" != "success" ]]; then
            git restore src/data/elections/2026 || true
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          function compactLog(file) {
            if (!fs.existsSync(file)) return null;
            const lines = fs.readFileSync(file, "utf8").trim().split(/\r?\n/);
            return lines.slice(-100).join("\n").slice(-16000) || null;
          }

          const status = {
            updatedAt: new Date().toISOString(),
            conclusion: process.env.JOB_STATUS,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            triggerCommit: process.env.RUN_SHA,
            runUrl: process.env.RUN_URL,
            validationSummary: compactLog("/tmp/election-validation.log"),
            qaSummary: compactLog("/tmp/election-qa.log"),
          };

          fs.writeFileSync(
            "src/data/elections/2026/workflow-status.json",
            `${JSON.stringify(status, null, 2)}\n`,
          );
          NODE

          git config user.name "KeepTXRed Election Refresh"
          git config user.email "actions@users.noreply.github.com"

          if [[ "$JOB_STATUS" == "success" ]]; then
            git add src/data/elections/2026
            message="Refresh verified 2026 election data"
          else
            git add src/data/elections/2026/workflow-status.json
            message="Record failed election data refresh"
          fi

          git restore --worktree .
          if git diff --cached --quiet; then
            echo "No refresh status or election data changes to publish."
            exit 0
          fi

          allowed='^src/data/elections/2026/'
          unexpected_files="$(git diff --cached --name-only | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the election-data allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          git diff --cached --binary > /tmp/election-data-refresh.patch
          if [[ ! -s /tmp/election-data-refresh.patch ]]; then
            echo "No staged election-data patch to publish."
            exit 0
          fi

          git fetch origin main
          git reset --hard origin/main
          if ! git apply --index --3way /tmp/election-data-refresh.patch; then
            echo "Fresh election-data patch conflicts with current main; refusing to publish without a new refresh." >&2
            exit 1
          fi

          unexpected_files="$(git diff --cached --name-only | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Reapplied patch touched files outside the election-data allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          if [[ "$JOB_STATUS" == "success" ]]; then
            bun run elections:validate
            bun run elections:qa
          fi

          if git diff --cached --quiet; then
            echo "Election data already matches current main."
            exit 0
          fi

          refresh_branch='automation/election-data-refresh'
          git checkout -B "$refresh_branch"
          git commit -m "$message"
          git push --force-with-lease origin "$refresh_branch"

          pr_number="$(gh pr list --head "$refresh_branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$refresh_branch" \
              --title "$message" \
              --body $'Automated Election Central refresh.\n\nThe workflow restricts publication to src/data/elections/2026, rebases the generated-data patch onto current protected main, and reruns election validation and structural QA after the rebase for successful refreshes. Normal branch protection and required checks remain authoritative.')"
            pr_number="${pr_url##*/}"
          else
            echo "Updated existing election data refresh PR #$pr_number."
          fi

          gh pr merge "$pr_number" --auto --squash
          echo "Election refresh is queued through protected PR #$pr_number."
