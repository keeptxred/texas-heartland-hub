name: Materialize seven-role policing hero

on:
  push:
    branches:
      - fix/policing-full-seven-role-hero-20260903
    paths:
      - ".tmp/policing-seven-role/**"
      - ".github/workflows/materialize-policing-seven-role.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Materialize exact seven-role hero
        shell: bash
        run: |
          set -euo pipefail

          expected_parts=16
          found_parts="$(find .tmp/policing-seven-role -maxdepth 1 -name 'part*.b64' 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$found_parts" != "$expected_parts" ]]; then
            echo "Waiting for all $expected_parts chunks; found $found_parts."
            exit 0
          fi

          cat .tmp/policing-seven-role/part*.b64 > /tmp/policing-seven-role.b64
          base64 -d /tmp/policing-seven-role.b64 > /tmp/policing-seven-role.jpg

          echo "420b2e416f3fae96a820b1bff293364f00cf0c48a6c451f77192dfec6fd0f9ed  /tmp/policing-seven-role.jpg" | sha256sum -c -

          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/policing-seven-role.jpg')
          assert src.size == (1731, 909), src.size
          assert src.format == 'JPEG', src.format
          print(src.size, src.format)
          PY

          out='public/images/news/texas-policing-agencies-compared-seven-role-420b2e416f3f.jpg'
          cp /tmp/policing-seven-role.jpg "$out"
          test "$(wc -c < "$out")" -gt 600000

          rm -rf .tmp/policing-seven-role
          rm -f .github/workflows/materialize-policing-seven-role.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize exact seven-role policing hero'
          git push origin HEAD
