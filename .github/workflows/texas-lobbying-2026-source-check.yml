name: Verify Texas 2026 lobbying primary sources

on:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: texas-2026-lobbying-primary-sources
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify official registration, compensation, rules and expenditure sources
        run: node scripts/lobbying/verify-texas-2026-sources.mjs
      - name: Commit verified source fingerprints only after successful checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lobbying-2026-source-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lobbying): record verified TEC primary-source status [skip ci]"
            git push
          fi
