name: Discover Texas election results endpoints

on:
  pull_request:
    paths:
      - ".github/workflows/election-results-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official results applications
        shell: bash
        run: |
          node <<'NODE' > election-results-discovery.txt
          const urls = [
            'https://electionresults.sos.state.tx.us/results.html',
            'https://goelect.txelections.civixapps.com/ivis-cbp-ui/candidate-information',
          ];
          for (const url of urls) {
            console.log(`\n===== ${url} =====`);
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                headers: { 'user-agent': 'Mozilla/5.0 KeepTXRed election diagnostics' },
              });
              console.log('status', response.status, response.statusText, 'final', response.url);
              console.log('headers', Object.fromEntries(response.headers));
              const text = await response.text();
              console.log('length', text.length);
              console.log('\n-- scripts --');
              for (const match of text.matchAll(/<script\b[^>]*src=["']([^"']+)/gi)) console.log(match[1]);
              console.log('\n-- links --');
              for (const match of text.matchAll(/<(?:a|link)\b[^>]*href=["']([^"']+)/gi)) console.log(match[1]);
              console.log('\n-- forms/actions --');
              for (const match of text.matchAll(/<form\b[^>]*action=["']([^"']+)/gi)) console.log(match[1]);
              console.log('\n-- options --');
              for (const match of text.matchAll(/<option\b[^>]*value=["']?([^"' >]*)[^>]*>([\s\S]*?)<\/option>/gi)) {
                console.log(JSON.stringify({ value: match[1], label: match[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() }));
              }
              console.log('\n-- probable API strings --');
              const strings = [...text.matchAll(/["']([^"']*(?:api|candidate|election|result)[^"']*)["']/gi)]
                .map((match) => match[1])
                .filter((value) => value.length < 300);
              console.log([...new Set(strings)].join('\n'));
              console.log('\n-- first 12000 chars --');
              console.log(text.slice(0, 12000));
            } catch (error) {
              console.log('ERROR', error?.stack || error);
            }
          }
          NODE

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: election-results-discovery
          path: election-results-discovery.txt
