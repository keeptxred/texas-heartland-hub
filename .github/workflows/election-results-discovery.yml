name: Discover Texas election results endpoints

on:
  pull_request:
    paths:
      - ".github/workflows/election-results-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official results applications
        shell: bash
        run: |
          node <<'NODE' > election-results-discovery.txt
          const entryUrls = [
            'https://electionresults.sos.state.tx.us/results.html',
            'https://goelect.txelections.civixapps.com/ivis-enr-ui/races',
            'https://goelect.txelections.civixapps.com/ivis-cbp-ui/candidate-information',
          ];
          const headers = { 'user-agent': 'Mozilla/5.0 KeepTXRed election diagnostics' };

          for (const url of entryUrls) {
            console.log(`\n===== ENTRY ${url} =====`);
            try {
              const response = await fetch(url, { redirect: 'follow', headers });
              console.log('status', response.status, response.statusText, 'final', response.url);
              const text = await response.text();
              console.log('content-type', response.headers.get('content-type'), 'length', text.length);
              const scripts = [...text.matchAll(/<script\b[^>]*src=["']([^"']+)/gi)].map((match) => match[1]);
              console.log('-- scripts --');
              console.log(scripts.join('\n'));
              console.log('-- links --');
              console.log([...text.matchAll(/<(?:a|link)\b[^>]*href=["']([^"']+)/gi)].map((match) => match[1]).join('\n'));
              console.log('-- HTML endpoint strings --');
              printEndpointStrings(text);

              for (const script of scripts) {
                const scriptUrl = new URL(script, response.url).href;
                console.log(`\n===== SCRIPT ${scriptUrl} =====`);
                try {
                  const scriptResponse = await fetch(scriptUrl, { headers });
                  const scriptText = await scriptResponse.text();
                  console.log('status', scriptResponse.status, 'length', scriptText.length);
                  printEndpointStrings(scriptText);
                } catch (error) {
                  console.log('SCRIPT ERROR', error?.stack || error);
                }
              }

              const origin = new URL(response.url).origin;
              const basePath = new URL(response.url).pathname.split('/').slice(0, -1).join('/');
              for (const candidate of [
                `${origin}${basePath}/assets/config/config.json`,
                `${origin}${basePath}/assets/configuration.json`,
                `${origin}${basePath}/assets/env.js`,
                `${origin}${basePath}/config.json`,
                `${origin}${basePath}/runtime-config.json`,
                `${origin}${basePath}/asset-manifest.json`,
              ]) {
                console.log(`\n===== CONFIG ${candidate} =====`);
                try {
                  const configResponse = await fetch(candidate, { headers });
                  const configText = await configResponse.text();
                  console.log('status', configResponse.status, 'content-type', configResponse.headers.get('content-type'), 'length', configText.length);
                  if (configResponse.ok && configText.length < 50000) console.log(configText);
                } catch (error) {
                  console.log('CONFIG ERROR', error?.stack || error);
                }
              }
            } catch (error) {
              console.log('ENTRY ERROR', error?.stack || error);
            }
          }

          function printEndpointStrings(text) {
            const urls = [...text.matchAll(/https?:\\?\/\\?\/[^"'`\\s)]+/gi)].map((match) => match[0]);
            const paths = [...text.matchAll(/["'`]([^"'`]{0,180}(?:api|candidate|election|contest|race|result|report|export|download)[^"'`]{0,180})["'`]/gi)]
              .map((match) => match[1])
              .filter((value) => value.length < 380);
            console.log([...new Set([...urls, ...paths])].slice(0, 1000).join('\n'));
          }
          NODE

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: election-results-discovery
          path: election-results-discovery.txt
