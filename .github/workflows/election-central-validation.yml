name: Election Central validation

on:
  pull_request:
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/lib/authority-entity.ts"
      - "src/lib/authority-entity-paths.ts"
      - "src/lib/authority-entity-registry.ts"
      - "src/lib/candidate-authority.ts"
      - "src/lib/race-authority.ts"
      - "src/lib/election-authority-registry.ts"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/components/admin/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/sitemap-elections*"
      - "scripts/elections/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/lib/authority-entity.ts"
      - "src/lib/authority-entity-paths.ts"
      - "src/lib/authority-entity-registry.ts"
      - "src/lib/candidate-authority.ts"
      - "src/lib/race-authority.ts"
      - "src/lib/election-authority-registry.ts"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/components/admin/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/sitemap-elections*"
      - "scripts/elections/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate canonical election data
        run: bun run elections:validate

      - name: Validate race authority graph
        run: bun scripts/elections/validate-race-authority.mjs

      - name: Validate complete Phase 3 graph
        run: bun scripts/elections/validate-phase-3-authority-graph.mjs

      - name: Run election calculation fixtures
        run: bunx vitest run src/lib/elections

      - name: Typecheck application
        run: bun run typecheck

      - name: Build production application and routes
        run: bun run build

      - name: Run real-data launch QA
        run: bun run elections:qa
