name: Election Central validation

on:
  pull_request:
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/components/admin/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/sitemap-elections*"
      - "scripts/elections/**"
      - "package.json"
      - ".github/workflows/election-central-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/components/admin/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/sitemap-elections*"
      - "scripts/elections/**"
      - "package.json"
      - ".github/workflows/election-central-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Validate canonical election data
        run: pnpm elections:validate

      - name: Capture election calculation fixtures
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm exec vitest run src/lib/elections > election-tests.log 2>&1
          status=$?
          cat election-tests.log
          exit $status

      - name: Capture application typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm typecheck > election-typecheck.log 2>&1
          status=$?
          cat election-typecheck.log
          exit $status

      - name: Capture production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm build > election-build.log 2>&1
          status=$?
          cat election-build.log
          exit $status

      - name: Capture real-data launch QA
        id: qa
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm elections:qa > election-qa.log 2>&1
          status=$?
          cat election-qa.log
          exit $status

      - name: Upload Election Central diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-central-diagnostics
          path: |
            election-tests.log
            election-typecheck.log
            election-build.log
            election-qa.log
          if-no-files-found: error

      - name: Stop on Election Central validation failure
        if: steps.tests.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure' || steps.qa.outcome == 'failure'
        run: exit 1
