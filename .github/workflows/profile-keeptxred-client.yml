name: Diagnose KeepTXRed shared client JS entry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/laws/client-entry-profiler.ts"
      - "scripts/laws/client-entry-import-chains.ts"
      - "scripts/laws/client-entry-import-chains.test.ts"
      - "scripts/laws/client-entry-profiler.test.ts"
      - ".github/workflows/profile-keeptxred-client.yml"
      - "vite.config.ts"
      - "src/routes/news.$slug.tsx"
      - "src/data/article-bodies.ts"
      - "src/lib/news-static-materials.server.ts"
      - "src/lib/news-static-materials.functions.ts"
      - "src/routes/data.$slug.tsx"
      - "src/components/texas-data-page.tsx"
      - "src/lib/texas-data-head.ts"
      - "src/lib/data-reference-citation-contract.test.ts"
      - "src/routes/elections*.tsx"
      - "src/lib/elections/*route-metadata.functions.ts"
      - "src/lib/elections/election-*.functions.ts"
      - "src/lib/elections/eager-snapshot-boundary.test.ts"
      - "src/lib/government-history-route.functions.ts"
      - "src/lib/government-history-ssr-boundary.test.ts"
      - "src/routes/texas-government.*.tsx"
      - "src/routes/texas-politics.*.tsx"
      - "src/lib/politics-history-route.functions.ts"
      - "src/lib/politics-history-route-boundary.test.ts"
      - "src/routes/texas-politics.*.tsx"
      - "src/lib/republic-history-route.functions.ts"
      - "src/lib/republic-history-server-boundary.test.ts"
      - "src/data/texas-republic-government-authority.ts"
      - "src/routes/texas-government.index.tsx"
      - "src/routes/texas-government.reference.$slug.tsx"
      - "src/lib/search-recovery-authority.functions.ts"
      - "src/lib/search-recovery-authority-ssr.test.ts"

permissions:
  contents: read

concurrency:
  group: ktr-client-profile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test profiling attribution
        run: bunx vitest run scripts/laws/client-entry-profiler.test.ts scripts/laws/client-entry-import-chains.test.ts

      - name: Build with opt-in attribution (no production behavioral changes)
        env:
          KTR_BUNDLE_PROFILE: "1"
        run: bun run build

      - name: Display largest contributors in job summary
        shell: bash
        run: |
          set -euo pipefail
          test -s laws-client-bundle-profile/client-entry.json
          test -s laws-client-bundle-profile/client-entry.md
          cat laws-client-bundle-profile/client-entry.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve full client module attribution for reproducible profiling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keeptxred-client-entry-module-attribution
          path: laws-client-bundle-profile/*
          if-no-files-found: ignore
          retention-days: 7
