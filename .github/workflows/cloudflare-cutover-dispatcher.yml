name: Dispatch KeepTXRed Cloudflare cutover

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/cloudflare-cutover-execute'
      - '.github/cloudflare-www-cutover-execute'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'cloudflare-cutover-execute' ||
       github.event.pull_request.head.ref == 'cloudflare-www-cutover-execute')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hardened Cloudflare cutover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            cloudflare-cutover-execute)
              workflow="cloudflare-apex-cutover.yml"
              label="apex"
              ;;
            cloudflare-www-cutover-execute)
              workflow="cloudflare-www-cutover.yml"
              label="www"
              ;;
            *)
              echo "Unexpected execution branch: $HEAD_REF" >&2
              exit 1
              ;;
          esac

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/$workflow/dispatches")"
          if [[ "$http_status" != "204" ]]; then
            echo "::error title=Cloudflare cutover dispatch failed::GitHub returned HTTP $http_status"
            cat "$response_file" >&2 || true
            exit 1
          fi
          echo "Hardened Cloudflare $label cutover dispatched from main."
