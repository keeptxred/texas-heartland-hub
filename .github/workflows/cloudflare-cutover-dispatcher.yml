name: Dispatch KeepTXRed Cloudflare cutover

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/cloudflare-cutover-execute'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'cloudflare-cutover-execute'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hardened apex cutover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/cloudflare-apex-cutover.yml/dispatches")"
          if [[ "$http_status" != "204" ]]; then
            echo "::error title=Cloudflare cutover dispatch failed::GitHub returned HTTP $http_status"
            cat "$response_file" >&2 || true
            exit 1
          fi
          echo "Hardened Cloudflare apex cutover dispatched from main."
