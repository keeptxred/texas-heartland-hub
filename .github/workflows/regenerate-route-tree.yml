name: Regenerate route tree

on:
  push:
    branches:
      - feat/ktr-issue-guides-policy-tools

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[route-tree]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ktr-issue-guides-policy-tools
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Regenerate TanStack route tree
        run: bun run build:dev
      - name: Commit generated route tree if changed
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "[route-tree] Regenerate TanStack route tree"
          git push origin HEAD:feat/ktr-issue-guides-policy-tools
