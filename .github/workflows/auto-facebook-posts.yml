name: Auto Facebook Posts

on:
  schedule:
    # Five broad posting windows per day. Each scheduled run waits a fresh,
    # cryptographically random 0-120 minutes before publishing, so the actual
    # Facebook post times vary day to day instead of landing on a fixed clock.
    # UTC bases correspond roughly to 8am/11am/2pm/5pm/8pm during Texas DST
    # and shift one hour earlier during standard time.
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keeptxred-auto-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Randomize scheduled post time
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail

          # Draw from the runner's OS entropy source rather than relying on
          # bash $RANDOM. Two hours of jitter keeps the five daily posts in
          # useful waking/evening windows while avoiding a repeatable pattern.
          random_u32=$(od -An -N4 -tu4 /dev/urandom | tr -d '[:space:]')
          delay_seconds=$(( random_u32 % 7201 ))
          delay_minutes=$(( delay_seconds / 60 ))
          delay_remainder=$(( delay_seconds % 60 ))
          echo "Random Facebook delay selected: ${delay_minutes}m ${delay_remainder}s."
          sleep "$delay_seconds"

      - name: Post next eligible KeepTXRed article to Facebook
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')

          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the Facebook OIDC token.' >&2
            exit 1
          fi

          status=$(curl -sS -X POST -o /tmp/facebook-post.json -w '%{http_code}' \
            --max-time 420 \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            'https://keeptxred.com/api/public/hooks/auto-facebook-post' || echo 000)

          echo "auto-facebook-post HTTP ${status}"
          cat /tmp/facebook-post.json 2>/dev/null || true
          echo

          if [[ "$status" != "200" ]] || ! jq -e '.ok == true' /tmp/facebook-post.json >/dev/null 2>&1; then
            echo 'AUTO_FACEBOOK_POST_FAILED' >&2
            exit 1
          fi

          if jq -e '.posted == true' /tmp/facebook-post.json >/dev/null 2>&1; then
            slug=$(jq -r '.slug // ""' /tmp/facebook-post.json)
            post_url=$(jq -r '.post_url // ""' /tmp/facebook-post.json)
            echo "AUTO_FACEBOOK_POST_SUCCESS slug=${slug} post_url=${post_url}"
          else
            reason=$(jq -r '.reason // "no eligible article"' /tmp/facebook-post.json)
            echo "AUTO_FACEBOOK_POST_NOOP reason=${reason}"
          fi
