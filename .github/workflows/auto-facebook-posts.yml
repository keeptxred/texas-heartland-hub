name: Auto Facebook Posts

on:
  schedule:
    # Lightweight checks every 30 minutes across the Texas waking/evening day.
    # KeepTXRed generates five randomized Central-time targets per day.
    # TexasDefined uses two randomized targets from the same waking/evening span.
    - cron: "0,30 12-23 * * *"
    - cron: "0,30 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keeptxred-auto-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check randomized Facebook schedules and post if due
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')

          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the Facebook OIDC token.' >&2
            exit 1
          fi

          mode="scheduled"
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            mode="manual"
          fi

          run_post_check() {
            local label="$1"
            local endpoint="$2"
            local output="$3"

            status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time 420 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "X-KTR-Facebook-Mode: ${mode}" \
              "$endpoint" || echo 000)

            echo "${label} HTTP ${status} mode=${mode}"
            cat "$output" 2>/dev/null || true
            echo

            if [[ "$status" != "200" ]] || ! jq -e '.ok == true' "$output" >/dev/null 2>&1; then
              echo "${label}_FAILED" >&2
              return 1
            fi

            if jq -e '.posted == true' "$output" >/dev/null 2>&1; then
              title=$(jq -r '.title // .slug // ""' "$output")
              post_url=$(jq -r '.post_url // ""' "$output")
              echo "${label}_SUCCESS title=${title} post_url=${post_url}"
            else
              reason=$(jq -r '.reason // "no eligible item"' "$output")
              next_target=$(jq -r '.next_target_local // ""' "$output")
              posts_today=$(jq -r '.posts_today // ""' "$output")
              setup_required=$(jq -r '.setup_required // false' "$output")
              echo "${label}_NOOP reason=${reason} next_target=${next_target} posts_today=${posts_today} setup_required=${setup_required}"
            fi
          }

          run_post_check \
            "AUTO_FACEBOOK_POST" \
            "https://keeptxred.com/api/public/hooks/auto-facebook-post" \
            "/tmp/facebook-post.json"

          run_post_check \
            "AUTO_TEXASDEFINED_FACEBOOK_POST" \
            "https://keeptxred.com/api/public/hooks/auto-texasdefined-facebook-post" \
            "/tmp/texasdefined-facebook-post.json"
