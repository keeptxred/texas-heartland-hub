name: Auto Facebook Posts

on:
  schedule:
    # Lightweight checks every 30 minutes across the Texas waking/evening day.
    # The application generates five different randomized Central-time targets
    # per day and only publishes when the next target is due. This avoids long
    # sleeping Actions jobs while keeping the actual Facebook times variable.
    - cron: "0,30 12-23 * * *"
    - cron: "0,30 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keeptxred-auto-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check randomized Facebook schedule and post if due
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')

          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the Facebook OIDC token.' >&2
            exit 1
          fi

          mode="scheduled"
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            mode="manual"
          fi

          status=$(curl -sS -X POST -o /tmp/facebook-post.json -w '%{http_code}' \
            --max-time 420 \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "X-KTR-Facebook-Mode: ${mode}" \
            'https://keeptxred.com/api/public/hooks/auto-facebook-post' || echo 000)

          echo "auto-facebook-post HTTP ${status} mode=${mode}"
          cat /tmp/facebook-post.json 2>/dev/null || true
          echo

          if [[ "$status" != "200" ]] || ! jq -e '.ok == true' /tmp/facebook-post.json >/dev/null 2>&1; then
            echo 'AUTO_FACEBOOK_POST_FAILED' >&2
            exit 1
          fi

          if jq -e '.posted == true' /tmp/facebook-post.json >/dev/null 2>&1; then
            slug=$(jq -r '.slug // ""' /tmp/facebook-post.json)
            post_url=$(jq -r '.post_url // ""' /tmp/facebook-post.json)
            echo "AUTO_FACEBOOK_POST_SUCCESS slug=${slug} post_url=${post_url}"
          else
            reason=$(jq -r '.reason // "no eligible article"' /tmp/facebook-post.json)
            next_target=$(jq -r '.next_target_local // ""' /tmp/facebook-post.json)
            posts_today=$(jq -r '.posts_today // ""' /tmp/facebook-post.json)
            echo "AUTO_FACEBOOK_POST_NOOP reason=${reason} next_target=${next_target} posts_today=${posts_today}"
          fi
