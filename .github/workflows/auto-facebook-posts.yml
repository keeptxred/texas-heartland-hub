name: Auto Facebook Posts

on:
  schedule:
    - cron: "0,30 12-23 * * *"
    - cron: "0,30 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keeptxred-auto-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTOMATION_ORIGIN: https://keeptxred-site.freddy-coppola.workers.dev
    steps:
      - name: Check KeepTXRed Facebook schedule and post if due
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')
          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the Facebook OIDC token.' >&2
            exit 1
          fi

          mode="scheduled"
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            mode="manual"
          fi

          endpoint="${AUTOMATION_ORIGIN%/}/api/public/hooks/auto-facebook-post-smart"
          output="/tmp/facebook-post-keeptxred.json"
          status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
            --max-time 420 \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "X-KTR-Facebook-Mode: ${mode}" \
            "$endpoint" || echo 000)

          if [[ "$status" != "200" ]] || ! jq -e '.ok == true' "$output" >/dev/null 2>&1; then
            cat "$output" 2>/dev/null || true
            exit 1
          fi

          if jq -e '.image_required == true' "$output" >/dev/null 2>&1; then
            title=$(jq -r '.title // empty' "$output")
            prompt=$(jq -r '.image_prompt // empty' "$output")
            if [[ -z "$title" || -z "$prompt" || -z "${OPENAI_API_KEY:-}" ]]; then
              echo 'OpenAI attention-image generation is missing a title, prompt, or OPENAI_API_KEY.' >&2
              exit 1
            fi

            openai_payload=$(jq -n --arg prompt "$prompt" \
              '{model:"gpt-image-2",prompt:$prompt,size:"1536x1024",quality:"medium",output_format:"png"}')
            openai_status=$(curl -sS -X POST \
              -o /tmp/ktr-openai-image.json \
              -w '%{http_code}' \
              --max-time 420 \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "$openai_payload" \
              'https://api.openai.com/v1/images/generations' || echo 000)
            if [[ "$openai_status" != "200" ]]; then
              jq -r '.error.message // "OpenAI image generation failed"' /tmp/ktr-openai-image.json 2>/dev/null >&2 || true
              exit 1
            fi

            image_b64=$(jq -r '.data[0].b64_json // empty' /tmp/ktr-openai-image.json)
            if [[ -z "$image_b64" ]]; then
              echo 'OpenAI returned no image bytes.' >&2
              exit 1
            fi

            publish_payload=$(jq -n \
              --arg title "$title" \
              --arg image "$image_b64" \
              '{attention_title:$title,image_base64:$image,image_mime:"image/png",image_provider:"openai:gpt-image-2"}')
            publish_status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time 420 \
              -H 'accept: application/json' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'X-KTR-Facebook-Mode: scheduled' \
              --data "$publish_payload" \
              "$endpoint" || echo 000)
            if [[ "$publish_status" != "200" ]] || ! jq -e '.ok == true and .posted == true and .image_generated_by_openai == true' "$output" >/dev/null 2>&1; then
              cat "$output" >&2 || true
              exit 1
            fi
          fi

          cat "$output"
