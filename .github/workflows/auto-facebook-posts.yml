name: Auto Facebook Posts

on:
  schedule:
    # Lightweight checks every 30 minutes across the Texas waking/evening day.
    # Keep TX Red can publish up to five randomized posts per day and
    # TexasDefined can publish up to two. Each site decides independently
    # whether a randomized Central-time target is due.
    - cron: "0,30 12-23 * * *"
    - cron: "0,30 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keeptxred-auto-facebook
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check randomized Facebook schedules and post if due
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')

          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the Facebook OIDC token.' >&2
            exit 1
          fi

          mode="scheduled"
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            mode="manual"
          fi

          failures=0

          run_page() {
            local label="$1"
            local endpoint="$2"
            local output="$3"
            local status

            status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time 420 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "X-KTR-Facebook-Mode: ${mode}" \
              "$endpoint" || echo 000)

            echo "${label} auto-facebook HTTP ${status} mode=${mode}"
            cat "$output" 2>/dev/null || true
            echo

            if [[ "$status" != "200" ]] || ! jq -e '.ok == true' "$output" >/dev/null 2>&1; then
              echo "AUTO_FACEBOOK_POST_FAILED page=${label}" >&2
              failures=$((failures + 1))
              return
            fi

            if jq -e '.posted == true' "$output" >/dev/null 2>&1; then
              slug=$(jq -r '.slug // ""' "$output")
              title=$(jq -r '.title // ""' "$output")
              article_url=$(jq -r '.article_url // ""' "$output")
              post_url=$(jq -r '.post_url // ""' "$output")
              echo "AUTO_FACEBOOK_POST_SUCCESS page=${label} slug=${slug} title=${title} article_url=${article_url} post_url=${post_url}"
            else
              reason=$(jq -r '.reason // "no eligible article"' "$output")
              next_target=$(jq -r '.next_target_local // ""' "$output")
              posts_today=$(jq -r '.posts_today // ""' "$output")
              echo "AUTO_FACEBOOK_POST_NOOP page=${label} reason=${reason} next_target=${next_target} posts_today=${posts_today}"
            fi
          }

          # Run the two Page publishers independently so a problem with one Page
          # never prevents the other Page from getting its scheduled check.
          run_page \
            "keeptxred" \
            "https://keeptxred.com/api/public/hooks/auto-facebook-post" \
            "/tmp/facebook-post-keeptxred.json"

          run_page \
            "texasdefined" \
            "https://keeptxred.com/api/public/hooks/auto-facebook-post-texasdefined" \
            "/tmp/facebook-post-texasdefined.json"

          if (( failures > 0 )); then
            exit 1
          fi
