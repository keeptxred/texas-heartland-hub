name: Apply Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/apply-supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: 'Show pending migrations without applying them'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Preferred write path: a Supabase Postgres Session Pooler connection string.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Backward-compatible write path for a linked-project workflow.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ftkznprjljkhymknvhye
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Select migration transport
        id: transport
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${SUPABASE_DB_URL:-}" ]]; then
            echo 'mode=db-url' >> "$GITHUB_OUTPUT"
            echo 'Using direct Postgres migration transport (SUPABASE_DB_URL).'
            exit 0
          fi

          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" && -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo 'mode=linked' >> "$GITHUB_OUTPUT"
            echo 'Using linked-project migration transport.'
            exit 0
          fi

          # Some migrations are applied through the connected Supabase control
          # plane before their repository PR merges. In that case no GitHub DB
          # credential is needed: the read-only RPC below proves that every newly
          # added migration version in this exact revision already exists in
          # production. It cannot write or mark migrations as applied.
          echo 'mode=verify-only' >> "$GITHUB_OUTPUT"
          echo 'No write transport configured; requiring read-only production migration parity.'

      - name: Link production project for legacy transport
        if: steps.transport.outputs.mode == 'linked'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending production migrations
        if: steps.transport.outputs.mode != 'verify-only'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.transport.outputs.mode }}" == 'db-url' ]]; then
            supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run
          else
            supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run
          fi

      - name: Apply pending production migrations
        if: steps.transport.outputs.mode != 'verify-only' && (github.event_name != 'workflow_dispatch' || inputs.dry_run_only != true)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.transport.outputs.mode }}" == 'db-url' ]]; then
            supabase db push --db-url "$SUPABASE_DB_URL" --include-all
          else
            supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all
          fi

      - name: Verify writable migration state
        if: steps.transport.outputs.mode != 'verify-only' && (github.event_name != 'workflow_dispatch' || inputs.dry_run_only != true)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.transport.outputs.mode }}" == 'db-url' ]]; then
            supabase migration list --db-url "$SUPABASE_DB_URL"
          else
            supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Verify externally applied migration parity
        if: steps.transport.outputs.mode == 'verify-only'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == 'push' && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t migration_changes < <(git diff --name-status "$base" HEAD -- 'supabase/migrations/*.sql')
          if [[ ${#migration_changes[@]} -eq 0 ]]; then
            echo 'No migration files changed in this exact revision; parity gate has nothing to verify.'
            exit 0
          fi

          bad_change=0
          versions=()
          for change in "${migration_changes[@]}"; do
            status="${change%%$'\t'*}"
            path="${change#*$'\t'}"
            if [[ "$status" != 'A' ]]; then
              echo "::error title=Historical migration changed::Verify-only mode cannot approve $status change to $path. Configure a write transport and use a new forward migration instead."
              bad_change=1
              continue
            fi
            file="${path##*/}"
            version="${file%%_*}"
            if [[ ! "$version" =~ ^[0-9]{14}$ ]]; then
              echo "::error title=Invalid migration filename::$path must start with a 14-digit migration version."
              bad_change=1
              continue
            fi
            versions+=("$version")
          done
          [[ "$bad_change" -eq 0 ]] || exit 1

          if [[ ${#versions[@]} -eq 0 ]]; then
            echo 'No newly added migration versions to verify.'
            exit 0
          fi

          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL="\(.*\)"$/\1/p' .env | head -n 1)"
          SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env | head -n 1)"
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo '::error title=Public Supabase configuration unavailable::Cannot perform read-only migration parity check.'
            exit 1
          fi

          versions_json="$(printf '%s\n' "${versions[@]}" | jq -R . | jq -s .)"
          payload="$(jq -cn --argjson versions "$versions_json" '{expected_versions:$versions}')"
          response="$(curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/verify_repo_migrations" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload")"

          missing="$(jq -r '.[] | select(.applied != true) | .version' <<<"$response")"
          returned_count="$(jq 'length' <<<"$response")"
          if [[ "$returned_count" -ne "${#versions[@]}" ]]; then
            echo "::error title=Migration parity response incomplete::Expected ${#versions[@]} results but production returned $returned_count."
            exit 1
          fi
          if [[ -n "$missing" ]]; then
            echo '::error title=Production migrations missing::The following repository migration versions are not applied in production:'
            echo "$missing"
            echo 'No Cloudflare deployment may proceed until these versions are applied through an authorized Supabase write path.'
            exit 1
          fi

          printf 'Verified %d externally applied migration version(s) in production: %s\n' "${#versions[@]}" "${versions[*]}"
