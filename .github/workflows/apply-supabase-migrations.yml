name: Apply Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/apply-supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: qhwwmdszjgkscqxgmenf
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify migration credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN repository secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD repository secret'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending production migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Verify migration state
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
