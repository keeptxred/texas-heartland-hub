name: One-shot HB1056 public title gate repair

on:
  push:
    branches:
      - fix/hb1056-public-title-gate-20260909
    paths:
      - .github/workflows/one-shot-hb1056-public-title-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hb1056-public-title-gate-20260909
          fetch-depth: 0
      - name: Align deploy smoke with public article headline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "Texas Gold and Silver Legal Tender Law Takes Effect Sept. 1"
          new = "Texas Gold and Silver Legal Tender Law: What HB 1056 Does Sept. 1"
          paths = [
              Path("scripts/seo/verify-deployed-laws-routes.py"),
              Path("src/lib/deployed-laws-gate-in-production.test.ts"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one stale title, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python3 -m py_compile scripts/seo/verify-deployed-laws-routes.py
          git diff --check
      - name: Commit narrow repair and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-hb1056-public-title-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seo/verify-deployed-laws-routes.py src/lib/deployed-laws-gate-in-production.test.ts .github/workflows/one-shot-hb1056-public-title-gate.yml
          git commit -m "Align HB1056 deploy gate with public headline"
          git push origin HEAD:fix/hb1056-public-title-gate-20260909
