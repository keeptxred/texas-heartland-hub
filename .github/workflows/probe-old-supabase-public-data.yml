name: Trace live KeepTXRed backend

on:
  push:
    branches:
      - agent/probe-old-supabase-public-data
    paths:
      - '.github/workflows/probe-old-supabase-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Inspect live HTML and JavaScript bundles
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          curl --connect-timeout 15 --max-time 60 -fsSL https://keeptxred.com/ -o "$work/index.html"

          printf '### Live KeepTXRed backend trace\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Live HTML: `%s bytes`\n\n' "$(wc -c < "$work/index.html")" >> "$GITHUB_STEP_SUMMARY"

          mapfile -t scripts < <(
            grep -oE '<script[^>]+src=["'"'][^"'"']+["'"']' "$work/index.html" \
              | sed -E 's/.*src=["'"']([^"'"']+)["'"'].*/\1/' \
              | sort -u
          )

          echo "Found ${#scripts[@]} script assets"
          printf 'Script assets inspected: `%s`\n\n' "${#scripts[@]}" >> "$GITHUB_STEP_SUMMARY"

          : > "$work/all.txt"
          cat "$work/index.html" >> "$work/all.txt"

          for src in "${scripts[@]}"; do
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="https://keeptxred.com$src" ;;
              *) url="https://keeptxred.com/$src" ;;
            esac
            echo "Fetching $url"
            curl --connect-timeout 15 --max-time 60 -fsSL "$url" >> "$work/all.txt" || true
            printf '\n' >> "$work/all.txt"
          done

          mapfile -t hosts < <(grep -oE 'https://[a-z0-9-]+\.supabase\.co' "$work/all.txt" | sort -u || true)
          mapfile -t refs < <(grep -oE '[a-z0-9]{20}\.supabase\.co' "$work/all.txt" | sed 's/\.supabase\.co//' | sort -u || true)

          echo 'Supabase hosts found:'
          printf '%s\n' "${hosts[@]:-none}"

          printf 'Supabase hosts found:\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ ${#hosts[@]} -eq 0 ]]; then
            printf -- '- none\n' >> "$GITHUB_STEP_SUMMARY"
          else
            for host in "${hosts[@]}"; do
              printf -- '- `%s`\n' "$host" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          printf '\nProject refs found:\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ ${#refs[@]} -eq 0 ]]; then
            printf -- '- none\n' >> "$GITHUB_STEP_SUMMARY"
          else
            for ref in "${refs[@]}"; do
              printf -- '- `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
