name: Trace live KeepTXRed backend

on:
  push:
    branches:
      - agent/probe-old-supabase-public-data
    paths:
      - '.github/workflows/probe-old-supabase-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Probe live server health and hosting headers
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          curl --connect-timeout 15 --max-time 60 -fsSL -D "$work/root.headers" https://keeptxred.com/ -o /dev/null
          status="$(curl --connect-timeout 15 --max-time 60 -sS -D "$work/health.headers" -o "$work/health.json" -w '%{http_code}' https://keeptxred.com/api/public/hooks/health || true)"

          echo "health HTTP $status"
          cat "$work/health.json"
          echo
          echo 'selected response headers:'
          grep -Ei '^(server|via|x-|cf-|fly-|render-|vercel-|location):' "$work/root.headers" || true
          grep -Ei '^(server|via|x-|cf-|fly-|render-|vercel-|location):' "$work/health.headers" || true

          printf '### Live KeepTXRed server health\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Health HTTP: `%s`\n\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$work/health.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" == '000' || "$status" == 'curl-error' ]]; then
            exit 2
          fi
