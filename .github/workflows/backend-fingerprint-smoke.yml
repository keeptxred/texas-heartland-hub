name: Backend Fingerprint Smoke
on:
  push:
    branches: [test/backend-fingerprint-smoke]
    paths: ['.github/workflows/backend-fingerprint-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed backend routes and canonical Supabase host
        shell: bash
        run: |
          set +e
          for path in deployment-fingerprint newsroom-health; do
            echo "=== $path ==="
            curl -sS -i --max-time 30 "https://keeptxred.com/api/public/$path"
            echo
          done
          echo '=== canonical Supabase DNS ==='
          getent ahosts qhwwmdszjgkscqxgmenf.supabase.co || true
          echo '=== canonical Supabase HTTP ==='
          curl -sS -i --max-time 30 'https://qhwwmdszjgkscqxgmenf.supabase.co/rest/v1/' || true
          echo
