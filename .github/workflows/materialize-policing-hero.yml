name: Materialize policing hero

on:
  push:
    branches:
      - fix/policing-hero-full-image
    paths:
      - ".tmp/policing-hero/**"
      - ".github/workflows/materialize-policing-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified hero image
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .tmp/policing-hero/part08.b64 ]]; then
            echo "Policing hero chunks already materialized or incomplete; nothing to do."
            exit 0
          fi

          cat .tmp/policing-hero/part*.b64 > /tmp/policing.b64
          base64 -d /tmp/policing.b64 > /tmp/policing.webp

          test "$(wc -c < /tmp/policing.webp)" -gt 50000

          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("/tmp/policing.webp").convert("RGB")
          assert src.size == (1280, 720), src.size
          out = "public/images/news/texas-policing-agencies-compared.jpg"
          src.save(out, "JPEG", quality=92, optimize=True)
          check = Image.open(out)
          assert check.size == (1280, 720), check.size
          print(out, check.size)
          PY

          test "$(wc -c < public/images/news/texas-policing-agencies-compared.jpg)" -gt 100000

          rm -f public/images/news/texas-policing-agencies-compared-v2.jpg
          rm -rf .tmp/policing-hero

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Materialize full policing comparison hero image"
          git push origin HEAD
