name: Evergreen Entity Audit
on:
  pull_request:
    paths:
      - 'src/lib/evergreen-entity-verification*'
      - 'scripts/evergreen/**'
      - 'docs/evergreen/**'
      - '.github/workflows/evergreen-entity-audit.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/evergreen-entity-verification.test.ts
      - run: node scripts/evergreen/audit-entities.mjs > evergreen-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: evergreen-inventory
          path: evergreen-inventory.json
