name: TexasDefined domain cutover executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: texasdefined-domain-cutover-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  cutover:
    if: github.head_ref == 'run-td-cloudflare-cutover-apex-ktr' || github.head_ref == 'run-td-cloudflare-cutover-www-ktr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      WORKER_NAME: texasdefined-site
      ZONE_NAME: texasdefined.com
      REQUESTED_HOSTNAME: ${{ github.head_ref == 'run-td-cloudflare-cutover-www-ktr' && 'www.texasdefined.com' || 'texasdefined.com' }}
    steps:
      - name: Rollback-safe TexasDefined custom-domain cutover
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing Cloudflare account ID; DNS untouched.'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing deploy token; DNS untouched.'; exit 1; }

          # Prove account-level Workers permission and that the permanent TD Worker exists.
          workers_http="$(curl -sS -o "$tmp/workers.json" -w '%{http_code}' -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          [[ "$workers_http" -lt 400 ]] || { echo "::error::Workers access failed HTTP $workers_http; DNS untouched."; cat "$tmp/workers.json" >&2 || true; exit 1; }
          python3 - "$tmp/workers.json" "$WORKER_NAME" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          name=sys.argv[2]
          names={str(x.get('id') or x.get('name') or '') for x in (data.get('result') or [])}
          if data.get('success') is not True or name not in names:
              raise SystemExit(f'Permanent Worker {name!r} is not visible; DNS untouched.')
          print(f'Permanent Worker {name} is visible.')
          PY

          # Prove the Worker is healthy on workers.dev before touching production DNS.
          sub_http="$(curl -sS -o "$tmp/sub.json" -w '%{http_code}' -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          [[ "$sub_http" -lt 400 ]] || { echo "::error::workers.dev lookup failed HTTP $sub_http; DNS untouched."; exit 1; }
          subdomain="$(python3 - "$tmp/sub.json" <<'PY'
          import json, sys
          print((json.load(open(sys.argv[1])).get('result') or {}).get('subdomain') or '')
          PY
          )"
          test -n "$subdomain" || { echo '::error::Cloudflare account has no workers.dev subdomain; DNS untouched.'; exit 1; }
          preview="https://${WORKER_NAME}.${subdomain}.workers.dev"
          for path in / /robots.txt /sitemap.xml /fishing /guides /county/travis; do
            curl --retry 8 --retry-all-errors --retry-delay 2 --max-time 30 -fsSL "$preview$path" -o "$tmp/preview"
            test -s "$tmp/preview" || { echo "::error::Worker preview failed for $path; DNS untouched."; exit 1; }
          done
          echo "Worker preview healthy: $preview"

          # Resolve the active TexasDefined Cloudflare zone. With a zone-scoped token this
          # also proves the token was explicitly granted access to texasdefined.com.
          zone_http="$(curl -sS -o "$tmp/zone.json" -w '%{http_code}' -H "$auth" --get \
            --data-urlencode "name=$ZONE_NAME" --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" "$api/zones")"
          [[ "$zone_http" -lt 400 ]] || { echo "::error::TexasDefined zone lookup failed HTTP $zone_http; DNS untouched."; cat "$tmp/zone.json" >&2 || true; exit 1; }
          zone_id="$(python3 - "$tmp/zone.json" "$ZONE_NAME" "$CLOUDFLARE_ACCOUNT_ID" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1])); name=sys.argv[2]; account=sys.argv[3]
          rows=[z for z in (data.get('result') or []) if z.get('name')==name and (z.get('account') or {}).get('id')==account and z.get('status')=='active']
          print(rows[0].get('id','') if len(rows)==1 else '')
          PY
          )"
          test -n "$zone_id" || { echo '::error::No accessible active texasdefined.com Cloudflare zone; DNS untouched.'; exit 1; }

          records_http="$(curl -sS -o "$tmp/records.json" -w '%{http_code}' -H "$auth" --get \
            --data-urlencode "name=$REQUESTED_HOSTNAME" --data-urlencode 'per_page=100' "$api/zones/$zone_id/dns_records")"
          [[ "$records_http" -lt 400 ]] || { echo "::error::DNS access failed HTTP $records_http; DNS untouched."; cat "$tmp/records.json" >&2 || true; exit 1; }

          domains_http="$(curl -sS -o "$tmp/domains.json" -w '%{http_code}' -H "$auth" --get \
            --data-urlencode "hostname=$REQUESTED_HOSTNAME" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          [[ "$domains_http" -lt 400 ]] || { echo "::error::Worker custom-domain access failed HTTP $domains_http; DNS untouched."; cat "$tmp/domains.json" >&2 || true; exit 1; }
          existing_service="$(python3 - "$tmp/domains.json" "$REQUESTED_HOSTNAME" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1])); host=sys.argv[2].lower()
          rows=[x for x in (data.get('result') or []) if str(x.get('hostname') or '').lower()==host]
          if len(rows)>1: raise SystemExit(f'Multiple Worker domains found for {host}')
          print((rows[0].get('service') or '') if rows else '')
          PY
          )"

          verify_live() {
            for attempt in $(seq 1 60); do
              if [[ "$REQUESTED_HOSTNAME" == 'www.texasdefined.com' ]]; then
                code="$(curl --connect-timeout 8 --max-time 15 -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "https://$REQUESTED_HOSTNAME/" || true)"
                location="$(curl --connect-timeout 8 --max-time 15 -sSI --max-redirs 0 "https://$REQUESTED_HOSTNAME/" 2>/dev/null | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); print; exit}' || true)"
                if [[ "$code" =~ ^30(1|8)$ && "$location" == https://texasdefined.com/* ]]; then return 0; fi
              else
                if curl --connect-timeout 8 --max-time 15 -fsSL "https://$REQUESTED_HOSTNAME/" -o "$tmp/live" && [[ -s "$tmp/live" ]]; then
                  curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://$REQUESTED_HOSTNAME/robots.txt" -o /dev/null && \
                  curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://$REQUESTED_HOSTNAME/sitemap.xml" -o /dev/null && return 0
                fi
              fi
              sleep 5
            done
            return 1
          }

          if [[ -n "$existing_service" ]]; then
            [[ "$existing_service" == "$WORKER_NAME" ]] || { echo "::error::$REQUESTED_HOSTNAME is already attached to unexpected Worker $existing_service; DNS untouched."; exit 1; }
            verify_live || { echo '::error::Existing TexasDefined Worker domain is unhealthy; DNS untouched.'; exit 1; }
            echo "$REQUESTED_HOSTNAME is already healthy on $WORKER_NAME."
            exit 0
          fi

          # Back up only conflicting web records. Never touch MX/TXT/CAA or mail records.
          conflict_count="$(python3 - "$tmp/records.json" "$tmp/backup.json" "$REQUESTED_HOSTNAME" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1])); host=sys.argv[3].rstrip('.').lower()
          rows=[]
          for r in (data.get('result') or []):
              if str(r.get('name') or '').rstrip('.').lower()==host and r.get('type') in {'A','AAAA','CNAME'}:
                  rows.append({k:r.get(k) for k in ('id','type','name','content','ttl','proxied','comment','tags')})
          json.dump(rows,open(sys.argv[2],'w'))
          print(len(rows))
          PY
          )"
          [[ "$conflict_count" -le 1 ]] || { echo "::error::Found $conflict_count conflicting web records; refusing automated cutover. DNS untouched."; exit 1; }

          restore_old_record() {
            [[ "$conflict_count" -eq 1 ]] || return 0
            payload="$(python3 - "$tmp/backup.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))[0]
          print(json.dumps({k:v for k,v in r.items() if k!='id' and v is not None},separators=(',',':')))
          PY
            )"
            http="$(curl -sS -o "$tmp/restore.json" -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data "$payload" "$api/zones/$zone_id/dns_records")"
            [[ "$http" -lt 400 ]] || { echo "::error::Automatic DNS rollback failed HTTP $http"; cat "$tmp/restore.json" >&2 || true; return 1; }
            echo "Restored prior $REQUESTED_HOSTNAME web record."
          }

          if [[ "$conflict_count" -eq 1 ]]; then
            record_id="$(python3 - "$tmp/backup.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))[0]
          print(r['id'])
          print(f"Backed up {r['type']} {r['name']} -> {r['content']}",file=sys.stderr)
          PY
            )"
            del_http="$(curl -sS -o "$tmp/delete.json" -w '%{http_code}' -X DELETE -H "$auth" "$api/zones/$zone_id/dns_records/$record_id")"
            [[ "$del_http" -lt 400 ]] || { echo "::error::Could not remove old web record HTTP $del_http; cutover stopped."; cat "$tmp/delete.json" >&2 || true; exit 1; }
            echo "Removed old $REQUESTED_HOSTNAME web record."
          fi

          payload="$(python3 - "$REQUESTED_HOSTNAME" "$WORKER_NAME" "$ZONE_NAME" <<'PY'
          import json, sys
          print(json.dumps({'hostname':sys.argv[1],'service':sys.argv[2],'zone_name':sys.argv[3]},separators=(',',':')))
          PY
          )"
          attach_http="$(curl -sS -o "$tmp/attach.json" -w '%{http_code}' -X PUT -H "$auth" -H 'Content-Type: application/json' \
            --data "$payload" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          if [[ "$attach_http" -ge 400 ]]; then
            echo "Worker domain attach failed HTTP $attach_http; restoring prior DNS."
            cat "$tmp/attach.json" >&2 || true
            restore_old_record
            exit 1
          fi
          domain_id="$(python3 - "$tmp/attach.json" <<'PY'
          import json, sys
          print((json.load(open(sys.argv[1])).get('result') or {}).get('id') or '')
          PY
          )"

          if verify_live; then
            echo "$REQUESTED_HOSTNAME is live and healthy on $WORKER_NAME."
            exit 0
          fi

          echo 'Live verification failed; rolling back Worker domain and DNS.'
          if [[ -n "$domain_id" ]]; then
            curl -sS -X DELETE -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$domain_id" -o "$tmp/detach.json" || true
          fi
          restore_old_record
          echo '::error::TexasDefined cutover did not become healthy and was rolled back.'
          exit 1
