name: Sync sitewide Google Search Console data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-gsc-sitewide.yml"
      - "scripts/seo/gsc-sitewide-utils.mjs"
      - "scripts/seo/gsc-sitewide-utils.test.mjs"
      - "scripts/seo/gsc-sitewide-transport-contract.test.mjs"
      - "scripts/seo/sync-gsc-sitewide.mjs"
      - "src/lib/gsc-sitewide.ts"
      - "src/routes/api/admin/gsc-sitewide-sync.ts"
      - "supabase/migrations/*_gsc_sitewide_search_console.sql"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-gsc-sitewide.yml"
      - "scripts/seo/gsc-sitewide-utils.mjs"
      - "scripts/seo/gsc-sitewide-utils.test.mjs"
      - "scripts/seo/gsc-sitewide-transport-contract.test.mjs"
      - "scripts/seo/sync-gsc-sitewide.mjs"
      - "src/lib/gsc-sitewide.ts"
      - "src/routes/api/admin/gsc-sitewide-sync.ts"
      - "supabase/migrations/*_gsc_sitewide_search_console.sql"

permissions:
  contents: read
  actions: read

concurrency:
  group: gsc-sitewide-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate sitewide Search Console scripts without credentials
        run: |
          node --check scripts/seo/sync-gsc-sitewide.mjs
          node --check scripts/seo/gsc-sitewide-utils.mjs
          node --check scripts/seo/gsc-sitewide-utils.test.mjs
          node --check scripts/seo/gsc-sitewide-transport-contract.test.mjs

  sync:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
      GSC_SITE_URL: sc-domain:keeptxred.com
      GSC_SITEWIDE_FETCH_ORIGIN: https://keeptxred-site.freddy-coppola.workers.dev
      GSC_SITEWIDE_SYNC_ENDPOINT: https://keeptxred-site.freddy-coppola.workers.dev/api/admin/gsc-sitewide-sync
      GSC_SITEWIDE_LOOKBACK_DAYS: "28"
      GSC_INSPECTION_LIMIT: "200"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backfill finalized page metrics and rotate URL Inspection coverage
        run: node scripts/seo/sync-gsc-sitewide.mjs
