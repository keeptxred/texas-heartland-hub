name: One-shot crawl audit after 2130

on:
  push:
    branches:
      - diagnostic/crawl-leaks-after-2130-20260909

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run precise retired-public-link crawl audit
        run: bun run seo:crawl-leaks
      - name: Run strict precise crawl audit
        env:
          SEO_CRAWL_LEAK_STRICT: '1'
        run: bun run seo:crawl-leaks
