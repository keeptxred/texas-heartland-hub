name: One-time delete stale weird-town branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-delete-weird-town-stale-refs.yml'

permissions:
  contents: write

jobs:
  delete-stale-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete stale weird-town branch refs
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'cleanup/remove-weird-town-one-time-publisher'
            'fix/one-time-td-weird-town-facebook-20260912'
            'fix/one-time-td-weird-town-facebook-v2'
            'fix/weird-town-facebook-url-upload'
            'cleanup/delete-weird-town-stale-refs-20260913'
          )

          for branch in "${branches[@]}"; do
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            status=$(curl -sS -o /tmp/delete-ref-response.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api_url")
            case "$status" in
              204) echo "Deleted ${branch}" ;;
              404|422) echo "Already absent or not deletable because it was already removed: ${branch}" ;;
              *) cat /tmp/delete-ref-response.json >&2 || true; echo "Failed deleting ${branch}: HTTP ${status}" >&2; exit 1 ;;
            esac
          done

          for branch in "${branches[@]}"; do
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"
            status=$(curl -sS -o /tmp/verify-ref-response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api_url")
            if [[ "$status" != "404" ]]; then
              cat /tmp/verify-ref-response.json >&2 || true
              echo "Branch still exists after deletion attempt: ${branch} (HTTP ${status})" >&2
              exit 1
            fi
          done

          echo "All stale weird-town branch refs are absent."
