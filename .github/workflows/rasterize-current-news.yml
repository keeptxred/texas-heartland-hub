name: Rasterize current news heroes
on:
  push:
    branches: [chatgpt/current-texas-news-2026-09-04]
    paths: ['.github/workflows/rasterize-current-news.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow
      - name: Render unique 1600x900 JPEG heroes
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import random
          out=Path('public/images/news/generated/2026-09-04'); out.mkdir(parents=True,exist_ok=True)
          specs=[('paxton-financial-disclosures.jpg',(218,208,190),'documents'),('sboe-social-studies-standards.jpg',(210,221,222),'school'),('tamu-core-curriculum-review.jpg',(220,214,202),'campus'),('texas-voucher-budget.jpg',(218,226,222),'voucher'),('texas-food-insecurity.jpg',(225,219,205),'food'),('tesla-cybercab-austin.jpg',(204,216,224),'car'),('trinity-county-deer-viral.jpg',(48,61,66),'deer'),('fort-worth-kindergartner-safety.jpg',(216,227,231),'gate'),('denton-turtles-shipment.jpg',(213,223,213),'turtles'),('desoto-handshake-viral.jpg',(190,202,208),'football')]
          for idx,(name,bg,kind) in enumerate(specs):
            im=Image.new('RGB',(1600,900),bg); d=ImageDraw.Draw(im); d.rectangle((0,650,1600,900),fill=(105+idx*4,92+idx*2,72+idx*2))
            if kind=='documents':
              d.polygon([(120,380),(420,150),(720,380)],fill=(80,65,55)); d.rectangle((180,380,660,650),fill=(178,135,98)); d.rectangle((850,120,1330,720),fill=(242,237,224)); [d.rectangle((930,y,930+w,y+18),fill=(100,100,95)) for y,w in [(270,300),(370,300),(470,220)]]; d.ellipse((1110,540,1360,790),outline=(55,75,90),width=35); d.line((1300,730,1480,880),fill=(55,75,90),width=45)
            elif kind=='school':
              d.rectangle((160,260,760,650),fill=(225,215,190)); d.rectangle((160,260,760,330),fill=(105,75,60)); d.polygon([(930,200),(1180,280),(1360,470),(1210,670),(920,640),(820,430)],fill=(180,115,90)); d.line((1030,420,1090,480,1220,320),fill=(245,240,225),width=35)
            elif kind=='campus':
              d.polygon([(100,340),(480,120),(860,340)],fill=(90,50,55)); d.rectangle((170,340,790,650),fill=(185,170,145)); d.rectangle((930,170,1370,680),fill=(245,240,232)); d.line((990,570,1045,625,1170,480),fill=(110,50,55),width=32)
            elif kind=='voucher':
              d.polygon([(100,370),(440,150),(780,370)],fill=(105,80,65)); d.rectangle((160,370,720,650),fill=(200,180,150)); d.rounded_rectangle((850,190,1380,560),radius=35,fill=(238,230,210)); d.ellipse((940,280,1140,480),fill=(185,165,90)); d.line((1040,330,1040,430),fill=(245,240,230),width=22); d.line((990,380,1090,380),fill=(245,240,230),width=22)
            elif kind=='food':
              d.rectangle((130,220,650,650),fill=(195,165,120)); [d.rectangle((190,y,590,y+22),fill=(235,226,210)) for y in [340,440,540]]; d.polygon([(900,220),(1160,310),(1340,500),(1180,680),(860,650),(750,430)],fill=(180,100,80))
            elif kind=='car':
              d.rectangle((760,300,860,650),fill=(165,150,125)); d.rectangle((810,170,910,650),fill=(165,150,125)); d.polygon([(810,170),(860,65),(910,170)],fill=(130,110,80)); d.polygon([(100,700),(350,635),(690,660),(820,800),(150,800)],fill=(195,160,70)); d.polygon([(250,665),(350,565),(620,565),(720,665)],fill=(225,205,135)); d.ellipse((240,735,390,885),fill=(45,48,50)); d.ellipse((650,735,800,885),fill=(45,48,50))
            elif kind=='deer':
              d.rectangle((0,0,1600,650),fill=(35,48,55)); [d.polygon([(x,650),(x+130,650-h),(x+260,650)],fill=(20,38,30)) for x,h in [(80,360),(300,430),(1250,400)]]; d.ellipse((650,410,930,620),fill=(165,130,95)); d.ellipse((830,350,980,500),fill=(165,130,95)); d.ellipse((1180,500,1300,620),fill=(205,170,125)); d.rectangle((1130,610,1350,800),fill=(50,75,100))
            elif kind=='gate':
              d.polygon([(100,320),(490,110),(880,320)],fill=(115,80,68)); d.rectangle((160,320,820,650),fill=(200,160,120)); [d.line((x,350,x,720),fill=(80,95,100),width=28) for x in [1020,1260]]; [d.line((1020,y,1260,y),fill=(80,95,100),width=20) for y in [400,510,620]]; d.ellipse((900,580,980,660),fill=(210,165,120)); d.ellipse((1380,500,1490,610),fill=(210,165,120))
            elif kind=='turtles':
              d.rectangle((150,230,690,660),fill=(185,140,95)); d.line((150,230,420,390,690,230),fill=(120,90,65),width=26); d.line((420,390,420,660),fill=(120,90,65),width=26)
              for cx,cy,rx,ry in [(910,500,150,105),(1230,550,135,95),(1060,700,125,88)]: d.ellipse((cx-rx,cy-ry,cx+rx,cy+ry),fill=(105,135,95)); d.ellipse((cx+rx-25,cy-30,cx+rx+65,cy+45),fill=(145,160,110))
            else:
              d.rectangle((0,390,1600,900),fill=(90,125,75)); d.line((800,390,800,900),fill=(235,230,215),width=16); d.ellipse((625,485,975,835),outline=(235,230,215),width=14)
              for cx,color in [(620,(55,75,115)),(980,(120,55,65))]: d.ellipse((cx-55,500,cx+55,610),fill=(190,145,105)); d.line((cx,610,cx,805),fill=color,width=38)
            random.seed(idx+20260904)
            for _ in range(1800):
              x=random.randrange(1600); y=random.randrange(900); c=random.randrange(120,190); d.point((x,y),fill=(c,c,c))
            im.save(out/name,'JPEG',quality=86,optimize=True,progressive=True)
          PY
      - name: Repair publication migrations and remove SVG sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            '20260905014000_current_news_paxton_disclosures.sql','20260905014100_current_news_sboe_social_studies.sql','20260905014200_current_news_tamu_core_review.sql','20260905014300_current_news_voucher_budget.sql','20260905014400_current_news_food_insecurity.sql','20260905014500_current_viral_cybercab_austin.sql','20260905014600_current_viral_trinity_deer.sql','20260905014700_current_viral_fort_worth_kindergartner.sql','20260905014800_current_viral_denton_turtles.sql','20260905014900_current_viral_desoto_handshake.sql']
          for name in files:
            p=Path('supabase/migrations')/name
            s=p.read_text()
            s=s.replace('.svg', '.jpg')
            s=s.replace('Editorial illustration of ', '')
            s=s.replace("'paragraphs',jsonb_build_array(body)", "'paragraphs',to_jsonb(regexp_split_to_array(body,E'\\n\\n'))")
            p.write_text(s)
          for p in Path('public/images/news/generated/2026-09-04').glob('*.svg'):
            p.unlink()
          PY
      - name: Commit repaired package
        run: |
          git config user.name 'keeptxred'
          git config user.email 'freddy.coppola@gmail.com'
          git add supabase/migrations/20260905014*.sql public/images/news/generated/2026-09-04
          git add -u public/images/news/generated/2026-09-04
          if ! git diff --cached --quiet; then
            git commit -m 'Repair September 4 news publication contract'
            git push origin HEAD:chatgpt/current-texas-news-2026-09-04
          fi
