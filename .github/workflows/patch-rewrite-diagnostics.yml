name: Patch rewrite diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-rewrite-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 scripts/patch-rewrite-diagnostics.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/api/public/hooks/ingest-feeds.ts
          git commit -m "Preserve AI rewrite failure diagnostics"
          git push origin HEAD:main
