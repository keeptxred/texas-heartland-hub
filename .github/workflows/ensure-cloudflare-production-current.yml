name: Ensure Cloudflare Production Matches Main

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/deploy-current-main-trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read
  statuses: write

concurrency:
  group: keeptxred-cloudflare-production-ensure
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve verified current main and production state
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha"

          attempts=1
          if [[ "$EVENT_NAME" == 'push' ]]; then
            attempts=36
          fi

          verify_success='false'
          verify_active='false'
          verify_terminal='false'
          for attempt in $(seq 1 "$attempts"); do
            current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            if [[ "$current_main" != "$main_sha" ]]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "verified=false" >> "$GITHUB_OUTPUT"
              echo "Main advanced from $main_sha to $current_main while waiting for verification; a newer reconciliation run will handle it."
              exit 0
            fi

            verify_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/actions/workflows/shared-vitest.yml/runs?branch=main&per_page=100" \
              --jq '{workflow_runs: [.workflow_runs[] | {head_sha, status, conclusion}]}')"
            verify_state="$(printf '%s' "$verify_json" | jq -r --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha)] as $rows | [(any($rows[]; .status == "completed" and .conclusion == "success")), (any($rows[]; .status != "completed")), (($rows | length) > 0 and (any($rows[]; .status == "completed" and .conclusion == "success") | not) and (any($rows[]; .status != "completed") | not))] | map(tostring) | @tsv')"
            IFS=$'\t' read -r verify_success verify_active verify_terminal <<< "$verify_state"

            if [[ "$verify_success" == 'true' ]]; then
              echo "Exact current main $main_sha has a successful Repository test and build health run."
              break
            fi

            if [[ "$attempt" -lt "$attempts" ]]; then
              echo "Waiting for a successful exact-SHA repository verification on $main_sha (active=$verify_active terminal_only=$verify_terminal, attempt $attempt/$attempts)."
              sleep 10
            fi
          done

          if [[ "$verify_success" != 'true' ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "Current main $main_sha has no successful exact-SHA Repository test and build health run; production will not be changed."
            exit 0
          fi

          echo "verified=true" >> "$GITHUB_OUTPUT"

          production_state="$(gh api "repos/$REPOSITORY/commits/$main_sha/status" --jq '[.statuses[] | select(.context == "keeptxred-production-current")][0].state // ""')"
          production_target="$(gh api "repos/$REPOSITORY/commits/$main_sha/status" --jq '[.statuses[] | select(.context == "keeptxred-production-current")][0].target_url // ""')"

          echo "production_state=${production_state:-none}"
          if [[ "$production_state" == 'success' ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Production is already recorded as current for verified main $main_sha."
            exit 0
          fi

          if [[ "$production_state" == 'pending' && "$production_target" =~ /actions/runs/([0-9]+) ]]; then
            existing_run_id="${BASH_REMATCH[1]}"
            existing_head="$(gh api "repos/$REPOSITORY/actions/runs/$existing_run_id" --jq '.head_sha // ""' 2>/dev/null || true)"
            existing_status="$(gh api "repos/$REPOSITORY/actions/runs/$existing_run_id" --jq '.status // ""' 2>/dev/null || true)"
            if [[ "$existing_head" == "$main_sha" && "$existing_status" != 'completed' && -n "$existing_status" ]]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "existing_run_id=$existing_run_id" >> "$GITHUB_OUTPUT"
              echo "A custom-domain deployment for current main is already $existing_status (run $existing_run_id)."
              exit 0
            fi
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Verified main $main_sha is not recorded as current in production; deployment is required."

      - name: Dispatch exact verified main to production custom domain
        id: dispatch
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.gate.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$current_main" != "$MAIN_SHA" ]]; then
            echo "Current main advanced to $current_main before deployment dispatch; refusing stale production deployment."
            exit 0
          fi

          before_id="$(gh api "repos/$REPOSITORY/actions/workflows/deploy-cloudflare-production.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"

          gh workflow run deploy-cloudflare-production.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f activate_custom_domain=true \
            -f production_hostname=keeptxred.com

          run_id=''
          run_sha=''
          run_url=''
          for attempt in $(seq 1 30); do
            run_record="$(gh api \
              "repos/$REPOSITORY/actions/workflows/deploy-cloudflare-production.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.id > $before_id) | [.id, .head_sha, .html_url] | @tsv" \
              | head -n 1)"
            if [[ -n "$run_record" ]]; then
              IFS=$'\t' read -r run_id run_sha run_url <<< "$run_record"
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "The production workflow dispatch was accepted but no new run could be resolved." >&2
            exit 1
          fi

          if [[ "$run_sha" != "$MAIN_SHA" ]]; then
            echo "Dispatched production run $run_id resolved to $run_sha instead of verified $MAIN_SHA; cancelling before deployment." >&2
            gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            exit 1
          fi

          gh api --method POST \
            "repos/$REPOSITORY/statuses/$MAIN_SHA" \
            -f state='pending' \
            -f context='keeptxred-production-current' \
            -f description='Verified custom-domain deployment in progress' \
            -f target_url="$run_url" >/dev/null

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Dispatched verified production run $run_id for $MAIN_SHA."

      - name: Wait for verified custom-domain deployment
        id: deployment
        if: steps.dispatch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.gate.outputs.main_sha }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          gh_api_retry() {
            local output rc attempt
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@" 2>&1)"; then
                printf '%s' "$output"
                return 0
              fi
              rc=$?
              printf '%s\n' "$output" >&2
              if [[ "$attempt" -eq 5 ]]; then
                return "$rc"
              fi
              echo "Transient GitHub API failure while polling production state; retrying ($attempt/5)." >&2
              sleep $((attempt * 2))
            done
          }

          for attempt in $(seq 1 120); do
            run_json="$(gh_api_retry "repos/$REPOSITORY/actions/runs/$RUN_ID")"
            status="$(printf '%s' "$run_json" | jq -r '.status // ""')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"

            current_main="$(gh_api_retry "repos/$REPOSITORY/commits/main" --jq '.sha')"
            if [[ "$current_main" != "$MAIN_SHA" && "$status" != 'completed' ]]; then
              echo "Main advanced to $current_main while run $RUN_ID was still $status; cancelling stale deployment." >&2
              gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/cancel" >/dev/null || true
              exit 1
            fi

            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                echo "Verified production run $RUN_ID completed with conclusion '$conclusion'." >&2
                exit 1
              fi
              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "Verified custom-domain deployment $RUN_ID completed successfully."
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for verified production run $RUN_ID." >&2
          exit 1

      - name: Check out exact deployed revision for authority smoke
        if: steps.deployment.outputs.success == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.gate.outputs.main_sha }}

      - name: Verify political geography authority on deployed Worker
        if: steps.deployment.outputs.success == 'true'
        env:
          SITE_URL: https://keeptxred-site.freddy-coppola.workers.dev
        run: python3 scripts/authority/verify-political-geography-production.py

      - name: Verify live GEO discovery endpoints
        if: steps.deployment.outputs.success == 'true'
        env:
          SITE_URL: https://keeptxred.com
        shell: bash
        run: |
          set -euo pipefail
          robots="$(mktemp)"
          sitemap_headers="$(mktemp)"
          sitemap_body="$(mktemp)"
          trap 'rm -f "$robots" "$sitemap_headers" "$sitemap_body"' EXIT

          curl --location --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -o "$robots" "$SITE_URL/robots.txt"

          python3 - "$robots" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          required = {
              'OAI-SearchBot', 'GPTBot', 'ChatGPT-User', 'ClaudeBot', 'Claude-Web',
              'anthropic-ai', 'PerplexityBot', 'Perplexity-User', 'Google-Extended',
              'Applebot-Extended', 'Amazonbot', 'Meta-ExternalAgent', 'CCBot', 'Bytespider',
          }
          blocks = {}
          agents = []
          rules = []
          def flush():
              if agents:
                  for agent in agents:
                      blocks.setdefault(agent.lower(), []).extend(rules)
          for raw in text.splitlines() + ['']:
              line = raw.strip()
              if not line or line.startswith('#'):
                  flush(); agents = []; rules = []
                  continue
              key, sep, value = line.partition(':')
              if not sep:
                  continue
              key = key.strip().lower(); value = value.strip()
              if key == 'user-agent':
                  if rules:
                      flush(); agents = []; rules = []
                  agents.append(value)
              elif key in {'allow', 'disallow'} and agents:
                  rules.append((key, value))
          missing = []
          for agent in sorted(required):
              agent_rules = blocks.get(agent.lower())
              if not agent_rules:
                  missing.append(agent)
                  continue
              if ('disallow', '/') in agent_rules:
                  raise SystemExit(f'{agent} is blocked at the root')
              if ('allow', '/') not in agent_rules:
                  raise SystemExit(f'{agent} lacks explicit Allow: /')
          if missing:
              raise SystemExit('Missing AI crawler groups: ' + ', '.join(missing))
          expected = 'Sitemap: https://keeptxred.com/sitemap.xml'
          if expected not in text:
              raise SystemExit(f'robots.txt is missing {expected}')
          print('Live robots.txt permits all required AI discovery crawlers.')
          PY

          curl --location --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -D "$sitemap_headers" -o "$sitemap_body" "$SITE_URL/sitemap.xml"

          python3 - "$sitemap_headers" "$sitemap_body" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          headers = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').lower()
          if 'content-type: application/xml' not in headers and 'content-type: text/xml' not in headers:
              raise SystemExit('sitemap.xml did not return an XML content type')
          root = ET.parse(sys.argv[2]).getroot()
          if not root.tag.endswith('sitemapindex'):
              raise SystemExit(f'Expected sitemapindex root, got {root.tag!r}')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locations = [n.text.strip() for n in root.findall('sm:sitemap/sm:loc', ns) if n.text]
          required = {
              'https://keeptxred.com/sitemap-pages.xml',
              'https://keeptxred.com/sitemap-news.xml',
              'https://keeptxred.com/sitemap-evergreen.xml',
              'https://keeptxred.com/sitemap-elections.xml',
          }
          missing = sorted(required.difference(locations))
          if missing:
              raise SystemExit('Missing required child sitemaps: ' + ', '.join(missing))
          print(f'Live sitemap index is valid with {len(locations)} child sitemaps.')
          PY

      - name: Publish production-current success
        if: steps.deployment.outputs.success == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.gate.outputs.main_sha }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$REPOSITORY/statuses/$MAIN_SHA" \
            -f state='success' \
            -f context='keeptxred-production-current' \
            -f description='Verified Cloudflare custom-domain production is current' \
            -f target_url="$RUN_URL" >/dev/null
          echo "Published keeptxred-production-current=success for $MAIN_SHA"

      - name: Publish production-current failure
        if: failure() && steps.gate.outputs.main_sha != '' && steps.dispatch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.gate.outputs.main_sha }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$REPOSITORY/statuses/$MAIN_SHA" \
            -f state='failure' \
            -f context='keeptxred-production-current' \
            -f description='Verified custom-domain deployment or GEO smoke failed' \
            -f target_url="$RUN_URL" >/dev/null
          echo "Published keeptxred-production-current=failure for $MAIN_SHA"
