name: Texas Government Authority Pages

on:
  pull_request:
    paths:
      - "src/lib/texas-government.ts"
      - "src/routes/texas-government*"
      - "src/routes/sitemap-government*"
      - "src/routes/sitemap*.ts"
      - "scripts/government/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/government-authority-pages.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/texas-government.ts"
      - "src/routes/texas-government*"
      - "src/routes/sitemap-government*"
      - "src/routes/sitemap*.ts"
      - "scripts/government/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/government-authority-pages.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate authority pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate authority-page coverage
        run: bun scripts/government/validate-authority-pages.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Lint changed district routes
        run: bunx eslint src/routes/elections.districts.tsx src/routes/elections.districts.index.tsx

      - name: Test
        run: bun run test

      - name: Production build
        run: bun run build
