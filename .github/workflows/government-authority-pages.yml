name: Texas Government Authority Pages

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/texas-government.ts"
      - "src/routes/texas-government*"
      - "src/routes/sitemap-government*"
      - "src/routes/sitemap*.ts"
      - "scripts/government/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/government-authority-pages.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/texas-government.ts"
      - "src/routes/texas-government*"
      - "src/routes/sitemap-government*"
      - "src/routes/sitemap*.ts"
      - "scripts/government/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/government-authority-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: government-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate authority pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate authority-page coverage
        run: bun scripts/government/validate-authority-pages.mjs
      - name: Lint government authority files
        run: bunx eslint src/lib/texas-government.ts 'src/routes/texas-government*' 'src/routes/sitemap-government*'
