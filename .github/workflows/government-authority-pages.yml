name: Texas Government Authority Pages

on:
  pull_request:
    paths:
      - "src/lib/texas-government.ts"
      - "src/routes/texas-government*"
      - "src/routes/sitemap-government*"
      - "src/routes/sitemap[.]xml.ts"
      - "scripts/government/**"
      - ".github/workflows/government-authority-pages.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/texas-government.ts"
      - "src/routes/texas-government*"
      - "src/routes/sitemap-government*"
      - "src/routes/sitemap[.]xml.ts"
      - "scripts/government/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate authority pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate authority-page coverage
        run: node scripts/government/validate-authority-pages.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
