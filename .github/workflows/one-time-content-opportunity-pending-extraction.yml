name: One-time Content Opportunities pending-extraction fix

on:
  push:
    branches:
      - fix/content-opportunity-pending-extraction-current

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/content-opportunity-pending-extraction-current
          fetch-depth: 0
      - name: Patch pending-extraction publish path
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/admin/ContentOpportunityPanel.tsx')
          source = path.read_text()

          replacements = [
            (
              '''function normalizeOpportunityTitle(value: string | null | undefined): string {''',
              '''function canAttemptArticlePublish(preflight: RewritePreflightResult | undefined): boolean {\n  return !!preflight && (preflight.rewriteable || preflight.reason === "PENDING_EXTRACTION");\n}\n\nfunction normalizeOpportunityTitle(value: string | null | undefined): string {''',
            ),
            (
              '''  return effectivePreflight(item).rewriteable;''',
              '''  return canAttemptArticlePublish(effectivePreflight(item));''',
            ),
            (
              '''  if (preflight.reason === "PENDING_EXTRACTION") return { text: "Checking source", tone: "muted" };''',
              '''  if (preflight.reason === "PENDING_EXTRACTION") {\n    return { text: "Source check required · publishing will extract the source", tone: "muted" };\n  }''',
            ),
            (
              '''      } else {\n        setArticleMsg((s) => ({ ...s, [r.id]: { ok: false, text: res.error } }));\n        if (/does not contain enough text|not enough factual/i.test(res.error)) {''',
              '''      } else {\n        setArticleMsg((s) => ({ ...s, [r.id]: { ok: false, text: res.error } }));\n        const { data: refreshed } = await supabase\n          .from("texas_news_feed")\n          .select("id,title,source,pub_date,internal_slug,link,description,extracted_body,preflight_json")\n          .eq("id", r.id)\n          .maybeSingle();\n        if (refreshed) {\n          setItems((current) =>\n            current.map((item) => (item.id === r.id ? ({ ...item, ...refreshed } as FeedItem) : item)),\n          );\n        }\n        if (/does not contain enough text|not enough factual/i.test(res.error)) {''',
            ),
            (
              '''                const preflight = preflightById[r.id];''',
              '''                const preflight = preflightById[r.id];\n                const canAttemptPublish = alreadyPublished || canAttemptArticlePublish(preflight);''',
            ),
            (
              '''                              disabled={!!articleWorking[r.id] || (!alreadyPublished && !preflight?.rewriteable)}''',
              '''                              disabled={!!articleWorking[r.id] || !canAttemptPublish}''',
            ),
            (
              '''                              title={\n                                !alreadyPublished && !preflight?.rewriteable\n                                  ? preflight?.message\n                                  : undefined\n                              }''',
              '''                              title={!canAttemptPublish ? preflight?.message : undefined}''',
            ),
            (
              '''                                ? "Republish"\n                                : "Publish to Keep Texas Red"}''',
              '''                                ? "Republish"\n                                : preflight?.reason === "PENDING_EXTRACTION"\n                                ? "Check Source & Publish"\n                                : "Publish to Keep Texas Red"}''',
            ),
            (
              '''                        (!statuses[previewRow.id]?.rewritten && !preflightById[previewRow.id]?.rewriteable)''',
              '''                        (!statuses[previewRow.id]?.rewritten && !canAttemptArticlePublish(preflightById[previewRow.id]))''',
            ),
            (
              '''                      {statuses[previewRow.id]?.rewritten ? "Republish" : "Publish to Keep Texas Red"}''',
              '''                      {statuses[previewRow.id]?.rewritten\n                        ? "Republish"\n                        : preflightById[previewRow.id]?.reason === "PENDING_EXTRACTION"\n                        ? "Check Source & Publish"\n                        : "Publish to Keep Texas Red"}''',
            ),
          ]

          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one match, found {count}: {old[:120]!r}')
            source = source.replace(old, new, 1)

          path.write_text(source)

          test = Path('src/lib/content-opportunity-pending-extraction.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(new URL("../components/admin/ContentOpportunityPanel.tsx", import.meta.url), "utf8");\n\ndescribe("Content Opportunities pending extraction flow", () => {\n  it("keeps pending-extraction rows actionable", () => {\n    expect(source).toContain('preflight.rewriteable || preflight.reason === "PENDING_EXTRACTION"');\n    expect(source).toContain('return canAttemptArticlePublish(effectivePreflight(item));');\n    expect(source).toContain('"Check Source & Publish"');\n  });\n\n  it("refreshes persisted preflight after a failed publish attempt", () => {\n    expect(source).toContain('.select("id,title,source,pub_date,internal_slug,link,description,extracted_body,preflight_json")');\n    expect(source).toContain('.eq("id", r.id)');\n    expect(source).toContain('current.map((item) => (item.id === r.id ? ({ ...item, ...refreshed } as FeedItem) : item))');\n  });\n});\n''')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-content-opportunity-pending-extraction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/ContentOpportunityPanel.tsx src/lib/content-opportunity-pending-extraction.test.ts .github/workflows/one-time-content-opportunity-pending-extraction.yml
          git commit -m 'Fix Content Opportunities pending extraction deadlock'
          git push origin HEAD:fix/content-opportunity-pending-extraction-current
