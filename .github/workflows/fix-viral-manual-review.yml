name: Fix Viral Radar manual review queue

on:
  push:
    paths:
      - '.github/workflows/fix-viral-manual-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Viral Radar queue and Texans scoring
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('src/components/admin/ViralRadarPanel.tsx')
          text = panel.read_text()
          old = '''function shouldShowRow(row: Row, result: RewritePreflightResult): boolean {
  if (row.internal_slug) return true;
  if (result.rewriteable) return true;
  // Persisted preflight means extraction already ran. Any persisted
  // non-ready result is terminal and must leave the publish queue.
  if (row.preflight_json) return false;
  if (result.reason !== "PENDING_EXTRACTION") return false;
  return (
    (row.viral_score ?? 0) >= VIRAL_AUTO_REWRITE_MIN_SCORE &&
    (row.classification_confidence ?? 0) >= VIRAL_AUTO_REWRITE_MIN_CONFIDENCE &&
    (row.texas_relevance_score ?? 0) >= 40
  );
}'''
          new = '''function shouldShowRow(row: Row, result: RewritePreflightResult): boolean {
  if (row.internal_slug) return true;
  if (result.rewriteable) return true;
  // Persisted preflight means extraction already ran. Any persisted
  // non-ready result is terminal and must leave the publish queue.
  if (row.preflight_json) return false;
  if (result.reason !== "PENDING_EXTRACTION") return false;

  // Viral Radar is also a manual-review queue. Do not require the stricter
  // automatic-rewrite score/confidence gate here; otherwise useful Texas
  // stories disappear before an editor can check their source. Pending rows
  // must still be Texas-focused and come from a credible source.
  return (
    (row.texas_relevance_score ?? 0) >= 40 &&
    (row.source_reputation_score ?? 0) >= 55
  );
}'''
          if old not in text:
              raise SystemExit('Expected shouldShowRow block not found')
          panel.write_text(text.replace(old, new))

          scorer = Path('src/lib/viral-score.ts')
          score_text = scorer.read_text()
          old_regex = r'const TEXAS_STRONG = /\btexas\b|\btexan\b|\bt\.x\.\b/i;'
          new_regex = r'const TEXAS_STRONG = /\btexas\b|\btexans?\b|\bt\.x\.\b/i;'
          if old_regex not in score_text:
              raise SystemExit('Expected TEXAS_STRONG regex not found')
          scorer.write_text(score_text.replace(old_regex, new_regex))
          PY
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-viral-manual-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ViralRadarPanel.tsx src/lib/viral-score.ts .github/workflows/fix-viral-manual-review.yml
          git commit -m "Restore Viral Radar manual review candidates"
          git push
