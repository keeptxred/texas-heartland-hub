name: Fix Admin Duplicate And Viral Scope

on:
  push:
    paths:
      - '.github/workflows/fix-admin-duplicate-viral-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch Content Opportunities dedupe and Viral Radar scope
        run: |
          python3 <<'PY'
          from pathlib import Path

          # --- Content Opportunities: canonical dedupe, prefer real feed rows ---
          p = Path('src/components/admin/ContentOpportunityPanel.tsx')
          text = p.read_text()

          anchor = '''function shouldShowOpportunity(item: FeedItem): boolean {\n  if (item.id < 0 || item.internal_slug) return true;\n  if (!item.preflight_json) return true;\n  return effectivePreflight(item).rewriteable;\n}\n'''
          replacement = '''function normalizeOpportunityTitle(value: string | null | undefined): string {\n  return String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();\n}\n\nfunction normalizeOpportunityUrl(value: string | null | undefined): string {\n  const raw = String(value ?? "").trim();\n  if (!raw) return "";\n  try {\n    const url = new URL(raw);\n    url.hash = "";\n    url.search = "";\n    return `${url.origin}${url.pathname.replace(/\\/+$/, "")}`.toLowerCase();\n  } catch {\n    return raw.replace(/[?#].*$/, "").replace(/\\/+$/, "").toLowerCase();\n  }\n}\n\nfunction dedupeFeedOpportunities(feed: FeedItem[]): FeedItem[] {\n  const seenLinks = new Set<string>();\n  const seenSlugs = new Set<string>();\n  const seenTitles = new Set<string>();\n  const result: FeedItem[] = [];\n\n  for (const item of feed) {\n    const link = normalizeOpportunityUrl(item.link);\n    const slug = String(item.internal_slug ?? item.article_slug ?? "").toLowerCase().trim();\n    const title = normalizeOpportunityTitle(item.title);\n    if ((link && seenLinks.has(link)) || (slug && seenSlugs.has(slug)) || (title && seenTitles.has(title))) {\n      continue;\n    }\n    if (link) seenLinks.add(link);\n    if (slug) seenSlugs.add(slug);\n    if (title) seenTitles.add(title);\n    result.push(item);\n  }\n  return result;\n}\n\nfunction shouldShowOpportunity(item: FeedItem): boolean {\n  if (item.id < 0 || item.internal_slug) return true;\n  if (!item.preflight_json) return true;\n  return effectivePreflight(item).rewriteable;\n}\n'''
          if anchor not in text:
              raise SystemExit('Content helper anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_select = '.select("slug,title,category,source_name,published_at,featured_image_url")'
          new_select = '.select("slug,title,category,source_name,published_at,featured_image_url,source_url")'
          if old_select not in text:
              raise SystemExit('daily_articles select anchor not found')
          text = text.replace(old_select, new_select, 1)

          old_type = '''        featured_image_url: string | null;\n      }>;'''
          new_type = '''        featured_image_url: string | null;\n        source_url: string | null;\n      }>;'''
          if old_type not in text:
              raise SystemExit('rawArticles type anchor not found')
          text = text.replace(old_type, new_type, 1)

          old_article_feed = '''      const articleFeed: FeedItem[] = rawArticles\n        .filter(\n          (a) =>\n            !publishedSlugs.has(a.slug.toLowerCase()) &&\n            !publishedTitles.has(a.title.toLowerCase().trim()),\n        )\n        .map((a, i) => ({'''
          new_article_feed = '''      // Canonicalize the real feed first. If ingestion inserted the same source\n      // more than once, keep the newest real feed row so actions/status attach\n      // to a single record.\n      const canonicalFeed = dedupeFeedOpportunities(rawFeed);\n      const feedLinks = new Set(canonicalFeed.map((f) => normalizeOpportunityUrl(f.link)).filter(Boolean));\n      const feedSlugs = new Set(\n        canonicalFeed\n          .map((f) => String(f.internal_slug ?? f.article_slug ?? "").toLowerCase().trim())\n          .filter(Boolean),\n      );\n      const feedTitles = new Set(canonicalFeed.map((f) => normalizeOpportunityTitle(f.title)).filter(Boolean));\n\n      const articleFeed: FeedItem[] = rawArticles\n        .filter(\n          (a) =>\n            !publishedSlugs.has(a.slug.toLowerCase()) &&\n            !publishedTitles.has(a.title.toLowerCase().trim()) &&\n            !feedSlugs.has(a.slug.toLowerCase()) &&\n            !feedTitles.has(normalizeOpportunityTitle(a.title)) &&\n            !(a.source_url && feedLinks.has(normalizeOpportunityUrl(a.source_url))),\n        )\n        .map((a, i) => ({'''
          if old_article_feed not in text:
              raise SystemExit('articleFeed anchor not found')
          text = text.replace(old_article_feed, new_article_feed, 1)

          old_merge = '''      const feed = [...rawFeed, ...articleFeed].filter((f) => !isLowValueTitle(f.title));'''
          new_merge = '''      // Real texas_news_feed rows win over synthetic daily_articles rows. A final\n      // dedupe protects against title/slug/link overlap across both sources.\n      const feed = dedupeFeedOpportunities([...canonicalFeed, ...articleFeed]).filter(\n        (f) => !isLowValueTitle(f.title),\n      );'''
          if old_merge not in text:
              raise SystemExit('feed merge anchor not found')
          text = text.replace(old_merge, new_merge, 1)
          p.write_text(text)

          # --- Viral Radar: show true viral candidates only ---
          p = Path('src/components/admin/ViralRadarPanel.tsx')
          text = p.read_text()
          anchor = '''function shouldShowRow(row: Row): boolean {\n  if (row.internal_slug) return true;\n  return (\n    (row.texas_relevance_score ?? 0) >= MANUAL_TEXAS_MIN &&\n    (row.source_reputation_score ?? 0) >= MANUAL_REPUTATION_MIN\n  );\n}\n'''
          replacement = '''export function isViralRadarCandidate(row: Pick<Row,\n  "viral_score" | "classification_confidence" | "trend_velocity" | "source_count" | "viral_signals"\n>): boolean {\n  const score = row.viral_score ?? 0;\n  const confidence = row.classification_confidence ?? 0;\n  const velocity = row.trend_velocity ?? 0;\n  const sources = row.source_count ?? 1;\n  const hasVideo = Boolean(row.viral_signals?.has_video);\n\n  // Primary viral gate used by the automated rewrite system.\n  if (score >= VIRAL_AUTO_REWRITE_MIN_SCORE && confidence >= VIRAL_AUTO_REWRITE_MIN_CONFIDENCE) {\n    return true;\n  }\n\n  // Strong corroborating signals can surface a story slightly below the main\n  // score threshold, but ordinary editorial-feed items stay out of Viral Radar.\n  if (score >= 55 && velocity >= 20) return true;\n  if (score >= 55 && sources >= 2) return true;\n  if (score >= 60 && hasVideo) return true;\n  return false;\n}\n\nfunction shouldShowRow(row: Row): boolean {\n  if (!isViralRadarCandidate(row)) return false;\n  return (\n    (row.texas_relevance_score ?? 0) >= MANUAL_TEXAS_MIN &&\n    (row.source_reputation_score ?? 0) >= MANUAL_REPUTATION_MIN\n  );\n}\n'''
          if anchor not in text:
              raise SystemExit('Viral shouldShowRow anchor not found')
          text = text.replace(anchor, replacement, 1)
          p.write_text(text)

          # Focused tests for viral inclusion. Content dedupe is exercised by build/typecheck;
          # keeping the helper local avoids exporting admin-only FeedItem types.
          test = Path('src/components/admin/ViralRadarPanel.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { isViralRadarCandidate } from "./ViralRadarPanel";\n\ndescribe("Viral Radar candidate scope", () => {\n  it("includes stories that meet the primary viral gate", () => {\n    expect(isViralRadarCandidate({ viral_score: 70, classification_confidence: 0.8, trend_velocity: 0, source_count: 1, viral_signals: null })).toBe(true);\n  });\n\n  it("excludes ordinary editorial feed items", () => {\n    expect(isViralRadarCandidate({ viral_score: 45, classification_confidence: 0.9, trend_velocity: 0, source_count: 1, viral_signals: null })).toBe(false);\n  });\n\n  it("includes a corroborated breakout slightly below the main gate", () => {\n    expect(isViralRadarCandidate({ viral_score: 58, classification_confidence: 0.4, trend_velocity: 22, source_count: 1, viral_signals: null })).toBe(true);\n  });\n});\n''')
          PY
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/components/admin/ViralRadarPanel.test.ts
      - run: bun run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ContentOpportunityPanel.tsx src/components/admin/ViralRadarPanel.tsx src/components/admin/ViralRadarPanel.test.ts
          git commit -m "fix(admin): dedupe opportunities and scope Viral Radar"
          git push origin HEAD:main
