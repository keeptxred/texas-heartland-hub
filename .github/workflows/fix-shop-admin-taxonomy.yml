name: Fix Shop Admin Taxonomy

on:
  push:
    paths:
      - '.github/workflows/fix-shop-admin-taxonomy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Update shop admin taxonomy
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/routes/admin/shop-products.tsx')
          text = p.read_text()

          old_categories = 'const CATEGORIES = [["", "Unassigned"], ["shirts", "T-Shirts"], ["hoodies", "Hoodies"], ["hats", "Hats"], ["drinkware", "Drinkware"], ["stickers", "Stickers"], ["tote-bags", "Tote Bags"], ["accessories", "Accessories"]] as const;'
          new_categories = 'const CATEGORIES = [["", "Unassigned"], ["shirts", "T-Shirts"], ["hoodies", "Sweatshirts"], ["hats", "Hats"], ["drinkware", "Drinkware"], ["stickers", "Stickers"], ["tote-bags", "Tote Bags"], ["accessories", "Accessories"]] as const;'

          old_collections = 'const COLLECTIONS = [["patriotic", "Patriotic"], ["texas", "Texas"], ["floral", "Floral"], ["conservative", "Conservative"], ["texas-pride", "Texas Pride"], ["outdoors", "Outdoors"], ["home", "Home"], ["gifts", "Gifts"], ["texas-wildlife", "Texas Wildlife"], ["hill-country", "Hill Country"], ["gulf-coast", "Gulf Coast"], ["bbq", "BBQ"], ["state-parks", "State Parks"], ["small-town-texas", "Small Town Texas"], ["texas-christmas", "Texas Christmas"]] as const;'
          new_collections = 'const COLLECTIONS = [["patriotic", "Patriotic"], ["texas", "Texas"], ["floral", "Floral"], ["conservative", "Conservative"], ["texas-pride", "Texas Pride"], ["outdoors", "Outdoors"], ["home", "Home"], ["gifts", "Gifts"], ["texas-wildlife", "Texas Wildlife"], ["gulf-coast", "Gulf Coast"], ["bbq", "BBQ"], ["holiday", "Holiday Collection"]] as const;'

          if old_categories not in text:
              raise SystemExit('category taxonomy anchor not found')
          if old_collections not in text:
              raise SystemExit('collection taxonomy anchor not found')

          text = text.replace(old_categories, new_categories, 1)
          text = text.replace(old_collections, new_collections, 1)
          p.write_text(text)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin/shop-products.tsx
          git commit -m "fix(shop): update admin categories and collections"
          git push origin HEAD:main
