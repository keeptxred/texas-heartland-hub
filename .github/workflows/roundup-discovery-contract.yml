name: Roundup Discovery Contract

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/news/validate-roundup-discovery-contract.mjs"
      - "scripts/news/validate-nov8-flyover-benchmark.mjs"
      - "scripts/news/validate-nov9-flyover-benchmark.mjs"
      - "supabase/functions/ktr-rss-relay/index.ts"
      - "supabase/functions/ktr-rss-relay-priority/index.ts"
      - ".github/workflows/roundup-discovery-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/news/validate-roundup-discovery-contract.mjs"
      - "scripts/news/validate-nov8-flyover-benchmark.mjs"
      - "scripts/news/validate-nov9-flyover-benchmark.mjs"
      - "supabase/functions/ktr-rss-relay/index.ts"
      - "supabase/functions/ktr-rss-relay-priority/index.ts"
      - ".github/workflows/roundup-discovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-roundup-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Validate roundup discovery coverage
        run: |
          node scripts/news/validate-roundup-discovery-contract.mjs
          node scripts/news/validate-nov8-flyover-benchmark.mjs
          node scripts/news/validate-nov9-flyover-benchmark.mjs
