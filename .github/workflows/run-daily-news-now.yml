name: Run Daily News Now

# Production publisher smoke trigger: 2026-08-12 20:37 UTC hydrated-source retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-daily-news-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Invoke production daily news publisher
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://keeptxred.com/api/public/hooks/run-generate-news'
          for attempt in $(seq 1 4); do
            echo "Publish attempt ${attempt}/4"
            status=$(curl -sS -o /tmp/publish.json -w '%{http_code}' --max-time 180 "$endpoint" || true)
            cat /tmp/publish.json 2>/dev/null || true
            echo
            if [[ "$status" == "200" ]] && jq -e '.ok == true' /tmp/publish.json >/dev/null 2>&1; then
              echo 'DAILY_NEWS_PUBLISH_SUCCESS'
              exit 0
            fi
            if grep -Eqi 'daily free allocation|used up.*neurons|prepayment credits are depleted|RESOURCE_EXHAUSTED' /tmp/publish.json 2>/dev/null; then
              echo 'AI provider quota or credit allocation is exhausted; stop retrying to avoid waste.'
              exit 1
            fi
            echo "Publisher not ready or failed (HTTP $status)."
            sleep 15
          done
          echo 'DAILY_NEWS_PUBLISH_FAILED'
          exit 1
