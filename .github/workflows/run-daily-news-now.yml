name: Run Daily News Now

# Production publisher: per-offset generate-news calls on the custom domain. Trigger 2026-08-12 18:18 CT.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-daily-news-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Invoke production daily news publisher (one ranked story per request)
        shell: bash
        run: |
          set -euo pipefail
          base='https://keeptxred.com/api/public/hooks/generate-news'
          failed=()
          for offset in $(seq 0 9); do
            result='unknown'
            for attempt in 1 2; do
              status=$(curl -sS -X POST -o /tmp/publish.json -w '%{http_code}' \
                --max-time 95 -H 'accept: application/json' \
                "${base}?offset=${offset}&limit=1" || echo 000)

              if grep -Eqi 'daily free allocation|used up.*neurons|Workers AI.*quota|RESOURCE_EXHAUSTED' /tmp/publish.json 2>/dev/null; then
                echo "offset=${offset} QUOTA_EXHAUSTED"
                cat /tmp/publish.json || true
                echo
                echo 'Cloudflare Workers AI daily allocation exhausted; stopping to avoid waste.'
                exit 1
              fi

              if [[ "$status" == "200" ]] && jq -e '.ok == true' /tmp/publish.json >/dev/null 2>&1; then
                if jq -e '.no_items == true' /tmp/publish.json >/dev/null 2>&1; then
                  result="ok(no-items)"
                else
                  result="ok(inserted=$(jq -r '.inserted // 0' /tmp/publish.json))"
                fi
                break
              fi

              # Benign no-item / duplicate-only outcomes are nonfatal.
              if [[ "$status" == "200" ]] && grep -Eqi 'No items met the publish threshold|duplicate' /tmp/publish.json 2>/dev/null; then
                result='ok(benign-skip)'
                break
              fi

              if [[ "$status" == "000" || "$status" =~ ^5 ]]; then
                result="retryable(HTTP ${status})"
                [[ "$attempt" -lt 2 ]] && sleep 10 && continue
                break
              fi

              result="failed(HTTP ${status}: $(head -c 200 /tmp/publish.json | tr -d '\n'))"
              break
            done

            echo "offset=${offset} -> ${result}"
            [[ "$result" == ok* ]] || failed+=("${offset}:${result}")
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "DAILY_NEWS_PUBLISH_FAILED offsets: ${failed[*]}"
            exit 1
          fi
          echo 'DAILY_NEWS_PUBLISH_SUCCESS'
