name: Run Daily News Now

# Production publisher: prioritize the evidence-rich clustered newsroom,
# then the independently corroborated overdue fallback, then curated reserve. The retired legacy
# single-source RSS writer is intentionally not part of this workflow.
# Six daily opportunities keep the fresh article pool deep enough for Facebook
# while the existing AI reservation/budget gates remain authoritative.
on:
  schedule:
    - cron: "15 */4 * * *"
  # Successful verified deployments explicitly dispatch this workflow after
  # passing production newsroom smoke. This workflow retains its schedule and
  # direct manual entry point but no longer duplicates post-deploy events.
  workflow_dispatch:
    inputs:
      flyover_feed_id:
        description: "Optional exact KTR feed item selected by the Flyover automation"
        required: false
        type: string
      flyover_run_id:
        description: "Flyover execution run id used only for audit correlation"
        required: false
        type: string

run-name: "${{ inputs.flyover_run_id != '' && format('Flyover {0} feed {1}', inputs.flyover_run_id, inputs.flyover_feed_id) || 'Run Daily News Now' }}"

permissions:
  contents: read
  id-token: write

env:
  # GitHub-hosted runners are challenged on browser-facing keeptxred.com API
  # routes. Machine hooks use the same deployed Worker directly while retaining
  # their existing OIDC and publication-safety authorization.
  AUTOMATION_ORIGIN: https://keeptxred-site.freddy-coppola.workers.dev
  FLYOVER_FEED_ID: "${{ inputs.flyover_feed_id || '' }}"
  FLYOVER_RUN_ID: "${{ inputs.flyover_run_id || '' }}"

concurrency:
  group: ktr-guarded-production-newsroom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish best available quality-gated newsroom story
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-newsroom"
          # Refresh only through the GitHub-hosted OIDC endpoint. The Worker
          # independently checks issuer, signature, audience, main and workflow.
          refresh_newsroom_oidc() {
            oidc_token=$(curl -fsS --max-time 15 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$oidc_url" | jq -r '.value // empty')
            if [[ -z "$oidc_token" ]]; then
              echo 'GitHub Actions did not issue the newsroom OIDC token.' >&2
              return 1
            fi
          }
          refresh_newsroom_oidc

          # A Flyover dispatch names the exact feed item that this run is
          # authorized to evaluate. This avoids asking the general newsroom
          # scheduler to choose a different higher-priority story.
          if [[ -n "${FLYOVER_FEED_ID:-}" ]]; then
            if [[ ! "$FLYOVER_FEED_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid Flyover feed id: $FLYOVER_FEED_ID" >&2
              exit 1
            fi
            if [[ -z "${FLYOVER_RUN_ID:-}" ]]; then
              echo 'Flyover exact-feed dispatch requires flyover_run_id.' >&2
              exit 1
            fi

            payload="$(jq -nc --argjson feed_item_id "$FLYOVER_FEED_ID" '{feed_item_id:$feed_item_id}')"
            exact_status=""
            for attempt in $(seq 1 60); do
              exact_status="$(curl -sS -X POST -o /tmp/flyover-exact.json -w '%{http_code}' \
                --max-time 420 \
                -H 'accept: application/json' \
                -H 'content-type: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                --data "$payload" \
                "${AUTOMATION_ORIGIN%/}/api/public/hooks/publish-flyover-feed" || echo 000)"

              echo "flyover-exact attempt=${attempt} HTTP=${exact_status}"
              cat /tmp/flyover-exact.json 2>/dev/null || true
              echo

              # A newly merged route can briefly be absent from the deployed
              # worker. Retry only 404 deployment lag here. Transport failures
              # remain failures so the outer automation can perform its
              # side-effect-first safe retry contract.
              if [[ "$exact_status" == "404" ]]; then
                sleep 10
                continue
              fi
              break
            done

            if [[ "$exact_status" != "200" ]] || ! jq -e '.ok == true and (.slug // "") != ""' /tmp/flyover-exact.json >/dev/null 2>&1; then
              echo "FLYOVER_EXACT_FEED_PUBLISH_FAILED feed_id=${FLYOVER_FEED_ID} HTTP=${exact_status}" >&2
              exit 1
            fi

            if ! jq -e '.image.ok == true and (.image.url // "") != ""' /tmp/flyover-exact.json >/dev/null 2>&1; then
              echo "FLYOVER_EXACT_FEED_IMAGE_FAILED feed_id=${FLYOVER_FEED_ID}; publication is incomplete without a validated image." >&2
              exit 1
            fi

            slug="$(jq -r '.slug' /tmp/flyover-exact.json)"
            live_url="$(jq -r '.live_url' /tmp/flyover-exact.json)"
            live_ok=0
            for attempt in $(seq 1 18); do
              live_status="$(curl -sS -L -o /tmp/flyover-live.html -w '%{http_code}' --max-time 30 "$live_url" || echo 000)"
              if [[ "$live_status" == "200" ]] && grep -Fq "$slug" /tmp/flyover-live.html; then
                live_ok=1
                break
              fi
              sleep 10
            done
            if [[ "$live_ok" -ne 1 ]]; then
              echo "FLYOVER_EXACT_FEED_LIVE_VERIFY_FAILED feed_id=${FLYOVER_FEED_ID} slug=${slug} url=${live_url}" >&2
              exit 1
            fi

            echo "FLYOVER_EXACT_FEED_PUBLISH_SUCCESS run_id=${FLYOVER_RUN_ID} feed_id=${FLYOVER_FEED_ID} slug=${slug} live_url=${live_url}"
            exit 0
          fi

          clustered_ready=1

          run_zero_ai_stage() {
            local name="$1"
            local endpoint="$2"
            local timeout="$3"
            local output="/tmp/newsroom-${name}.json"
            local status
            status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time "$timeout" -H 'accept: application/json' \
              "${AUTOMATION_ORIGIN%/}/api/public/hooks/${endpoint}" || echo 000)
            echo "newsroom-${name} HTTP ${status}"
            cat "$output" 2>/dev/null || true
            echo
            if [[ "$status" != "200" ]] || ! jq -e '.ok == true and (.aiCalls // 0) == 0' "$output" >/dev/null 2>&1; then
              echo "CLUSTERED_NEWSROOM_${name^^}_FAILED; unsafe legacy fallback is disabled."
              clustered_ready=0
              return 0
            fi
          }

          run_zero_ai_stage evidence enrich-newsroom-rss-evidence 90
          run_zero_ai_stage normalize normalize-newsroom-feed 90
          run_zero_ai_stage cluster cluster-newsroom-stories 90
          run_zero_ai_stage score score-newsroom-stories 90
          run_zero_ai_stage decide decide-newsroom-packages 90
          run_zero_ai_stage packets build-newsroom-research-packets 180

          if [[ "$clustered_ready" -eq 1 ]]; then
            # Recover ONE already GENERATED, currently HELD and still-recent
            # publish-mode draft without new paid AI. The server rechecks its
            # exact packet, independent sources, full draft, and duplicates.
            # This never changes an editorial rejection into an approval.
            newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
              --max-time 600 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${AUTOMATION_ORIGIN%/}/api/public/hooks/generate-newsroom?mode=publish&recover_held=1" || echo 000)
            echo "recent-held-draft-recovery HTTP ${newsroom_status}"
            cat /tmp/newsroom-publish.json 2>/dev/null || true
            echo

            # A temporary GitHub OIDC JWKS lookup timeout can reject a valid
            # signed token (401). Retry exactly once with a NEW GitHub-issued
            # OIDC token; never retry a publishing attempt that got past auth,
            # and never fall through as if a persistent 401 meant no eligible
            # article. The Worker still performs every signature/claim check.
            if [[ "$newsroom_status" == "401" ]]; then
              echo 'HELD_DRAFT_AUTH_RETRY: refreshing GitHub OIDC once after 401'
              refresh_newsroom_oidc
              newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
                --max-time 600 \
                -H 'accept: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                "${AUTOMATION_ORIGIN%/}/api/public/hooks/generate-newsroom?mode=publish&recover_held=1" || echo 000)
              echo "recent-held-draft-recovery-refreshed HTTP ${newsroom_status}"
              cat /tmp/newsroom-publish.json 2>/dev/null || true
              echo
            fi
            if [[ "$newsroom_status" == "401" ]]; then
              echo 'HELD_DRAFT_AUTH_FAILED: refreshed signed GitHub OIDC was also denied' >&2
              exit 1
            fi

            if grep -Eqi 'daily free allocation|used up.*neurons|Workers AI.*quota|RESOURCE_EXHAUSTED|ai_budget_exhausted' /tmp/newsroom-publish.json 2>/dev/null; then
              echo 'Cloudflare image quota exhausted during recent held-draft recovery; stopping additional paid AI calls.' >&2
              exit 1
            fi

            # The explicit October 11–25 factual election-administration
            # approval remains independently bounded and expires October 30.
            if [[ "$newsroom_status" != "200" ]] || ! jq -e '.ok == true and .published == true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
                --max-time 600 \
                -H 'accept: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                "${AUTOMATION_ORIGIN%/}/api/public/hooks/generate-newsroom?mode=publish&recover_election=1" || echo 000)
              echo "approved-election-draft-recovery HTTP ${newsroom_status}"
              cat /tmp/newsroom-publish.json 2>/dev/null || true
              echo
              # Re-issued GitHub OIDC tokens do not guarantee every Worker
              # request can fetch its signing keys. A 401 is NOT a legitimate
              # editorial no-item; refresh and retry once, then fail closed.
              # Authorization happens before any draft selection/DB mutation.
              if [[ "$newsroom_status" == "401" ]]; then
                echo 'ELECTION_DRAFT_AUTH_RETRY: refreshing signed OIDC once after 401'
                refresh_newsroom_oidc
                newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
                  --max-time 600 \
                  -H 'accept: application/json' \
                  -H "Authorization: Bearer ${oidc_token}" \
                  "${AUTOMATION_ORIGIN%/}/api/public/hooks/generate-newsroom?mode=publish&recover_election=1" || echo 000)
                echo "approved-election-draft-recovery-refreshed HTTP ${newsroom_status}"
                cat /tmp/newsroom-publish.json 2>/dev/null || true
                echo
              fi
              if [[ "$newsroom_status" == "401" ]]; then
                echo 'ELECTION_DRAFT_AUTH_FAILED: refreshed OIDC was denied' >&2
                exit 1
              fi
              if grep -Eqi 'daily free allocation|used up.*neurons|Workers AI.*quota|RESOURCE_EXHAUSTED|ai_budget_exhausted' /tmp/newsroom-publish.json 2>/dev/null; then
                echo 'Cloudflare image quota exhausted during approved election recovery; stopping additional paid AI calls.' >&2
                exit 1
              fi
            fi

            # On a legitimate no-item or rejected draft, continue the normal
            # safe publication path, never the legacy single-source RSS writer.
            if [[ "$newsroom_status" != "200" ]] || ! jq -e '.ok == true and .published == true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
                --max-time 600 \
                -H 'accept: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                "${AUTOMATION_ORIGIN%/}/api/public/hooks/generate-newsroom?mode=publish" || echo 000)
            fi

            echo "clustered-newsroom HTTP ${newsroom_status}"
            cat /tmp/newsroom-publish.json 2>/dev/null || true
            echo
            # Do not misclassify transient signing-key/OIDC failures as a
            # lack of independently corroborated stories. Retry an HTTP 401
            # at most once with newly issued GitHub OIDC; on repeat 401 fail
            # this run. The Worker still verifies issuer, signature and claims.
            if [[ "$newsroom_status" == "401" ]]; then
              echo 'NORMAL_NEWSROOM_AUTH_RETRY: refreshing signed OIDC once after 401'
              refresh_newsroom_oidc
              newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
                --max-time 600 \
                -H 'accept: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                "${AUTOMATION_ORIGIN%/}/api/public/hooks/generate-newsroom?mode=publish" || echo 000)
              echo "clustered-newsroom-refreshed HTTP ${newsroom_status}"
              cat /tmp/newsroom-publish.json 2>/dev/null || true
              echo
            fi
            if [[ "$newsroom_status" == "401" ]]; then
              echo 'NORMAL_NEWSROOM_AUTH_FAILED: refreshed OIDC was denied' >&2
              exit 1
            fi

            if grep -Eqi 'daily free allocation|used up.*neurons|Workers AI.*quota|RESOURCE_EXHAUSTED|ai_budget_exhausted' /tmp/newsroom-publish.json 2>/dev/null; then
              echo 'Clustered newsroom AI budget/quota exhausted; stopping to avoid additional AI calls.' >&2
              exit 1
            fi

            if [[ "$newsroom_status" == "200" ]] && jq -e '.ok == true and .published == true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              slug=$(jq -r '.slug // ""' /tmp/newsroom-publish.json)
              source_count=$(jq -r '.sourceCount // 0' /tmp/newsroom-publish.json)
              primary_count=$(jq -r '.primarySourceCount // 0' /tmp/newsroom-publish.json)
              ai_calls=$(jq -r '.aiCalls // 0' /tmp/newsroom-publish.json)
              repair=$(jq -r '.repairAttempted // false' /tmp/newsroom-publish.json)

              finalize_payload=$(jq -nc --arg slug "$slug" '{slug:$slug}')
              finalize_status=$(curl -sS -X POST -o /tmp/newsroom-finalize.json -w '%{http_code}' \
                --max-time 300 \
                -H 'accept: application/json' \
                -H 'content-type: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                --data "$finalize_payload" \
                "${AUTOMATION_ORIGIN%/}/api/public/hooks/finalize-newsroom-article" || echo 000)

              echo "clustered-newsroom-finalize HTTP ${finalize_status}"
              cat /tmp/newsroom-finalize.json 2>/dev/null || true
              echo

              if [[ "$finalize_status" != "200" ]] || ! jq -e '.ok == true' /tmp/newsroom-finalize.json >/dev/null 2>&1; then
                echo "CLUSTERED_NEWSROOM_FINALIZE_FAILED slug=${slug} HTTP=${finalize_status}; article remains published for safe recovery, but this run is not a production pass." >&2
                exit 1
              fi
              # A verified source-backed article is a successful WEBSITE
              # publication even when its hero cannot be validated. Do not
              # mark it image-ready, and never queue a photo-less Facebook post.
              if ! jq -e '.image.ok == true and (.image.url // "") != ""' /tmp/newsroom-finalize.json >/dev/null 2>&1; then
                if jq -e '.webOnly == true and .imageReady == false' /tmp/newsroom-finalize.json >/dev/null 2>&1; then
                  echo "DAILY_NEWS_WEB_ONLY_SUCCESS clustered_slug=${slug} social_image_ready=false sources=${source_count} primary=${primary_count}"
                  exit 0
                fi
                echo "CLUSTERED_NEWSROOM_IMAGE_STATE_INVALID slug=${slug}; finalization did not confirm web-only or validated-image status." >&2
                exit 1
              fi

              echo "DAILY_NEWS_PUBLISH_SUCCESS clustered_slug=${slug} sources=${source_count} primary=${primary_count} ai_calls=${ai_calls} repair=${repair}"
              exit 0
            fi

            if [[ "$newsroom_status" == "200" ]] && jq -e '.ok == true and .no_items == true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              echo "Clustered newsroom had no production-eligible packet: $(jq -r '.reason // "unknown"' /tmp/newsroom-publish.json). Overdue fallback remains subject to its own evidence and editorial gates."
            elif [[ "$newsroom_status" == "200" ]] && jq -e '.ok == true and .generated == true and .published != true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              echo 'Clustered newsroom draft did not pass final validation. Overdue fallback remains subject to its own evidence and editorial gates.'
            else
              echo "Clustered newsroom publish attempt was unavailable (HTTP ${newsroom_status}). Overdue fallback remains subject to its own evidence and editorial gates."
            fi
          else
            echo 'Clustered newsroom preprocessing failed. Overdue fallback remains subject to its own evidence and editorial gates.'
          fi

          echo 'No clustered newsroom story published; trying the independent corroboration-gated overdue writer.'
          gap_status=$(curl -sS -X POST -o /tmp/overdue-gap.json -w '%{http_code}' \
            --max-time 360 \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            "${AUTOMATION_ORIGIN%/}/api/public/hooks/publish-overdue-gap" || echo 000)

          echo "overdue-gap HTTP ${gap_status}"
          cat /tmp/overdue-gap.json 2>/dev/null || true
          echo

          if [[ "$gap_status" != "200" ]] || ! jq -e '.ok == true' /tmp/overdue-gap.json >/dev/null 2>&1; then
            echo 'OVERDUE_GAP_PUBLISHER_FAILED'
            exit 1
          fi

          overdue_published=$(jq -r '.published // 0' /tmp/overdue-gap.json)
          if [[ "$overdue_published" -gt 0 ]]; then
            echo "DAILY_NEWS_PUBLISH_SUCCESS overdue_published=${overdue_published}"
            exit 0
          fi

          echo 'No overdue gap publication; continuing to reserve safety net.'

          echo 'No quality-gated normal article published; invoking curated reserve safety net.'
          # The reserve path also generates AND verifies a 1280×720 featured
          # image before publication. The previous 95-second client timeout
          # cut off valid attempts after the main publisher had already failed.
          # At most two independently validated images may now be tested if
          # the first article fails story-match vision (never provider quota/error).
          # Allow the request to complete instead of cutting off validation.
          safety_status=$(curl -sS -X POST -o /tmp/safety-net.json -w '%{http_code}' \
            --max-time 480 -H 'accept: application/json' \
            "${AUTOMATION_ORIGIN%/}/api/public/hooks/publishing-safety-net" || echo 000)
          cat /tmp/safety-net.json 2>/dev/null || true
          echo

          if [[ "$safety_status" != "200" ]] || ! jq -e '.ok == true' /tmp/safety-net.json >/dev/null 2>&1; then
            echo "PUBLISHING_SAFETY_NET_FAILED (HTTP ${safety_status})"
            exit 1
          fi

          reserve_published=$(jq -r '.reserve_published // ""' /tmp/safety-net.json)
          if [[ -n "$reserve_published" ]]; then
            echo "DAILY_NEWS_PUBLISH_SUCCESS reserve_published=${reserve_published}"
          else
            echo 'DAILY_NEWS_NO_PUBLICATION no_quality_gated_article=true reserve_published=false'
            # Publishing is not a success if the feed has already gone stale.
            # Leave legitimate quality-gated no-op runs green when there is no
            # overdue gap; escalate a prolonged missing-publication condition.
            if jq -e '.publication_gap == true' /tmp/safety-net.json >/dev/null 2>&1; then
              echo 'DAILY_NEWS_PUBLISH_GAP no_qualifying_story_and_publication_overdue=true' >&2
              exit 1
            fi
          fi
