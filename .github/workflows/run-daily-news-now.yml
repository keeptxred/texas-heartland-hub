name: Run Daily News Now

# Production publisher: prioritize eligible overdue gaps, then the clustered
# newsroom, then the legacy ranked RSS writer, with the reserve safety net last.
on:
  schedule:
    - cron: "15 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish best available newsroom story
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-newsroom"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')

          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the newsroom OIDC token.' >&2
            exit 1
          fi

          gap_status=$(curl -sS -X POST -o /tmp/overdue-gap.json -w '%{http_code}' \
            --max-time 360 \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            'https://keeptxred.com/api/public/hooks/publish-overdue-gap' || echo 000)

          echo "overdue-gap HTTP ${gap_status}"
          cat /tmp/overdue-gap.json 2>/dev/null || true
          echo

          if [[ "$gap_status" != "200" ]] || ! jq -e '.ok == true' /tmp/overdue-gap.json >/dev/null 2>&1; then
            echo 'OVERDUE_GAP_PUBLISHER_FAILED'
            exit 1
          fi

          overdue_published=$(jq -r '.published // 0' /tmp/overdue-gap.json)
          if [[ "$overdue_published" -gt 0 ]]; then
            echo "DAILY_NEWS_PUBLISH_SUCCESS overdue_published=${overdue_published}"
            exit 0
          fi

          echo 'No overdue gap published; refreshing deterministic clustered newsroom pipeline.'
          clustered_ready=1

          run_zero_ai_stage() {
            local name="$1"
            local endpoint="$2"
            local timeout="$3"
            local output="/tmp/newsroom-${name}.json"
            local status
            status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time "$timeout" -H 'accept: application/json' \
              "https://keeptxred.com/api/public/hooks/${endpoint}" || echo 000)
            echo "newsroom-${name} HTTP ${status}"
            cat "$output" 2>/dev/null || true
            echo
            if [[ "$status" != "200" ]] || ! jq -e '.ok == true and (.aiCalls // 0) == 0' "$output" >/dev/null 2>&1; then
              echo "CLUSTERED_NEWSROOM_${name^^}_FAILED; preserving legacy fallback."
              clustered_ready=0
              return 0
            fi
          }

          run_zero_ai_stage evidence enrich-newsroom-rss-evidence 90
          run_zero_ai_stage normalize normalize-newsroom-feed 90
          run_zero_ai_stage cluster cluster-newsroom-stories 90
          run_zero_ai_stage score score-newsroom-stories 90
          run_zero_ai_stage decide decide-newsroom-packages 90
          run_zero_ai_stage packets build-newsroom-research-packets 180

          if [[ "$clustered_ready" -eq 1 ]]; then
            newsroom_status=$(curl -sS -X POST -o /tmp/newsroom-publish.json -w '%{http_code}' \
              --max-time 240 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              'https://keeptxred.com/api/public/hooks/generate-newsroom?mode=publish' || echo 000)

            echo "clustered-newsroom HTTP ${newsroom_status}"
            cat /tmp/newsroom-publish.json 2>/dev/null || true
            echo

            if grep -Eqi 'daily free allocation|used up.*neurons|Workers AI.*quota|RESOURCE_EXHAUSTED|ai_budget_exhausted' /tmp/newsroom-publish.json 2>/dev/null; then
              echo 'Clustered newsroom AI budget/quota exhausted; stopping to avoid additional AI calls.' >&2
              exit 1
            fi

            if [[ "$newsroom_status" == "200" ]] && jq -e '.ok == true and .published == true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              slug=$(jq -r '.slug // ""' /tmp/newsroom-publish.json)
              source_count=$(jq -r '.sourceCount // 0' /tmp/newsroom-publish.json)
              primary_count=$(jq -r '.primarySourceCount // 0' /tmp/newsroom-publish.json)
              ai_calls=$(jq -r '.aiCalls // 0' /tmp/newsroom-publish.json)
              repair=$(jq -r '.repairAttempted // false' /tmp/newsroom-publish.json)

              finalize_payload=$(jq -nc --arg slug "$slug" '{slug:$slug}')
              finalize_status=$(curl -sS -X POST -o /tmp/newsroom-finalize.json -w '%{http_code}' \
                --max-time 300 \
                -H 'accept: application/json' \
                -H 'content-type: application/json' \
                -H "Authorization: Bearer ${oidc_token}" \
                --data "$finalize_payload" \
                'https://keeptxred.com/api/public/hooks/finalize-newsroom-article' || echo 000)

              echo "clustered-newsroom-finalize HTTP ${finalize_status}"
              cat /tmp/newsroom-finalize.json 2>/dev/null || true
              echo

              if [[ "$finalize_status" != "200" ]] || ! jq -e '.ok == true' /tmp/newsroom-finalize.json >/dev/null 2>&1; then
                echo "CLUSTERED_NEWSROOM_FINALIZE_WARNING slug=${slug} HTTP=${finalize_status}; article remains published."
              elif ! jq -e '.image.ok == true' /tmp/newsroom-finalize.json >/dev/null 2>&1; then
                echo "CLUSTERED_NEWSROOM_IMAGE_WARNING slug=${slug}; article remains published and image can be remediated separately."
              fi

              echo "DAILY_NEWS_PUBLISH_SUCCESS clustered_slug=${slug} sources=${source_count} primary=${primary_count} ai_calls=${ai_calls} repair=${repair}"
              exit 0
            fi

            if [[ "$newsroom_status" == "200" ]] && jq -e '.ok == true and .no_items == true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              echo "Clustered newsroom had no production-eligible packet: $(jq -r '.reason // "unknown"' /tmp/newsroom-publish.json). Continuing to legacy fallback."
            elif [[ "$newsroom_status" == "200" ]] && jq -e '.ok == true and .generated == true and .published != true' /tmp/newsroom-publish.json >/dev/null 2>&1; then
              echo "Clustered newsroom draft did not pass final validation; preserving legacy fallback."
            else
              echo "Clustered newsroom publish attempt was unavailable (HTTP ${newsroom_status}); preserving legacy fallback."
            fi
          fi

          echo 'Continuing to legacy ranked RSS publisher.'
          base='https://keeptxred.com/api/public/hooks/generate-news'
          inserted=0
          failed=0
          legacy_expensive_attempts=0
          LEGACY_FALLBACK_MAX_EXPENSIVE_ATTEMPTS=2

          # Free/no-item offsets may be scanned, but a response that could have
          # consumed an AI rewrite counts against the fallback cap. Never retry a
          # non-no-item response: a 5xx can occur after model generation, so an
          # HTTP retry could silently spend a second AI call on the same candidate.
          for offset in $(seq 0 9); do
            result='unknown'
            status=$(curl -sS -X POST -o /tmp/publish.json -w '%{http_code}' \
              --max-time 95 -H 'accept: application/json' \
              "${base}?offset=${offset}&limit=1" || echo 000)

            if grep -Eqi 'daily free allocation|used up.*neurons|Workers AI.*quota|RESOURCE_EXHAUSTED' /tmp/publish.json 2>/dev/null; then
              echo "offset=${offset} QUOTA_EXHAUSTED"
              cat /tmp/publish.json || true
              echo
              echo 'Cloudflare Workers AI daily allocation exhausted; stopping to avoid waste.'
              exit 1
            fi

            if [[ "$status" == "200" ]] && jq -e '.ok == true' /tmp/publish.json >/dev/null 2>&1; then
              if jq -e '.no_items == true' /tmp/publish.json >/dev/null 2>&1; then
                result="ok(no-items)"
              else
                current_inserted=$(jq -r '.inserted // 0' /tmp/publish.json)
                result="ok(inserted=${current_inserted})"
                inserted=$((inserted + current_inserted))
                legacy_expensive_attempts=$((legacy_expensive_attempts + 1))
              fi
            elif [[ "$status" == "200" ]] && grep -Eqi 'No items met the publish threshold|duplicate' /tmp/publish.json 2>/dev/null; then
              result='ok(benign-skip)'
              legacy_expensive_attempts=$((legacy_expensive_attempts + 1))
            else
              echo "offset=${offset} -> failed(HTTP ${status})"
              echo '--- production response body ---'
              cat /tmp/publish.json 2>/dev/null || true
              echo
              result="rejected(HTTP ${status})"
              failed=$((failed + 1))
              legacy_expensive_attempts=$((legacy_expensive_attempts + 1))
            fi

            echo "offset=${offset} -> ${result} legacy_expensive_attempts=${legacy_expensive_attempts}"
            if [[ "$inserted" -gt 0 ]]; then
              echo "A legacy fallback article published at offset=${offset}; stopping further AI calls."
              break
            fi
            if [[ "$legacy_expensive_attempts" -ge "$LEGACY_FALLBACK_MAX_EXPENSIVE_ATTEMPTS" ]]; then
              echo "LEGACY_FALLBACK_AI_CAP_REACHED attempts=${legacy_expensive_attempts}; stopping before additional AI candidates."
              break
            fi
          done

          if [[ "$inserted" -eq 0 ]]; then
            echo "No normal article published (${failed} rejected candidate(s)); invoking reserve safety net."
            safety_status=$(curl -sS -X POST -o /tmp/safety-net.json -w '%{http_code}' \
              --max-time 95 -H 'accept: application/json' \
              'https://keeptxred.com/api/public/hooks/publishing-safety-net' || echo 000)
            cat /tmp/safety-net.json 2>/dev/null || true
            echo
            if [[ "$safety_status" != "200" ]] || ! jq -e '.ok == true' /tmp/safety-net.json >/dev/null 2>&1; then
              echo "PUBLISHING_SAFETY_NET_FAILED (HTTP ${safety_status})"
              exit 1
            fi
          fi

          echo "DAILY_NEWS_PUBLISH_SUCCESS inserted=${inserted} rejected=${failed} legacy_expensive_attempts=${legacy_expensive_attempts}"
