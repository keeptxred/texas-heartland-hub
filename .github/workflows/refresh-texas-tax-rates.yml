name: Refresh Texas tax rates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: write

concurrency:
  group: refresh-texas-tax-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install spreadsheet parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download and generate statewide rates
        run: python scripts/sync_texas_tax_rates.py

      - name: Validate county coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/data/counties.ts').read_text()
          assert 'countyCount:254' in text, 'Generated metadata does not report 254 counties'
          assert text.count('"dataSource":"Texas Comptroller PTAD"') == 254, 'Not all counties were generated'
          print('Validated all 254 counties')
          PY

      - name: Commit changed rates
        shell: bash
        run: |
          set -euo pipefail
          target='src/data/counties.ts'
          if git diff --quiet -- "$target"; then
            echo 'No tax-rate changes detected.'
            exit 0
          fi

          unexpected=$(git status --short | awk '{print $2}' | grep -vxF "$target" || true)
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing to publish unexpected files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'main advanced during generation; refusing to publish stale tax-rate data.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'chore: refresh Texas property tax rates'
          git push origin HEAD:main
