name: Refresh Texas tax rates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-texas-tax-rates
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install spreadsheet parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Download and generate statewide rates
        run: python scripts/sync_texas_tax_rates.py
      - name: Validate county coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/data/counties.ts').read_text()
          assert 'countyCount:254' in text, 'Generated metadata does not report 254 counties'
          assert text.count('"dataSource":"Texas Comptroller PTAD"') == 254, 'Not all counties were generated'
          print('Validated all 254 counties')
          PY
      - name: Publish changed rates as protected PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Refresh Texas property tax rates
          PR_BODY: Automated Texas Comptroller PTAD refresh. All 254 counties were validated before this PR was opened; protected verify still gates merge and deployment.
          COMMIT_MESSAGE: "chore: refresh Texas property tax rates"
        shell: bash
        run: |
          set -euo pipefail
          target='src/data/counties.ts'
          if git diff --quiet -- "$target"; then
            echo 'No tax-rate changes detected.'
            exit 0
          fi
          unexpected=$(git status --short | awk '{print $2}' | grep -vxF "$target" || true)
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing to publish unexpected files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh texas-tax-rates "$target"
