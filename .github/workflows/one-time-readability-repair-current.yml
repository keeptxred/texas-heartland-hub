name: One-time readability repair current

on:
  push:
    branches:
      - fix/readability-repair-current

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/readability-repair-current
      - name: Patch readability repair into current editorial pipeline
        shell: python
        run: |
          from pathlib import Path

          readability = Path('src/lib/editorial-readability.ts')
          s = readability.read_text()
          anchor = '''function normalizeGenericHeading(value: string, sectionIndex: number): string {\n  if (!isGenericHeading(value)) return value.trim();\n  return NORMALIZED_SECTION_HEADINGS[sectionIndex % NORMALIZED_SECTION_HEADINGS.length];\n}\n\nexport function validateArticleReadability'''
          insert = '''function normalizeGenericHeading(value: string, sectionIndex: number): string {\n  if (!isGenericHeading(value)) return value.trim();\n  return NORMALIZED_SECTION_HEADINGS[sectionIndex % NORMALIZED_SECTION_HEADINGS.length];\n}\n\nfunction splitSentences(value: string): string[] {\n  return value.trim().match(/[^.!?]+(?:[.!?]+[”’"']?|$)/g)?.map((sentence) => sentence.trim()).filter(Boolean) ?? [value.trim()];\n}\n\nfunction looksStructural(value: string): boolean {\n  const trimmed = value.trim();\n  return /^(?:[-*+]\\s|\\d+[.)]\\s|>\\s|#{1,6}\\s|```|<[^>]+>)/.test(trimmed);\n}\n\nfunction splitOversizedProse(value: string): string[] {\n  const trimmed = value.trim();\n  if (!trimmed || looksStructural(trimmed) || wordCount(trimmed) <= READABILITY_LIMITS.hardParagraphWords) return [trimmed];\n\n  const sentences = splitSentences(trimmed);\n  if (sentences.length < 2) return [trimmed];\n\n  const chunks: string[] = [];\n  let current: string[] = [];\n  let currentWords = 0;\n\n  for (const sentence of sentences) {\n    const sentenceWords = wordCount(sentence);\n    const exceedsTarget = current.length > 0 && currentWords + sentenceWords > READABILITY_LIMITS.warningParagraphWords;\n    const exceedsSentenceTarget = current.length >= 4;\n    if (exceedsTarget || exceedsSentenceTarget) {\n      chunks.push(current.join(" "));\n      current = [];\n      currentWords = 0;\n    }\n    current.push(sentence);\n    currentWords += sentenceWords;\n  }\n  if (current.length) chunks.push(current.join(" "));\n\n  if (chunks.length > 1 && wordCount(chunks[chunks.length - 1]) < 25) {\n    const tail = chunks.pop()!;\n    const previous = chunks[chunks.length - 1];\n    if (wordCount(previous) + wordCount(tail) <= READABILITY_LIMITS.hardParagraphWords) chunks[chunks.length - 1] = `${previous} ${tail}`;\n    else chunks.push(tail);\n  }\n  return chunks;\n}\n\nfunction repairParagraph(value: string): string[] {\n  const trimmed = value.trim();\n  if (!trimmed) return [];\n  return trimmed\n    .split(/\\n\\s*\\n/)\n    .map((part) => part.trim())\n    .filter(Boolean)\n    .flatMap(splitOversizedProse);\n}\n\n/**\n * Conservatively repairs malformed paragraph-array boundaries without rewriting\n * article wording. Headings and all non-paragraph fields are preserved.\n */\nexport function repairArticleReadability<T extends ReadabilityArticleShape>(article: T): T {\n  if (!Array.isArray(article.sections)) return article;\n  let changed = false;\n  const sections = article.sections.map((section) => {\n    const original = Array.isArray(section?.paragraphs) ? section.paragraphs : [];\n    const repaired = original.flatMap((paragraph) => repairParagraph(paragraph ?? ""));\n    const sectionChanged = repaired.length !== original.length || repaired.some((paragraph, index) => paragraph !== original[index]);\n    if (!sectionChanged) return section;\n    changed = true;\n    return { ...section, paragraphs: repaired };\n  });\n  return changed ? ({ ...article, sections } as T) : article;\n}\n\nexport function validateArticleReadability'''
          if s.count(anchor) != 1:
              raise SystemExit(f'readability insertion count={s.count(anchor)}')
          readability.write_text(s.replace(anchor, insert, 1))

          pipeline = Path('src/lib/editorial-pipeline.ts')
          p = pipeline.read_text()
          old_import = 'import { validateArticleReadability } from "./editorial-readability";'
          new_import = 'import { repairArticleReadability, validateArticleReadability } from "./editorial-readability";'
          if p.count(old_import) != 1:
              raise SystemExit(f'pipeline import count={p.count(old_import)}')
          p = p.replace(old_import, new_import, 1)

          first_old = '''  const firstValidation = validateArticle(\n    parsedFirst.article ?? {},\n    parsedFirst.brief ?? undefined,\n    sourceText,\n  );\n  if (firstValidation.ok && parsedFirst.article) {\n    return {\n      article: parsedFirst.article,'''
          first_new = '''  const firstArticle = parsedFirst.article ? repairArticleReadability(parsedFirst.article) : null;\n  const firstValidation = validateArticle(\n    firstArticle ?? {},\n    parsedFirst.brief ?? undefined,\n    sourceText,\n  );\n  if (firstValidation.ok && firstArticle) {\n    return {\n      article: firstArticle,'''
          if p.count(first_old) != 1:
              raise SystemExit(f'first integration count={p.count(first_old)}')
          p = p.replace(first_old, first_new, 1)

          second_old = '''  const secondValidation = validateArticle(\n    parsedSecond.article ?? {},\n    parsedSecond.brief ?? undefined,\n    sourceText,\n  );\n  if (secondValidation.ok && parsedSecond.article) {\n    return {\n      article: parsedSecond.article,'''
          second_new = '''  const secondArticle = parsedSecond.article ? repairArticleReadability(parsedSecond.article) : null;\n  const secondValidation = validateArticle(\n    secondArticle ?? {},\n    parsedSecond.brief ?? undefined,\n    sourceText,\n  );\n  if (secondValidation.ok && secondArticle) {\n    return {\n      article: secondArticle,'''
          if p.count(second_old) != 1:
              raise SystemExit(f'second integration count={p.count(second_old)}')
          pipeline.write_text(p.replace(second_old, second_new, 1))

          test = Path('src/lib/editorial-readability.repair.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { repairArticleReadability, validateArticleReadability } from "./editorial-readability";\n\nconst sentence = "Texas officials described the change and explained how it will affect residents across the state in the months ahead.";\n\ndescribe("repairArticleReadability", () => {\n  it("splits embedded blank-line paragraphs without changing their wording", () => {\n    const article = { sections: [{ heading: "What changed", paragraphs: ["First paragraph stays intact.\\n\\nSecond paragraph stays intact."] }] };\n    const repaired = repairArticleReadability(article);\n    expect(repaired.sections[0].paragraphs).toEqual(["First paragraph stays intact.", "Second paragraph stays intact."]);\n  });\n\n  it("splits oversized prose at sentence boundaries", () => {\n    const wall = Array.from({ length: 18 }, () => sentence).join(" ");\n    const article = { sections: [{ heading: "What changed", paragraphs: [wall] }] };\n    const repaired = repairArticleReadability(article);\n    expect(repaired.sections[0].paragraphs.length).toBeGreaterThan(1);\n    expect(repaired.sections[0].paragraphs.join(" ")).toBe(wall);\n    expect(validateArticleReadability(repaired).some((reason) => reason.includes("paragraph_too_long"))).toBe(false);\n  });\n\n  it("leaves already-readable structured articles unchanged", () => {\n    const article = { sections: [{ heading: "What changed", paragraphs: ["A concise first paragraph explains the event.", "A concise second paragraph explains what happens next."] }] };\n    expect(repairArticleReadability(article)).toBe(article);\n  });\n\n  it("does not split structural list blocks", () => {\n    const list = `- ${Array.from({ length: 170 }, () => "item").join(" ")}`;\n    const article = { sections: [{ heading: "Key points", paragraphs: [list] }] };\n    expect(repairArticleReadability(article)).toBe(article);\n  });\n});\n''')

          contract = Path('src/lib/editorial-pipeline.readability-repair-contract.test.ts')
          contract.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(new URL("./editorial-pipeline.ts", import.meta.url), "utf8");\n\ndescribe("editorial readability repair integration", () => {\n  it("repairs both generated attempts before validation and return", () => {\n    expect(source).toContain("const firstArticle = parsedFirst.article ? repairArticleReadability(parsedFirst.article) : null");\n    expect(source).toContain("const secondArticle = parsedSecond.article ? repairArticleReadability(parsedSecond.article) : null");\n    expect(source).toContain("article: firstArticle");\n    expect(source).toContain("article: secondArticle");\n  });\n});\n''')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-readability-repair-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/editorial-readability.ts src/lib/editorial-pipeline.ts src/lib/editorial-readability.repair.test.ts src/lib/editorial-pipeline.readability-repair-contract.test.ts .github/workflows/one-time-readability-repair-current.yml
          git commit -m 'Repair malformed article paragraph boundaries before validation'
          git push origin HEAD:fix/readability-repair-current
