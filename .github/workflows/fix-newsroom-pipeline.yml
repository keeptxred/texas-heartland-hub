name: Fix newsroom publishing pipeline

on:
  push:
    paths:
      - '.github/workflows/fix-newsroom-pipeline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair Viral Radar and publication timestamps
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('src/components/admin/ViralRadarPanel.tsx')
          text = panel.read_text()
          old = '''  const meetsScoreGate = (row.viral_score ?? 0) >= VIRAL_AUTO_REWRITE_MIN_SCORE;
  const meetsConfidenceGate =
    (row.classification_confidence ?? 0) >= VIRAL_AUTO_REWRITE_MIN_CONFIDENCE;
  const meetsTexasGate = (row.texas_relevance_score ?? 0) >= 40;

  return meetsScoreGate && meetsConfidenceGate && meetsTexasGate;'''
          new = '''  // Keep Viral Radar useful as a manual-review queue. The stricter score and
  // confidence thresholds belong to the Ready for Rewrite filter, not to the
  // entire panel. Pending rows still must be Texas-focused and credible.
  return (
    (row.texas_relevance_score ?? 0) >= 40 &&
    (row.source_reputation_score ?? 0) >= 55
  );'''
          if old not in text:
              raise SystemExit('Expected Viral Radar gate block not found')
          panel.write_text(text.replace(old, new))

          scorer = Path('src/lib/viral-score.ts')
          score_text = scorer.read_text()
          old_regex = r'const TEXAS_STRONG = /\btexas\b|\btexan\b|\bt\.x\.\b/i;'
          new_regex = r'const TEXAS_STRONG = /\btexas\b|\btexans?\b|\bt\.x\.\b/i;'
          if old_regex not in score_text:
              raise SystemExit('Expected TEXAS_STRONG regex not found')
          scorer.write_text(score_text.replace(old_regex, new_regex))

          ingest = Path('src/routes/api/public/hooks/ingest-feeds.ts')
          ingest_text = ingest.read_text()
          old_publish = '''  const articleRow = buildArticleRow(item, rw);
  const target = minWordsForItem(item, rw);'''
          new_publish = '''  const articleRow = buildArticleRow(item, rw);
  // published_at tracks when Keep TX Red actually publishes the rewrite. The
  // source's original date remains available in the article body and slug.
  articleRow.published_at = new Date().toISOString();
  const target = minWordsForItem(item, rw);'''
          if old_publish not in ingest_text:
              raise SystemExit('Expected single-item publish block not found')
          ingest.write_text(ingest_text.replace(old_publish, new_publish, 1))
          PY
      - name: Commit repair and remove workflow
        run: |
          rm .github/workflows/fix-newsroom-pipeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ViralRadarPanel.tsx src/lib/viral-score.ts src/routes/api/public/hooks/ingest-feeds.ts .github/workflows/fix-newsroom-pipeline.yml
          git commit -m "Restore newsroom candidates and correct publish timestamps"
          git push