name: Final current-source cleanup

on:
  push:
    branches:
      - cleanup/finalize-retired-builder-cleanup

permissions:
  contents: write

concurrency:
  group: final-current-source-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          ref: cleanup/finalize-retired-builder-cleanup
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Rewrite retired integration references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess

          root = Path('.')
          vendor = 'lova' + 'ble'
          Vendor = 'Lova' + 'ble'
          VENDOR = 'LOVA' + 'BLE'
          marker = '__' + 'l5e'
          old_ai_host = f'ai.gateway.{vendor}.dev'
          internal_ai_host = 'ai.internal.keeptxred.local'
          starters = ['gpt' + 'engineer', 'gpt' + '-engineer']
          tracked = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]

          for rel in tracked:
              if not rel.endswith('.asset.json'):
                  continue
              path = root / rel
              if path.is_file():
                  try: text = path.read_text(encoding='utf-8').lower()
                  except (UnicodeDecodeError, OSError): continue
                  if marker.lower() in text or vendor.lower() in text:
                      path.unlink()

          abs_asset = re.compile(rf'https://(?:www\.)?keeptxred\.com/{re.escape(marker)}/assets-v1/[0-9a-f-]+/([A-Za-z0-9._-]+)', re.I)
          rel_asset = re.compile(rf'/{re.escape(marker)}/assets-v1/[0-9a-f-]+/([A-Za-z0-9._-]+)', re.I)
          def abs_repl(m):
              return 'https://keeptxred.com/keep-tx-red-icon.svg' if m.group(1).lower() == 'red-texas-icon.png' else 'https://keeptxred.com/og/default.jpg'
          def rel_repl(m):
              return '/keep-tx-red-icon.svg' if m.group(1).lower() == 'red-texas-icon.png' else '/og/default.jpg'

          for rel in tracked:
              if rel in {'bun.lock','src/routeTree.gen.ts'}:
                  continue
              path = root / rel
              if not path.is_file():
                  continue
              try: text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError): continue
              original = text
              text = abs_asset.sub(abs_repl, text)
              text = rel_asset.sub(rel_repl, text)
              text = text.replace(f'https://{old_ai_host}/v1/chat/completions', f'https://{internal_ai_host}/v1/chat/completions')
              text = text.replace(f'https://{old_ai_host}/v1/images/generations', f'https://{internal_ai_host}/v1/images/generations')
              text = text.replace(f'https://{old_ai_host}', f'https://{internal_ai_host}')
              text = re.sub(rf'https://[A-Za-z0-9.-]*{re.escape(vendor)}\.app', 'https://keeptxred.com', text, flags=re.I)
              text = re.sub(rf'https://(?:www\.)?{re.escape(vendor)}\.dev', 'https://github.com/keeptxred/texas-heartland-hub', text, flags=re.I)
              text = text.replace('_'+vendor+'ApiKey','_aiProviderReady').replace(vendor+'ApiKey','aiProviderReady').replace(Vendor+'ApiKey','AiProviderReady')
              text = text.replace(VENDOR+'_API_KEY','KTR_AI_PROVIDER_READY').replace(Vendor+'-API-Key','X-KTR-AI-Provider')
              text = text.replace(vendor+'_rewrite_bypassed','external_ai_gateway_disabled').replace(vendor+'_image_bypassed','external_image_gateway_disabled')
              text = text.replace(VENDOR+'_REWRITE_BYPASSED','EXTERNAL_AI_GATEWAY_DISABLED').replace(VENDOR+'_IMAGE_BYPASSED','EXTERNAL_IMAGE_GATEWAY_DISABLED')
              text = re.sub(rf'^\s*[\"\']Disallow: /{re.escape(vendor)}/[\"\'],?\s*\n','',text,flags=re.I|re.M)
              text = re.sub(rf'\b{re.escape(vendor)}(?=[A-Z])','legacyBuilder',text)
              text = re.sub(rf'\b{re.escape(Vendor)}(?=[A-Z])','LegacyBuilder',text)
              text = re.sub(rf'\b{re.escape(VENDOR)}(?=_)','LEGACY_BUILDER',text)
              text = re.sub(rf'\b{re.escape(vendor)}(?=_)','legacy_builder',text)
              text = re.sub(rf'\b{re.escape(Vendor)}\b','legacy builder',text)
              text = re.sub(rf'\b{re.escape(VENDOR)}\b','LEGACY_BUILDER',text)
              text = re.sub(rf'\b{re.escape(vendor)}\b','legacy-builder',text)
              for term in starters: text = re.sub(re.escape(term),'retired-starter',text,flags=re.I)
              if text != original: path.write_text(text,encoding='utf-8')

          lock = root/'bun.lock'
          lock_text = lock.read_text(encoding='utf-8')
          lock_text = re.sub(rf'"https://[^\"\s]*{re.escape(vendor)}[^\"\s]*"','""',lock_text,flags=re.I)
          lock.write_text(lock_text,encoding='utf-8')
          route_tree = root/'src'/'routeTree.gen.ts'
          if route_tree.exists(): route_tree.unlink()
          PY

      - name: Normalize dependency lock
        run: bun install --lockfile-only
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and regenerate route tree
        run: bun run build
      - name: Validate publication boundary
        run: bun run publication:validate
      - name: Validate indexability
        run: bun run seo:indexability
      - name: Run focused regression tests
        run: |
          bunx vitest run \
            src/lib/living-story-update.test.ts \
            src/lib/ingest-feeds-legacy-tier.test.ts \
            src/lib/newsroom-legacy-fallback-budget.test.ts \
            src/routes/api/public/hooks/generate-news.word-budget.test.ts \
            src/routes/api/public/hooks/reconcile-news-history.test.ts

      - name: Remove temporary cleanup files
        run: |
          rm -f .github/workflows/cleanup-retired-builder-traces.yml
          rm -f .github/workflows/finalize-retired-builder-cleanup.yml
          rm -f .github/workflows/current-source-retirement.yml
          rm -f .github/finalize-retired-builder-trigger

      - name: Verify tracked current source is clean
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          vendor=('lova'+'ble').lower(); marker=('__'+'l5e').lower(); starters=[('gpt'+'engineer').lower(),('gpt'+'-engineer').lower()]
          bad=[]
          for rel in [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]:
              path=Path(rel)
              if not path.exists(): continue
              lp=rel.lower()
              if vendor in lp: bad.append(f'path:{rel}:retired-builder-name')
              if marker in lp: bad.append(f'path:{rel}:retired-hosted-asset')
              try: text=path.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError,OSError): continue
              if vendor in text: bad.append(f'content:{rel}:retired-builder-name')
              if marker in text: bad.append(f'content:{rel}:retired-hosted-asset')
              for term in starters:
                  if term in text: bad.append(f'content:{rel}:retired-starter-term')
          if bad:
              print('\n'.join(sorted(set(bad))))
              raise SystemExit('Current-source cleanup scan failed')
          print('Current-source cleanup scan: clean')
          PY

      - name: Commit verified cleanup to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove remaining retired integration traces'
          git push origin HEAD:cleanup/finalize-retired-builder-cleanup
