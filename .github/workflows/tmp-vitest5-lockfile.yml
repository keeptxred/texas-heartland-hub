name: Temporary Vitest 5 lockfile generation

on:
  push:
    branches:
      - chore/vitest-5-current-main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/vitest-5-current-main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Update Vitest and Bun lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.devDependencies.vitest = '^5.0.0';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          bun install --lockfile-only
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency metadata changes to commit."
            exit 0
          fi
          git commit -m "Upgrade Vitest to 5 with Bun lockfile"
          git push origin HEAD:chore/vitest-5-current-main
