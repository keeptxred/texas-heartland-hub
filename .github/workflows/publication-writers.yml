name: Validate Publication Writers

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/content-publication-guard.ts'
      - 'src/lib/content-quality.ts'
      - 'src/lib/ctr-loop.functions.ts'
      - 'src/lib/featured-image.functions.ts'
      - 'src/lib/gsc.ts'
      - 'src/routes/api/public/hooks/**'
      - 'src/lib/ingest-and-normalize.functions.ts'
      - 'scripts/shared/validate-publication-writers.mjs'
      - '.github/workflows/publication-writers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/content-publication-guard.ts'
      - 'src/lib/content-quality.ts'
      - 'src/lib/ctr-loop.functions.ts'
      - 'src/lib/featured-image.functions.ts'
      - 'src/lib/gsc.ts'
      - 'src/routes/api/public/hooks/**'
      - 'src/lib/ingest-and-normalize.functions.ts'
      - 'scripts/shared/validate-publication-writers.mjs'
      - '.github/workflows/publication-writers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-publication-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit article publication writers
        run: node scripts/shared/validate-publication-writers.mjs
