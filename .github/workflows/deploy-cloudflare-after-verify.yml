name: Deploy verified KeepTXRed to Cloudflare

on:
  workflow_run:
    workflows: ["Repository test and build health"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact main commit SHA that already passed Repository test and build health
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_RUNTIME_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_NAME: keeptxred-site
      PREVIEW_URL: https://keeptxred-site.freddy-coppola.workers.dev
      PRODUCTION_URL: https://keeptxred.com

    steps:
      - name: Resolve verified production revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_EVENT: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.verified_sha }}
          VERIFIED_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || 'main' }}
        run: |
          set -euo pipefail

          if [[ -z "$VERIFIED_SHA" ]]; then
            echo "::error title=Verified SHA required::Production deployment requires an exact verified SHA."
            exit 1
          fi

          if [[ "$VERIFIED_BRANCH" != "main" ]]; then
            if [[ "$DEPLOY_EVENT" == "workflow_dispatch" ]]; then
              echo "::error title=Verified branch must be main::Manual production deployment must target main."
              exit 1
            fi
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Verified workflow was not main; skipping production deployment."
            exit 0
          fi

          main_sha="$(curl --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 5 --max-time 20 \
            --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

          if [[ "$VERIFIED_SHA" != "$main_sha" ]]; then
            if [[ "$DEPLOY_EVENT" == "workflow_dispatch" ]]; then
              echo "::error title=Verified revision is stale::Current main is $main_sha, but deployment requested verified SHA $VERIFIED_SHA."
              exit 1
            fi
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Verified revision $VERIFIED_SHA is no longer current main ($main_sha); refusing stale deployment."
            exit 0
          fi

          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Verified revision is current main: $VERIFIED_SHA"

      - name: Checkout verified revision
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        if: steps.revision.outputs.deploy == 'true'
        with:
          bun-version: 1.3.14

      - name: Verify required production credentials
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_RUNTIME_AI_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Cloudflare deploy token
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          scripts_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          python3 - "$token_json" "$scripts_json" <<'PY'
          import json, sys
          token = json.loads(sys.argv[1])
          scripts = json.loads(sys.argv[2])
          if token.get("success") is not True or (token.get("result") or {}).get("status") != "active":
              raise SystemExit("Cloudflare deploy token is not active")
          if scripts.get("success") is not True:
              raise SystemExit(f"Cloudflare Workers access failed: {scripts.get('errors')!r}")
          print("Cloudflare deploy token and Workers access confirmed")
          PY

      - name: Install dependencies
        if: steps.revision.outputs.deploy == 'true'
        run: bun install --frozen-lockfile

      - name: Build and validate Worker package
        if: steps.revision.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          bun run build
          bunx wrangler deploy --dry-run

      - name: Deploy verified revision
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          python3 - "$secrets_file" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump({
                  "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
                  "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_RUNTIME_AI_TOKEN"],
                  "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              }, fh)
          PY
          bunx wrangler deploy --secrets-file "$secrets_file"

      - name: Verify workers.dev health
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --location --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
            "$PREVIEW_URL/api/public/hooks/health")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("database") != "ok" or data.get("ai_provider_ready") is not True:
              raise SystemExit(f"workers.dev health failed: {data!r}")
          print("workers.dev health passed")
          PY

      - name: Verify live payment runtime
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'rm -f "$body_file" "$header_file"' EXIT
          status="$(curl --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error \
            -H 'x-keeptxred-deployment-smoke: canonical' \
            -D "$header_file" -o "$body_file" -w '%{http_code}' \
            "$PREVIEW_URL/api/public/payments/health")"
          python3 - "$status" "$header_file" "$body_file" <<'PY'
          import json, pathlib, sys

          status, header_path, body_path = sys.argv[1:]
          headers = pathlib.Path(header_path).read_text(encoding="utf-8", errors="replace")
          body = pathlib.Path(body_path).read_text(encoding="utf-8", errors="replace")
          content_type = next(
              (
                  line.split(":", 1)[1].strip()
                  for line in headers.splitlines()
                  if line.lower().startswith("content-type:")
              ),
              "",
          )

          try:
              data = json.loads(body)
          except json.JSONDecodeError:
              print(
                  "Payment runtime diagnostics:",
                  json.dumps(
                      {
                          "http_status": status,
                          "content_type": content_type,
                          "json": False,
                          "body_bytes": len(body.encode("utf-8")),
                      },
                      sort_keys=True,
                  ),
              )
              raise SystemExit("Payment runtime endpoint did not return JSON.")

          safe = {
              "http_status": status,
              "content_type": content_type,
              "json": True,
              "status": data.get("status"),
              "bindings": data.get("bindings"),
              "stripe_api": data.get("stripe_api"),
              "stripe_webhook": data.get("stripe_webhook"),
              "printify_api": data.get("printify_api"),
              "stripe_error": data.get("stripe_error"),
              "stripe_webhook_error": data.get("stripe_webhook_error"),
              "printify_error": data.get("printify_error"),
          }
          print("Payment runtime diagnostics:", json.dumps(safe, sort_keys=True))

          bindings = data.get("bindings") or {}
          missing = sorted(name for name, present in bindings.items() if present is not True)
          failures = []
          if status != "200":
              failures.append(f"HTTP {status}")
          if data.get("status") != "ok":
              failures.append(f"status={data.get('status')!r}")
          if data.get("stripe_api") != "ok":
              failures.append(f"stripe_api={data.get('stripe_api')!r}")
          if data.get("stripe_webhook") != "ok":
              failures.append(f"stripe_webhook={data.get('stripe_webhook')!r}")
          if data.get("printify_api") != "ok":
              failures.append(f"printify_api={data.get('printify_api')!r}")
          if missing:
              failures.append(f"missing_bindings={missing!r}")
          if failures:
              raise SystemExit("Live payment runtime verification failed: " + "; ".join(failures))
          print("Live payment runtime verification passed")
          PY

      - name: Verify deployed law route ownership, H1s, and canonicals
        if: steps.revision.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ env.PREVIEW_URL }}
        run: python3 scripts/seo/verify-deployed-laws-routes.py

      - name: Verify property-tax ownership handoff on deployed Worker
        if: steps.revision.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ env.PREVIEW_URL }}
        run: python3 scripts/seo/verify-property-tax-handoff.py

      - name: Verify all TexasDefined ownership destinations
        if: steps.revision.outputs.deploy == 'true'
        run: python3 scripts/seo/verify-texasdefined-ownership-destinations.py

      - name: Verify city migration redirects on deployed Worker
        if: steps.revision.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ env.PREVIEW_URL }}
        run: python3 scripts/authority/smoke-production.py --city-migration-only

      - name: Verify deployed Worker health and production edge route
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners are intentionally challenged by the production
          # zone on dynamic/browser-facing paths. Verify the deployed Worker through
          # workers.dev, then prove the production hostname is reachable on a static
          # Cloudflare edge path without weakening the zone's protections.
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
            "$PREVIEW_URL/api/public/hooks/health")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("database") != "ok" or data.get("ai_provider_ready") is not True:
              raise SystemExit(f"Deployed Worker health failed: {data!r}")
          print("Deployed Worker database and AI health passed")
          PY
          robots_body="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
            "$PRODUCTION_URL/robots.txt")"
          if [[ -z "$robots_body" ]]; then
            echo "Production edge returned an empty robots.txt response." >&2
            exit 1
          fi
          echo "Deployed Worker health passed and production edge route is reachable"

      - name: Verify TexasDefined generated-image receiver rejects unauthenticated publishing
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receiver_url="$PREVIEW_URL/api/public/hooks/publish-texasdefined-generated-image"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          status="$(curl --retry 5 --retry-delay 2 --retry-all-errors \
            --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --request POST \
            "$receiver_url")"

          if [[ "$status" != "401" ]]; then
            echo "TexasDefined generated-image receiver returned HTTP $status instead of 401 for an unauthenticated request." >&2
            cat "$body_file" >&2 || true
            exit 1
          fi

          python3 - "$body_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          if data.get('ok') is not False or data.get('posted') is not False:
              raise SystemExit(f'Unexpected receiver security response: {data!r}')
          if data.get('error') != 'Missing GitHub Actions OIDC token':
              raise SystemExit(f'Unexpected receiver rejection reason: {data!r}')
          print('TexasDefined generated-image receiver is live and rejects unauthenticated publishing.')
          PY

      - name: Verify authority reference endpoints
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          verify_reference() {
            local url="$1"
            local kind="$2"
            local headers body
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' RETURN
            curl --retry 10 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
              -D "$headers" -o "$body" "$url"
            python3 - "$headers" "$body" "$kind" "$url" <<'PY'
          import json, re, sys
          headers_path, body_path, kind, url = sys.argv[1:]
          with open(headers_path, encoding='utf-8') as fh:
              headers = fh.read().lower()
          if 'content-type: application/json' not in headers:
              raise SystemExit(f'{kind} reference is not JSON: {headers!r}')
          if 'x-robots-tag:' not in headers or 'noindex' not in headers:
              raise SystemExit(f'{kind} reference lost noindex protection: {headers!r}')
          with open(body_path, encoding='utf-8') as fh:
              data = json.load(fh)
          if not isinstance(data, dict) or not data:
              raise SystemExit(f'{kind} reference payload is empty or not an object')
          forbidden = re.compile(r'(service.?role|supabase|database.?id|internal.?id|ingestion|editorial.?metadata)', re.I)
          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if forbidden.search(str(key)):
                          raise SystemExit(f'{kind} reference exposes forbidden field {path}.{key}')
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f'{path}[{index}]')
          walk(data)
          if kind == 'bill':
              if data.get('schemaVersion') != 1 or data.get('site') != 'Keep TX Red' or data.get('jurisdiction') != 'Texas':
                  raise SystemExit(f'Unexpected bill reference contract: {data!r}')
              if data.get('canonicalUrl') != 'https://keeptxred.com/bills/texas/89/sb/37':
                  raise SystemExit(f'Unexpected bill canonical URL: {data.get("canonicalUrl")!r}')
              official = data.get('officialBillUrl')
              if not isinstance(official, str) or 'capitol.texas.gov' not in official:
                  raise SystemExit(f'Bill reference lacks official Texas Legislature source: {official!r}')
              if not isinstance(data.get('documents'), list) or not isinstance(data.get('actions'), list):
                  raise SystemExit('Bill reference documents/actions contract is invalid')
          print(f'{kind} authority reference passed: {url}')
          PY
          }

          verify_reference "$PREVIEW_URL/elections/reference.json" election
          verify_reference "$PREVIEW_URL/bills/texas/89/sb/37/reference.json" bill

      - name: Apply guarded one-time news history reconciliation
        if: steps.revision.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          marker='.github/reconcile-news-history-once'
          if [[ ! -f "$marker" ]]; then
            echo 'No reconciliation marker present; skipping.'
            exit 0
          fi
          if [[ "$(tr -d '\r\n' < "$marker")" != 'apply-2026-08-17' ]]; then
            echo 'Unexpected reconciliation marker contents; refusing to run.' >&2
            exit 1
          fi

          endpoint="$PREVIEW_URL/api/public/hooks/reconcile-news-history?days=30&limit=5000"
          dry_file="$(mktemp)"
          apply_file="$(mktemp)"
          pending_file="$(mktemp)"
          trap 'rm -f "$dry_file" "$apply_file" "$pending_file"' EXIT

          curl --retry 4 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
            --max-time 90 -o "$dry_file" "$endpoint"

          python3 - "$dry_file" "$pending_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          expected = {
              '2026-08-14-austin-isd-s-future-hangs-in-the-balance-ebpaee',
              '2026-08-17-texas-college-football-players-named-to-2026-ray-guy-award-watch-list',
          }
          if data.get('ok') is not True or data.get('mode') != 'dry-run':
              raise SystemExit(f'Unexpected dry-run response: {data!r}')
          for key in ('aiCalls', 'articleWrites', 'slugChanges'):
              if data.get(key) != 0:
                  raise SystemExit(f'Dry-run safety invariant failed: {key}={data.get(key)!r}')
          results = data.get('results', [])
          safe = {
              row.get('canonicalSlug')
              for row in results
              if row.get('status') == 'would_backfill' and row.get('canonicalSlug')
          }
          unexpected = safe - expected
          if unexpected:
              raise SystemExit(f'Unexpected new reconciliation candidates; refusing apply: {sorted(unexpected)!r}')
          degraded = [
              (row.get('canonicalSlug'), row.get('status'), row.get('reason'))
              for row in results
              if row.get('canonicalSlug') in expected
              and row.get('status') not in {'would_backfill'}
              and (str(row.get('status', '')).startswith('hold') or str(row.get('status', '')).startswith('failed'))
          ]
          if degraded:
              raise SystemExit(f'Expected reconciliation candidate degraded into hold/failure: {degraded!r}')
          with open(sys.argv[2], 'w', encoding='utf-8') as fh:
              json.dump(sorted(safe), fh)
          completed = expected - safe
          print(f'Pending verified reconciliation candidates: {sorted(safe)!r}')
          print(f'Expected candidates already complete/absent: {sorted(completed)!r}')
          PY

          if [[ "$(cat "$pending_file")" == '[]' ]]; then
            echo 'Verified one-time reconciliation is already complete; no apply required.'
            exit 0
          fi

          curl --retry 4 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
            --max-time 90 -o "$apply_file" \
            -X POST \
            -H 'content-type: application/json' \
            -H "x-reconcile-service-role-key: $SUPABASE_SERVICE_ROLE_KEY" \
            --data '{}' \
            "$endpoint"

          python3 - "$apply_file" "$pending_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          with open(sys.argv[2], encoding='utf-8') as fh:
              pending = set(json.load(fh))
          backfilled = {
              row.get('canonicalSlug')
              for row in data.get('results', [])
              if row.get('status') == 'backfilled' and row.get('canonicalSlug')
          }
          if data.get('ok') is not True or data.get('mode') != 'apply':
              raise SystemExit(f'Unexpected apply response: {data!r}')
          if backfilled != pending:
              raise SystemExit(f'Unexpected backfill set. pending={sorted(pending)!r} actual={sorted(backfilled)!r}')
          for key in ('aiCalls', 'articleWrites', 'slugChanges'):
              if data.get(key) != 0:
                  raise SystemExit(f'Apply safety invariant failed: {key}={data.get(key)!r}')
          print(json.dumps({
              'scanned': data.get('scanned'),
              'planned': data.get('planned'),
              'safe': data.get('safe'),
              'held': data.get('held'),
              'holdsQueued': data.get('holdsQueued'),
              'backfilled': sorted(backfilled),
              'aiCalls': data.get('aiCalls'),
              'articleWrites': data.get('articleWrites'),
              'slugChanges': data.get('slugChanges'),
          }, indent=2))
          PY
