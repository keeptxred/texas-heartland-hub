name: Deploy verified KeepTXRed to Cloudflare

on:
  workflow_run:
    workflows: ["Repository test and build health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_RUNTIME_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_NAME: keeptxred-site
      PREVIEW_URL: https://keeptxred-site.freddy-coppola.workers.dev
      PRODUCTION_URL: https://keeptxred.com

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify required production credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_RUNTIME_AI_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Cloudflare deploy token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          scripts_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          python3 - "$token_json" "$scripts_json" <<'PY'
          import json, sys
          token = json.loads(sys.argv[1])
          scripts = json.loads(sys.argv[2])
          if token.get("success") is not True or (token.get("result") or {}).get("status") != "active":
              raise SystemExit("Cloudflare deploy token is not active")
          if scripts.get("success") is not True:
              raise SystemExit(f"Cloudflare Workers access failed: {scripts.get('errors')!r}")
          print("Cloudflare deploy token and Workers access confirmed")
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and validate Worker package
        run: |
          set -euo pipefail
          bun run build
          bunx wrangler deploy --dry-run

      - name: Deploy verified revision
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          python3 - "$secrets_file" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump({
                  "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
                  "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_RUNTIME_AI_TOKEN"],
                  "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              }, fh)
          PY
          bunx wrangler deploy --secrets-file "$secrets_file"

      - name: Verify workers.dev health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
            "$PREVIEW_URL/api/public/hooks/health")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("database") != "ok" or data.get("ai_provider_ready") is not True:
              raise SystemExit(f"workers.dev health failed: {data!r}")
          print("workers.dev health passed")
          PY

      - name: Verify production health and homepage
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
            "$PRODUCTION_URL/api/public/hooks/health")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("database") != "ok" or data.get("ai_provider_ready") is not True:
              raise SystemExit(f"Production health failed: {data!r}")
          print("Production database and AI health passed")
          PY
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error \
            -o /dev/null "$PRODUCTION_URL/"
          echo "Production homepage reachable"
