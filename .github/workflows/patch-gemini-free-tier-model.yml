name: Patch Gemini Free Tier Model

on:
  push:
    branches: [agent/gemini-free-tier-model]
    paths: ['.github/workflows/patch-gemini-free-tier-model.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-free-tier-model
      - name: Force stable free-tier rewrite model
        run: |
          set -euo pipefail
          sed -i 's/: process\.env\.AI_REWRITE_MODEL || "gemini-3\.5-flash";/: "gemini-2.5-flash-lite";/' src/server.ts
          sed -i 's/rewrite_model: ready ? (process\.env\.AI_REWRITE_MODEL || "gemini-3\.5-flash") : null,/rewrite_model: ready ? "gemini-2.5-flash-lite" : null,/' src/routes/api/public/hooks/health.ts
          sed -i 's/Google Gemini direct (${process\.env\.AI_REWRITE_MODEL || "gemini-3\.5-flash"})/Google Gemini direct (gemini-2.5-flash-lite)/' src/server.ts
          grep -q 'gemini-2.5-flash-lite' src/server.ts
          grep -q 'rewrite_model: ready ? "gemini-2.5-flash-lite" : null' src/routes/api/public/hooks/health.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/routes/api/public/hooks/health.ts
          git rm .github/workflows/patch-gemini-free-tier-model.yml
          git commit -m "Use Gemini 2.5 Flash-Lite for free-tier rewrites"
          git push origin HEAD:agent/gemini-free-tier-model
