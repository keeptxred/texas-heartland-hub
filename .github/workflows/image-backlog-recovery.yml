name: KeepTXRed Image Backlog Recovery

on:
  workflow_dispatch:
  # Protected-main merges are performed by repository automation, so a marker
  # commit may not emit a second push-triggered workflow. Listen to the required
  # repository verification as a fallback, but execute only for an explicit
  # [run-image-backlog] sentinel in the verified commit message.
  workflow_run:
    workflows: ["Repository test and build health"]
    types: [completed]
    branches: [main]
  # Keep background image repair inside the Workers AI free-neuron budget.
  # This pass is staggered from both the newsroom publisher and AdSense image
  # recovery so a persistent failure cannot trigger an unbounded retry storm.
  schedule:
    - cron: '45 2,10,18 * * *'
  # The marker path provides an explicit, bounded production-repair mechanism.
  # A marker push must name one to four exact slugs so an emergency repair can
  # never spend the bounded batch on unrelated newer backlog rows.
  push:
    branches: [main]
    paths:
      - '.github/force-image-backlog-recovery'

permissions:
  contents: read
  id-token: write

# Share the production image-recovery lock with the recurring AdSense image
# job so two workflows never regenerate the same article concurrently.
concurrency:
  group: adsense-image-readiness-backfill
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[run-image-backlog]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recover missing and legacy article images pending-first
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-newsroom"
          issue_oidc_token() {
            local token
            token=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$oidc_url" | jq -r '.value // empty')
            if [[ -z "$token" ]]; then
              echo 'GitHub Actions did not issue the newsroom OIDC token.' >&2
              return 1
            fi
            printf '%s' "$token"
          }

          endpoint='https://keeptxred-site.freddy-coppola.workers.dev/api/public/hooks/image-backlog-recovery'
          ready=-1
          for attempt in $(seq 1 8); do
            oidc_token=$(issue_oidc_token)
            status=$(curl -sS -X POST -o /tmp/image-backlog-dry.json -w '%{http_code}' \
              --max-time 45 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${endpoint}?dry=1" || echo 000)
            echo "worker endpoint probe ${attempt}/8 HTTP ${status}"
            cat /tmp/image-backlog-dry.json 2>/dev/null || true
            echo
            if [[ "$status" == "200" ]] && jq -e '.ok == true and .dryRun == true' /tmp/image-backlog-dry.json >/dev/null 2>&1; then
              ready=$(jq -r '.ready // 0' /tmp/image-backlog-dry.json)
              break
            fi
            sleep 15
          done

          if [[ "$ready" -lt 0 ]]; then
            echo 'Direct Worker image backlog endpoint never became ready.' >&2
            exit 1
          fi
          if [[ "$ready" -eq 0 ]]; then
            echo 'IMAGE_BACKLOG_RECOVERY_SUCCESS ready=0; missing/legacy quality backlog already clean.'
            exit 0
          fi

          load_exact_marker_slugs() {
            max_per_run=4
            marker_b64=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/force-image-backlog-recovery?ref=${MARKER_REF}" --jq '.content')
            printf '%s' "$marker_b64" | base64 --decode > /tmp/image-recovery-marker
            mapfile -t marker_slugs < <(sed -n 's/^slug:[[:space:]]*//p' /tmp/image-recovery-marker | sed '/^[[:space:]]*$/d' | awk '!seen[$0]++')
            if [[ "${#marker_slugs[@]}" -lt 1 ]]; then
              echo 'Force-marker repair must name at least one exact slug using slug:<value>.' >&2
              exit 1
            fi
            if [[ "${#marker_slugs[@]}" -gt "$max_per_run" ]]; then
              echo "Force-marker repair exceeds the ${max_per_run}-article safety cap." >&2
              exit 1
            fi
            slugs=("${marker_slugs[@]}")
            for slug in "${slugs[@]}"; do
              if ! jq -e --arg slug "$slug" '.slugs | index($slug) != null' /tmp/image-backlog-dry.json >/dev/null; then
                echo "Target slug is not currently eligible for image recovery: ${slug}" >&2
                exit 1
              fi
            done
          }

          # Ordinary background passes remain capped at one article, but rotate
          # across the missing-image cohort so one strict-validator hard failure
          # can never monopolize every scheduled run. Once missing images are
          # cleared, the same rotation naturally advances through legacy assets.
          max_per_run=1
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            load_exact_marker_slugs
          else
            missing=$(jq -r '.missing // 0' /tmp/image-backlog-dry.json)
            candidate_count="$ready"
            if [[ "$missing" -gt 0 ]]; then
              candidate_count="$missing"
            fi
            if [[ "$candidate_count" -lt 1 ]]; then
              echo 'No eligible image-recovery candidates remain.'
              exit 0
            fi
            rotation=$(( (GITHUB_RUN_NUMBER - 1) % candidate_count ))
            mapfile -t slugs < <(jq -r --argjson offset "$rotation" --argjson max "$max_per_run" '.slugs[$offset:($offset + $max)][]' /tmp/image-backlog-dry.json)
            echo "IMAGE_BACKLOG_RECOVERY_ROTATION candidate_count=${candidate_count} offset=${rotation} slug=${slugs[0]:-none}"
          fi

          failures=0
          succeeded=0
          processed=0

          for slug in "${slugs[@]}"; do
            # GitHub OIDC tokens are intentionally short-lived. Long image
            # generations can outlast a token, so mint a fresh token before
            # every protected Worker request instead of reusing the probe token.
            oidc_token=$(issue_oidc_token)
            encoded_slug=$(jq -rn --arg value "$slug" '$value|@uri')
            output="/tmp/image-backlog-${processed}.json"
            status=$(curl -sS -X POST -o "$output" -w '%{http_code}' \
              --max-time 600 \
              -H 'accept: application/json' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${endpoint}?slug=${encoded_slug}" || echo 000)
            echo "image slug=${slug} HTTP ${status}"
            cat "$output" 2>/dev/null || true
            echo
            processed=$((processed + 1))
            if [[ "$status" == "200" ]] && jq -e '.ok == true and .failed == 0' "$output" >/dev/null 2>&1; then
              succeeded=$((succeeded + 1))
            else
              failures=$((failures + 1))
            fi
          done

          echo "IMAGE_BACKLOG_RECOVERY_TOTAL ready_at_start=${ready} processed=${processed} succeeded=${succeeded} failures=${failures}"
          if [[ "$failures" -gt 0 ]]; then
            echo 'At least one requested image failed the existing production quality gate; retaining failures for diagnosis.' >&2
            exit 1
          fi
