name: Verify political figures in production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: keeptxred-political-figures-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://keeptxred-site.freddy-coppola.workers.dev
      PRODUCTION_URL: https://keeptxred.com

    steps:
      - name: Wait for matching verified production deployment
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in $(seq 1 90); do
            main_sha="$(curl --retry 3 --retry-delay 2 --retry-all-errors \
              --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

            if [[ "$main_sha" != "$TARGET_SHA" ]]; then
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              echo "Smoke target $TARGET_SHA was superseded by current main $main_sha; newer main will own production verification."
              exit 0
            fi

            runs_json="$(curl --retry 3 --retry-delay 2 --retry-all-errors \
              --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"

            read -r successful active matching statuses < <(python3 - "$runs_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          runs = [
              run for run in (data.get("workflow_runs") or [])
              if run.get("name") == "Deploy verified KeepTXRed to Cloudflare"
          ]
          successful = any(
              run.get("status") == "completed" and run.get("conclusion") == "success"
              for run in runs
          )
          active = any(run.get("status") in {"queued", "in_progress", "waiting", "requested", "pending"} for run in runs)
          states = ",".join(
              f'{run.get("status") or "missing"}:{run.get("conclusion") or "pending"}'
              for run in runs[:10]
          ) or "none"
          print(str(successful).lower(), str(active).lower(), len(runs), states)
          PY
            )

            if [[ "$successful" == "true" ]]; then
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              echo "Verified Cloudflare deployment completed for $TARGET_SHA."
              exit 0
            fi

            echo "Waiting for a successful Cloudflare deployment of $TARGET_SHA (attempt $attempt/90; matching=$matching; active=$active; states=$statuses)."
            sleep 10
          done

          echo "Timed out waiting for a successful verified Cloudflare deployment of $TARGET_SHA." >&2
          exit 1

      - name: Verify production hostname edge
        if: steps.gate.outputs.run_smoke == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 3 --retry-all-errors \
            --fail-with-body --silent --show-error --max-time 30 \
            -A 'KeepTXRed-production-smoke/3.0' \
            -o /tmp/keeptxred-robots.txt \
            "$PRODUCTION_URL/robots.txt"
          test -s /tmp/keeptxred-robots.txt
          echo "PASS production edge $PRODUCTION_URL/robots.txt"

      - name: Checkout verified revision
        if: steps.gate.outputs.run_smoke == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        if: steps.gate.outputs.run_smoke == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.gate.outputs.run_smoke == 'true'
        run: bun install --frozen-lockfile

      - name: Verify representative Political Figures routes in Chrome
        if: steps.gate.outputs.run_smoke == 'true'
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          cat > .political-figures-production-smoke.mjs <<'JS'
          import { chromium } from "@playwright/test";

          const preview = process.env.PREVIEW_URL ?? "https://keeptxred-site.freddy-coppola.workers.dev";
          const production = process.env.PRODUCTION_URL ?? "https://keeptxred.com";
          const profiles = [
            ["/texas-politics/figures/don-huffines-texas-comptroller-profile", "Don Huffines", "comptroller.texas.gov"],
            ["/texas-politics/figures/debra-lehrmann-texas-supreme-court-justice", "Debra Lehrmann", "txcourts.gov"],
            ["/texas-politics/figures/kevin-yeary-texas-court-criminal-appeals-judge", "Kevin Yeary", "txcourts.gov"],
            ["/texas-politics/figures/gina-parker-texas-court-criminal-appeals-judge", "Gina G. Parker", "txcourts.gov"],
            ["/texas-politics/figures/sharon-keller-texas-court-criminal-appeals-presiding-judge", "Sharon Keller", "txcourts.gov"],
          ];

          const browser = await chromium.launch({ channel: "chrome", headless: true });
          try {
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36 KeepTXRed-production-smoke/3.0",
            });

            for (const [path, expectedName, sourceDomain] of profiles) {
              const page = await context.newPage();
              const url = `${preview}${path}`;
              const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60_000 });
              if (!response || !response.ok()) {
                throw new Error(`${path}: expected deployed Worker HTTP 2xx, received ${response?.status() ?? "no response"}`);
              }

              await page.waitForLoadState("networkidle", { timeout: 15_000 }).catch(() => {});
              const title = await page.title();
              if (/just a moment|attention required|verify you are human/i.test(title)) {
                throw new Error(`${path}: deployed Worker returned a browser challenge instead of the page (title=${JSON.stringify(title)})`);
              }

              const h1 = page.locator("h1").first();
              await h1.waitFor({ state: "visible", timeout: 30_000 });
              const h1Text = ((await h1.textContent()) ?? "").replace(/\s+/g, " ").trim();
              if (!h1Text.toLowerCase().includes(expectedName.toLowerCase())) {
                throw new Error(`${path}: unexpected H1 ${JSON.stringify(h1Text)}; expected ${JSON.stringify(expectedName)}`);
              }

              const canonical = await page.locator('link[rel="canonical"]').first().getAttribute("href");
              const expectedCanonical = `${production}${path}`;
              if (canonical !== expectedCanonical) {
                throw new Error(`${path}: canonical ${JSON.stringify(canonical)} != ${JSON.stringify(expectedCanonical)}`);
              }

              const robots = ((await page.locator('meta[name="robots"]').first().getAttribute("content").catch(() => null)) ?? "").toLowerCase();
              const xRobots = (response.headers()["x-robots-tag"] ?? "").toLowerCase();
              if (robots.includes("noindex") || xRobots.includes("noindex")) {
                throw new Error(`${path}: unexpectedly noindexed (meta=${JSON.stringify(robots)}, header=${JSON.stringify(xRobots)})`);
              }

              const officialLinks = await page.locator(`a[href*="${sourceDomain}"]`).count();
              if (officialLinks < 1) {
                throw new Error(`${path}: missing rendered official source link for ${sourceDomain}`);
              }

              console.log(`PASS ${path} | WorkerHTTP=${response.status()} | H1=${JSON.stringify(h1Text)} | canonical=${canonical} | source=${sourceDomain}`);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          JS
          bun .political-figures-production-smoke.mjs
          rm -f .political-figures-production-smoke.mjs
