name: Verify original political profiles production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-original-political-profiles-production.yml'
      - 'src/data/texas-political-figures.ts'
      - 'src/data/texas-political-figures-all.ts'
      - 'src/data/texas-political-figure-heroes.ts'
      - 'src/data/texas-political-figure-heroes.test.ts'
      - 'src/data/texas-political-figure-authority-sources.ts'
      - 'src/data/texas-political-figure-authority-sources.test.ts'
      - 'src/routes/texas-politics.figures_.$figureSlug.tsx'
      - 'src/routes/sitemap-political-figures[.]xml.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-original-political-profiles-production.yml'
      - 'src/data/texas-political-figures.ts'
      - 'src/data/texas-political-figures-all.ts'
      - 'src/data/texas-political-figure-heroes.ts'
      - 'src/data/texas-political-figure-heroes.test.ts'
      - 'src/data/texas-political-figure-authority-sources.ts'
      - 'src/data/texas-political-figure-authority-sources.test.ts'
      - 'src/routes/texas-politics.figures_.$figureSlug.tsx'
      - 'src/routes/sitemap-political-figures[.]xml.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-political-profile-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile-contract:
    name: Validate political profile contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate canonical registry, sources, and rights-vetted heroes
        run: npx vitest run src/data/texas-political-figures-all.test.ts src/data/texas-political-figure-authority-sources.test.ts src/data/texas-political-figure-heroes.test.ts

  verify-production:
    name: Verify original 10 political profiles on keeptxred.com
    if: github.event_name != 'pull_request'
    needs: validate-profile-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require live canonical profile pages, schema, sources, heroes, and sitemap discovery
        shell: bash
        run: |
          set -euo pipefail

          slugs=(
            ronald-reagan-texas-conservative-legacy
            george-hw-bush-texas-political-life
            george-w-bush-texas-governor-president
            ted-cruz-texas-senator-profile
            john-cornyn-texas-senator-profile
            greg-abbott-texas-governor-profile
            dan-patrick-texas-lieutenant-governor-profile
            ken-paxton-texas-attorney-general-profile
            phil-gramm-texas-senator-fiscal-conservative
            rick-perry-texas-governor-energy-legacy
          )

          verify_page() {
            local slug="$1"
            local url="https://keeptxred.com/texas-politics/figures/$slug"
            local html="/tmp/political-profile-$slug.html"
            local code hero image_result image_code image_type

            code=$(curl -A 'Mozilla/5.0 KeepTXRedProductionVerifier/1.0' -L -sS -o "$html" -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [[ "$code" != "200" ]]; then
              echo "WAIT page=$code $url"
              return 1
            fi

            if grep -Eqi 'page not found|404[^0-9].*not found|not available' "$html"; then
              echo "WAIT fallback-page $url"
              return 1
            fi

            python3 - "$html" "$url" <<'PY'
          import html as html_lib
          import re
          import sys
          from pathlib import Path

          path, expected = sys.argv[1:]
          raw = Path(path).read_text(errors='ignore')
          text = html_lib.unescape(raw)

          canonical = None
          for pattern in (
              r'<link[^>]+rel=["\x27]canonical["\x27][^>]+href=["\x27]([^"\x27]+)',
              r'<link[^>]+href=["\x27]([^"\x27]+)["\x27][^>]+rel=["\x27]canonical["\x27]',
          ):
              match = re.search(pattern, raw, re.I)
              if match:
                  canonical = html_lib.unescape(match.group(1))
                  break
          if canonical != expected:
              raise SystemExit(f'canonical mismatch: {canonical!r} != {expected!r}')

          robots_values = []
          for tag in re.findall(r'<meta[^>]+>', raw, re.I):
              if not re.search(r'name=["\x27]robots["\x27]', tag, re.I):
                  continue
              match = re.search(r'content=["\x27]([^"\x27]+)', tag, re.I)
              if match:
                  robots_values.append(match.group(1).lower())
          if not robots_values:
              raise SystemExit('robots meta missing')
          if any('noindex' in value or 'nofollow' in value for value in robots_values):
              raise SystemExit(f'blocked robots directives: {robots_values}')
          if not any('index' in value and 'follow' in value for value in robots_values):
              raise SystemExit(f'index/follow directives missing: {robots_values}')

          if not re.search(r'"@type"\s*:\s*"ProfilePage"', text):
              raise SystemExit('ProfilePage structured data missing')
          if not re.search(r'"@type"\s*:\s*"Person"', text):
              raise SystemExit('Person structured data missing')
          if 'Institutional sources and records' not in text:
              raise SystemExit('visible institutional source section missing')
          PY

            hero=$(python3 - "$html" <<'PY'
          import html as html_lib
          import re
          import sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(errors='ignore')
          for pattern in (
              r'<meta[^>]+property=["\x27]og:image["\x27][^>]+content=["\x27]([^"\x27]+)',
              r'<meta[^>]+content=["\x27]([^"\x27]+)["\x27][^>]+property=["\x27]og:image["\x27]',
          ):
              match = re.search(pattern, raw, re.I)
              if match:
                  print(html_lib.unescape(match.group(1)))
                  break
          PY
          )
            if [[ -z "$hero" ]]; then
              echo "WAIT hero-metadata $url"
              return 1
            fi
            if [[ "$hero" == /* ]]; then hero="https://keeptxred.com$hero"; fi

            image_result=$(curl -A 'Mozilla/5.0 KeepTXRedProductionVerifier/1.0' -L -sS -o /dev/null -w '%{http_code}\t%{content_type}' --max-time 30 "$hero" || printf '000\t')
            IFS=$'\t' read -r image_code image_type <<< "$image_result"
            if [[ "$image_code" != "200" || ! "$image_type" =~ ^image/ ]]; then
              echo "WAIT hero=$image_code mime=$image_type $hero ($url)"
              return 1
            fi

            echo "PASS page=200 canonical=indexable schema=ProfilePage+Person sources=visible hero=200 $url"
          }

          for attempt in $(seq 1 10); do
            sitemap=/tmp/political-figures-sitemap.xml
            sitemap_code=$(curl -A 'Mozilla/5.0 KeepTXRedProductionVerifier/1.0' -L -sS -o "$sitemap" -w '%{http_code}' --max-time 30 https://keeptxred.com/sitemap-political-figures.xml || echo 000)
            failures=0

            for slug in "${slugs[@]}"; do
              url="https://keeptxred.com/texas-politics/figures/$slug"
              if [[ "$sitemap_code" != "200" ]] || ! grep -Fq "$url" "$sitemap"; then
                echo "WAIT sitemap=$sitemap_code missing=$url"
                failures=$((failures + 1))
                continue
              fi
              if ! verify_page "$slug"; then failures=$((failures + 1)); fi
            done

            if [[ "$failures" -eq 0 ]]; then
              echo "All original 10 political profiles are live, canonical, indexable, sourced, image-backed, structured, and discoverable in the dedicated sitemap."
              exit 0
            fi

            echo "Production is not ready for $failures profile check(s); attempt $attempt/10."
            if [[ "$attempt" -lt 10 ]]; then sleep 30; fi
          done

          echo "Original political-profile production verification failed after the deployment propagation window."
          exit 1
