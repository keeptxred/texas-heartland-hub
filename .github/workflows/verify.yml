name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Routes and TypeScript
        run: npm run typecheck
      - name: SEO and indexability
        run: npm run seo:validate
      - name: Shared platform
        run: npm run shared:validate
      - name: Shared entities
        run: npm run shared:entities:validate
      - name: Publication boundaries
        run: npm run publication:validate
      - name: Elections
        run: npm run elections:validate
      - name: Legislature
        run: npm run legislature:validate
