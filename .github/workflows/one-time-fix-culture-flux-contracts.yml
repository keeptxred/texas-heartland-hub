name: One-time fix culture FLUX contract tests

on:
  push:
    branches:
      - fix/culture-flux-image-model

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/culture-flux-image-model
      - name: Preserve existing image contract assertions with model-aware calls
        shell: python
        run: |
          from pathlib import Path

          cf = Path('src/lib/featured-image-cloudflare.ts')
          s = cf.read_text()
          # Keep the existing source-contract assertion explicit while retaining one shared random seed.
          if s.count('        seed,') != 2:
              raise SystemExit(f'unexpected shorthand seed count={s.count("        seed,")}')
          cf.write_text(s.replace('        seed,', '        seed: seed,'))

          test = Path('src/lib/multisource-image-grounding.integration.test.ts')
          t = test.read_text()
          old = 'const generationIndex = source.indexOf("generateImageBytes(prompt, negativePrompt)");'
          new = 'const generationIndex = source.indexOf("generateImageBytes(prompt, negativePrompt");'
          if t.count(old) != 1:
              raise SystemExit(f'multisource contract match count={t.count(old)}')
          test.write_text(t.replace(old, new, 1))
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-fix-culture-flux-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/featured-image-cloudflare.ts src/lib/multisource-image-grounding.integration.test.ts .github/workflows/one-time-fix-culture-flux-contracts.yml
          git commit -m 'Update image contracts for culture model routing'
          git push origin HEAD:fix/culture-flux-image-model
