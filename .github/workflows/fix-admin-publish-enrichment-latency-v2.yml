name: Fix admin publish enrichment latency v2

on:
  push:
    branches:
      - fix/admin-publish-enrichment-latency-20260917

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-publish-enrichment-latency-20260917
          fetch-depth: 0
      - name: Patch source enrichment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/multi-source-publish.ts')
          s = p.read_text()
          old = '''async function enrichClusterBodies(cluster: StoryCluster, supabaseAdmin: any): Promise<StoryCluster> {
  const rows = [cluster.primary, ...cluster.members];
  const enriched: ClusterableFeedItem[] = [];

  for (const row of rows) {
    let body = (row.extracted_body ?? "").trim();
    const description = (row.description ?? "").trim();
    if (!body && wordCount(description) < 180 && /^https?:\\/\\//i.test(row.link)) {
      body = (await fetchReadableText(row.link)) ?? "";
      if (body && row.id) {
        await supabaseAdmin.from("texas_news_feed").update({ extracted_body: body }).eq("id", row.id);
      }
    }
    enriched.push({ ...row, extracted_body: body || description });
  }

  const primary = enriched[0];
  const members = cluster.members.map((member, index) => ({ ...member, ...enriched[index + 1] }));
  return { ...cluster, primary, members };
}
'''
          new = '''async function enrichClusterBodies(cluster: StoryCluster, supabaseAdmin: any): Promise<StoryCluster> {
  const rows = [cluster.primary, ...cluster.members];
  // The cluster is bounded to MAX_CLUSTER_SOURCES, so parallel enrichment is
  // safe and prevents multiple slow source fetches from stacking 10s timeouts.
  const enriched: ClusterableFeedItem[] = await Promise.all(
    rows.map(async (row) => {
      let body = (row.extracted_body ?? "").trim();
      const description = (row.description ?? "").trim();
      if (!body && wordCount(description) < 180 && /^https?:\\/\\//i.test(row.link)) {
        body = (await fetchReadableText(row.link)) ?? "";
        if (body && row.id) {
          await supabaseAdmin.from("texas_news_feed").update({ extracted_body: body }).eq("id", row.id);
        }
      }
      return { ...row, extracted_body: body || description };
    }),
  );

  const primary = enriched[0];
  const members = cluster.members.map((member, index) => ({ ...member, ...enriched[index + 1] }));
  return { ...cluster, primary, members };
}
'''
          if old not in s:
              raise SystemExit('expected enrichClusterBodies block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/multi-source-publish.ts
          git rm .github/workflows/fix-admin-publish-enrichment-latency-v2.yml
          git commit -m "Parallelize source enrichment [admin-publish-latency-fix]"
          git push origin HEAD:fix/admin-publish-enrichment-latency-20260917
