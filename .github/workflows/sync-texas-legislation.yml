name: Sync Texas legislation

on:
  workflow_dispatch:
  schedule:
    - cron: "20 14 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: texas-legislation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GitHub performs the FTP ingestion work, while database writes are proxied
      # through the deployed first-party Worker. Use the canonical KTR origin
      # directly: workers.dev permanently redirects to keeptxred.com, and Fetch
      # intentionally strips Authorization on a cross-origin redirect. Calling
      # the canonical proxy preserves the short-lived GITHUB_TOKEN together with
      # the exact run identity headers. No Supabase service-role key is stored in
      # GitHub Actions.
      SUPABASE_URL: https://keeptxred.com/api/admin/legislation-sync-proxy
      SUPABASE_SERVICE_ROLE_KEY: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify status and session contracts
        run: node --test scripts/legislature/status-normalization.check.mjs scripts/legislature/plan-sessions.check.mjs scripts/legislature/session-identity.check.mjs
      - name: Incremental legislative sync
        run: |
          sessions=$(node scripts/legislature/plan-sessions.mjs --daily)
          echo "Syncing $sessions"
          bun run legislature:sync -- --sessions="$sessions"
