name: Sync Texas legislation

on:
  workflow_dispatch:
  schedule:
    - cron: "20 14 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: texas-legislation-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GitHub performs the FTP ingestion work, while database writes are proxied
      # through the deployed first-party Worker. The production zone intentionally
      # challenges GitHub-hosted runners, so use the same workers.dev origin that
      # production deployment smoke tests already trust. The short-lived GITHUB_TOKEN
      # plus run id authenticate the exact workflow run, so no Supabase service
      # role key is stored in GitHub Actions.
      SUPABASE_URL: https://keeptxred-site.freddy-coppola.workers.dev/api/admin/legislation-sync-proxy
      SUPABASE_SERVICE_ROLE_KEY: ${{ github.token }}::${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Incremental legislative sync
        run: bun run legislature:sync -- --sessions=89R
