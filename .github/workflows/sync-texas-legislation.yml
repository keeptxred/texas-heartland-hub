name: Sync Texas legislation

# This workflow requires a GitHub Actions SUPABASE_SERVICE_ROLE_KEY secret.
# Keep it manual until that credential is configured; a daily schedule with an
# empty secret only produces guaranteed red runs and never syncs legislation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texas-legislation-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify sync credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "## Texas legislation sync not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY is missing. The scheduled trigger is intentionally disabled until it is configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Incremental legislative sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run legislature:sync -- --sessions=89R
