name: Sync Texas legislation

on:
  workflow_dispatch:
  schedule:
    - cron: "40 8 * * 1"

concurrency:
  group: texas-legislation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Incremental legislative sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run legislature:sync -- --sessions=89R
