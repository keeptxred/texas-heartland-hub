name: Election public brand normalize v2

on:
  push:
    branches:
      - fix/election-public-brand-core

permissions:
  contents: write

concurrency:
  group: election-public-brand-normalize-v2
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[election-brand-normalized-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/election-public-brand-core
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Normalize public Election Central display branding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          target_paths = set()
          for directory in [Path('src/pages/elections'), Path('src/components/elections')]:
              if directory.exists():
                  target_paths.update(p for p in directory.rglob('*.tsx') if p.is_file())
          target_paths.update(p for p in Path('src/routes').glob('elections*.tsx') if p.is_file())
          target_paths.update({
              Path('src/lib/elections/config.ts'),
              Path('src/lib/elections/pollingSources.ts'),
          })

          public_brand = re.compile(r'(?<!@)\bKeepTXRed\b(?!-)')
          changed = []
          for path in sorted(target_paths):
              if not path.exists():
                  continue
              text = path.read_text()
              normalized = public_brand.sub('Keep TX Red', text)
              if normalized != text:
                  path.write_text(normalized)
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No public Election Central display-brand strings were normalized')

          print('Normalized public branding in:')
          for path in changed:
              print(f'  {path}')

          leftovers = []
          for path in sorted(target_paths):
              if path.exists() and public_brand.search(path.read_text()):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Unnormalized public KeepTXRed tokens remain: ' + ', '.join(leftovers))
          PY

      - name: Add public-brand regression contract
        shell: bash
        run: |
          cat > src/lib/election-public-brand-contract.test.ts <<'EOF'
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import { describe, expect, it } from "vitest";

          function walkTsx(directory: string): string[] {
            const files: string[] = [];
            for (const entry of readdirSync(directory)) {
              const path = join(directory, entry);
              if (statSync(path).isDirectory()) files.push(...walkTsx(path));
              else if (path.endsWith(".tsx")) files.push(path);
            }
            return files;
          }

          const publicElectionFiles = [
            ...walkTsx(join(process.cwd(), "src/pages/elections")),
            ...walkTsx(join(process.cwd(), "src/components/elections")),
            ...readdirSync(join(process.cwd(), "src/routes"))
              .filter((name) => name.startsWith("elections") && name.endsWith(".tsx"))
              .map((name) => join(process.cwd(), "src/routes", name)),
            join(process.cwd(), "src/lib/elections/config.ts"),
            join(process.cwd(), "src/lib/elections/pollingSources.ts"),
          ];

          describe("Election Central public brand contract", () => {
            it("uses Keep TX Red on public election surfaces while preserving social handles and machine IDs", () => {
              for (const path of publicElectionFiles) {
                const source = readFileSync(path, "utf8");
                expect(source, path).not.toMatch(/(^|[^@])\bKeepTXRed\b(?!-)/m);
              }
            });
          });
          EOF

      - name: Guard exact diff scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/pages/elections/|src/components/elections/|src/routes/elections.*\.tsx$|src/lib/elections/(config|pollingSources)\.ts$|src/lib/election-public-brand-contract\.test\.ts$)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused branding and title contracts
        run: bunx vitest run src/lib/election-public-brand-contract.test.ts src/lib/election-route-title-contract.test.ts

      - name: Commit scoped public branding and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/election-public-brand-normalize-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Election Central public branding [election-brand-normalized-v2]"
          git push origin HEAD:fix/election-public-brand-core
