name: Validate Newsroom Coverage Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/viral-score.ts'
      - 'src/lib/viral-score.test.ts'
      - 'src/lib/nlp.ts'
      - 'src/components/admin/NewsCoverageGapPanel.tsx'
      - 'src/components/admin/NewsSourceHealthPanel.tsx'
      - 'src/routes/admin.coverage-gaps.tsx'
      - 'src/routes/admin.source-health.tsx'
      - 'src/routes/api/public/hooks/ingest-feeds.ts'
      - 'src/routes/api/public/newsroom-health.ts'
      - 'scripts/news/validate-coverage-contract.mjs'
      - 'supabase/migrations/*news*coverage*.sql'
      - 'supabase/migrations/*news*source*health*.sql'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/newsroom-coverage-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/viral-score.ts'
      - 'src/lib/viral-score.test.ts'
      - 'src/lib/nlp.ts'
      - 'src/components/admin/NewsCoverageGapPanel.tsx'
      - 'src/components/admin/NewsSourceHealthPanel.tsx'
      - 'src/routes/admin.coverage-gaps.tsx'
      - 'src/routes/admin.source-health.tsx'
      - 'src/routes/api/public/hooks/ingest-feeds.ts'
      - 'src/routes/api/public/newsroom-health.ts'
      - 'scripts/news/validate-coverage-contract.mjs'
      - 'supabase/migrations/*news*coverage*.sql'
      - 'supabase/migrations/*news*source*health*.sql'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/newsroom-coverage-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsroom-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-newsroom-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate source, scoring, and reporting contract
        run: bun scripts/news/validate-coverage-contract.mjs
      - name: Run coverage regression tests
        run: bunx vitest run src/lib/viral-score.test.ts
