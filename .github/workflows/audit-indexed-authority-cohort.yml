name: Audit indexed authority cohort live
on:
  workflow_dispatch:
  schedule:
    - cron: '34 13 * * 3'
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/authority/indexed-authority-inventory.json'
      - 'scripts/authority/indexed-authority-content-evidence.json'
      - 'scripts/authority/audit-indexed-authority-inventory.mjs'
      - '.github/workflows/audit-indexed-authority-cohort.yml'
permissions:
  contents: read
concurrency:
  group: indexed-authority-live-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate fixed recovery inventory
        run: node scripts/authority/audit-indexed-authority-inventory.mjs --validate
      - name: Scan current production cohort
        run: node scripts/authority/audit-indexed-authority-inventory.mjs
      - name: Retain per-URL live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-authority-live
          path: artifacts/indexed-authority-live.json
          if-no-files-found: error
          retention-days: 30
