name: Fix Facebook Linkage Regression

on:
  push:
    paths:
      - '.github/workflows/fix-facebook-linkage-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch Facebook eligibility to use resolved article linkage
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/ContentOpportunityPanel.tsx')
          text = path.read_text()

          old_main = '''                const canPostToFacebook =\n                  isDailyArticle || (!!r.internal_slug && !!status?.rewritten);'''
          new_main = '''                const resolvedArticleSlug = r.article_slug ?? r.internal_slug ?? null;\n                const resolvedArticleUrl =\n                  r.article_url ?? (resolvedArticleSlug ? `https://keeptxred.com/news/${resolvedArticleSlug}` : null);\n                const canPostToFacebook =\n                  isDailyArticle || (!!status?.rewritten && !!(resolvedArticleSlug || resolvedArticleUrl));'''
          if old_main not in text:
              raise SystemExit('main Facebook eligibility anchor not found')
          text = text.replace(old_main, new_main, 1)

          old_preview = '''                  {(previewRow.id < 0 || (!!previewRow.internal_slug && !!statuses[previewRow.id]?.rewritten)) ? ('''
          new_preview = '''                  {(previewRow.id < 0 ||\n                    (!!statuses[previewRow.id]?.rewritten &&\n                      !!(previewRow.article_slug ?? previewRow.internal_slug ?? previewRow.article_url))) ? ('''
          if old_preview not in text:
              raise SystemExit('preview Facebook eligibility anchor not found')
          text = text.replace(old_preview, new_preview, 1)

          path.write_text(text)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ContentOpportunityPanel.tsx
          git commit -m "fix(admin): restore Facebook posting for resolved articles"
          git push origin HEAD:main
