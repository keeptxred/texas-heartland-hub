name: Migrate Remaining TanStack Validators

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-remaining-tanstack-validators.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace deprecated validators
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/services/quickPublish.functions.ts
            src/services/explore/duplicateMerge.functions.ts
          )
          for file in "${files[@]}"; do
            test -f "$file"
            sed -i 's/\.inputValidator(/.validator(/g' "$file"
            if grep -F '.inputValidator(' "$file"; then
              echo "Deprecated validator remains in $file" >&2
              exit 1
            fi
          done
          git diff --check
          if git diff --quiet -- "${files[@]}"; then
            echo "No validator migrations were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "chore(tanstack): migrate remaining server validators"
          git push origin HEAD:main
