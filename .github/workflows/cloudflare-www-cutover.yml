name: One-time KeepTXRed Cloudflare www cutover

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-www-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_FALLBACK_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      WORKER_NAME: keeptxred-site
      APEX_HOSTNAME: keeptxred.com
      WWW_HOSTNAME: www.keeptxred.com
      PRODUCTION_ZONE_NAME: keeptxred.com

    steps:
      - name: Verify apex production before touching www DNS
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error \
            "https://$APEX_HOSTNAME/api/public/hooks/health")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("database") != "ok" or data.get("ai_provider_ready") is not True:
              raise SystemExit(f"Apex production is not healthy: {data!r}")
          print("Apex production healthy: database=ok, ai_provider_ready=true")
          PY

      - name: Preflight permissions and safely cut over www
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "::error title=Missing Cloudflare account ID::www DNS was not touched."; exit 1; }
          [[ -n "${CLOUDFLARE_DEPLOY_TOKEN:-}" ]] || { echo "::error title=Missing Cloudflare deploy token::www DNS was not touched."; exit 1; }

          tokens=("$CLOUDFLARE_DEPLOY_TOKEN")
          token_names=("deploy token")
          if [[ -n "${CLOUDFLARE_FALLBACK_TOKEN:-}" && "$CLOUDFLARE_FALLBACK_TOKEN" != "$CLOUDFLARE_DEPLOY_TOKEN" ]]; then
            tokens+=("$CLOUDFLARE_FALLBACK_TOKEN")
            token_names+=("fallback token")
          fi

          zone_id="${CLOUDFLARE_ZONE_ID:-}"
          if [[ -z "$zone_id" ]]; then
            for i in "${!tokens[@]}"; do
              zone_file="$workdir/zone-$i.json"
              set +e
              zone_http="$(curl --silent --show-error -o "$zone_file" -w '%{http_code}' \
                -H "Authorization: Bearer ${tokens[$i]}" \
                --get --data-urlencode "name=$PRODUCTION_ZONE_NAME" \
                --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
                "$api/zones")"
              zone_curl=$?
              set -e
              if [[ "$zone_curl" -eq 0 && "$zone_http" -lt 400 ]]; then
                candidate="$(python3 - "$zone_file" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [z for z in (data.get("result") or []) if z.get("name") == os.environ["PRODUCTION_ZONE_NAME"] and (z.get("account") or {}).get("id") == os.environ["CLOUDFLARE_ACCOUNT_ID"] and z.get("status") == "active"]
          print(matches[0]["id"] if len(matches) == 1 else "")
          PY
                )"
                if [[ -n "$candidate" ]]; then
                  zone_id="$candidate"
                  echo "Zone lookup access confirmed with ${token_names[$i]}."
                  break
                fi
              fi
            done
          fi
          [[ -n "$zone_id" ]] || { echo "::error title=Cloudflare Zone Read permission required::www DNS was not touched."; exit 1; }

          DNS_TOKEN=""
          DNS_SOURCE=""
          records_file="$workdir/records.json"
          for i in "${!tokens[@]}"; do
            set +e
            records_http="$(curl --silent --show-error -o "$records_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${tokens[$i]}" \
              --get --data-urlencode "name=$WWW_HOSTNAME" --data-urlencode "per_page=100" \
              "$api/zones/$zone_id/dns_records")"
            records_curl=$?
            set -e
            if [[ "$records_curl" -eq 0 && "$records_http" -lt 400 ]]; then
              DNS_TOKEN="${tokens[$i]}"
              DNS_SOURCE="${token_names[$i]}"
              break
            fi
          done
          [[ -n "$DNS_TOKEN" ]] || { echo "::error title=Cloudflare DNS permission required::www DNS was not touched."; exit 1; }
          echo "DNS access confirmed with $DNS_SOURCE."

          WORKER_TOKEN=""
          WORKER_SOURCE=""
          domains_file="$workdir/domains.json"
          for i in "${!tokens[@]}"; do
            set +e
            domains_http="$(curl --silent --show-error -o "$domains_file" -w '%{http_code}' \
              -H "Authorization: Bearer ${tokens[$i]}" \
              --get --data-urlencode "hostname=$WWW_HOSTNAME" \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            domains_curl=$?
            set -e
            if [[ "$domains_curl" -eq 0 && "$domains_http" -lt 400 ]]; then
              WORKER_TOKEN="${tokens[$i]}"
              WORKER_SOURCE="${token_names[$i]}"
              break
            fi
          done
          [[ -n "$WORKER_TOKEN" ]] || { echo "::error title=Cloudflare Workers Scripts permission required::www DNS was not touched."; exit 1; }
          echo "Worker Custom Domain access confirmed with $WORKER_SOURCE."

          existing_domain="$(python3 - "$domains_file" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          host = os.environ["WWW_HOSTNAME"].lower()
          matches = [d for d in (data.get("result") or []) if str(d.get("hostname") or "").lower() == host]
          if len(matches) > 1:
              raise SystemExit(f"Multiple Worker domains found for {host}: {matches!r}")
          if not matches:
              print("")
          else:
              d = matches[0]
              print(f"{d.get('id','')}|{d.get('service','')}")
          PY
          )"

          verify_www() {
            local headers code curl_status location health health_status ok
            for attempt in $(seq 1 60); do
              headers="$workdir/www-headers.txt"
              : > "$headers"
              set +e
              code="$(curl --connect-timeout 8 --max-time 15 --silent --show-error \
                --output /dev/null --dump-header "$headers" --max-redirs 0 \
                --write-out '%{http_code}' "https://$WWW_HOSTNAME/")"
              curl_status=$?
              set -e
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$headers" | tail -1)"
              if [[ "$curl_status" -eq 0 && "$code" == "301" && "$location" == "https://$APEX_HOSTNAME/" ]]; then
                set +e
                health="$(curl --connect-timeout 8 --max-time 20 --location --fail-with-body --silent --show-error \
                  "https://$WWW_HOSTNAME/api/public/hooks/health" 2>/dev/null)"
                health_status=$?
                set -e
                if [[ "$health_status" -eq 0 ]]; then
                  ok="$(python3 - "$health" <<'PY'
          import json, sys
          try:
              d = json.loads(sys.argv[1])
              good = d.get("database") == "ok" and d.get("ai_provider_ready") is True
          except Exception:
              good = False
          print("true" if good else "false")
          PY
                  )"
                  [[ "$ok" == "true" ]] && return 0
                fi
              fi
              sleep 5
            done
            return 1
          }

          if [[ -n "$existing_domain" ]]; then
            existing_service="${existing_domain#*|}"
            if [[ "$existing_service" != "$WORKER_NAME" ]]; then
              echo "::error title=Unexpected existing www Worker domain::$WWW_HOSTNAME is attached to '$existing_service', not '$WORKER_NAME'. www DNS was not touched."
              exit 1
            fi
            echo "$WWW_HOSTNAME is already attached to $WORKER_NAME; verifying canonical redirect."
            if verify_www; then
              echo "www redirect and production health passed."
              exit 0
            fi
            echo "::error title=Existing www Worker domain unhealthy::Canonical redirect verification failed. www DNS was not touched."
            exit 1
          fi

          backup="$workdir/www-backup.json"
          conflict_count="$(python3 - "$records_file" "$backup" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("success") is not True:
              raise SystemExit(f"DNS lookup failed: {data.get('errors')!r}")
          host = os.environ["WWW_HOSTNAME"].rstrip(".").lower()
          records = []
          for r in data.get("result") or []:
              if str(r.get("name") or "").rstrip(".").lower() == host and r.get("type") in {"A", "AAAA", "CNAME"}:
                  records.append({
                      "id": r.get("id"), "type": r.get("type"), "name": r.get("name"),
                      "content": r.get("content"), "ttl": r.get("ttl", 1),
                      "proxied": r.get("proxied"), "comment": r.get("comment"),
                      "tags": r.get("tags") or [],
                  })
          json.dump(records, open(sys.argv[2], "w", encoding="utf-8"))
          print(len(records))
          PY
          )"
          if [[ "$conflict_count" -gt 1 ]]; then
            echo "::error title=Multiple www web records found::Found $conflict_count A/AAAA/CNAME records for $WWW_HOSTNAME. Refusing automated deletion."
            exit 1
          fi

          restore_dns() {
            local payload restore_file restore_http
            [[ "$conflict_count" -eq 1 ]] || return 0
            payload="$(python3 - "$backup" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          print(json.dumps({k: r.get(k) for k in ("type", "name", "content", "ttl", "proxied", "comment", "tags") if r.get(k) is not None}, separators=(",", ":")))
          PY
            )"
            restore_file="$workdir/restore.json"
            restore_http="$(curl --silent --show-error -o "$restore_file" -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $DNS_TOKEN" -H "Content-Type: application/json" \
              --data "$payload" "$api/zones/$zone_id/dns_records")"
            if [[ "$restore_http" -ge 400 ]]; then
              echo "::error title=www DNS rollback failed::HTTP $restore_http while restoring the previous www record."
              cat "$restore_file" >&2 || true
              return 1
            fi
            echo "Previous www DNS record restored."
          }

          if [[ "$conflict_count" -eq 1 ]]; then
            python3 - "$backup" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))[0]
          print(f"Backed up www web record: {r['type']} {r['name']} -> {r['content']} (proxied={r['proxied']})")
          PY
            record_id="$(python3 - "$backup" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))[0]["id"])
          PY
            )"
            delete_file="$workdir/delete.json"
            set +e
            delete_http="$(curl --silent --show-error -o "$delete_file" -w '%{http_code}' \
              -X DELETE -H "Authorization: Bearer $DNS_TOKEN" \
              "$api/zones/$zone_id/dns_records/$record_id")"
            delete_curl=$?
            set -e
            if [[ "$delete_curl" -ne 0 || "$delete_http" -ge 400 ]]; then
              echo "::error title=Cloudflare www DNS deletion failed::No DNS record was changed."
              cat "$delete_file" >&2 || true
              exit 1
            fi
            echo "Old www web record removed; attaching Worker Custom Domain immediately."
          else
            echo "No conflicting www A/AAAA/CNAME record exists; attaching Worker Custom Domain directly."
          fi

          domain_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"hostname": os.environ["WWW_HOSTNAME"], "service": os.environ["WORKER_NAME"], "zone_name": os.environ["PRODUCTION_ZONE_NAME"]}))
          PY
          )"
          attach_file="$workdir/attach.json"
          set +e
          attach_http="$(curl --silent --show-error -o "$attach_file" -w '%{http_code}' \
            -X PUT -H "Authorization: Bearer $WORKER_TOKEN" -H "Content-Type: application/json" \
            --data "$domain_payload" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          attach_curl=$?
          set -e

          domain_id=""
          if [[ "$attach_curl" -eq 0 && "$attach_http" -lt 400 ]]; then
            domain_id="$(python3 - "$attach_file" <<'PY'
          import json, os, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print(""); raise SystemExit
          r = data.get("result") or {}
          ok = data.get("success") is True and r.get("hostname") == os.environ["WWW_HOSTNAME"] and r.get("service") == os.environ["WORKER_NAME"]
          print((r.get("id") or "") if ok else "")
          PY
            )"
          fi
          if [[ -z "$domain_id" ]]; then
            echo "Worker Custom Domain attach failed; restoring previous www DNS if one existed."
            cat "$attach_file" >&2 || true
            restore_dns
            exit 1
          fi

          echo "www Worker Custom Domain attached. Waiting for canonical redirect and health."
          if verify_www; then
            echo "www canonical redirect and production health passed."
            exit 0
          fi

          echo "www did not become healthy in the provisioning window; rolling back."
          detach_file="$workdir/detach.json"
          detach_http="$(curl --silent --show-error -o "$detach_file" -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $WORKER_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$domain_id")"
          if [[ "$detach_http" -ge 400 ]]; then
            echo "::error title=Automatic www rollback blocked::Could not detach the unhealthy www Worker Custom Domain (HTTP $detach_http)."
            cat "$detach_file" >&2 || true
            exit 1
          fi
          restore_dns
          echo "::error title=Cloudflare www cutover rolled back::www verification failed, so the previous DNS was restored when applicable."
          exit 1
