name: Export Supabase Cold Archives to Private Storage
on:
  push:
    branches:
      - main
      - fix/supabase-free-tier-followup-20261012
    paths:
      - scripts/data/export-supabase-cold-archives.mjs
      - .github/workflows/export-supabase-cold-archives.yml
  workflow_dispatch:
  schedule:
    - cron: '33 7 * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  export:
    if: github.repository == 'keeptxred/texas-heartland-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://ftkznprjljkhymknvhye.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_COLD_MAINTENANCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'live' || (github.ref == 'refs/heads/fix/supabase-free-tier-followup-20261012' && 'canary' || 'off') }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify existing Supabase service-role credentials
        shell: bash
        run: |
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "::error::Supabase service-role secret not configured"; exit 1; }
      - run: bun install --frozen-lockfile
      - name: Export and verify private cold archives (never delete database rows)
        run: bun scripts/data/export-supabase-cold-archives.mjs
      - name: Report export result to review PR
        if: always() && github.ref == 'refs/heads/fix/supabase-free-tier-followup-20261012'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GH_REPO}/issues/2724/comments" -f body="Verified cold-archive canary/export job: ${JOB_STATUS}. See run logs for backed-up and safely retired row counts. A failed retirement transaction keeps its original rows. Run: ${RUN_URL}."

      - name: Open or resolve production maintenance failure alert
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='Shared Supabase Cold Archive Maintenance Failure'
          number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ "$STATUS" == "success" ]]; then
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$REPO" --body "Scheduled archive pipeline recovered. Verified run: $RUN_URL"
              gh issue close "$number" --repo "$REPO"
            fi
          elif [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$REPO" --body "Maintenance failed closed; no unverified archive retirement. Investigate: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$title" --body "The scheduled archive pipeline failed and did NOT certify a successful retirement. Inspect $RUN_URL. Check the private staging archive and manifest; avoid deleting unverified records."
          fi
