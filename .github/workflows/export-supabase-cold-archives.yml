name: Export Supabase Cold Archives to Private Storage
on:
  push:
    branches:
      - fix/supabase-free-tier-retention-20261011
    paths:
      - scripts/data/export-supabase-cold-archives.mjs
      - .github/workflows/export-supabase-cold-archives.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'keeptxred/texas-heartland-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: https://ftkznprjljkhymknvhye.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PostgreSQL client if required
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Validate connection prerequisites
        shell: bash
        run: |
          test -n "${SUPABASE_DB_URL}" || { echo "::error::SUPABASE_DB_URL is not configured"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "::error::Supabase service-role secret not configured"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit
      - name: Export and verify private cold archives (never delete database rows)
        run: node scripts/data/export-supabase-cold-archives.mjs
