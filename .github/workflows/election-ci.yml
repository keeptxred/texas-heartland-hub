name: Verify Election Central build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-manual-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run live-link launch QA
        env:
          ELECTION_QA_CHECK_LINKS: "true"
        run: bun run elections:qa
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Build production application
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: bun run build
      - name: Run mobile browser smoke tests (standard homepage)
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: bun run elections:test:mobile
      - name: Run mobile browser smoke tests (Election Central homepage)
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "true"
        run: bun run elections:test:mobile
