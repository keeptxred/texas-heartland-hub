name: Verify Election Central build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/components/elections/**"
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*.tsx"
      - "src/routes/sitemap-elections*.ts"
      - "src/types/elections/**"
      - "scripts/elections/**"
      - "tests/elections/**"
      - "playwright.elections.config.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/election-ci.yml"

permissions:
  contents: read

concurrency:
  group: election-central-ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Validate election records
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          bun run elections:validate 2>&1 | tee /tmp/election-ci-validate.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build production application and generate routes
        id: build
        continue-on-error: true
        shell: bash
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: |
          set +e
          set -o pipefail
          bun run build 2>&1 | tee /tmp/election-ci-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Typecheck application
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/election-ci-typecheck.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          bun run test 2>&1 | tee /tmp/election-ci-tests.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          grep -E "FAIL|failed|AssertionError|Error:|Test Files|Tests  " /tmp/election-ci-tests.log | tail -160 > /tmp/election-ci-test-failures.log || true
          exit "$status"

      - name: Run mobile browser smoke tests (standard homepage)
        id: mobile
        continue-on-error: true
        shell: bash
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: |
          set +e
          set -o pipefail
          bun run elections:test:mobile 2>&1 | tee /tmp/election-ci-mobile.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Run mobile browser smoke tests (Election Central homepage)
        id: mobile_homepage
        continue-on-error: true
        shell: bash
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "true"
        run: |
          set +e
          set -o pipefail
          bun run elections:test:mobile 2>&1 | tee /tmp/election-ci-mobile-homepage.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Create verification report
        if: always()
        shell: bash
        env:
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          TYPECHECK_EXIT_CODE: ${{ steps.typecheck.outputs.exit_code }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
          MOBILE_EXIT_CODE: ${{ steps.mobile.outputs.exit_code }}
          MOBILE_HOMEPAGE_EXIT_CODE: ${{ steps.mobile_homepage.outputs.exit_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          function compactLog(file, lineLimit = 100, characterLimit = 16000) {
            if (!fs.existsSync(file)) return null;
            const lines = fs.readFileSync(file, "utf8").trim().split(/\r?\n/);
            return lines.slice(-lineLimit).join("\n").slice(-characterLimit) || null;
          }

          const result = (code) => code === "0" ? "success" : "failure";
          const checks = {
            validation: result(process.env.VALIDATE_EXIT_CODE),
            build: result(process.env.BUILD_EXIT_CODE),
            typecheck: result(process.env.TYPECHECK_EXIT_CODE),
            tests: result(process.env.TEST_EXIT_CODE),
            mobile: result(process.env.MOBILE_EXIT_CODE),
            homepageEnabledMobile: result(process.env.MOBILE_HOMEPAGE_EXIT_CODE),
          };
          const exitCodes = {
            validation: process.env.VALIDATE_EXIT_CODE || null,
            build: process.env.BUILD_EXIT_CODE || null,
            typecheck: process.env.TYPECHECK_EXIT_CODE || null,
            tests: process.env.TEST_EXIT_CODE || null,
            mobile: process.env.MOBILE_EXIT_CODE || null,
            homepageEnabledMobile: process.env.MOBILE_HOMEPAGE_EXIT_CODE || null,
          };
          const passed = Object.values(exitCodes).every((code) => code === "0");
          const status = {
            updatedAt: new Date().toISOString(),
            conclusion: passed ? "success" : "failure",
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            triggerCommit: process.env.RUN_SHA,
            runUrl: process.env.RUN_URL,
            checks,
            exitCodes,
            validationSummary: compactLog("/tmp/election-ci-validate.log"),
            buildSummary: compactLog("/tmp/election-ci-build.log"),
            typecheckSummary: compactLog("/tmp/election-ci-typecheck.log"),
            testFailureSummary: compactLog("/tmp/election-ci-test-failures.log", 160, 20000),
            testSummary: compactLog("/tmp/election-ci-tests.log"),
            mobileSummary: compactLog("/tmp/election-ci-mobile.log", 160, 20000),
            homepageEnabledMobileSummary: compactLog("/tmp/election-ci-mobile-homepage.log", 160, 20000),
          };
          fs.writeFileSync("/tmp/election-ci-status.json", `${JSON.stringify(status, null, 2)}\n`);

          const symbol = (value) => value === "success" ? "✅" : "❌";
          const summary = [
            "## Election Central verification",
            "",
            `**Conclusion:** ${passed ? "PASS" : "FAIL"}`,
            "",
            "| Check | Result | Exit code |",
            "|---|---|---|",
            ...Object.entries(checks).map(([name, value]) => `| ${name} | ${symbol(value)} ${value} | ${exitCodes[name] ?? "missing"} |`),
            "",
            `Commit: \`${process.env.RUN_SHA}\``,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-central-verification-${{ github.run_id }}
          path: |
            /tmp/election-ci-status.json
            /tmp/election-ci-validate.log
            /tmp/election-ci-build.log
            /tmp/election-ci-typecheck.log
            /tmp/election-ci-tests.log
            /tmp/election-ci-test-failures.log
            /tmp/election-ci-mobile.log
            /tmp/election-ci-mobile-homepage.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          TYPECHECK_EXIT_CODE: ${{ steps.typecheck.outputs.exit_code }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
          MOBILE_EXIT_CODE: ${{ steps.mobile.outputs.exit_code }}
          MOBILE_HOMEPAGE_EXIT_CODE: ${{ steps.mobile_homepage.outputs.exit_code }}
        run: |
          for code in \
            "$VALIDATE_EXIT_CODE" \
            "$BUILD_EXIT_CODE" \
            "$TYPECHECK_EXIT_CODE" \
            "$TEST_EXIT_CODE" \
            "$MOBILE_EXIT_CODE" \
            "$MOBILE_HOMEPAGE_EXIT_CODE"; do
            if [[ "$code" != "0" ]]; then
              exit 1
            fi
          done
