name: Validate Governance Operations

on:
  push:
    branches: [main]
    paths:
      - 'src/shared/platform-core/**'
      - 'src/platform/governance-event-store.ts'
      - 'src/lib/content-publication-guard.ts'
      - 'src/routes/api.publication-gate.ts'
      - 'src/routes/api.governance-health.ts'
      - 'src/routes/admin/governance-health.tsx'
      - 'scripts/shared/validate-governance-operations.mjs'
      - '.github/workflows/governance-operations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/shared/platform-core/**'
      - 'src/platform/governance-event-store.ts'
      - 'src/lib/content-publication-guard.ts'
      - 'src/routes/api.publication-gate.ts'
      - 'src/routes/api.governance-health.ts'
      - 'src/routes/admin/governance-health.tsx'
      - 'scripts/shared/validate-governance-operations.mjs'
      - '.github/workflows/governance-operations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate governance operations
        run: node scripts/shared/validate-governance-operations.mjs
