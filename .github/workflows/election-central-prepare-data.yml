name: Prepare Election Central validation data

on:
  pull_request:
    paths:
      - ".github/workflows/election-central-prepare-data.yml"
      - "scripts/elections/**"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: election-central-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Capture official race import
        id: races
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm elections:import:races > election-race-import.log 2>&1
          status=$?
          cat election-race-import.log
          exit $status

      - name: Upload race import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-race-import-diagnostics
          path: election-race-import.log
          if-no-files-found: error

      - name: Stop on race import failure
        if: steps.races.outcome == 'failure'
        run: exit 1

      - name: Import authoritative candidates
        run: pnpm elections:import:candidates

      - name: Import available finance summaries
        run: pnpm elections:import:finance

      - name: Import authoritative geography
        run: pnpm elections:import:geography

      - name: Generate eligible forecast snapshots
        run: pnpm elections:forecast

      - name: Generate canonical source registry
        run: pnpm elections:sources

      - name: Validate generated data
        run: pnpm elections:validate

      - name: Run launch QA
        run: pnpm elections:qa

      - name: Commit generated validation data
        shell: bash
        run: |
          if git diff --quiet -- src/data/elections/2026; then
            echo "No generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026
          git commit -m "Populate verified 2026 election data"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
