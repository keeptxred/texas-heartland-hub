name: Vehicle handoff production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vehicle-handoff-production-smoke.yml'
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-vehicle-handoff-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_ORIGIN: https://keeptxred.com
    steps:
      - name: Verify retired vehicle routes redirect to TexasDefined
        shell: bash
        run: |
          set -euo pipefail

          verify_redirect() {
            local source_path="$1"
            local destination="$2"
            local headers body status location challenge probe expected
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' RETURN
            probe="?vehicle_smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            expected="${destination}${probe}"

            for attempt in $(seq 1 12); do
              status="$(curl --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 10 --max-time 45 --max-redirs 0 \
                --silent --show-error \
                -H 'cache-control: no-cache' \
                -H 'pragma: no-cache' \
                -D "$headers" -o "$body" -w '%{http_code}' \
                "${PRODUCTION_ORIGIN}${source_path}${probe}" || true)"
              location="$(tr -d '\r' < "$headers" | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"
              challenge="$(tr -d '\r' < "$headers" | awk 'BEGIN { IGNORECASE=1 } /^cf-mitigated:[[:space:]]*challenge/ { print "yes"; exit }')"

              if [[ "$status" == "301" && "$location" == "$expected" ]]; then
                echo "Vehicle handoff passed: $source_path -> $location"
                return 0
              fi

              echo "Waiting for $source_path: HTTP ${status:-000}, location=${location:-<missing>}, challenge=${challenge:-no}, attempt $attempt/12"
              sleep 5
            done

            echo "::error title=Vehicle handoff production smoke failed::$source_path expected HTTP 301 to $expected, got HTTP ${status:-000}, location ${location:-<missing>}, challenge=${challenge:-no}."
            cat "$headers" >&2 || true
            exit 1
          }

          verify_redirect "/vehicles/renewal" "https://texasdefined.com/texas-vehicle-registration-renewal"
          verify_redirect "/vehicles/registration-fees-taxes" "https://texasdefined.com/texas-vehicle-registration-fees-taxes"
