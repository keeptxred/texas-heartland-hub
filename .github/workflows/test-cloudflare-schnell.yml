name: Test Cloudflare Schnell

on:
  push:
    branches:
      - switch-featured-images-to-cloudflare
    paths:
      - ".github/workflows/test-cloudflare-schnell.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate one test image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error('Cloudflare repository secrets are missing');
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/ai/run/@cf/black-forest-labs/flux-1-schnell`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: 'Photorealistic editorial photograph of a Texas Hill Country ranch at golden hour, wide landscape composition, no text, no logos, no people', num_steps: 4 })
          });
          const text = await res.text();
          if (!res.ok) throw new Error(`Cloudflare ${res.status}: ${text.slice(0,500)}`);
          const json = JSON.parse(text);
          const image = json?.result?.image;
          if (!image || typeof image !== 'string' || image.length < 10000) throw new Error('Cloudflare returned no usable image payload');
          const bytes = Buffer.from(image, 'base64');
          console.log(`Schnell test succeeded: ${bytes.length} image bytes returned`);
          NODE
