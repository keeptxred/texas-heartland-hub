name: Agent align legacy evidence length

on:
  push:
    branches: [agent/facebook-hard-duplicate-guard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/facebook-hard-duplicate-guard
          fetch-depth: 0
      - name: Align legacy evidence-driven length rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/ingest-feeds-legacy.ts')
          text = path.read_text()

          old = '''// Tiered minimum word counts for ingested RSS rewrites. Short official press
          // releases (governor, SoS, Texas Register) rarely justify 2,000 words, so we
          // gate them at a lower "breaking news" floor. Analysis-friendly lifestyle /
          // business feeds get a middle tier. Evergreen articles are generated by a
          // separate pipeline and still enforce the 5,000-word rule there.
          const MIN_WORDS_BREAKING = 800;
          const MIN_WORDS_ANALYSIS = 1200;
          // Used inside the AI prompt/expansion payload as the baseline the model
          // should aim for. Individual items are gated by their tiered target below.
          const NON_EVERGREEN_MIN_MAIN_WORDS = MIN_WORDS_BREAKING;

          function minWordsForItem(it: Item, rw: Rewrite | null): number {
            const cat = (rw?.category ?? it.category ?? categoryFor(it.source)).toLowerCase();
            if (cat === "non-political" || cat === "business" || cat === "education" || cat === "sports") {
              return MIN_WORDS_ANALYSIS;
            }
            return MIN_WORDS_BREAKING;
          }
          '''
          new = '''// Evidence-driven length floors. Thin but legitimate primary-source updates
          // should become concise factual stories instead of being retried until an AI
          // pads them to an arbitrary category length. Rich packets still support deep
          // analysis. Keep these thresholds aligned with editorial-pipeline.ts.
          const MIN_WORDS_COMPACT = 650;
          const MIN_WORDS_STANDARD = 800;
          const MIN_WORDS_ANALYSIS = 1200;
          const COMPACT_SOURCE_MAX_CHARS = 4_500;
          const RICH_SOURCE_MIN_CHARS = 9_000;

          function minWordsForItem(it: Item, rw: Rewrite | null): number {
            const cat = (rw?.category ?? it.category ?? categoryFor(it.source)).toLowerCase();
            const evidenceChars = (it.description ?? "").trim().length;
            if (evidenceChars < COMPACT_SOURCE_MAX_CHARS) return MIN_WORDS_COMPACT;
            const analysisCategory = cat === "non-political" || cat === "business" || cat === "education" || cat === "sports";
            if (analysisCategory && evidenceChars >= RICH_SOURCE_MIN_CHARS) return MIN_WORDS_ANALYSIS;
            return MIN_WORDS_STANDARD;
          }
          '''
          if old not in text:
            raise SystemExit('legacy length block not found')
          text = text.replace(old, new, 1)

          old_prompt = '''- MINIMUM LENGTH: every non-evergreen article MUST be at least ${NON_EVERGREEN_MIN_MAIN_WORDS} words of original MAIN STORY PROSE across summary + analysis + sections only. Do NOT count Texas relevance, source attribution, FAQ, key takeaways, title, dek, or source lists toward this minimum. There is no upper word limit. Do not summarize briefly; expand with source-grounded context, background, stakeholders, local impact, timeline, what changes next, and reader context until the main story prose meets the minimum.'''
          new_prompt = '''- EVIDENCE-DRIVEN LENGTH: compact single-source material should produce at least about 650 words of original MAIN STORY PROSE; standard source-backed news should reach about 800; rich analysis packets may require 1,200. Do NOT count Texas relevance, source attribution, FAQ, key takeaways, title, dek, or source lists. Never pad a thin release merely to reach a category target; use only source-grounded context, chronology, stakeholders, local impact, timeline, what changes next, and reader context.'''
          if old_prompt not in text:
            raise SystemExit('legacy prompt length rule not found')
          text = text.replace(old_prompt, new_prompt, 1)

          pattern = re.compile(r'''async function expandRewrite\(\n  it: Item,\n  prior: Rewrite,\n  lovableApiKey: string,\n\): Promise<Rewrite \| null> \{.*?\n\}\n\n// One draft''', re.S)
          replacement = '''async function expandRewrite(\n  it: Item,\n  prior: Rewrite,\n  lovableApiKey: string,\n): Promise<Rewrite | null> {\n  // The shared editorial engine already performs one targeted repair. Do not\n  // spend a third paid call expanding a draft that passed evidence-driven\n  // validation; the scheduler should move to another candidate instead.\n  void it;\n  void lovableApiKey;\n  return prior;\n}\n\n// One draft'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'legacy expansion function replacement count={count}')
          path.write_text(text)

          length_path = Path('src/lib/article-length.ts')
          length_text = length_path.read_text()
          old_length = 'export const INGESTED_MIN_MAIN_WORDS = 800;'
          new_length = 'export const INGESTED_MIN_MAIN_WORDS = 650;'
          if old_length not in length_text:
            raise SystemExit('article-length ingested floor not found')
          length_path.write_text(length_text.replace(old_length, new_length, 1))
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ingest-feeds-legacy.ts src/lib/article-length.ts
          git commit -m 'Align legacy rewrites with evidence-driven length'
          git push origin HEAD:agent/facebook-hard-duplicate-guard
