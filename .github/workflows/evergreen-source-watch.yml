name: Evergreen Official Source Watch
on:
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/evergreen/check-official-sources.mjs scripts/evergreen/official-sources.json evergreen-source-results.json
      - name: Persist checks to private Supabase ledger when credentials are configured
        env:
          SUPABASE_URL: ${{ secrets.KTR_EVERGREEN_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KTR_EVERGREEN_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/evergreen/persist-source-results.mjs evergreen-source-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: evergreen-source-results
          path: evergreen-source-results.json
          retention-days: 30
