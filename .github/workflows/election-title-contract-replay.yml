name: Election title contract replay

on:
  push:
    branches:
      - fix/election-title-contract-v2

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: election-title-contract-replay
  cancel-in-progress: false

jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[title-contract-replayed]') && !contains(github.event.head_commit.message, '[title-contract-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/election-title-contract-v2
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Replay PR 2209 onto current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f title-contract-vitest-failure.txt
          gh pr diff 2209 --repo "$GITHUB_REPOSITORY" > /tmp/pr-2209.diff
          git apply --3way /tmp/pr-2209.diff

      - name: Repair regression scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/election-route-title-contract.test.ts")
          text = path.read_text()
          old = '''  it("keeps dynamic election detail title sources free of the compact legacy brand", () => {
            const dynamicRoutes = titleContractRoutes.slice(0, 5);
            for (const fileName of dynamicRoutes) {
              expect(sourceFor(fileName)).not.toContain("KeepTXRed");
            }
          });'''
          new = '''  it("keeps dynamic election detail title construction free of legacy compact-brand suffixes", () => {
            const dynamicRoutes = titleContractRoutes.slice(0, 5);
            for (const fileName of dynamicRoutes) {
              const source = sourceFor(fileName);
              expect(source).not.toContain("| KeepTXRed Election Central");
              expect(source).not.toMatch(/not found \\| KeepTXRed/i);
            }
          });'''
          if old not in text:
              raise SystemExit("expected overbroad regression block not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused Election title contract with captured failure
        shell: bash
        run: |
          set +e
          bunx vitest run src/lib/election-route-title-contract.test.ts > /tmp/title-contract-focused.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            tail -n 240 /tmp/title-contract-focused.log > title-contract-vitest-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add title-contract-vitest-failure.txt
            git commit -m "Capture Election title contract Vitest failure [title-contract-diagnostic]"
            git push origin HEAD:fix/election-title-contract-v2
            exit $status
          fi

      - name: Run full Vitest suite with captured failure
        shell: bash
        run: |
          set +e
          bun run test > /tmp/title-contract-vitest.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            tail -n 240 /tmp/title-contract-vitest.log > title-contract-vitest-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add title-contract-vitest-failure.txt
            git commit -m "Capture Election title contract full-suite failure [title-contract-diagnostic]"
            git push origin HEAD:fix/election-title-contract-v2
            exit $status
          fi

      - name: Run typecheck
        run: bun run typecheck

      - name: Commit replay and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f title-contract-vitest-failure.txt
          rm .github/workflows/election-title-contract-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce shared Election Central title contract [title-contract-replayed]"
          git push origin HEAD:fix/election-title-contract-v2
