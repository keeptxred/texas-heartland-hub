name: Diagnose existing KTR 50c live payment

on:
  pull_request:
    paths:
      - '.github/workflows/verify-existing-ktr-live-payment.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query deployed KTR Stripe event diagnostics
        shell: bash
        run: |
          set -euo pipefail
          url='https://keeptxred.com/api/public/payments/live-test?site=ktr&run=ktr-20260920-3f7a9d&diagnostics=1'
          body="$(curl --silent --show-error --fail-with-body             --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30             -H 'Accept: application/json' "$url")"
          printf '%s\n' "$body"
          LIVE_PAYMENT_JSON="$body" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["LIVE_PAYMENT_JSON"])
          assert payload.get("ok") is True, payload
          assert payload.get("found") is True, payload
          assert payload.get("paid") is True, payload
          assert payload.get("amountTotal") == 50, payload
          assert payload.get("currency") == "usd", payload

          diagnostic = payload.get("diagnostics") or {}
          summary = {
              "paid": payload.get("paid"),
              "webhook_received_marker": payload.get("webhookReceived"),
              "stripe_event_found": diagnostic.get("stripeEventFound"),
              "stripe_event_type": diagnostic.get("stripeEventType"),
              "stripe_event_pending_webhooks": diagnostic.get("stripeEventPendingWebhooks"),
              "stripe_event_livemode": diagnostic.get("stripeEventLivemode"),
              "webhook_endpoint_found": diagnostic.get("webhookEndpointFound"),
              "webhook_endpoint_status": diagnostic.get("webhookEndpointStatus"),
              "webhook_endpoint_receives_checkout_completed": diagnostic.get("webhookEndpointReceivesCheckoutCompleted"),
          }
          print("SAFE_DIAGNOSTIC=" + json.dumps(summary, sort_keys=True))
          PY
