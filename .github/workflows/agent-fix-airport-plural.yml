name: Agent fix plural transportation routing

on:
  push:
    branches: [agent/facebook-hard-duplicate-guard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/facebook-hard-duplicate-guard
          fetch-depth: 0
      - name: Fix plural transportation keywords
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/featured-image-core.ts')
          text = path.read_text()
          old = r'["transportation", /\b(highway|interstate|traffic|txdot|airport|rail|transit|bridge|road construction)\b/i],'
          new = r'["transportation", /\b(highways?|interstates?|traffic|txdot|airports?|rail|transit|bridges?|road construction)\b/i],'
          if old not in text:
            raise SystemExit('transportation keyword row not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/featured-image-core.ts
          git rm .github/workflows/agent-fix-airport-plural.yml
          git commit -m 'Fix plural transportation image routing'
          git push origin HEAD:agent/facebook-hard-duplicate-guard
