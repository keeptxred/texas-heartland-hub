name: Patch Facebook published linkage

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-facebook-published-linkage.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply linkage patch
        run: python3 scripts/patch-facebook-published-linkage.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ContentOpportunityPanel.tsx
          git commit -m "Resolve published articles for Facebook posting"
          git push origin HEAD:main
