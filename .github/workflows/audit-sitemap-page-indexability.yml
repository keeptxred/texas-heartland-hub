name: Audit sitemap page indexability

on:
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-sitemap-page-indexability.yml"
      - "scripts/ci/audit-sitemap-page-indexability.mjs"
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-sitemap-page-indexability
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check audit script syntax
        run: node --check scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Audit every submitted sitemap page
        env:
          AUDIT_CONCURRENCY: "12"
          AUDIT_RETRIES: "2"
          AUDIT_TIMEOUT_MS: "15000"
          AUDIT_OUTPUT: tmp/sitemap-page-indexability-audit.json
        run: node scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Upload sitemap indexability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-page-indexability-audit
          path: tmp/sitemap-page-indexability-audit.json
          if-no-files-found: warn
          retention-days: 14
