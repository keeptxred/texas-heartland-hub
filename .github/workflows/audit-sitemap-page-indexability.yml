# Full production crawl: weekly/manual only; never after routine deployments.
name: Audit sitemap page indexability

on:
  push:
    branches: [diagnostic/ktr-42-livecheck-20261025]
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-sitemap-page-indexability
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete-archive diagnostic branch
        uses: actions/checkout@v5
        with:
          ref: diagnostic/ktr-42-livecheck-20261025

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify seven reconstructed historical articles
        run: node --input-type=module -e "const slugs=[\"2026-07-10-texas-wrestling-coach-from-amarillo-sentenced-to-18-years-for-abuse\",\"2026-07-11-eagle-pass-officials-deny-request-for-buoy-barrier-staging-in-city-park\",\"2026-07-11-breaking-texas-officials-respond-to-supreme-court-win-for-app-age-verification\",\"2026-07-11-breaking-texas-judge-voids-2021-ballot-measure-over-misleading-debt-language\",\"2026-07-10-texas-senators-investigate-foreign-influence-in-surrogacy-industry\",\"2026-07-12-university-of-north-texas-names-critical-race-theory-scholar-as-interim-provost\",\"2026-06-30-texas-officials-respond-to-boling-isd-trustee-sentencing-in-child-exploitation-c\"];let fail=0;for(const slug of slugs){const url='https://keeptxred.com/news/'+slug;const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(18000)});const html=await r.text();const title=(new RegExp('<title[^>]*>([^<]*)</title>','i').exec(html)||[])[1]||'';const result={slug,status:r.status,type:r.headers.get('content-type'),noindex:/(?:name=\\\"robots\\\"[^>]*noindex|noindex[^>]*name=\\\"robots\\\")/i.test(html),title:title.slice(0,110)};console.log('REBUILT_HISTORICAL '+JSON.stringify(result));if(r.status!==200||!result.type?.includes('text/html')||/404|not found/i.test(title))fail++}if(fail)process.exitCode=1;"

      - name: Verify two more reports and three same-event redirects
        run: node --input-type=module -e "for(const slug of [\"live-2026-07-09-texas-community-colleges-rebound-with-new-workforce-focus-uq2vra\",\"live-2026-07-02-austin-robotics-firm-unveils-massive-facility-for-humanoid-machine-dev-90almg\",\"2026-07-12-eagle-pass-officials-deny-request-to-store-buoy-barriers-at-local-park\",\"2026-07-12-breaking-u-s-supreme-court-upholds-texas-age-verification-law-for-app-stores\",\"2026-07-12-breaking-court-voids-2021-texas-ballot-measure-that-expanded-county-debt-powers\"]){let url='https://keeptxred.com/news/'+slug;const chain=[];for(let i=0;i<4;i++){const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(16000)});chain.push({url,status:r.status});if([301,308].includes(r.status)&&r.headers.get('location')){url=new URL(r.headers.get('location'),url).href;continue;}if(r.status!==200)process.exitCode=1;break;}console.log('ARCHIVE_RECOVERY '+JSON.stringify({slug,chain}));}"

      - name: Reconcile every one of the 441 historical URLs
        run: node scripts/ci/ktr-441-final-onetime.mjs

      - name: Upload complete historical URL audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktr-historical-441-final-20261025
          path: tmp/ktr-441-final-20261025.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check audit script syntax
        run: node --check scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Audit every submitted sitemap page
        env:
          AUDIT_CONCURRENCY: "12"
          AUDIT_RETRIES: "2"
          AUDIT_TIMEOUT_MS: "15000"
          AUDIT_OUTPUT: tmp/sitemap-page-indexability-audit.json
        run: node scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Upload sitemap indexability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-page-indexability-audit
          path: tmp/sitemap-page-indexability-audit.json
          if-no-files-found: warn
          retention-days: 14
