# Full production crawl: weekly/manual only; never after routine deployments.
name: Audit sitemap page indexability

on:
  push:
    branches: [diagnostic/ktr-404-recovery-20261025]
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-sitemap-page-indexability
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify recovered 404 source URLs
        run: node --input-type=module -e "const urls=[\"2026-08-14-austin-isd-s-future-hangs-in-the-balance-ebpaee\",\"2026-08-14-texas-public-information-act-request-guide\",\"2026-08-14-texas-school-districts-show-improvement-in-tea-a-f-ratings-gbezru\",\"2026-06-28-texas-voter-registration-guide-deadlines-id-rules-and-verification\"];let bad=0;for(const slug of urls){let url='https://keeptxred.com/news/'+slug;const chain=[];for(let hop=0;hop<4;hop++){const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(13000)});chain.push({url,status:r.status,location:r.headers.get('location')});if([301,302,307,308].includes(r.status)&&r.headers.get('location')){url=new URL(r.headers.get('location'),url).href;continue;}break;}if(chain.at(-1).status!==200)bad++;console.log('RECOVERY_VERIFY '+JSON.stringify({slug,chain}));}if(bad)process.exitCode=1;"

      - name: Check audit script syntax
        run: node --check scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Audit every submitted sitemap page
        env:
          AUDIT_CONCURRENCY: "12"
          AUDIT_RETRIES: "2"
          AUDIT_TIMEOUT_MS: "15000"
          AUDIT_OUTPUT: tmp/sitemap-page-indexability-audit.json
        run: node scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Upload sitemap indexability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-page-indexability-audit
          path: tmp/sitemap-page-indexability-audit.json
          if-no-files-found: warn
          retention-days: 14
