# Full production crawl: weekly/manual only; never after routine deployments.
name: Audit sitemap page indexability

on:
  push:
    branches: [diagnostic/ktr-404-recovery-20261025]
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-sitemap-page-indexability
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: diagnostic/ktr-404-recovery-20261025

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Final 441-URL live historical reconciliation
        run: node scripts/ci/ktr-historical-final-20261025.mjs

      - name: Upload historical status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktr-historical-final-20261025
          path: tmp/historical-404-final-20261025.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check audit script syntax
        run: node --check scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Audit every submitted sitemap page
        env:
          AUDIT_CONCURRENCY: "12"
          AUDIT_RETRIES: "2"
          AUDIT_TIMEOUT_MS: "15000"
          AUDIT_OUTPUT: tmp/sitemap-page-indexability-audit.json
        run: node scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Upload sitemap indexability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-page-indexability-audit
          path: tmp/sitemap-page-indexability-audit.json
          if-no-files-found: warn
          retention-days: 14
