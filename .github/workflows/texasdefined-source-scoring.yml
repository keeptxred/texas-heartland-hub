name: Refresh TexasDefined original-source newsroom scoring

# GitHub owns the schedule. Zero AI and zero KTR article publication.
# Normalize, score and route real original publisher evidence before
# TexasDefined's four-times-daily authority-gated article publication.
on:
  schedule:
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/texasdefined-source-scoring.yml'
      - 'src/routes/api/public/hooks/score-viral.ts'
      - 'src/lib/viral-score.ts'

permissions:
  contents: read

concurrency:
  group: texasdefined-primary-source-scoring
  cancel-in-progress: false

jobs:
  score:
    if: github.repository == 'keeptxred/texas-heartland-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Refresh feed and original-source eligibility without creating articles
        shell: bash
        run: |
          set -euo pipefail
          # Never POST to an older deployed scorer. It ignores the
          # td-source-routing mode and can still create KTR articles.
          # This NEW endpoint is safe for probing: a GET cannot mutate data.
          origin="https://keeptxred-site.freddy-coppola.workers.dev"
          readiness=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 12 \
              --output /tmp/td-score-ready.json --write-out '%{http_code}' \
              "${origin}/api/public/hooks/texasdefined-source-scoring-readiness" || echo 000)"
            if [[ "$code" == 200 ]] && jq -e '.ok == true and .mode == "td-source-routing"
              and .version == "20261117-v1" and .publicationSuppressed == true' \
              /tmp/td-score-ready.json >/dev/null 2>&1; then
              readiness=1
              break
            fi
            echo "Official source scorer release not live: attempt $attempt/30 HTTP=$code"
            sleep 12
          done
          if [[ "$readiness" != 1 ]]; then
            echo "::error::The source-only scorer release is not verified live. No POST attempted."
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 660 \
            --output /tmp/td-original-scoring.json \
            --write-out '%{http_code}' --request POST \
            "${origin}/api/public/hooks/score-viral?mode=td-source-routing" || echo 000)"
          if [[ "$status" != 200 ]]; then
            echo "::error::Original source scorer returned HTTP $status; no approval override or article creation."
            cat /tmp/td-original-scoring.json 2>/dev/null || true
            exit 1
          fi
          if ! jq -e '.ok == true and .publicationSuppressed == true and .autoPublishAttempted == 0
            and .autoPublished == 0 and (.autoPublishResults | type) == "array"
            and (.autoPublishResults | length) == 0
            and .scanned >= 0 and .updated >= 0 and .updateFailures >= 0' \
            /tmp/td-original-scoring.json >/dev/null; then
            echo "::error::Original scorer response did not certify source-only operation; no publication success claimed."
            jq -c '{ok,scanned,updated,reviewFlagged,publicationSuppressed,autoPublishAttempted,autoPublished,updateFailures,error}' /tmp/td-original-scoring.json || true
            exit 1
          fi
          jq -r '["## TexasDefined first-party source scoring (zero AI publications)",
            ("Scanned: " + (.scanned|tostring)),
            ("Reclassified/updated: " + (.updated|tostring)),
            ("Editorial review holds: " + (.reviewFlagged|tostring)),
            ("Unattended KTR publish attempts: " + (.autoPublishAttempted|tostring)),
            ("Unattended KTR articles published: " + (.autoPublished|tostring))] | join("\n")' \
            /tmp/td-original-scoring.json >> "$GITHUB_STEP_SUMMARY"
          jq -c '{ok,scanned,updated,reviewFlagged,autoPublishFlagged,publicationSuppressed,autoPublishAttempted,autoPublished,updateFailures}' /tmp/td-original-scoring.json
