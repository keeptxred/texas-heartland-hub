name: One-shot deployed laws smoke current

on:
  push:
    branches:
      - diagnostic/deployed-laws-smoke-current-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact deployed laws umbrella smoke
        id: smoke
        continue-on-error: true
        env:
          SITE_URL: https://keeptxred-site.freddy-coppola.workers.dev
          DEPLOYMENT_SMOKE_REPORT: /tmp/deployed-laws-smoke-report.json
        run: python3 scripts/seo/verify-deployed-laws-routes.py
      - name: Show structured smoke report
        if: always()
        run: |
          if [ -f /tmp/deployed-laws-smoke-report.json ]; then
            cat /tmp/deployed-laws-smoke-report.json
          else
            echo 'No structured smoke report was written.'
          fi
      - name: Upload structured smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-laws-smoke-report
          path: /tmp/deployed-laws-smoke-report.json
          if-no-files-found: warn
      - name: Preserve smoke failure
        if: steps.smoke.outcome != 'success'
        run: exit 1
