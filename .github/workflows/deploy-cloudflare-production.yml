name: Deploy KeepTXRed to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-production.yml'
  workflow_dispatch:
    inputs:
      activate_custom_domain:
        description: Attach keeptxred.com only after the workers.dev preview passes health checks
        required: true
        type: boolean
        default: false
      production_hostname:
        description: Production hostname to attach when custom-domain activation is enabled
        required: true
        type: string
        default: keeptxred.com

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_RUNTIME_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_HOSTNAME: ${{ github.event_name == 'workflow_dispatch' && inputs.production_hostname || 'keeptxred.com' }}
      PRODUCTION_ZONE_NAME: keeptxred.com

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify required production credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_RUNTIME_AI_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Deployment is blocked before any Cloudflare change is attempted." >&2
          fi
          exit "$missing"

      - name: Verify Cloudflare deploy token and Workers account access
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          workers_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          python3 - "$token_json" "$workers_json" <<'PY'
          import json
          import sys

          token = json.loads(sys.argv[1])
          workers = json.loads(sys.argv[2])
          status = (token.get("result") or {}).get("status")
          if token.get("success") is not True or status != "active":
              raise SystemExit(f"Cloudflare deploy token verification failed: status={status!r}, errors={token.get('errors')!r}")
          if workers.get("success") is not True:
              raise SystemExit(f"Cloudflare Workers account access failed: errors={workers.get('errors')!r}")
          result = workers.get("result") or []
          print(f"Cloudflare deploy token active; Workers account access confirmed ({len(result)} script(s) visible).")
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production Worker
        run: |
          set -euo pipefail
          bun run lint
          bun run build
          bunx wrangler deploy --dry-run

      - name: Deploy isolated Worker preview with runtime AI credentials
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          deploy_log="$(mktemp)"
          trap 'rm -f "$secrets_file" "$deploy_log"' EXIT

          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import sys

          payload = {
              "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_RUNTIME_AI_TOKEN"],
              "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY

          set +e
          bunx wrangler deploy --secrets-file "$secrets_file" 2>&1 | tee "$deploy_log"
          deploy_status=${PIPESTATUS[0]}
          set -e

          if [[ "$deploy_status" -ne 0 ]]; then
            diagnostic="$(python3 - "$deploy_log" <<'PY'
          import os
          import re
          import sys

          with open(sys.argv[1], "r", encoding="utf-8", errors="replace") as fh:
              text = fh.read()

          for name in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_RUNTIME_AI_TOKEN"):
              secret = os.environ.get(name, "")
              if secret:
                  text = text.replace(secret, "***")

          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          lines = [ansi.sub("", line).strip() for line in text.splitlines() if line.strip()]
          interesting = [line for line in lines if re.search(r"error|permission|auth|forbidden|unauthorized|code|worker", line, re.I)]
          selected = (interesting or lines)[-12:]
          message = " | ".join(selected)[:3500]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(message or "Wrangler exited without a diagnostic message")
          PY
            )"
            echo "::error title=Cloudflare Worker upload failed::$diagnostic"
            exit "$deploy_status"
          fi

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | tail -1 || true)"
          if [[ -z "$preview_url" ]]; then
            account_subdomain_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || true)"
            account_subdomain="$(python3 - "$account_subdomain_json" <<'PY'
          import json
          import sys
          try:
              data = json.loads(sys.argv[1])
              print((data.get("result") or {}).get("subdomain") or "")
          except Exception:
              print("")
          PY
            )"
            if [[ -n "$account_subdomain" ]]; then
              preview_url="https://$WORKER_NAME.$account_subdomain.workers.dev"
            fi
          fi

          if [[ -z "$preview_url" ]]; then
            echo "Worker uploaded, but its workers.dev preview URL could not be resolved. Production was not touched." >&2
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Verify preview database and AI health
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL%/}/api/public/hooks/health"
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error "$health_url")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok": failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True: failures.append("AI provider is not ready")
          if failures: raise SystemExit("Preview health verification failed: " + "; ".join(failures))
          PY

      - name: Promote tested Worker to production custom domain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_custom_domain == true }}
        shell: bash
        run: |
          set -euo pipefail
          domain_payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "hostname": os.environ["PRODUCTION_HOSTNAME"],
              "service": os.environ["WORKER_NAME"],
              "zone_name": os.environ["PRODUCTION_ZONE_NAME"],
          }))
          PY
          )"

          domain_json="$(curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$domain_payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          echo "$domain_json"

          python3 - "$domain_json" <<'PY'
          import json
          import os
          import sys

          data = json.loads(sys.argv[1])
          result = data.get("result") or {}
          failures = []
          if data.get("success") is not True:
              failures.append(f"Cloudflare API returned errors={data.get('errors')!r}")
          if result.get("hostname") != os.environ["PRODUCTION_HOSTNAME"]:
              failures.append(f"hostname mismatch: {result.get('hostname')!r}")
          if result.get("service") != os.environ["WORKER_NAME"]:
              failures.append(f"service mismatch: {result.get('service')!r}")
          if result.get("zone_name") != os.environ["PRODUCTION_ZONE_NAME"]:
              failures.append(f"zone mismatch: {result.get('zone_name')!r}")
          if failures:
              raise SystemExit("Cloudflare production domain attachment failed: " + "; ".join(failures))
          print(f"Attached {result['hostname']} to {result['service']} in zone {result['zone_name']} after preview health passed.")
          PY

      - name: Verify production database and AI health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_custom_domain == true }}
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://$PRODUCTION_HOSTNAME/api/public/hooks/health"
          response="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error "$health_url")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok": failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True: failures.append("AI provider is not ready")
          if failures: raise SystemExit("Production health verification failed: " + "; ".join(failures))
          PY
