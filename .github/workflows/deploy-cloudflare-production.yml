name: Deploy KeepTXRed to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-production.yml'
  workflow_dispatch:
    inputs:
      activate_custom_domain:
        description: Attach keeptxred.com only after the workers.dev preview passes health checks
        required: true
        type: boolean
        default: false
      production_hostname:
        description: Production hostname to attach when custom-domain activation is enabled
        required: true
        type: string
        default: keeptxred.com

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_RUNTIME_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_HOSTNAME: ${{ github.event_name == 'workflow_dispatch' && inputs.production_hostname || 'keeptxred.com' }}
      PRODUCTION_ZONE_NAME: keeptxred.com

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify required production credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_RUNTIME_AI_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Deployment is blocked before any Cloudflare change is attempted." >&2
          fi
          exit "$missing"

      - name: Verify Cloudflare deploy token and Workers account access
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          workers_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          python3 - "$token_json" "$workers_json" <<'PY'
          import json
          import sys

          token = json.loads(sys.argv[1])
          workers = json.loads(sys.argv[2])
          status = (token.get("result") or {}).get("status")
          if token.get("success") is not True or status != "active":
              raise SystemExit(f"Cloudflare deploy token verification failed: status={status!r}, errors={token.get('errors')!r}")
          if workers.get("success") is not True:
              raise SystemExit(f"Cloudflare Workers account access failed: errors={workers.get('errors')!r}")
          result = workers.get("result") or []
          print(f"Cloudflare deploy token active; Workers account access confirmed ({len(result)} script(s) visible).")
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production Worker
        run: |
          set -euo pipefail
          bun run lint
          bun run build
          bunx wrangler deploy --dry-run

      - name: Deploy isolated Worker preview with runtime AI credentials
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          deploy_log="$(mktemp)"
          trap 'rm -f "$secrets_file" "$deploy_log"' EXIT

          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import sys

          payload = {
              "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_RUNTIME_AI_TOKEN"],
              "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY

          set +e
          bunx wrangler deploy --secrets-file "$secrets_file" 2>&1 | tee "$deploy_log"
          deploy_status=${PIPESTATUS[0]}
          set -e

          if [[ "$deploy_status" -ne 0 ]]; then
            diagnostic="$(python3 - "$deploy_log" <<'PY'
          import os
          import re
          import sys

          with open(sys.argv[1], "r", encoding="utf-8", errors="replace") as fh:
              text = fh.read()

          for name in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_RUNTIME_AI_TOKEN"):
              secret = os.environ.get(name, "")
              if secret:
                  text = text.replace(secret, "***")

          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          lines = [ansi.sub("", line).strip() for line in text.splitlines() if line.strip()]
          interesting = [line for line in lines if re.search(r"error|permission|auth|forbidden|unauthorized|code|worker", line, re.I)]
          selected = (interesting or lines)[-12:]
          message = " | ".join(selected)[:3500]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(message or "Wrangler exited without a diagnostic message")
          PY
            )"
            echo "::error title=Cloudflare Worker upload failed::$diagnostic"
            exit "$deploy_status"
          fi

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | tail -1 || true)"
          if [[ -z "$preview_url" ]]; then
            account_subdomain_json="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || true)"
            account_subdomain="$(python3 - "$account_subdomain_json" <<'PY'
          import json
          import sys
          try:
              data = json.loads(sys.argv[1])
              print((data.get("result") or {}).get("subdomain") or "")
          except Exception:
              print("")
          PY
            )"
            if [[ -n "$account_subdomain" ]]; then
              preview_url="https://$WORKER_NAME.$account_subdomain.workers.dev"
            fi
          fi

          if [[ -z "$preview_url" ]]; then
            echo "Worker uploaded, but its workers.dev preview URL could not be resolved. Production was not touched." >&2
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Verify preview database and AI health
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL%/}/api/public/hooks/health"
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error "$health_url")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok": failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True: failures.append("AI provider is not ready")
          if failures: raise SystemExit("Preview health verification failed: " + "; ".join(failures))
          PY

      - name: Verify preview GEO content before production promotion
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          election_body="$(mktemp)"
          home_body="$(mktemp)"
          trap 'rm -f "$election_body" "$home_body"' EXIT

          curl --retry 20 --retry-delay 3 --retry-all-errors \
            --fail-with-body --silent --show-error \
            "${PREVIEW_URL%/}/elections/2026" -o "$election_body"
          curl --retry 20 --retry-delay 3 --retry-all-errors \
            --fail-with-body --silent --show-error \
            "${PREVIEW_URL%/}/" -o "$home_body"

          python3 - "$election_body" "$home_body" <<'PY'
          import pathlib
          import re
          import sys

          election = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          home = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")

          strong_h1 = "2026 Texas Election Central: Races, Candidates, Polls & Results"
          if strong_h1 not in election:
              h1s = re.findall(r"<h1\b[^>]*>(.*?)</h1>", election, flags=re.I | re.S)
              simplified = [re.sub(r"<[^>]+>", "", value).strip() for value in h1s]
              raise SystemExit(f"Preview election HTML is missing the strengthened H1; observed h1={simplified!r}")

          for marker in ('"Organization"', '"NewsMediaOrganization"'):
              if marker not in election:
                  raise SystemExit(f"Preview election HTML is missing JSON-LD marker {marker}")

          if '"FAQPage"' not in home:
              raise SystemExit("Preview home HTML is missing FAQPage JSON-LD")

          print("Preview GEO gate passed: strengthened election H1, Organization/NewsMediaOrganization JSON-LD, and home FAQPage JSON-LD are present before production promotion.")
          PY

      - name: Promote tested Worker to production custom domain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_custom_domain == true }}
        shell: bash
        run: |
          set -euo pipefail
          domain_payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "hostname": os.environ["PRODUCTION_HOSTNAME"],
              "service": os.environ["WORKER_NAME"],
              "zone_name": os.environ["PRODUCTION_ZONE_NAME"],
          }))
          PY
          )"

          domain_response_file="$(mktemp)"
          trap 'rm -f "$domain_response_file"' EXIT
          set +e
          domain_http_status="$(curl --fail-with-body --silent --show-error \
            -o "$domain_response_file" \
            -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$domain_payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          domain_curl_status=$?
          set -e
          domain_json="$(cat "$domain_response_file")"

          echo "Cloudflare domain API HTTP status: $domain_http_status"
          echo "Cloudflare domain API response: $domain_json"
          if [[ "$domain_curl_status" -ne 0 ]]; then
            diagnostic="$(python3 - "$domain_http_status" "$domain_json" <<'PY'
          import sys

          status, body = sys.argv[1], sys.argv[2]
          message = f"HTTP {status}: {body}"[:3500]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(message)
          PY
            )"
            echo "::error title=Cloudflare Workers Domains API failed::$diagnostic"
            {
              echo "### Cloudflare Workers Domains API diagnostic"
              echo
              echo "- HTTP status: \`$domain_http_status\`"
              echo
              echo '```json'
              echo "$domain_json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare domain API request failed with curl status $domain_curl_status and HTTP status $domain_http_status." >&2
            exit "$domain_curl_status"
          fi

          python3 - "$domain_json" <<'PY'
          import json
          import os
          import sys

          data = json.loads(sys.argv[1])
          result = data.get("result") or {}
          failures = []
          if data.get("success") is not True:
              failures.append(f"Cloudflare API returned errors={data.get('errors')!r}")
          if result.get("hostname") != os.environ["PRODUCTION_HOSTNAME"]:
              failures.append(f"hostname mismatch: {result.get('hostname')!r}")
          if result.get("service") != os.environ["WORKER_NAME"]:
              failures.append(f"service mismatch: {result.get('service')!r}")
          if result.get("zone_name") != os.environ["PRODUCTION_ZONE_NAME"]:
              failures.append(f"zone mismatch: {result.get('zone_name')!r}")
          if failures:
              raise SystemExit("Cloudflare production domain attachment failed: " + "; ".join(failures))
          print(f"Attached {result['hostname']} to {result['service']} in zone {result['zone_name']} after preview health passed.")
          PY

      - name: Verify promoted Worker health and production edge route
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_custom_domain == true }}
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail

          # GitHub-hosted runner IPs are intentionally challenged by the production
          # zone on dynamic/browser-facing paths. Verify the promoted Worker through
          # its workers.dev origin, then verify that the production hostname is
          # reachable through Cloudflare on a static path. The preceding Domains API
          # step already requires the hostname to map to this exact Worker service.
          health_url="${PREVIEW_URL%/}/api/public/hooks/health"
          response="$(curl --retry 20 --retry-delay 3 --retry-all-errors \
            --fail-with-body --silent --show-error "$health_url")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok": failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True: failures.append("AI provider is not ready")
          if failures:
              raise SystemExit("Promoted Worker health verification failed: " + "; ".join(failures))
          print(json.dumps({"database": data.get("database"), "ai_provider_ready": data.get("ai_provider_ready")}))
          PY

          robots_url="https://$PRODUCTION_HOSTNAME/robots.txt"
          robots_body="$(curl --retry 10 --retry-delay 3 --retry-all-errors \
            --fail-with-body --silent --show-error "$robots_url")"
          if [[ -z "$robots_body" ]]; then
            echo "Production edge returned an empty robots.txt response." >&2
            exit 1
          fi
          echo "Promoted Worker health passed and production edge route is reachable."
