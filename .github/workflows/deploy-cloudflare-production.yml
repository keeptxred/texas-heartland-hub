name: Deploy KeepTXRed to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      activate_custom_domain:
        description: Attach keeptxred.com only after the workers.dev preview passes health checks
        required: true
        type: boolean
        default: false
      production_hostname:
        description: Production hostname to attach when custom-domain activation is enabled
        required: true
        type: string
        default: keeptxred.com

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_RUNTIME_AI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_HOSTNAME: ${{ inputs.production_hostname }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify required production credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_RUNTIME_AI_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Deployment is blocked before any Cloudflare change is attempted." >&2
          fi
          exit "$missing"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production Worker
        run: |
          set -euo pipefail
          bun run lint
          bun run build
          bunx wrangler deploy --dry-run

      - name: Deploy isolated Worker preview with runtime AI credentials
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          deploy_log="$(mktemp)"
          trap 'rm -f "$secrets_file" "$deploy_log"' EXIT

          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import sys

          payload = {
              "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_RUNTIME_AI_TOKEN"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
          PY

          bunx wrangler deploy --strict --secrets-file "$secrets_file" 2>&1 | tee "$deploy_log"

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | tail -1 || true)"
          if [[ -z "$preview_url" ]]; then
            account_subdomain_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || true)"
            account_subdomain="$(python3 - "$account_subdomain_json" <<'PY'
          import json
          import sys

          try:
              data = json.loads(sys.argv[1])
              print((data.get("result") or {}).get("subdomain") or "")
          except Exception:
              print("")
          PY
            )"
            if [[ -n "$account_subdomain" ]]; then
              preview_url="https://$WORKER_NAME.$account_subdomain.workers.dev"
            fi
          fi

          if [[ -z "$preview_url" ]]; then
            echo "Worker uploaded, but its workers.dev preview URL could not be resolved. Production was not touched." >&2
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Verify preview database and AI health
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL%/}/api/public/hooks/health"
          response="$(curl --retry 6 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error "$health_url")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok":
              failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True:
              failures.append("AI provider is not ready")
          if failures:
              raise SystemExit("Preview health verification failed: " + "; ".join(failures))
          PY

      - name: Attach production custom domain
        if: ${{ inputs.activate_custom_domain }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "hostname": os.environ["PRODUCTION_HOSTNAME"],
              "service": os.environ["WORKER_NAME"],
          }))
          PY
          )"

          response="$(curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])
          if data.get("success") is not True:
              raise SystemExit("Cloudflare did not confirm custom-domain attachment")
          PY

      - name: Verify production database and AI health
        if: ${{ inputs.activate_custom_domain }}
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://$PRODUCTION_HOSTNAME/api/public/hooks/health"
          response="$(curl --retry 10 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error "$health_url")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json
          import sys

          data = json.loads(sys.argv[1])
          failures = []
          if data.get("database") != "ok":
              failures.append("database is not ok")
          if data.get("ai_provider_ready") is not True:
              failures.append("AI provider is not ready")
          if failures:
              raise SystemExit("Production health verification failed: " + "; ".join(failures))
          PY
