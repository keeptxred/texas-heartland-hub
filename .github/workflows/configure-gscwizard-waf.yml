name: Configure GSC Wizard crawl exception

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/configure-gscwizard-waf.yml'

permissions:
  contents: read

concurrency:
  group: gscwizard-waf-exception
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      PRODUCTION_HOSTNAME: keeptxred.com
      RULE_DESCRIPTION: Allow GSCWizard read-only SEO crawl on public pages
      RULE_EXPRESSION: '(http.request.method in {"GET" "HEAD"} and http.host eq "keeptxred.com" and http.user_agent contains "GSCWizard-Bot" and http.request.uri.path in {"/" "/elections/2026" "/elections/candidates"})'

    steps:
      - name: Check required Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GSC Wizard WAF exception"
              echo
              echo "Cloudflare deploy credentials are not available to this workflow. No Cloudflare configuration was changed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve production zone and test WAF access
        if: steps.credentials.outputs.available == 'true'
        id: zone
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          domains_file="$(mktemp)"
          trap 'rm -f "$domains_file"' EXIT
          domains_status="$(curl --silent --show-error -o "$domains_file" -w '%{http_code}' "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          domains_json="$(cat "$domains_file")"
          if [[ "$domains_status" != "200" ]]; then
            echo "can_manage=false" >> "$GITHUB_OUTPUT"
            echo "reason=Workers Domains API returned HTTP $domains_status" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zone_id="$(python3 - "$domains_json" "$PRODUCTION_HOSTNAME" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          host = sys.argv[2]
          for item in data.get('result') or []:
              if item.get('hostname') == host:
                  print(item.get('zone_id') or '')
                  break
          PY
          )"
          if [[ -z "$zone_id" ]]; then
            echo "can_manage=false" >> "$GITHUB_OUTPUT"
            echo "reason=Could not resolve zone_id for $PRODUCTION_HOSTNAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

          ruleset_file="$(mktemp)"
          ruleset_status="$(curl --silent --show-error -o "$ruleset_file" -w '%{http_code}' "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint")"
          ruleset_json="$(cat "$ruleset_file")"
          rm -f "$ruleset_file"

          if [[ "$ruleset_status" == "401" || "$ruleset_status" == "403" ]]; then
            echo "can_manage=false" >> "$GITHUB_OUTPUT"
            echo "reason=Cloudflare deploy token lacks Zone WAF/rulesets access (HTTP $ruleset_status)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ruleset_status" == "404" ]]; then
            echo "can_manage=false" >> "$GITHUB_OUTPUT"
            echo "reason=No existing custom-firewall entrypoint ruleset; workflow will not create a new zone ruleset automatically" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ruleset_status" != "200" ]]; then
            echo "can_manage=false" >> "$GITHUB_OUTPUT"
            echo "reason=Rulesets API returned HTTP $ruleset_status" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ruleset_id="$(python3 - "$ruleset_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print((data.get('result') or {}).get('id') or '')
          PY
          )"
          if [[ -z "$ruleset_id" ]]; then
            echo "can_manage=false" >> "$GITHUB_OUTPUT"
            echo "reason=Custom-firewall ruleset ID was not returned" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_rule_id="$(python3 - "$ruleset_json" "$RULE_DESCRIPTION" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          desc = sys.argv[2]
          for rule in (data.get('result') or {}).get('rules') or []:
              if rule.get('description') == desc:
                  print(rule.get('id') or '')
                  break
          PY
          )"
          echo "ruleset_id=$ruleset_id" >> "$GITHUB_OUTPUT"
          echo "existing_rule_id=$existing_rule_id" >> "$GITHUB_OUTPUT"
          echo "can_manage=true" >> "$GITHUB_OUTPUT"

      - name: Report permission blocker
        if: steps.credentials.outputs.available == 'true' && steps.zone.outputs.can_manage != 'true'
        shell: bash
        run: |
          {
            echo "### GSC Wizard WAF exception"
            echo
            echo "No Cloudflare WAF change was made."
            echo
            echo "Reason: ${{ steps.zone.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add narrow read-only GSC Wizard skip rule
        if: steps.zone.outputs.can_manage == 'true' && steps.zone.outputs.existing_rule_id == ''
        id: create_rule
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'action': 'skip',
              'action_parameters': {
                  'ruleset': 'current',
                  'phases': [
                      'http_ratelimit',
                      'http_request_sbfm',
                      'http_request_firewall_managed',
                  ],
                  'products': ['bic', 'securityLevel', 'uaBlock'],
              },
              'expression': os.environ['RULE_EXPRESSION'],
              'description': os.environ['RULE_DESCRIPTION'],
              'enabled': True,
              'logging': {'enabled': True},
              'position': {'index': 1},
          }))
          PY
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/rulesets/${{ steps.zone.outputs.ruleset_id }}/rules")"
          body="$(cat "$response_file")"
          if [[ "$status" != "200" ]]; then
            echo "Cloudflare rule creation failed with HTTP $status" >&2
            python3 - "$body" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
              print(json.dumps({'errors': data.get('errors'), 'messages': data.get('messages')}))
          except Exception:
              print('Cloudflare returned a non-JSON error response')
          PY
            exit 1
          fi
          rule_id="$(python3 - "$body" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print((data.get('result') or {}).get('id') or '')
          PY
          )"
          if [[ -z "$rule_id" ]]; then
            echo "Cloudflare returned success but no rule ID." >&2
            exit 1
          fi
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Verify existing or newly-created rule definition
        if: steps.zone.outputs.can_manage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/rulesets/phases/http_request_firewall_custom/entrypoint")"
          python3 - "$response" "$RULE_DESCRIPTION" "$RULE_EXPRESSION" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          desc = sys.argv[2]
          expression = sys.argv[3]
          rules = (data.get('result') or {}).get('rules') or []
          matches = [r for r in rules if r.get('description') == desc]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one GSC Wizard rule, found {len(matches)}')
          rule = matches[0]
          if rule.get('enabled') is not True:
              raise SystemExit('GSC Wizard rule exists but is disabled')
          if rule.get('expression') != expression:
              raise SystemExit('Existing GSC Wizard rule expression does not match the narrow approved expression')
          if rule.get('action') != 'skip':
              raise SystemExit('GSC Wizard rule is not a skip rule')
          print(f"Verified narrow GSC Wizard rule: {rule.get('id')}")
          PY

      - name: Verify GSC Wizard user-agent can read priority public pages
        if: steps.zone.outputs.can_manage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for path in / /elections/2026 /elections/candidates; do
            status="$(curl --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error \
              -A 'GSCWizard-Bot/1.0 (Full On-Page Checker)' \
              -o /tmp/gscwizard-body -w '%{http_code}' \
              "https://$PRODUCTION_HOSTNAME$path")"
            echo "$path -> HTTP $status"
            if [[ "$status" != "200" ]]; then
              failures=1
            fi
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "The custom WAF skip exists, but at least one request is still challenged. This indicates another Cloudflare control (for example non-skippable Bot Fight Mode) is responsible; no broader bypass was attempted." >&2
            exit 1
          fi
          {
            echo "### GSC Wizard WAF exception"
            echo
            echo "A narrow GET/HEAD exception is active for the GSC Wizard user agent on exactly three public pages."
            echo "All three verification requests returned HTTP 200."
            echo "No broad WAF or bot protection was disabled."
          } >> "$GITHUB_STEP_SUMMARY"
