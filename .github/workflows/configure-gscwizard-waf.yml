name: Configure GSC Wizard crawl exception

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/configure-gscwizard-waf.yml'

permissions:
  contents: read

concurrency:
  group: gscwizard-waf-exception
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      PRODUCTION_HOSTNAME: keeptxred.com
      RULE_DESCRIPTION: Allow GSCWizard read-only SEO crawl on public pages

    steps:
      - name: Remove ineffective temporary GSC Wizard skip rule
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Cloudflare credentials unavailable; cleanup cannot proceed." >&2
            exit 1
          fi

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          domains="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          zone_id="$(python3 - "$domains" "$PRODUCTION_HOSTNAME" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1]); host = sys.argv[2]
          for item in data.get('result') or []:
              if item.get('hostname') == host:
                  print(item.get('zone_id') or '')
                  break
          PY
          )"
          [[ -n "$zone_id" ]] || { echo "Could not resolve zone ID" >&2; exit 1; }

          entry_file="$(mktemp)"
          status="$(curl --silent --show-error -o "$entry_file" -w '%{http_code}' "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/phases/http_request_firewall_custom/entrypoint")"
          entry="$(cat "$entry_file")"
          rm -f "$entry_file"
          if [[ "$status" == "404" ]]; then
            echo "No custom-firewall entrypoint exists; nothing to clean up."
            exit 0
          fi
          [[ "$status" == "200" ]] || { echo "Entrypoint lookup failed with HTTP $status" >&2; exit 1; }

          read -r ruleset_id rule_id rule_count <<<"$(python3 - "$entry" "$RULE_DESCRIPTION" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1]); desc = sys.argv[2]
          result = data.get('result') or {}; rules = result.get('rules') or []
          rule_id = ''
          for rule in rules:
              if rule.get('description') == desc:
                  rule_id = rule.get('id') or ''
                  break
          print(result.get('id') or '', rule_id, len(rules))
          PY
          )"

          [[ -n "$ruleset_id" ]] || { echo "Missing ruleset ID" >&2; exit 1; }
          if [[ -z "$rule_id" ]]; then
            echo "Temporary GSC Wizard rule is already absent."
            exit 0
          fi

          delete_file="$(mktemp)"
          delete_status="$(curl --silent --show-error -o "$delete_file" -w '%{http_code}' \
            -X DELETE "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$ruleset_id/rules/$rule_id")"
          rm -f "$delete_file"
          [[ "$delete_status" == "200" ]] || { echo "Rule deletion failed with HTTP $delete_status" >&2; exit 1; }
          echo "Removed temporary GSC Wizard skip rule $rule_id."

          # This ruleset did not exist before this operation. If our rule was its only rule,
          # remove the now-empty entrypoint as well so Cloudflare returns to its prior state.
          if [[ "$rule_count" == "1" ]]; then
            ruleset_status="$(curl --silent --show-error -o /tmp/delete-ruleset -w '%{http_code}' \
              -X DELETE "${auth[@]}" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$ruleset_id")"
            rm -f /tmp/delete-ruleset
            [[ "$ruleset_status" == "204" ]] || { echo "Empty ruleset deletion failed with HTTP $ruleset_status" >&2; exit 1; }
            echo "Removed the empty custom-firewall entrypoint created by this probe."
          fi
