name: Cloudflare Email Service smoke test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/cloudflare-email-smoke-execute'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.pull_request.head.ref == 'run-cloudflare-email-smoke' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one transactional test email
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo '::error::Missing SUPABASE_SERVICE_ROLE_KEY'; exit 1; }

          payload='{"templateName":"order-confirmation","recipientEmail":"freddy.coppola@gmail.com","idempotencyKey":"cloudflare-email-smoke-20260815","templateData":{"orderId":"CLOUDFLARE-EMAIL-SMOKE-20260815","customerName":"Frederick","items":[{"description":"Cloudflare Email Service smoke test — no purchase","quantity":1,"amount":"0.00","currency":"USD"}],"total":"0.00","currency":"USD","shipping":{"name":"Test only","line1":"No shipment","city":"Katy","state":"TX","postal_code":"00000","country":"US"}}}'

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --connect-timeout 15 --max-time 45 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --data "$payload" \
            'https://keeptxred.com/api/email/transactional/send')"

          cat "$response_file"
          echo
          if [[ ! "$http_code" =~ ^2 ]]; then
            echo "::error title=Cloudflare email smoke failed::KTR email endpoint returned HTTP $http_code"
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('success') is not True:
              raise SystemExit(f"Email endpoint did not report success: {data}")
          if data.get('provider') != 'cloudflare-email-service':
              raise SystemExit(f"Unexpected email provider: {data.get('provider')!r}")
          print('Cloudflare Email Service accepted the one-message smoke test.')
          PY
