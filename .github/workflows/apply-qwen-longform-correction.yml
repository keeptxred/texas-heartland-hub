name: Apply Qwen longform correction patch

on:
  push:
    branches:
      - fix/qwen-longform-correction
    paths:
      - 'scripts/apply-qwen-longform-correction.py'
      - '.github/workflows/apply-qwen-longform-correction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-longform-correction
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-qwen-longform-correction.py
      - name: Commit patched files
        run: |
          if git diff --quiet -- src/routes/api/public/hooks/generate-news.ts src/server.ts src/routes/api/public/hooks/generate-news.word-budget.test.ts; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/api/public/hooks/generate-news.ts src/server.ts src/routes/api/public/hooks/generate-news.word-budget.test.ts
          git commit -m 'Use Qwen with one bounded longform correction'
          git push origin HEAD:fix/qwen-longform-correction
