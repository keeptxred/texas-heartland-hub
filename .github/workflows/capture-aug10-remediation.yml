name: Capture Aug 10 Remediation Response

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/capture-aug10-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Compare published origin and custom domain
        run: |
          set -u
          for base in https://keeptxred.lovable.app https://keeptxred.com; do
            echo "=== $base ==="
            status=$(curl -sS --max-time 180 -X POST \
              -H 'Accept: application/json' \
              -H 'User-Agent: KeepTXRed-Aug10-Diagnostic/1.0' \
              -o /tmp/body.json \
              -w '%{http_code}' \
              "$base/api/public/hooks/remediate-aug10-flyover" || true)
            echo "HTTP $status"
            cat /tmp/body.json || true
            echo
          done
