name: Printify live diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/printify-live-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read live Printify quote diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            https://keeptxred.com/api/public/payments/printify-quote-health | tee printify-diagnostic.json
          echo
          python3 -m json.tool printify-diagnostic.json
