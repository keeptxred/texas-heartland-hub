name: Election Central mobile browser QA

on:
  pull_request:
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/index.tsx"
      - "tests/elections/**"
      - "playwright.elections.config.ts"
      - "package.json"
      - ".github/workflows/election-central-mobile.yml"
  push:
    branches:
      - main
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/index.tsx"
      - "tests/elections/**"
      - "playwright.elections.config.ts"
      - "package.json"
      - ".github/workflows/election-central-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production application
        run: pnpm build

      - name: Run mobile browser smoke tests
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: pnpm elections:test:mobile
