name: Election Central mobile browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/index.tsx"
      - "tests/elections/**"
      - "playwright.elections.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        id: mobile_tests
        continue-on-error: true
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: bun run elections:test:mobile
      - name: Create mobile QA report
        if: always()
        shell: bash
        env:
          MOBILE_OUTCOME: ${{ steps.mobile_tests.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const checks = { mobileTests: process.env.MOBILE_OUTCOME };
          const passed = checks.mobileTests === "success";
          const report = {
            updatedAt: new Date().toISOString(), conclusion: passed ? "success" : "failure",
            runId: process.env.RUN_ID, runAttempt: process.env.RUN_ATTEMPT,
            triggerCommit: process.env.RUN_SHA, runUrl: process.env.RUN_URL,
            checks, viewport: { width: 390, height: 844 }, homepageTakeoverEnabledDuringTest: false,
          };
          fs.writeFileSync("/tmp/election-mobile-status.json", `${JSON.stringify(report, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Election Central mobile QA", "", `**Conclusion:** ${passed ? "PASS" : "FAIL"}`, "",
            `- Mobile browser tests: ${checks.mobileTests === "success" ? "✅" : "❌"} ${checks.mobileTests}`,
            "- Production build is validated by the dedicated Production Build Validation workflow.",
            "- Viewport: 390 × 844", "",
          ].join("\n"));
          NODE
      - name: Upload mobile QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-central-mobile-qa-${{ github.run_id }}
          path: /tmp/election-mobile-status.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce mobile QA result
        if: always()
        shell: bash
        env:
          MOBILE_OUTCOME: ${{ steps.mobile_tests.outcome }}
        run: |
          if [[ "$MOBILE_OUTCOME" != "success" ]]; then
            exit 1
          fi
