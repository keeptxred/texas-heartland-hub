name: Election Central mobile browser QA

on:
  pull_request:
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/index.tsx"
      - "tests/elections/**"
      - "playwright.elections.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-mobile.yml"
  push:
    branches:
      - main
    paths:
      - "src/data/elections/**"
      - "src/lib/elections/**"
      - "src/types/elections/**"
      - "src/components/elections/**"
      - "src/pages/elections/**"
      - "src/routes/elections*"
      - "src/routes/index.tsx"
      - "tests/elections/**"
      - "playwright.elections.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-central-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election-central-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Build production application
        id: build
        continue-on-error: true
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: bun run build

      - name: Run mobile browser smoke tests
        id: mobile_tests
        continue-on-error: true
        env:
          VITE_ENABLE_ELECTION_CENTRAL_HOMEPAGE: "false"
        run: bun run elections:test:mobile

      - name: Create mobile QA report
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile_tests.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const checks = {
            build: process.env.BUILD_OUTCOME,
            mobileTests: process.env.MOBILE_OUTCOME,
          };
          const passed = Object.values(checks).every((value) => value === "success");
          const report = {
            updatedAt: new Date().toISOString(),
            conclusion: passed ? "success" : "failure",
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            triggerCommit: process.env.RUN_SHA,
            runUrl: process.env.RUN_URL,
            checks,
            viewport: { width: 390, height: 844 },
            homepageTakeoverEnabledDuringTest: false,
          };
          fs.writeFileSync("/tmp/election-mobile-status.json", `${JSON.stringify(report, null, 2)}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Election Central mobile QA",
              "",
              `**Conclusion:** ${passed ? "PASS" : "FAIL"}`,
              "",
              `- Production build: ${checks.build === "success" ? "✅" : "❌"} ${checks.build}`,
              `- Mobile browser tests: ${checks.mobileTests === "success" ? "✅" : "❌"} ${checks.mobileTests}`,
              "- Viewport: 390 × 844",
              "",
            ].join("\n"),
          );
          NODE

      - name: Upload mobile QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-central-mobile-qa-${{ github.run_id }}
          path: /tmp/election-mobile-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce mobile QA result
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile_tests.outcome }}
        run: |
          if [[ "$BUILD_OUTCOME" != "success" || "$MOBILE_OUTCOME" != "success" ]]; then
            exit 1
          fi
