name: One-shot Election Central title-contract codemod

on:
  push:
    branches:
      - fix/election-title-contract
    paths:
      - .github/workflows/election-title-contract-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/election-title-contract
          fetch-depth: 0

      - name: Apply shared Election Central title contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          SEO_IMPORT = 'import { formatElectionTitle } from "@/lib/elections/seo";'

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, path):
              if old not in text:
                  raise SystemExit(f"expected source block missing in {path}: {old}")
              return text.replace(old, new, 1)

          def add_seo_import(text, path):
              if SEO_IMPORT in text:
                  return text
              anchors = [
                  'import { ELECTION_ROUTES } from "@/lib/elections";',
                  'import { ElectionRepositoryProvider } from "@/lib/elections/repositories";',
              ]
              for anchor in anchors:
                  if anchor in text:
                      return text.replace(anchor, f"{anchor}\n{SEO_IMPORT}", 1)
              raise SystemExit(f"no safe election SEO import anchor found in {path}")

          dynamic = {
              "src/routes/elections.candidates_.$candidateSlug.tsx": (
                  '''    const title = indexable\n      ? `${recordName} | KeepTXRed Election Central`\n      : "Election candidate not found | KeepTXRed";''',
                  '''    const title = formatElectionTitle(\n      indexable ? `${recordName} Election Central` : "Election candidate not found",\n    );''',
              ),
              "src/routes/elections.races_.$raceSlug.tsx": (
                  '''    const title = indexable\n      ? `${recordName} | KeepTXRed Election Central`\n      : "Election race not found | KeepTXRed";''',
                  '''    const title = formatElectionTitle(\n      indexable ? `${recordName} Election Central` : "Election race not found",\n    );''',
              ),
              "src/routes/elections.polls.$pollSlug.tsx": (
                  '''    const title = indexable\n      ? `${recordName} | KeepTXRed Election Central`\n      : "Election poll not found | KeepTXRed";''',
                  '''    const title = formatElectionTitle(\n      indexable ? `${recordName} Election Central` : "Election poll not found",\n    );''',
              ),
              "src/routes/elections.results.$resultSlug.tsx": (
                  '''    const title = indexable\n      ? `${recordName} | KeepTXRed Election Central`\n      : "Election result not found | KeepTXRed";''',
                  '''    const title = formatElectionTitle(\n      indexable ? `${recordName} Election Central` : "Election result not found",\n    );''',
              ),
              "src/routes/elections.forecast.$forecastSlug.tsx": (
                  '''    const title = indexable\n      ? `${recordName} | KeepTXRed Election Central`\n      : "Election forecast not found | KeepTXRed";''',
                  '''    const title = formatElectionTitle(\n      indexable ? `${recordName} Election Central` : "Election forecast not found",\n    );''',
              ),
          }

          for path, (old, new) in dynamic.items():
              text = add_seo_import(read(path), path)
              text = replace_once(text, old, new, path)
              write(path, text)

          path = "src/routes/elections.voting.tsx"
          text = add_seo_import(read(path), path)
          text = replace_once(
              text,
              'const WHO_REPRESENTS_ME = "https://wrm.capitol.texas.gov/home";',
              'const WHO_REPRESENTS_ME = "https://wrm.capitol.texas.gov/home";\nconst VOTING_TITLE = formatElectionTitle("Texas Voting Dates, Voter ID & Ballot Research");',
              path,
          )
          text = replace_once(
              text,
              '{ title: "Texas Voting Dates, Voter ID, Ballot Research & Official Resources | Keep TX Red" },',
              '{ title: VOTING_TITLE },',
              path,
          )
          text = replace_once(
              text,
              '{ property: "og:title", content: "Texas Voting Dates, Voter ID & Ballot Research | Keep TX Red Election Central" },',
              '{ property: "og:title", content: VOTING_TITLE },',
              path,
          )
          write(path, text)

          path = "src/routes/elections.2026.tsx"
          text = add_seo_import(read(path), path)
          text = replace_once(
              text,
              '''const ELECTION_CENTRAL_TITLE =\n  "2026 Texas Election Central | Races, Candidates, Polls & Results";''',
              '''const ELECTION_CENTRAL_NAME = "2026 Texas Election Central";\nconst ELECTION_CENTRAL_TITLE = formatElectionTitle(\n  "2026 Texas Election Central: Races & Results",\n);''',
              path,
          )
          text = replace_once(text, "  name: ELECTION_CENTRAL_TITLE,", "  name: ELECTION_CENTRAL_NAME,", path)
          write(path, text)

          for path, base_title, old_title, old_og in [
              (
                  "src/routes/elections.statewide.tsx",
                  "2026 Texas Statewide Elections",
                  '      { title: "2026 Texas Statewide Elections | Candidates, Polls & Results" },',
                  '      { property: "og:title", content: "2026 Texas Statewide Elections" },',
              ),
              (
                  "src/routes/elections.legislative.tsx",
                  "2026 Texas Legislative Elections",
                  '      { title: "2026 Texas Legislative Elections | House & Senate Races" },',
                  '      { property: "og:title", content: "2026 Texas Legislative Elections" },',
              ),
              (
                  "src/routes/elections.districts.index.tsx",
                  "Texas Election Districts & 2026 Race Lookup",
                  '      { title: "Texas Election Districts & 2026 Race Lookup | Congressional, House & Senate" },',
                  '      { property: "og:title", content: "Texas Election Districts & 2026 Race Lookup" },',
              ),
          ]:
              text = add_seo_import(read(path), path)
              text = replace_once(
                  text,
                  'const URL = "https://keeptxred.com/' + ("elections/statewide" if "statewide" in path else "elections/legislative" if "legislative" in path else "elections/districts") + '";',
                  'const URL = "https://keeptxred.com/' + ("elections/statewide" if "statewide" in path else "elections/legislative" if "legislative" in path else "elections/districts") + '";\nconst PAGE_TITLE = formatElectionTitle("' + base_title + '");',
                  path,
              )
              text = replace_once(text, old_title, "      { title: PAGE_TITLE },", path)
              text = replace_once(text, old_og, '      { property: "og:title", content: PAGE_TITLE },', path)
              write(path, text)

          path = "src/routes/elections.districts.$districtSlug.tsx"
          text = add_seo_import(read(path), path)
          text = replace_once(
              text,
              '''    const title = district\n      ? `2026 ${district.name} Election | Candidates & Results`\n      : "Texas Election District Not Found";''',
              '''    const pageName = district\n      ? `2026 ${district.name} Election`\n      : "Texas Election District Not Found";\n    const title = formatElectionTitle(pageName);''',
              path,
          )
          text = replace_once(text, "                    name: title,", "                    name: pageName,", path)
          write(path, text)

          for path in [*dynamic.keys(),
              "src/routes/elections.voting.tsx",
              "src/routes/elections.2026.tsx",
              "src/routes/elections.statewide.tsx",
              "src/routes/elections.legislative.tsx",
              "src/routes/elections.districts.index.tsx",
              "src/routes/elections.districts.$districtSlug.tsx",
          ]:
              text = read(path)
              if SEO_IMPORT not in text or "formatElectionTitle(" not in text:
                  raise SystemExit(f"title contract not applied to {path}")
          PY

      - name: Remove one-shot workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/election-title-contract-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/elections.candidates_.'$candidateSlug'.tsx \
                  src/routes/elections.races_.'$raceSlug'.tsx \
                  src/routes/elections.polls.'$pollSlug'.tsx \
                  src/routes/elections.results.'$resultSlug'.tsx \
                  src/routes/elections.forecast.'$forecastSlug'.tsx \
                  src/routes/elections.voting.tsx \
                  src/routes/elections.2026.tsx \
                  src/routes/elections.statewide.tsx \
                  src/routes/elections.legislative.tsx \
                  src/routes/elections.districts.index.tsx \
                  src/routes/elections.districts.'$districtSlug'.tsx \
                  .github/workflows/election-title-contract-codemod.yml
          git diff --cached --check
          git commit -m "Enforce shared Election Central title contract"
          git push origin HEAD:fix/election-title-contract
