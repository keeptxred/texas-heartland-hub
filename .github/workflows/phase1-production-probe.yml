name: Phase 1 Production Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase1-production-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify retired legacy endpoints are live
        shell: bash
        run: |
          set -euo pipefail
          check_endpoint() {
            local url="$1"
            local body="/tmp/$(basename "$url").json"
            for attempt in $(seq 1 18); do
              status=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "$url" || echo 000)
              echo "attempt=${attempt} url=${url} http=${status}"
              cat "$body" 2>/dev/null || true
              echo
              if [[ "$status" == "200" ]] && jq -e '
                .ok == true and
                .no_items == true and
                .disabled == true and
                .reason == "legacy_single_source_writer_retired_use_clustered_newsroom" and
                (.aiCalls // -1) == 0 and
                (.inserted // -1) == 0
              ' "$body" >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            echo "Production endpoint did not expose the Phase 1 retirement contract: $url" >&2
            return 1
          }

          check_endpoint 'https://keeptxred.com/api/public/hooks/generate-news'
          check_endpoint 'https://keeptxred.com/api/public/hooks/run-generate-news'
