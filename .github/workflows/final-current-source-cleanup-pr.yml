name: Final current-source cleanup PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: final-current-source-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Remove retired current-source traces
        run: python3 scripts/maintenance/final-current-source-cleanup.py

      - name: Normalize dependency lock
        run: bun install --lockfile-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and regenerate route tree
        run: bun run build

      - name: Validate publication boundary
        run: bun run publication:validate

      - name: Validate indexability
        run: bun run seo:indexability

      - name: Run focused regression tests
        run: |
          bunx vitest run \
            src/lib/living-story-update.test.ts \
            src/lib/ingest-feeds-legacy-tier.test.ts \
            src/lib/newsroom-legacy-fallback-budget.test.ts \
            src/routes/api/public/hooks/generate-news.word-budget.test.ts \
            src/routes/api/public/hooks/reconcile-news-history.test.ts

      - name: Remove temporary cleanup machinery
        run: |
          rm -f .github/workflows/cleanup-retired-builder-traces.yml
          rm -f .github/workflows/finalize-retired-builder-cleanup.yml
          rm -f .github/workflows/current-source-retirement.yml
          rm -f .github/workflows/final-current-source-cleanup-pr.yml
          rm -f .github/finalize-retired-builder-trigger
          rm -f .github/current-source-cleanup-trigger
          rm -f scripts/maintenance/final-current-source-cleanup.py

      - name: Verify tracked current source is clean
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          vendor = ('lova' + 'ble').lower()
          marker = ('__' + 'l5e').lower()
          starters = [('gpt' + 'engineer').lower(), ('gpt' + '-engineer').lower()]
          bad = []
          tracked = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          for rel in tracked:
              path = Path(rel)
              if not path.exists():
                  continue
              lower_path = rel.lower()
              if vendor in lower_path:
                  bad.append(f'path:{rel}:retired-builder-name')
              if marker in lower_path:
                  bad.append(f'path:{rel}:retired-hosted-asset')
              try:
                  text = path.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if vendor in text:
                  bad.append(f'content:{rel}:retired-builder-name')
              if marker in text:
                  bad.append(f'content:{rel}:retired-hosted-asset')
              for term in starters:
                  if term in text:
                      bad.append(f'content:{rel}:retired-starter-term')
          if bad:
              print('\n'.join(sorted(set(bad))))
              raise SystemExit('Current-source cleanup scan failed')
          print('Current-source cleanup scan: clean')
          PY

      - name: Commit verified cleanup to pull request branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove remaining retired integration traces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
