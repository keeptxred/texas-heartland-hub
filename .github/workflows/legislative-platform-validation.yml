name: Legislative platform validation

on:
  pull_request:
    paths:
      - 'src/routes/bills/**'
      - 'src/routes/admin/bills/**'
      - 'src/components/bills/**'
      - 'src/lib/bills.ts'
      - 'src/lib/legislative-sitemaps.ts'
      - 'scripts/legislature/**'
      - 'supabase/migrations/**bill**'
      - 'supabase/migrations/**legislative**'
      - '.github/workflows/legislative-platform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/bills/**'
      - 'src/routes/admin/bills/**'
      - 'src/components/bills/**'
      - 'src/lib/bills.ts'
      - 'src/lib/legislative-sitemaps.ts'
      - 'scripts/legislature/**'
      - 'supabase/migrations/**bill**'
      - 'supabase/migrations/**legislative**'
      - '.github/workflows/legislative-platform-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate legislative architecture
        run: npm run legislature:validate
      - name: Build application and generated routes
        run: npm run build:dev
