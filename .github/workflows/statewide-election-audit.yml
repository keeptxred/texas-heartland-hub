name: Statewide election audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/statewide-election-audit.yml'
      - 'scripts/elections/audit-statewide.mjs'
      - 'scripts/elections/scrape-official-candidates.ts'
      - 'scripts/elections/import-candidates.ts'
      - 'scripts/elections/reconcile-statewide-candidate-moves.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: statewide-election-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Scrape official qualified candidates
        id: candidate_scrape
        continue-on-error: true
        env:
          ELECTION_CANDIDATE_SCRAPE_OUTPUT: /tmp/official-candidates.json
        run: bun run elections:scrape:candidates
      - name: Use fresh official candidate extract when available
        if: steps.candidate_scrape.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/official-candidates.json ]]; then
            echo "Candidate extraction reported success but produced no usable file." >&2
            exit 1
          fi
          cp /tmp/official-candidates.json scripts/elections/import/official-candidates.json
          ELECTION_CANDIDATE_IMPORT=scripts/elections/import/official-candidates.json bun run elections:import:candidates
          ELECTION_OFFICIAL_CANDIDATES=scripts/elections/import/official-candidates.json node scripts/elections/reconcile-statewide-candidate-moves.mjs
      - name: Record upstream candidate-source outage
        if: steps.candidate_scrape.outcome == 'failure'
        shell: bash
        run: |
          echo "## Statewide election audit source warning" >> "$GITHUB_STEP_SUMMARY"
          echo "The official qualified-candidate source was unavailable. The audit is continuing against the last repository-maintained official candidate snapshot; no fresh candidate data will be committed from this run." >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -s scripts/elections/import/official-candidates.json ]]; then
            echo "No usable fallback official candidate snapshot exists." >&2
            exit 1
          fi
      - name: Audit every statewide race
        env:
          ELECTION_OFFICIAL_CANDIDATES: scripts/elections/import/official-candidates.json
        run: bun scripts/elections/audit-statewide.mjs
      - name: Run full election validation
        run: bun run elections:validate
      - name: Publish refreshed election data through PR
        if: steps.candidate_scrape.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/data/elections/2026/|scripts/elections/import/official-candidates\.json$|artifacts/elections/statewide-race-audit\.json$)'
          tracked_paths=(
            src/data/elections/2026
            scripts/elections/import/official-candidates.json
            artifacts/elections/statewide-race-audit.json
          )
          refresh_branch='automation/statewide-election-refresh'

          if git diff --quiet -- "${tracked_paths[@]}"; then
            echo "No election-data changes detected."
            exit 0
          fi

          git add "${tracked_paths[@]}"
          unexpected_files="$(git diff --cached --name-only | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the statewide-audit allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          git diff --cached --binary > /tmp/statewide-election-refresh.patch
          if [[ ! -s /tmp/statewide-election-refresh.patch ]]; then
            echo "No staged election-data patch to publish."
            exit 0
          fi

          git config user.name "KeepTXRed Election Audit"
          git config user.email "actions@users.noreply.github.com"

          # Rebase the validated generated-data delta onto the newest protected main.
          git fetch origin main
          git reset --hard origin/main
          if ! git apply --index --3way /tmp/statewide-election-refresh.patch; then
            echo "Fresh election-data patch conflicts with current main; refusing to publish without a new audit." >&2
            exit 1
          fi

          unexpected_files="$(git diff --cached --name-only | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Reapplied patch touched files outside the statewide-audit allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          # Validate again because main may have advanced since the original scrape.
          bun run elections:validate
          if git diff --cached --quiet; then
            echo "Election data already matches current main."
            exit 0
          fi

          git checkout -B "$refresh_branch"
          git commit -m "Refresh and audit statewide election candidates"
          git push --force-with-lease origin "$refresh_branch"

          pr_number="$(gh pr list --head "$refresh_branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$refresh_branch" \
              --title "Refresh and audit statewide election candidates" \
              --body $'Automated refresh from the official Texas qualified-candidate source.\n\nThe workflow scraped the source, imported the generated records, reconciled authoritative statewide race moves, passed the statewide race audit, passed the full election validation, rebased the generated-data delta onto current main, and reran validation before opening this PR. Branch protection and required checks remain authoritative.')"
            pr_number="${pr_url##*/}"
          else
            echo "Updated existing election refresh PR #$pr_number."
          fi

          # Let normal branch protection and the required verify check govern the merge.
          gh pr merge "$pr_number" --auto --squash
          echo "Election refresh is queued through protected PR #$pr_number."
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-race-audit
          path: |
            artifacts/elections/statewide-race-audit.json
            scripts/elections/import/official-candidates.json
          if-no-files-found: warn
