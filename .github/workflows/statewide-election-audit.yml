name: Statewide election audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    paths:
      - ".github/workflows/statewide-election-audit.yml"
      - "scripts/elections/audit-statewide.mjs"
      - "scripts/elections/scrape-official-candidates.ts"
      - "scripts/elections/import-candidates.ts"
      - "scripts/elections/import/candidates.json"
      - "src/data/elections/2026/races.json"
      - "src/data/elections/2026/candidates.json"
      - "package.json"
      - "bun.lock"

permissions:
  contents: write

concurrency:
  group: statewide-election-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Scrape official qualified candidates
        env:
          ELECTION_CANDIDATE_SCRAPE_OUTPUT: scripts/elections/import/official-candidates.json
        run: bun run elections:scrape:candidates

      - name: Import official candidates
        env:
          ELECTION_CANDIDATE_IMPORT: scripts/elections/import/official-candidates.json
        run: bun run elections:import:candidates

      - name: Audit every statewide race
        env:
          ELECTION_OFFICIAL_CANDIDATES: scripts/elections/import/official-candidates.json
        run: bun scripts/elections/audit-statewide.mjs

      - name: Run full election validation
        run: bun run elections:validate

      - name: Commit refreshed election data
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/data/elections/2026/|scripts/elections/import/official-candidates\.json$|artifacts/elections/statewide-race-audit\.json$)'
          if git diff --quiet -- src/data/elections/2026 scripts/elections/import/official-candidates.json artifacts/elections/statewide-race-audit.json; then
            echo "No election-data changes detected."
            exit 0
          fi
          git add src/data/elections/2026 scripts/elections/import/official-candidates.json artifacts/elections/statewide-race-audit.json
          unexpected_files="$(git diff --cached --name-only | grep -vE "$allowed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the statewide-audit allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced during statewide audit; refusing to publish stale data." >&2
            exit 1
          fi
          git config user.name "KeepTXRed Election Audit"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh and audit statewide election candidates"
          git push origin HEAD:main

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-race-audit
          path: |
            artifacts/elections/statewide-race-audit.json
            scripts/elections/import/official-candidates.json
          if-no-files-found: warn
