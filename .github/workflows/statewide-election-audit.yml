name: Statewide election audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: statewide-election-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape official qualified candidates
        env:
          ELECTION_CANDIDATE_SCRAPE_OUTPUT: scripts/elections/import/official-candidates.json
        run: npm run elections:scrape:candidates

      - name: Import official candidates
        env:
          ELECTION_CANDIDATE_IMPORT: scripts/elections/import/official-candidates.json
        run: npm run elections:import:candidates

      - name: Audit every statewide race
        env:
          ELECTION_OFFICIAL_CANDIDATES: scripts/elections/import/official-candidates.json
        run: node scripts/elections/audit-statewide.mjs

      - name: Run full election validation
        run: npm run elections:validate

      - name: Commit refreshed election data
        run: |
          if git diff --quiet -- src/data/elections/2026 scripts/elections/import/official-candidates.json artifacts/elections/statewide-race-audit.json; then
            echo "No election-data changes detected."
            exit 0
          fi
          git config user.name "KeepTXRed Election Audit"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/elections/2026 scripts/elections/import/official-candidates.json artifacts/elections/statewide-race-audit.json
          git commit -m "Refresh and audit statewide election candidates"
          git push

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-race-audit
          path: |
            artifacts/elections/statewide-race-audit.json
            scripts/elections/import/official-candidates.json
          if-no-files-found: warn
