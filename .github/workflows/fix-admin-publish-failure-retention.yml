name: Fix admin publish failure retention

on:
  push:
    branches:
      - fix/admin-publish-failure-retention-20260917
    paths:
      - .github/workflows/fix-admin-publish-failure-retention.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-publish-failure-retention-20260917
          fetch-depth: 0
      - name: Patch ContentOpportunityPanel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/admin/ContentOpportunityPanel.tsx')
          s = p.read_text()

          old = '''        if (/does not contain enough text|not enough factual/i.test(res.error)) {
          setItems((current) => current.filter((item) => item.id !== r.id));
        }
'''
          if old not in s:
              raise SystemExit('expected insufficient-text removal block not found')
          s = s.replace(old, '')

          old = '''        .filter((it) => statuses[it.id]?.rewritten || shouldShowOpportunity(it))
'''
          new = '''        .filter((it) => statuses[it.id]?.rewritten || !!articleMsg[it.id]?.text || shouldShowOpportunity(it))
'''
          if old not in s:
              raise SystemExit('expected scored visibility filter not found')
          s = s.replace(old, new, 1)

          old = '''    [items, ignored, statuses],
'''
          new = '''    [items, ignored, statuses, articleMsg],
'''
          if old not in s:
              raise SystemExit('expected scored dependency list not found')
          s = s.replace(old, new, 1)

          old = '''        setArticleMsg((s) => ({ ...s, [r.id]: { ok: false, text: res.error } }));
'''
          new = '''        setArticleMsg((s) => ({ ...s, [r.id]: { ok: false, text: `Publish failed — ${res.error}` } }));
'''
          if old not in s:
              raise SystemExit('expected publish error message assignment not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-admin-publish-failure-retention.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ContentOpportunityPanel.tsx .github/workflows/fix-admin-publish-failure-retention.yml
          git commit -m "Keep failed KTR publish rows visible"
          git push origin HEAD:fix/admin-publish-failure-retention-20260917
