name: Candidate photo new-domain sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/elections/apply-direct-web-photo-findings.mjs"
      - "scripts/elections/apply-verified-photo-findings-2026-07-31.mjs"
      - "scripts/elections/apply-automation-verified-photo-findings.mjs"
      - "scripts/elections/discover-candidate-photos-new-domains.mjs"
      - "scripts/elections/discover-candidate-photos-new-domains-wave2.mjs"
      - ".github/workflows/candidate-photo-new-domains.yml"

permissions:
  contents: write

concurrency:
  group: candidate-photo-new-domains
  cancel-in-progress: false

env:
  RUN_REQUESTED_AT: "2026-07-31T11:50:38-05:00"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply directly verified portraits
        run: node scripts/elections/apply-direct-web-photo-findings.mjs

      - name: Apply newly verified portraits
        run: node scripts/elections/apply-verified-photo-findings-2026-07-31.mjs

      - name: Apply automation-verified portraits
        run: node scripts/elections/apply-automation-verified-photo-findings.mjs

      - name: Run unused-domain sweep
        run: node scripts/elections/discover-candidate-photos-new-domains.mjs

      - name: Run second unused-domain sweep
        run: node scripts/elections/discover-candidate-photos-new-domains-wave2.mjs

      - name: Apply approved portraits
        run: node scripts/elections/candidate-photo-enrichment.mjs --apply

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=(
            src/data/elections/2026/candidate-photos.json
            src/data/elections/2026/candidates.json
            artifacts/elections/candidate-photo-report.json
            artifacts/elections/candidate-photo-new-domains-report.json
            artifacts/elections/candidate-photo-new-domains-wave2-report.json
            artifacts/elections/candidate-photo-review-queue.json
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TRACKED[@]}"
          if git diff --cached --quiet; then
            echo "No new-domain candidate photo changes."
            exit 0
          fi
          unexpected_files="$(git diff --cached --name-only | grep -vE '^(src/data/elections/2026/(candidate-photos|candidates)\.json|artifacts/elections/candidate-photo-(report|new-domains-report|new-domains-wave2-report|review-queue)\.json)$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the candidate-photo allowlist:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced during candidate-photo sweep; refusing to publish stale data." >&2
            exit 1
          fi
          git commit -m "Apply verified candidate portraits and unused-domain discoveries"
          git push origin HEAD:main
