name: Modernize GitHub Actions Runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modernize-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Upgrade official Node 24 actions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          for file in "${workflows[@]}"; do
            sed -i \
              -e 's#actions/checkout@v4#actions/checkout@v5#g' \
              -e 's#actions/setup-node@v4#actions/setup-node@v5#g' \
              "$file"
          done
          if grep -R -n -E 'actions/(checkout|setup-node)@v4' .github/workflows; then
            echo 'Deprecated official action runtime remains.' >&2
            exit 1
          fi
          git diff --check
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.parse_file(file); puts \"validated #{file}\" }"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full unit test suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run build:dev && bun run typecheck
      - name: Required validators
        shell: bash
        run: |
          set -euo pipefail
          bun run shared:validate
          bun run shared:entities:validate
          bun run seo:validate
          bun run elections:validate
          bun run legislature:validate
      - name: Production build
        run: bun run build
      - name: Commit workflow modernization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'No action upgrades were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: upgrade official actions to Node 24 runtimes'
          git push origin HEAD:main
