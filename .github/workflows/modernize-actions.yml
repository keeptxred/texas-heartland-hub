name: Modernize GitHub Actions Runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modernize-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Upgrade official Node 24 actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@v5',
              'actions/setup-node@v4': 'actions/setup-node@v5',
          }
          changed = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              original = path.read_text(encoding='utf-8')
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print(f'Updated {len(changed)} workflow files')
          for path in changed:
              print(path)
          remaining = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for old in replacements:
                  if old in text:
                      remaining.append(f'{path}: {old}')
          if remaining:
              raise SystemExit('Deprecated actions remain:\n' + '\n'.join(remaining))
          if not changed:
              raise SystemExit('Expected deprecated action references, but no files changed')
          PY
          git diff --check
          git status --short
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.parse_file(file); puts \"validated #{file}\" }"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full unit test suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run build:dev && bun run typecheck
      - name: Required validators
        shell: bash
        run: |
          set -euo pipefail
          bun run shared:validate
          bun run shared:entities:validate
          bun run seo:validate
          bun run elections:validate
          bun run legislature:validate
      - name: Production build
        run: bun run build
      - name: Commit workflow modernization
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet -- .github/workflows; then
            echo 'Expected workflow updates are missing.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: upgrade official actions to Node 24 runtimes'
          git push origin HEAD:main
