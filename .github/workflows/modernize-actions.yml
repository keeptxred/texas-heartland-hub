name: Validate GitHub Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.parse_file(file); puts \"validated #{file}\" }"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full unit test suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run build:dev && bun run typecheck
      - name: Required validators
        shell: bash
        run: |
          set -euo pipefail
          bun run shared:validate
          bun run shared:entities:validate
          bun run seo:validate
          bun run elections:validate
          bun run legislature:validate
      - name: Production build
        run: bun run build
