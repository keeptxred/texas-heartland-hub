name: Validate GitHub Actions Runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Reject deprecated official action runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r'^\s*-?\s*uses:\s*actions/(checkout|setup-node)@v4(?:\s|$)', re.MULTILINE)
          findings = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  action = match.group(1)
                  findings.append(f'{path}: upgrade actions/{action}@v4 to actions/{action}@v5')
          if findings:
              raise SystemExit('Deprecated GitHub Actions remain:\n' + '\n'.join(findings))
          print('No deprecated official action runtimes found.')
          PY
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.parse_file(file); puts \"validated #{file}\" }"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full unit test suite
        run: bun run test
      - name: Route generation and TypeScript
        run: bun run build:dev && bun run typecheck
      - name: Required validators
        shell: bash
        run: |
          set -euo pipefail
          bun run shared:validate
          bun run shared:entities:validate
          bun run seo:validate
          bun run elections:validate
          bun run legislature:validate
      - name: Production build
        run: bun run build
