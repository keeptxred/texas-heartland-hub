name: Finalize seven-role policing hero lock

on:
  push:
    branches:
      - fix/policing-seven-role-production-20260903
    paths:
      - ".github/workflows/finalize-policing-seven-role.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lock seven-role asset through rendering and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "/images/news/texas-policing-agencies-compared-full-c089e1bb.jpg"
          legacy = "/images/news/texas-policing-agencies-compared.jpg"
          new = "/images/news/texas-policing-agencies-compared-seven-role-0c284fef115e.webp"

          # Renderer hard lock.
          p = Path("src/lib/seo-headline.ts")
          s = p.read_text()
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          # Regression test must prove both prior wrong-image values lose to the subject lock.
          p = Path("src/lib/policing-image-lock.test.ts")
          s = p.read_text()
          s = s.replace(old, new)
          s = s.replace(
              'image_url: "/images/news/texas-policing-agencies-compared.jpg",\n      featured_image_url: "/images/fallback/politics.jpg",',
              'image_url: "/images/news/texas-policing-agencies-compared-full-c089e1bb.jpg",\n      featured_image_url: "/images/news/texas-policing-agencies-compared.jpg",'
          )
          p.write_text(s)

          # Metadata dimensions follow the exact 1280x672 WebP instead of claiming 1280x720.
          p = Path("src/routes/news.$slug.tsx")
          s = p.read_text()
          marker = '    const articleFaq = body.faq.filter(isSpecificFaq);\n'
          assert marker in s
          if 'const articleImageHeight =' not in s:
              s = s.replace(
                  marker,
                  marker + '    const articleImageWidth = 1280;\n    const articleImageHeight = article.slug === "texas-policing-agencies-compared" ? 672 : 720;\n'
              )
          old_dims = '      imageWidth: 1280,\n      imageHeight: 720,'
          assert old_dims in s
          s = s.replace(old_dims, '      imageWidth: articleImageWidth,\n      imageHeight: articleImageHeight,', 1)
          old_json_dims = '      width: 1280,\n      height: 720,'
          assert old_json_dims in s
          s = s.replace(old_json_dims, '      width: articleImageWidth,\n      height: articleImageHeight,', 1)
          p.write_text(s)

          # Correct Open Graph MIME metadata for immutable WebP social images.
          p = Path("src/lib/seo.ts")
          s = p.read_text()
          old_type = '{ property: "og:image:type", content: image.endsWith(".png") ? "image/png" : "image/jpeg" },'
          new_type = '{ property: "og:image:type", content: image.endsWith(".png") ? "image/png" : image.endsWith(".webp") ? "image/webp" : "image/jpeg" },'
          assert old_type in s
          s = s.replace(old_type, new_type)
          p.write_text(s)

          # Live smoke must reject both prior wrong hero paths and verify exact WebP bytes.
          p = Path(".github/workflows/policing-comparison-live-smoke.yml")
          s = p.read_text()
          s = s.replace('          HERO_PATH: ' + old, '          HERO_PATH: ' + new)
          s = s.replace(
              '          OLD_HERO_PATH: ' + legacy,
              '          WRONG_HASHED_HERO_PATH: ' + old + '\n          OLD_HERO_PATH: ' + legacy
          )
          s = s.replace(
              '          REPO_HERO: public/images/news/texas-policing-agencies-compared-full-c089e1bb.jpg',
              '          REPO_HERO: public/images/news/texas-policing-agencies-compared-seven-role-0c284fef115e.webp'
          )
          old_guard = '''          if grep -Fq "$OLD_HERO_PATH" "$article"; then
            echo "Live article HTML still references the retired policing hero path: $OLD_HERO_PATH" >&2
            exit 1
          fi
'''
          new_guard = '''          if grep -Fq "$WRONG_HASHED_HERO_PATH" "$article"; then
            echo "Live article HTML still references the wrong four-role hashed hero: $WRONG_HASHED_HERO_PATH" >&2
            exit 1
          fi
          if grep -Fq "$OLD_HERO_PATH" "$article"; then
            echo "Live article HTML still references the retired policing hero path: $OLD_HERO_PATH" >&2
            exit 1
          fi
          for meta_key in 'property="og:image"' 'name="twitter:image"'; do
            grep -F "$meta_key" "$article" | grep -Fq "$HERO_PATH" || {
              echo "Live article metadata $meta_key does not use the seven-role hero." >&2
              exit 1
            }
          done
'''
          assert old_guard in s
          s = s.replace(old_guard, new_guard)
          s = s.replace("grep -Eiq '^content-type: image/(jpeg|jpg)'", "grep -Eiq '^content-type: image/webp'")
          s = s.replace('Policing hero did not return a JPEG content type.', 'Policing hero did not return a WebP content type.')
          p.write_text(s)

          # Focused metadata regression coverage.
          Path("src/lib/policing-social-image.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { buildSeo } from "./seo";\n\nconst HERO = "/images/news/texas-policing-agencies-compared-seven-role-0c284fef115e.webp";\n\ndescribe("policing comparison social image metadata", () => {\n  it("emits the exact seven-role WebP in Open Graph and Twitter metadata", () => {\n    const seo = buildSeo({\n      title: "Texas Law Enforcement: Who does what?",\n      description: "Texas law-enforcement roles compared.",\n      path: "/news/texas-policing-agencies-compared",\n      image: HERO,\n      imageWidth: 1280,\n      imageHeight: 672,\n      type: "article",\n    });\n    const by = (key: string, value: string) => seo.meta.find((m) => m[key] === value)?.content;\n    expect(by("property", "og:image")).toBe(`https://keeptxred.com${HERO}`);\n    expect(by("property", "og:image:type")).toBe("image/webp");\n    expect(by("property", "og:image:width")).toBe("1280");\n    expect(by("property", "og:image:height")).toBe("672");\n    expect(by("name", "twitter:image")).toBe(`https://keeptxred.com${HERO}`);\n  });\n});\n''')
          PY

          test -s public/images/news/texas-policing-agencies-compared-seven-role-0c284fef115e.webp
          echo '0c284fef115ecc633eeae984a79fbbacac6e80f2f0a3526c3a1a5c8e6396814a  public/images/news/texas-policing-agencies-compared-seven-role-0c284fef115e.webp' | sha256sum -c -
          test "$(wc -c < public/images/news/texas-policing-agencies-compared-seven-role-0c284fef115e.webp)" -eq 59616

          rm -f .github/workflows/finalize-policing-seven-role.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hard-lock full seven-role policing hero'
          git push origin HEAD
