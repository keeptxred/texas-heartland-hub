name: Verify policing comparison live

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy KeepTXRed to Cloudflare Workers
      - Deploy verified KeepTXRed to Cloudflare
    types: [completed]

permissions:
  contents: read

concurrency:
  group: policing-comparison-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployed asset source
        uses: actions/checkout@v5

      - name: Verify live article and exact dedicated hero bytes
        env:
          SITE_URL: https://keeptxred.com
          ARTICLE_PATH: /news/texas-policing-agencies-compared
          HERO_PATH: /images/news/texas-policing-agencies-compared-full-c089e1bb.jpg
          OLD_HERO_PATH: /images/news/texas-policing-agencies-compared.jpg
          REPO_HERO: public/images/news/texas-policing-agencies-compared-full-c089e1bb.jpg
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          article="$(mktemp)"
          hero="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$article" "$hero" "$headers"' EXIT

          test -s "$REPO_HERO" || {
            echo "Expected repository hero is missing: $REPO_HERO" >&2
            exit 1
          }

          status="$(curl --location --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --silent --show-error \
            -o "$article" -w '%{http_code}' \
            "$SITE_URL$ARTICLE_PATH?ktr_live_smoke=$stamp")"
          if [[ "$status" != '200' ]]; then
            echo "Expected policing comparison HTTP 200, got $status" >&2
            cat "$article" >&2 || true
            exit 1
          fi

          grep -Fq 'Texas Law Enforcement' "$article" || {
            echo 'Live article HTML is missing the expected Texas Law Enforcement headline.' >&2
            exit 1
          }
          grep -Fq "$HERO_PATH" "$article" || {
            echo "Live article HTML does not reference the cache-safe policing hero: $HERO_PATH" >&2
            exit 1
          }
          if grep -Fq "$OLD_HERO_PATH" "$article"; then
            echo "Live article HTML still references the retired policing hero path: $OLD_HERO_PATH" >&2
            exit 1
          fi

          hero_status="$(curl --location --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --silent --show-error \
            -D "$headers" -o "$hero" -w '%{http_code}' \
            "$SITE_URL$HERO_PATH?ktr_live_smoke=$stamp")"
          if [[ "$hero_status" != '200' ]]; then
            echo "Expected policing hero HTTP 200, got $hero_status" >&2
            exit 1
          fi
          grep -Eiq '^content-type: image/(jpeg|jpg)' "$headers" || {
            echo 'Policing hero did not return a JPEG content type.' >&2
            cat "$headers" >&2
            exit 1
          }

          if ! cmp --silent "$REPO_HERO" "$hero"; then
            echo 'Live policing hero bytes do not match the repository-approved asset.' >&2
            echo "repo sha256: $(sha256sum "$REPO_HERO" | awk '{print $1}')" >&2
            echo "live sha256: $(sha256sum "$hero" | awk '{print $1}')" >&2
            exit 1
          fi

          bytes="$(wc -c < "$hero" | tr -d ' ')"
          digest="$(sha256sum "$hero" | awk '{print $1}')"
          echo "Live policing comparison verified: HTTP 200, cache-safe hero referenced, exact bytes match (${bytes} bytes, sha256 ${digest})."
