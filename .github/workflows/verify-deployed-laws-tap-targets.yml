name: Verify deployed law touch targets

on:
  workflow_run:
    workflows:
      - "Deploy verified KeepTXRed to Cloudflare"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-law-tap-targets-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  touch-targets:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install headless Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check actual deployed 44px law actions
        run: bunx playwright test --config=playwright.laws-deployed.config.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-laws-tap-targets
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
