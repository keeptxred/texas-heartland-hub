name: Apply Viral Radar visibility fix

on:
  push:
    paths:
      - .github/workflows/apply-viral-radar-visibility-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Viral Radar filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/ViralRadarPanel.tsx')
          text = path.read_text()

          old = '''function shouldShowRow(row: Row, result: RewritePreflightResult): boolean {
            if (row.internal_slug) return true;
            if (result.rewriteable) return true;
            return result.reason === "PENDING_EXTRACTION";
          }'''
          new = '''function shouldShowRow(row: Row, result: RewritePreflightResult): boolean {
            if (row.internal_slug) return true;
            if (result.rewriteable) return true;
            // Persisted preflight means extraction already ran. Any persisted
            // non-ready result is terminal and must leave the publish queue.
            if (row.preflight_json) return false;
            return result.reason === "PENDING_EXTRACTION";
          }'''

          if old not in text:
              raise SystemExit('Expected shouldShowRow helper was not found')

          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-time workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-viral-radar-visibility-fix.yml
          git add src/components/admin/ViralRadarPanel.tsx
          git commit -m "Hide completed failed preflight items from Viral Radar"
          git push origin main
