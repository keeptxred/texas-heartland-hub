name: Apply Viral Radar visibility fix

on:
  push:
    paths:
      - .github/workflows/apply-viral-radar-visibility-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Viral Radar filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/ViralRadarPanel.tsx')
          text = path.read_text()

          old_helper = '''function shouldShowRow(row: Row, result: RewritePreflightResult): boolean {
            if (row.internal_slug) return true;
            if (result.rewriteable) return true;
            return result.reason === "PENDING_EXTRACTION";
          }'''
          new_helper = '''function shouldShowRow(row: Row, result: RewritePreflightResult): boolean {
            if (row.internal_slug) return true;
            if (result.rewriteable) return true;
            // A persisted snapshot means extraction/preflight already ran. Any
            // persisted non-ready result is terminal and should not remain in
            // the publish queue. Only never-tested rows stay visible as pending.
            if (row.preflight_json) return false;
            return result.reason === "PENDING_EXTRACTION";
          }'''

          old_items = '    const items = [...recentRows];'
          new_items = '    const items = recentRows.filter((row) => shouldShowRow(row, preflightById[row.id]));'

          if old_helper not in text:
              raise SystemExit('Expected shouldShowRow helper was not found')
          if old_items not in text:
              raise SystemExit('Expected filtered-items line was not found')

          text = text.replace(old_helper, new_helper, 1)
          text = text.replace(old_items, new_items, 1)
          path.write_text(text)
          PY
      - name: Remove one-time workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-viral-radar-visibility-fix.yml
          git add src/components/admin/ViralRadarPanel.tsx
          git commit -m "Hide completed failed preflight items from Viral Radar"
          git push origin main
