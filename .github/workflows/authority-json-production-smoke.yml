name: Authority JSON Production Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/authority-json-production-smoke.yml'
      - 'src/routes/elections*'
      - 'src/lib/elections/**'
      - 'src/routes/bills/texas/**'
      - 'src/lib/bill-primary-source-reference.ts'
      - 'public/citation-magnets.json'
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sanity check workflow execution
        run: echo 'Authority JSON production smoke workflow is runnable'
