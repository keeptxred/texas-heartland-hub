name: Authority JSON Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-json-production-smoke.yml'
      - 'scripts/authority/verify-political-geography-production.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/authority-json-production-smoke.yml'
      - 'scripts/authority/**'
      - 'src/routes/elections*'
      - 'src/lib/elections/**'
      - 'src/routes/bills/texas/**'
      - 'src/lib/bill-primary-source-reference.ts'
      - 'public/citation-magnets.json'
      - 'src/data/texas-political-geography-authority.ts'
      - 'src/data/texas-political-history-authority.ts'
      - 'src/routes/keep-texas-red.tsx'
      - 'src/routes/texas-politics.texas-political-geography-history.tsx'
      - 'src/routes/texas-politics.texas-urban-suburban-rural-politics-history.tsx'
      - 'src/routes/texas-politics.south-texas-rio-grande-valley-political-history.tsx'
      - 'src/routes/texas-politics.texas-metro-regional-realignment-history.tsx'
      - 'src/routes/texas-politics.why-texas-is-politically-competitive.tsx'
      - 'src/routes/texas-politics.how-texas-became-republican.tsx'
      - 'src/routes/texas-politics.index.tsx'
      - 'src/routes/sitemap-political-geography*'
      - 'src/routes/sitemap*'
  workflow_run:
    workflows:
      - 'Deploy verified KeepTXRed to Cloudflare'
      - 'Deploy KeepTXRed to Cloudflare Workers'
    types: [completed]
  workflow_dispatch: {}
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read

env:
  SITE_URL: https://keeptxred.com

jobs:
  validate-script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate production smoke scripts
        run: python3 -m py_compile scripts/authority/smoke-production.py scripts/authority/verify-political-profiles-production.py scripts/authority/verify-political-geography-production.py scripts/seo/verify-texasdefined-ownership-destinations.py

  smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify live machine-readable authority resources
        run: |
          python3 -u - <<'PY'
          import runpy
          import time

          smoke = runpy.run_path("scripts/authority/smoke-production.py")
          checks = (
              ("election reference", "verify_elections"),
              ("bill reference", "verify_bill"),
              ("citation manifest", "verify_manifest"),
          )

          for label, function_name in checks:
              started = time.monotonic()
              print(f"SMOKE START: {label}", flush=True)
              try:
                  smoke[function_name]()
              except Exception as exc:
                  elapsed = time.monotonic() - started
                  print(
                      f"SMOKE FAIL: {label} after {elapsed:.1f}s: {exc}",
                      flush=True,
                  )
                  raise
              elapsed = time.monotonic() - started
              print(f"SMOKE PASS: {label} in {elapsed:.1f}s", flush=True)

          print("Authority JSON production smoke passed", flush=True)
          PY

  city-migration-smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify city migration redirects on production
        run: python3 scripts/authority/smoke-production.py --city-migration-only

  political-profile-smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify original political profiles on production
        run: python3 scripts/authority/verify-political-profiles-production.py

  political-geography-smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify political geography authority routes and sitemap ownership
        run: python3 scripts/authority/verify-political-geography-production.py
