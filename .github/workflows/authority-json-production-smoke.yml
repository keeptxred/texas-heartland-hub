name: Authority JSON Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/authority-json-production-smoke.yml'
      - 'src/routes/elections.reference[.]json.ts'
      - 'src/lib/elections/referenceExport.ts'
      - 'src/routes/bills/texas/**'
      - 'src/lib/bill-primary-source-reference.ts'
      - 'public/citation-magnets.json'
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read

concurrency:
  group: authority-json-production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://keeptxred.com
    steps:
      - name: Verify Election Central reference JSON
        shell: bash
        run: |
          set -euo pipefail
          url="$SITE_URL/elections/reference.json"
          curl --retry 4 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
            --max-time 30 -D /tmp/election.headers -o /tmp/election.json "$url"

          grep -Eqi '^content-type:[[:space:]]*application/json' /tmp/election.headers
          grep -Eqi '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*follow' /tmp/election.headers

          python3 - /tmp/election.json <<'PY'
          import json, sys

          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)

          expected = {
              'schemaVersion': 1,
              'site': 'Keep TX Red',
              'electionCycle': '2026',
              'canonicalHub': 'https://keeptxred.com/elections/2026',
              'generatedFrom': 'published_verified_records',
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'Election reference mismatch: {key}={data.get(key)!r}, expected {value!r}')

          races = data.get('races')
          candidates = data.get('candidates')
          if not isinstance(races, list) or not races:
              raise SystemExit('Election reference has no published verified races')
          if not isinstance(candidates, list) or not candidates:
              raise SystemExit('Election reference has no published verified candidates')

          for race in races:
              if not str(race.get('canonicalUrl', '')).startswith('https://keeptxred.com/elections/races/'):
                  raise SystemExit(f'Invalid race canonical URL: {race.get("canonicalUrl")!r}')
          for candidate in candidates:
              if not str(candidate.get('canonicalUrl', '')).startswith('https://keeptxred.com/elections/candidates/'):
                  raise SystemExit(f'Invalid candidate canonical URL: {candidate.get("canonicalUrl")!r}')

          forbidden_keys = {
              'email', 'phone', 'dateOfBirth', 'donationUrl', 'biography',
              'campaignWebsite', 'internalNotes', 'forecast', 'contactInfo',
          }
          def walk(value):
              if isinstance(value, dict):
                  leaked = forbidden_keys.intersection(value)
                  if leaked:
                      raise SystemExit(f'Election reference leaked forbidden keys: {sorted(leaked)}')
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          print(f'Election reference healthy: races={len(races)} candidates={len(candidates)} asOf={data.get("asOf")}')
          PY

      - name: Verify Texas bill primary-source reference JSON
        shell: bash
        run: |
          set -euo pipefail
          url="$SITE_URL/bills/texas/89/sb/37/reference.json"
          curl --retry 4 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
            --max-time 30 -D /tmp/bill.headers -o /tmp/bill.json "$url"

          grep -Eqi '^content-type:[[:space:]]*application/json' /tmp/bill.headers
          grep -Eqi '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*follow' /tmp/bill.headers
          grep -Eqi '^link:[[:space:]]*<https://keeptxred\.com/bills/texas/89/sb/37>;[[:space:]]*rel="canonical"' /tmp/bill.headers

          python3 - /tmp/bill.json <<'PY'
          import json, sys

          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)

          expected = {
              'schemaVersion': 1,
              'site': 'Keep TX Red',
              'jurisdiction': 'Texas',
              'billIdentifier': 'SB 37',
              'legislature': 89,
              'canonicalUrl': 'https://keeptxred.com/bills/texas/89/sb/37',
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'Bill reference mismatch: {key}={data.get(key)!r}, expected {value!r}')

          official = data.get('officialBillUrl')
          if not isinstance(official, str) or 'capitol.texas.gov' not in official:
              raise SystemExit(f'Bill reference missing Texas Legislature source URL: {official!r}')

          documents = data.get('documents')
          actions = data.get('actions')
          if not isinstance(documents, list) or not isinstance(actions, list):
              raise SystemExit('Bill reference documents/actions are not arrays')
          if not documents and not actions:
              raise SystemExit('Bill reference contains no primary-source documents or official actions')

          for document in documents:
              url = document.get('officialUrl')
              if not isinstance(url, str) or 'capitol.texas.gov' not in url:
                  raise SystemExit(f'Bill document is not an official Texas Legislature URL: {url!r}')

          forbidden_keys = {
              'id', 'metadata', 'internal_note', 'internalNotes', 'editorialRelationships',
              'ingestionMetadata', 'created_at', 'updated_at',
          }
          def walk(value):
              if isinstance(value, dict):
                  leaked = forbidden_keys.intersection(value)
                  if leaked:
                      raise SystemExit(f'Bill reference leaked forbidden keys: {sorted(leaked)}')
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          print(f'Bill reference healthy: documents={len(documents)} actions={len(actions)} lastSyncedAt={data.get("lastSyncedAt")}')
          PY

      - name: Verify discovery manifest advertises both resources
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
            --max-time 30 -o /tmp/citation-magnets.json "$SITE_URL/citation-magnets.json"
          grep -Fq '/elections/reference.json' /tmp/citation-magnets.json
          grep -Fq '/bills/texas/{legislature}/{bill-type}/{bill-number}/reference.json' /tmp/citation-magnets.json
          echo 'Citation manifest advertises both authority JSON resources'
