name: KeepTXRed IndexNow

on:
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Submit every canonical URL instead of only recently changed URLs
        required: false
        type: boolean
        default: false
      urls:
        description: Optional canonical URLs for explicit publish/update/delete/redirect notification (space or comma separated)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: keeptxred-indexnow
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INDEXNOW_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
      INDEXNOW_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.urls || '' }}
      INDEXNOW_FRESHNESS_HOURS: ${{ github.event_name == 'schedule' && '3' || '2' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify production crawler, canonical, sitemap and asset access
        run: node scripts/seo/verify-search-production.mjs

      - name: Notify IndexNow of canonical meaningful changes
        run: node scripts/seo/submit-indexnow.mjs
