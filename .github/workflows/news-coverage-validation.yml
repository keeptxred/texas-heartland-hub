name: Validate Texas News Coverage

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/viral-score.ts'
      - 'src/lib/viral-score.test.ts'
      - 'src/lib/nlp.ts'
      - 'src/routes/api/public/hooks/ingest-feeds.ts'
      - 'supabase/migrations/*news*coverage*.sql'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/news-coverage-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/viral-score.ts'
      - 'src/lib/viral-score.test.ts'
      - 'src/lib/nlp.ts'
      - 'src/routes/api/public/hooks/ingest-feeds.ts'
      - 'supabase/migrations/*news*coverage*.sql'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/news-coverage-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-news-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run statewide coverage regression tests
        run: bunx vitest run src/lib/viral-score.test.ts
