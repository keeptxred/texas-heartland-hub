name: Flyover scheduled publish bridge

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.user.login == 'keeptxred' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[Flyover Publish KTR] ')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Validate exact-feed trigger envelope
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          first_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '1p')"
          run_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '2p')"
          site_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '3p')"
          feed_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '4p')"
          line_count="$(printf '%s\n' "$ISSUE_BODY" | awk 'END {print NR}')"

          [[ "$line_count" -eq 4 ]]
          [[ "$first_line" == "flyover_publish_request_v2" ]]
          [[ "$run_line" =~ ^run_id=[A-Za-z0-9._:-]{8,160}$ ]]
          [[ "$site_line" == "site=ktr" ]]
          [[ "$feed_line" =~ ^feed_id=[1-9][0-9]*$ ]]

          echo "RUN_ID=${run_line#run_id=}" >> "$GITHUB_ENV"
          echo "FEED_ID=${feed_line#feed_id=}" >> "$GITHUB_ENV"

      - name: Dispatch protected exact-feed KTR publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run run-daily-news-now.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f flyover_feed_id="$FEED_ID" \
            -f flyover_run_id="$RUN_ID"

      - name: Resolve exact dispatched production run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="Flyover $RUN_ID feed $FEED_ID"
          for attempt in $(seq 1 30); do
            rows="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow run-daily-news-now.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 30 \
              --json databaseId,status,url,displayTitle)"
            row="$(jq -c --arg expected "$expected" '[.[] | select(.displayTitle == $expected)][0] // {}' <<<"$rows")"
            run_id="$(jq -r '.databaseId // 0' <<<"$row")"
            if [[ "$run_id" != "0" ]]; then
              echo "DISPATCHED_RUN_ID=$run_id" >> "$GITHUB_ENV"
              echo "DISPATCHED_RUN_URL=$(jq -r '.url // ""' <<<"$row")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done

          echo "No matching exact-feed Run Daily News Now dispatch appeared." >&2
          exit 1

      - name: Wait for protected exact-feed KTR publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if gh run watch "$DISPATCHED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status; then
            exit 0
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Flyover exact-feed bridge \`$RUN_ID\` for feed \`$FEED_ID\` reached the protected KTR publisher, but downstream Actions run $DISPATCHED_RUN_URL failed. This issue remains open for side-effect reconciliation or one safe retry."
          exit 1

      - name: Record successful exact-feed result and close request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Flyover exact-feed bridge completed \`$RUN_ID\` for feed \`$FEED_ID\`. The protected KTR publisher, hero-image gate, and live-URL verification succeeded. Actions run: $DISPATCHED_RUN_URL"
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed
