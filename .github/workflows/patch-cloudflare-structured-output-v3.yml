name: Patch Cloudflare Structured Output V3
on:
  push:
    branches: [agent/cloudflare-structured-output]
    paths: ['.github/workflows/patch-cloudflare-structured-output-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-structured-output
      - run: python scripts/patch-cloudflare-structured-output.py
      - run: git diff --check
      - run: |
          git config user.name keeptxred-bot
          git config user.email actions@users.noreply.github.com
          git add src/server.ts src/routes/api/public/hooks/generate-news.ts
          git commit -m "Use Cloudflare structured output schema"
          git push origin HEAD:agent/cloudflare-structured-output
