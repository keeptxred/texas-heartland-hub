name: Calculator validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/*calculator*.tsx"
      - "src/routes/moving-checklist.tsx"
      - "src/routes/migrated-tool-redirects.test.ts"
      - "src/lib/migrated-tool-canonical.ts"
      - "src/lib/migrated-tool-canonical.test.ts"
      - "src/lib/migrated-tool-production-smoke-contract.test.ts"
      - "src/lib/texasdefined-ownership-destination-production-smoke-contract.test.ts"
      - "scripts/authority/smoke-production.py"
      - "scripts/seo/verify-texasdefined-ownership-destinations.py"
      - "scripts/shared/validate-retired-lifestyle-code.mjs"
      - ".github/workflows/calculator-validation.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck surviving calculator handoff contracts
        run: bun run typecheck
      - name: Run calculator ownership tests
        run: bunx vitest run src/routes/migrated-tool-redirects.test.ts src/lib/migrated-tool-canonical.test.ts src/lib/migrated-tool-production-smoke-contract.test.ts src/lib/texasdefined-ownership-destination-production-smoke-contract.test.ts
      - name: Validate production smoke syntax
        run: python3 -m py_compile scripts/authority/smoke-production.py scripts/seo/verify-texasdefined-ownership-destinations.py
      - name: Validate retired calculator code stays retired
        run: node scripts/shared/validate-retired-lifestyle-code.mjs
      - name: Lint calculator handoff contracts
        run: |
          bunx eslint --rule 'prettier/prettier: off' \
            src/lib/migrated-tool-canonical.ts \
            src/lib/migrated-tool-canonical.test.ts \
            src/lib/migrated-tool-production-smoke-contract.test.ts \
            src/lib/texasdefined-ownership-destination-production-smoke-contract.test.ts \
            src/routes/migrated-tool-redirects.test.ts \
            src/routes/*calculator*.tsx \
            src/routes/moving-checklist.tsx
