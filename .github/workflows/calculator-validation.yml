name: Calculator validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/calculators/**"
      - "src/components/budget/**"
      - "src/components/closingCosts/**"
      - "src/components/cost/**"
      - "src/components/downPayment/**"
      - "src/components/equity/**"
      - "src/components/home/**"
      - "src/components/homeAffordability/**"
      - "src/components/income/**"
      - "src/components/mortgage/**"
      - "src/data/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage}/**"
      - "src/lib/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage,calculators}/**"
      - "src/pages/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage}/**"
      - "src/types/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage}/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.calculators.json"
      - ".github/workflows/calculator-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/components/calculators/**"
      - "src/components/budget/**"
      - "src/components/closingCosts/**"
      - "src/components/cost/**"
      - "src/components/downPayment/**"
      - "src/components/equity/**"
      - "src/components/home/**"
      - "src/components/homeAffordability/**"
      - "src/components/income/**"
      - "src/components/mortgage/**"
      - "src/data/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage}/**"
      - "src/lib/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage,calculators}/**"
      - "src/pages/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage}/**"
      - "src/types/{budget,closingCosts,cost,downPayment,equity,home,homeAffordability,income,mortgage}/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.calculators.json"
      - ".github/workflows/calculator-validation.yml"

permissions:
  contents: read

concurrency:
  group: calculator-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck calculator code
        run: bunx tsc -p tsconfig.calculators.json --pretty false
      - name: Run calculator tests
        run: bunx vitest run src/lib/calculators/__tests__/financialEngines.test.ts
      - name: Lint calculator code
        run: |
          bunx eslint --rule 'prettier/prettier: off' \
            src/components/calculators \
            src/components/budget \
            src/components/closingCosts \
            src/components/cost \
            src/components/downPayment \
            src/components/equity \
            src/components/home \
            src/components/homeAffordability \
            src/components/income \
            src/components/mortgage \
            src/data/budget \
            src/data/closingCosts \
            src/data/cost \
            src/data/downPayment \
            src/data/equity \
            src/data/home \
            src/data/homeAffordability \
            src/data/income \
            src/data/mortgage \
            src/lib/budget \
            src/lib/closingCosts \
            src/lib/cost \
            src/lib/downPayment \
            src/lib/equity \
            src/lib/home \
            src/lib/homeAffordability \
            src/lib/income \
            src/lib/mortgage \
            src/pages/budget \
            src/pages/closingCosts \
            src/pages/cost \
            src/pages/downPayment \
            src/pages/equity \
            src/pages/home \
            src/pages/homeAffordability \
            src/pages/income \
            src/pages/mortgage \
            src/types/budget \
            src/types/closingCosts \
            src/types/cost \
            src/types/downPayment \
            src/types/equity \
            src/types/home \
            src/types/homeAffordability \
            src/types/income \
            src/types/mortgage
