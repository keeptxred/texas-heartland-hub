name: Broken link audit

# Source-only checks run on affected PRs; full production crawl is weekly/manual.
# Zero-debt policy: retired internal links are no longer report-only once the migration backlog is cleared.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/broken-link-audit.yml'
      - 'scripts/seo/audit-broken-links.mjs'
      - 'scripts/seo/broken-link-audit-utils.mjs'
      - 'scripts/seo/broken-link-scan-scope.mjs'
      - 'src/routes/**'
      - 'src/server.ts'
      - 'src/server/**'
permissions:
  contents: read

concurrency:
  group: broken-link-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # PR merge ref and its first-parent base for changed-path detection
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit repository; require live verification for audit-code PRs
        id: audit
        env:
          AUDIT_SITE_URL: https://keeptxred.com
          AUDIT_FETCH_ORIGIN: https://keeptxred-site.freddy-coppola.workers.dev
        run: |
          if [[ "${{ github.event_name }}" == 'schedule' || "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            node scripts/seo/audit-broken-links.mjs --live
          elif [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            # Fail closed if the merge-base diff cannot be read. Avoid full live
            # production crawls for route-only PRs under the request budget.
            changed_files="$(git diff --name-only HEAD^1 HEAD)"
            if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/broken-link-audit\.yml|scripts/seo/(audit-broken-links|broken-link-audit-utils|broken-link-scan-scope)\.mjs)$'; then
              node scripts/seo/audit-broken-links.mjs --live
            else
              node scripts/seo/audit-broken-links.mjs
            fi
          else
            node scripts/seo/audit-broken-links.mjs
          fi
        continue-on-error: true
      - name: Publish audit summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/broken-link-audit.json', 'utf8'));
          const out = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(out, '# KeepTXRed broken-link audit\n\n');
          fs.appendFileSync(out, `- Blocking static findings: **${report.summary.blockingStaticFindings}**\n`);
          fs.appendFileSync(out, `- Migration-link findings: **${report.summary.migrationStaticFindings + report.summary.migrationLiveFindings}**\n`);
          fs.appendFileSync(out, `- Live pages checked: **${report.summary.livePagesChecked}**\n`);
          fs.appendFileSync(out, `- Blocking live failures: **${report.summary.blockingLiveFailures}**\n`);
          fs.appendFileSync(out, `- Canonical site: **${report.site}**\n`);
          fs.appendFileSync(out, `- Live fetch origin: **${report.liveFetchOrigin}**\n\n`);
          const actionable = [...report.staticFindings, ...report.liveFailures].filter((item) => item.severity === 'blocking');
          const migration = [...report.staticFindings, ...report.liveFailures].filter((item) => item.severity === 'migration-debt');
          console.log(`Blocking static findings: ${report.summary.blockingStaticFindings}`);
          console.log(`Migration-link findings: ${report.summary.migrationStaticFindings + report.summary.migrationLiveFindings}`);
          console.log(`Blocking live failures: ${report.summary.blockingLiveFailures}`);
          if (actionable.length) {
            console.log('Actionable findings:');
            for (const item of actionable.slice(0, 200)) {
              console.log(`- ${item.type}: ${item.file || item.source || item.url || ''}${item.line ? `:${item.line}` : ''} ${item.pathname || item.raw || item.status || item.error || ''}`);
            }
            fs.appendFileSync(out, '## Actionable findings\n\n');
            for (const item of actionable.slice(0, 200)) {
              fs.appendFileSync(out, `- \`${item.type}\`: ${item.file || item.source || item.url || ''}${item.line ? `:${item.line}` : ''} ${item.pathname || item.raw || item.status || item.error || ''}\n`);
            }
          }
          if (migration.length) {
            fs.appendFileSync(out, '\n## Migration debt (must be zero)\n\n');
            for (const item of migration.slice(0, 50)) {
              fs.appendFileSync(out, `- \`${item.type}\`: ${item.file || item.source || item.url || ''}${item.line ? `:${item.line}` : ''} ${item.pathname || item.raw || ''}\n`);
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broken-link-audit
          path: artifacts/broken-link-audit.json
          retention-days: 14
      - name: Enforce zero broken-link debt
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/broken-link-audit.json', 'utf8'));
          if (report.summary.staticFindings || report.summary.liveFailures) process.exit(1);
          NODE
