name: Generate Election Central polling averages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/data/elections/2026/polls.json"
      - "src/data/elections/2026/candidates.json"
      - "src/data/elections/2026/races.json"
      - "scripts/elections/polling-averages.ts"
      - "scripts/elections/validate-forecast-pipeline.mjs"
      - "src/lib/elections/pollingAverage.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-polling-averages.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: election-polling-averages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate weighted averages
        run: bun run elections:polling-averages
      - name: Validate forecast pipeline
        run: bun run elections:validate:forecast
      - name: Publish derived polling averages as protected PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Regenerate Election Central polling averages
          PR_BODY: Automated weighted polling-average regeneration. The forecast pipeline passed before this PR opened; protected verify still gates merge and deployment.
          COMMIT_MESSAGE: Regenerate weighted election polling averages
        shell: bash
        run: |
          set -euo pipefail
          target='src/data/elections/2026/polling-averages.json'
          if git diff --quiet -- "$target"; then
            echo "Polling averages are already current."
            exit 0
          fi
          changed="$(git status --short | awk '{print $2}')"
          unexpected_files="$(grep -v '^src/data/elections/2026/polling-averages.json$' <<<"$changed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the polling-average allowlist:"
            echo "$unexpected_files"
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh election-polling-averages "$target"
