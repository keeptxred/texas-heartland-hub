name: Generate Election Central polling averages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/data/elections/2026/polls.json"
      - "src/data/elections/2026/candidates.json"
      - "src/data/elections/2026/races.json"
      - "scripts/elections/polling-averages.ts"
      - "scripts/elections/validate-forecast-pipeline.mjs"
      - "src/lib/elections/pollingAverage.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-polling-averages.yml"

permissions:
  contents: write

concurrency:
  group: election-polling-averages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate weighted averages
        run: bun run elections:polling-averages

      - name: Validate forecast pipeline
        run: bun run elections:validate:forecast

      - name: Commit derived polling averages
        shell: bash
        run: |
          if git diff --quiet -- src/data/elections/2026/polling-averages.json; then
            echo "Polling averages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026/polling-averages.json
          unexpected_files="$(git diff --cached --name-only | grep -v '^src/data/elections/2026/polling-averages.json$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the polling-average allowlist:"
            echo "$unexpected_files"
            exit 1
          fi
          git commit -m "Regenerate weighted election polling averages"
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo "Main advanced during polling-average generation; refusing to publish stale data."
            exit 1
          fi
          git push origin HEAD:main
