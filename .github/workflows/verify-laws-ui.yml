name: Texas laws mobile and desktop UX

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/laws*.tsx"
      - "src/components/law-topic-page.tsx"
      - "src/components/laws/**"
      - "src/data/law-topic-*.ts"
      - "src/lib/law-topic-search.ts"
      - "playwright.laws.config.ts"
      - "tests/laws/**"
      - ".github/workflows/verify-laws-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: law-ux-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  law-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_VITE_REMOTE_BINDINGS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install headless Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify mobile and desktop law authority experience
        run: bunx playwright test --config=playwright.laws.config.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laws-ux-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
