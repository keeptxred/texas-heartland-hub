name: Upgrade Action Runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-action-runtimes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Upgrade supported action runtimes
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 sed -i \
              -e 's#actions/checkout@v4#actions/checkout@v5#g' \
              -e 's#actions/setup-node@v4#actions/setup-node@v5#g' \
              -e 's#actions/setup-python@v5#actions/setup-python@v6#g' \
              -e 's#actions/github-script@v7#actions/github-script@v8#g'

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.parse_file(file); puts \"validated #{file}\" }"

      - name: Commit upgrades
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'No action runtime upgrades required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: upgrade supported GitHub Action runtimes'
          git push origin HEAD:main
