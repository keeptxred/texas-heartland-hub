name: Upgrade Action Runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-action-runtimes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Upgrade, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
              xargs -0 sed -i \
                -e 's#actions/checkout@v4#actions/checkout@v5#g' \
                -e 's#actions/setup-node@v4#actions/setup-node@v5#g' \
                -e 's#actions/setup-python@v5#actions/setup-python@v6#g' \
                -e 's#actions/github-script@v7#actions/github-script@v8#g'

            ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.parse_file(file); puts \"validated #{file}\" }"

            if git diff --quiet -- .github/workflows; then
              echo 'No action runtime upgrades required.'
              exit 0
            fi

            git add .github/workflows
            git commit -m 'ci: upgrade supported GitHub Action runtimes'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} lost a race; retrying."
            sleep $((attempt * 2))
          done

          echo 'Unable to publish action runtime upgrades after five attempts.' >&2
          exit 1
