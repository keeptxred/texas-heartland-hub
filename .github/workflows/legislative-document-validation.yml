name: Legislative document validation

on:
  pull_request:
    paths:
      - 'scripts/legislature/**'
      - 'src/lib/bill-documents.ts'
      - 'src/lib/bill-documents.test.ts'
      - 'src/routes/bills/texas/**'
      - 'supabase/migrations/*legislative_document*'
      - 'package.json'
      - '.github/workflows/legislative-document-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run archive importer smoke test
        run: node scripts/legislature/test-local-documents.mjs

      - name: Run official document parser tests
        run: npm run legislature:archive:test-parser

      - name: Run bill document grouping tests
        run: npx vitest run src/lib/bill-documents.test.ts
