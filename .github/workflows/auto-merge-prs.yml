name: Auto-merge eligible PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    # Only auto-merge trusted, same-repository, non-draft PRs. Branch protection
    # and every required status check still gate the actual merge.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Wait for merge and verify current main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # This poller remains in the originating workflow because GITHUB_TOKEN
          # suppresses ordinary push/close workflow triggers from its own merge.
          for attempt in $(seq 1 300); do
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            merged_at="$(python3 - "$pr_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print(data.get("merged_at") or "")
          PY
            )"
            state="$(python3 - "$pr_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          print(data.get("state") or "")
          PY
            )"

            if [[ -n "$merged_at" ]]; then
              gh workflow run shared-vitest.yml --ref main --repo "$REPOSITORY"
              echo "Merged PR #$PR_NUMBER; dispatched repository health verification for current main."
              exit 0
            fi

            if [[ "$state" == "closed" ]]; then
              echo "PR #$PR_NUMBER closed without merging; no main verification dispatch needed."
              exit 0
            fi

            sleep 5
          done

          echo "::error title=Auto-merge wait timed out::PR #$PR_NUMBER did not merge within 25 minutes."
          exit 1
