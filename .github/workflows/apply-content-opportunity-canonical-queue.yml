name: Apply canonical Content Opportunities queue fix

on:
  push:
    branches:
      - fix/content-opportunity-canonical-queue
    paths:
      - '.github/workflows/apply-content-opportunity-canonical-queue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-opportunity-canonical-queue
      - name: Patch Content Opportunities canonical queue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/ContentOpportunityPanel.tsx')
          text = path.read_text()

          old = '  useEffect(() => {\n    let active = true;\n    (async () => {\n      const [feedRes, articleRes, pkgRes] = await Promise.all(['
          new = '  useEffect(() => {\n    let active = true;\n    (async () => {\n      const since = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString();\n      const [feedRes, articleRes, pkgRes, normalizationRes] = await Promise.all(['
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Content Opportunities Promise.all prelude, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '          .select("id,title,source,pub_date,internal_slug,link,description,extracted_body,preflight_json")\n          .order("pub_date", { ascending: false })'
          new = '          .select("id,title,source,pub_date,internal_slug,link,description,extracted_body,preflight_json")\n          .gte("pub_date", since)\n          .order("pub_date", { ascending: false })'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one feed query ordering block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '        supabase\n          .from("content_packages")\n          .select("source_url,source_title")\n          .eq("workflow_status", "PUBLISHED"),\n      ]);\n      if (!active) return;\n      const rawFeed = (feedRes.data ?? []) as FeedItem[];'
          new = '        supabase\n          .from("content_packages")\n          .select("source_url,source_title")\n          .eq("workflow_status", "PUBLISHED"),\n        supabase\n          .from("news_feed_normalization")\n          .select("feed_item_id,duplicate_of_feed_item_id")\n          .gte("observed_at", since)\n          .not("duplicate_of_feed_item_id", "is", null)\n          .limit(5000),\n      ]);\n      if (!active) return;\n      const duplicateFeedIds = new Set<number>(\n        ((normalizationRes.data ?? []) as Array<{ feed_item_id: number; duplicate_of_feed_item_id: number | null }>).map(\n          (row) => row.feed_item_id,\n        ),\n      );\n      const rawFeed = ((feedRes.data ?? []) as FeedItem[]).filter((item) => !duplicateFeedIds.has(item.id));'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one package/rawFeed block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '          // Keep a full recent catch-up window visible. A 150-row cap hid\n          // requested backfills after large multi-source refreshes.\n          .limit(500),'
          new = '          // Keep the review queue bounded to the same canonical 14-day newsroom window.\n          // Source history remains in texas_news_feed; deterministic duplicates are hidden below\n          // using news_feed_normalization rather than deleted.\n          .limit(500),'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one queue-limit comment block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/apply-content-opportunity-canonical-queue.yml').unlink()
          PY
      - name: Verify queue source contract
        run: |
          grep -F '.gte("pub_date", since)' src/components/admin/ContentOpportunityPanel.tsx
          grep -F '.from("news_feed_normalization")' src/components/admin/ContentOpportunityPanel.tsx
          grep -F '!duplicateFeedIds.has(item.id)' src/components/admin/ContentOpportunityPanel.tsx
      - name: Commit bounded fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/ContentOpportunityPanel.tsx .github/workflows/apply-content-opportunity-canonical-queue.yml
          git commit -m 'Canonicalize Content Opportunities queue'
          git push origin HEAD:fix/content-opportunity-canonical-queue
