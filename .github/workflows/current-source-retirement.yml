name: Current source retirement cleanup

on:
  push:
    branches:
      - cleanup/current-source-retirement

permissions:
  contents: write

concurrency:
  group: current-source-retirement
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          ref: cleanup/current-source-retirement
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Remove retired integration traces
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          vendor = 'lova' + 'ble'
          Vendor = 'Lova' + 'ble'
          VENDOR = 'LOVA' + 'BLE'
          old_asset_marker = '__' + 'l5e'
          old_ai_host = f'ai.gateway.{vendor}.dev'
          internal_ai_host = 'ai.internal.keeptxred.local'
          starter_a = 'gpt' + 'engineer'
          starter_b = 'gpt' + '-engineer'

          tracked = [p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p]

          # Metadata sidecars were only used by the retired hosted-asset system.
          for rel in tracked:
              if not rel.endswith('.asset.json'):
                  continue
              path = root / rel
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old_asset_marker.lower() in text.lower() or vendor.lower() in text.lower():
                  path.unlink()

          absolute_asset_re = re.compile(
              rf'https://(?:www\.)?keeptxred\.com/{re.escape(old_asset_marker)}/assets-v1/[0-9a-f-]+/([A-Za-z0-9._-]+)',
              re.I,
          )
          relative_asset_re = re.compile(
              rf'/{re.escape(old_asset_marker)}/assets-v1/[0-9a-f-]+/([A-Za-z0-9._-]+)',
              re.I,
          )

          def absolute_asset_replacement(match):
              filename = match.group(1).lower()
              if filename == 'red-texas-icon.png':
                  return 'https://keeptxred.com/keep-tx-red-icon.svg'
              return 'https://keeptxred.com/og/default.jpg'

          def relative_asset_replacement(match):
              filename = match.group(1).lower()
              if filename == 'red-texas-icon.png':
                  return '/keep-tx-red-icon.svg'
              return '/og/default.jpg'

          for rel in tracked:
              if rel in {'bun.lock', 'src/routeTree.gen.ts'}:
                  continue
              path = root / rel
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text

              text = absolute_asset_re.sub(absolute_asset_replacement, text)
              text = relative_asset_re.sub(relative_asset_replacement, text)

              text = text.replace(f'https://{old_ai_host}/v1/chat/completions', f'https://{internal_ai_host}/v1/chat/completions')
              text = text.replace(f'https://{old_ai_host}/v1/images/generations', f'https://{internal_ai_host}/v1/images/generations')
              text = text.replace(f'https://{old_ai_host}', f'https://{internal_ai_host}')
              text = re.sub(rf'https://[A-Za-z0-9.-]*{re.escape(vendor)}\.app', 'https://keeptxred.com', text, flags=re.I)
              text = re.sub(rf'https://(?:www\.)?{re.escape(vendor)}\.dev', 'https://github.com/keeptxred/texas-heartland-hub', text, flags=re.I)

              text = text.replace('_' + vendor + 'ApiKey', '_aiProviderReady')
              text = text.replace(vendor + 'ApiKey', 'aiProviderReady')
              text = text.replace(Vendor + 'ApiKey', 'AiProviderReady')
              text = text.replace(VENDOR + '_API_KEY', 'KTR_AI_PROVIDER_READY')
              text = text.replace(Vendor + '-API-Key', 'X-KTR-AI-Provider')
              text = text.replace(vendor + '_rewrite_bypassed', 'external_ai_gateway_disabled')
              text = text.replace(vendor + '_image_bypassed', 'external_image_gateway_disabled')
              text = text.replace(VENDOR + '_REWRITE_BYPASSED', 'EXTERNAL_AI_GATEWAY_DISABLED')
              text = text.replace(VENDOR + '_IMAGE_BYPASSED', 'EXTERNAL_IMAGE_GATEWAY_DISABLED')

              text = re.sub(rf'^\s*[\"\']Disallow: /{re.escape(vendor)}/[\"\'],?\s*\n', '', text, flags=re.I | re.M)
              text = re.sub(rf'\b{re.escape(vendor)}(?=[A-Z])', 'legacyBuilder', text)
              text = re.sub(rf'\b{re.escape(Vendor)}(?=[A-Z])', 'LegacyBuilder', text)
              text = re.sub(rf'\b{re.escape(VENDOR)}(?=_)', 'LEGACY_BUILDER', text)
              text = re.sub(rf'\b{re.escape(vendor)}(?=_)', 'legacy_builder', text)
              text = re.sub(rf'\b{re.escape(Vendor)}\b', 'legacy builder', text)
              text = re.sub(rf'\b{re.escape(VENDOR)}\b', 'LEGACY_BUILDER', text)
              text = re.sub(rf'\b{re.escape(vendor)}\b', 'legacy-builder', text)
              text = re.sub(re.escape(starter_a), 'retired-starter', text, flags=re.I)
              text = re.sub(re.escape(starter_b), 'retired-starter', text, flags=re.I)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Strip only source URL strings that point at the retired private registry.
          # Package versions, dependency edges, and integrity hashes remain intact.
          lock = root / 'bun.lock'
          lock_text = lock.read_text(encoding='utf-8')
          lock_text = re.sub(
              rf'"https://[^\"\s]*{re.escape(vendor)}[^\"\s]*"',
              '""',
              lock_text,
              flags=re.I,
          )
          lock.write_text(lock_text, encoding='utf-8')

          # Rebuild from actual current route files so removed compatibility routes vanish.
          route_tree = root / 'src' / 'routeTree.gen.ts'
          if route_tree.exists():
              route_tree.unlink()
          PY

      - name: Normalize lock from current package graph
        run: bun install --lockfile-only

      - name: Install dependencies from normalized lock
        run: bun install --frozen-lockfile

      - name: Build and regenerate route tree
        run: bun run build

      - name: Validate publication boundary
        run: bun run publication:validate

      - name: Validate indexability
        run: bun run seo:indexability

      - name: Run focused regression tests
        run: |
          bunx vitest run \
            src/lib/living-story-update.test.ts \
            src/lib/ingest-feeds-legacy-tier.test.ts \
            src/lib/newsroom-legacy-fallback-budget.test.ts \
            src/routes/api/public/hooks/generate-news.word-budget.test.ts \
            src/routes/api/public/hooks/reconcile-news-history.test.ts

      - name: Remove temporary cleanup files
        run: |
          rm -f .github/workflows/cleanup-retired-builder-traces.yml
          rm -f .github/workflows/finalize-retired-builder-cleanup.yml
          rm -f .github/workflows/current-source-retirement.yml
          rm -f .github/finalize-retired-builder-trigger

      - name: Verify tracked current source is clean
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          vendor = ('lova' + 'ble').lower()
          old_asset_marker = ('__' + 'l5e').lower()
          retired_starter = [('gpt' + 'engineer').lower(), ('gpt' + '-engineer').lower()]
          bad = []
          tracked = [p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p]
          for rel in tracked:
              path = Path(rel)
              if not path.exists():
                  continue
              low_path = rel.lower()
              if vendor in low_path:
                  bad.append(f'path:{rel}:retired-builder-name')
              if old_asset_marker in low_path:
                  bad.append(f'path:{rel}:retired-hosted-asset')
              try:
                  text = path.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if vendor in text:
                  bad.append(f'content:{rel}:retired-builder-name')
              if old_asset_marker in text:
                  bad.append(f'content:{rel}:retired-hosted-asset')
              for term in retired_starter:
                  if term in text:
                      bad.append(f'content:{rel}:retired-starter-term')
          if bad:
              print('\n'.join(sorted(set(bad))))
              raise SystemExit('Current-source retirement scan failed')
          print('Current-source retirement scan: clean')
          PY

      - name: Commit verified cleanup to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove remaining retired integration traces'
          git push origin HEAD:cleanup/current-source-retirement
