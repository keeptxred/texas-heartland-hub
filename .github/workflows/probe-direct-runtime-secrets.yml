name: Probe direct runtime secret presence

on:
  push:
    branches:
      - agent/probe-direct-runtime-secrets
    paths:
      - '.github/workflows/probe-direct-runtime-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AI: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_DEPLOY: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      SB_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SB_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FB_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FB_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FB_REDIRECT: ${{ secrets.FACEBOOK_OAUTH_REDIRECT_URL }}
      META_ID: ${{ secrets.META_APP_ID }}
      META_SECRET: ${{ secrets.META_APP_SECRET }}
      RESEND: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GEMINI: ${{ secrets.GEMINI_API_KEY }}
      LOVABLE: ${{ secrets.LOVABLE_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s=PRESENT\n' "$label"
            else
              printf '%s=MISSING\n' "$label"
            fi
          }
          check CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT"
          check CLOUDFLARE_API_TOKEN "$CF_AI"
          check CLOUDFLARE_DEPLOY_API_TOKEN "$CF_DEPLOY"
          check SUPABASE_SERVICE_ROLE_KEY "$SB_SERVICE"
          check SUPABASE_DB_URL "$SB_DB_URL"
          check FACEBOOK_APP_ID "$FB_ID"
          check FACEBOOK_APP_SECRET "$FB_SECRET"
          check FACEBOOK_OAUTH_REDIRECT_URL "$FB_REDIRECT"
          check META_APP_ID "$META_ID"
          check META_APP_SECRET "$META_SECRET"
          check RESEND_API_KEY "$RESEND"
          check STRIPE_SECRET_KEY "$STRIPE_SECRET"
          check STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK"
          check GEMINI_API_KEY "$GEMINI"
          check LOVABLE_API_KEY "$LOVABLE"
