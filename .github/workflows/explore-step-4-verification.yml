name: Explore Texas Step 4 verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/features/explore/**"
      - "src/services/explore/**"
      - "supabase/functions/explore-*/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "src/integrations/supabase/types.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/explore-step-4-verification.yml"
  push:
    branches:
      - agent/texas-living-platform-phase-v

concurrency:
  group: explore-step-4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify checked-out revision and cron migration
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub SHA: ${GITHUB_SHA}"
          git rev-parse HEAD
          migration="supabase/migrations/20260627133555_f934a17f-5d3a-432f-95b6-47ef8fcaba77.sql"
          test -f "$migration"
          sed -n '1,24p' "$migration"
          if grep -Fqx "SELECT cron.unschedule('generate-evergreen-daily');" "$migration"; then
            echo "Unsafe direct cron.unschedule call is still present in the checked-out migration." >&2
            exit 1
          fi
          grep -Fq "WHERE jobname = 'generate-evergreen-daily'" "$migration"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations to a clean database
        run: supabase db reset --local --no-seed

      - name: Synchronize generated Supabase types
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/supabase-types.ts

          if diff -q src/integrations/supabase/types.ts /tmp/supabase-types.ts >/dev/null; then
            echo "Supabase types are current."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" \
              | grep -E '^(supabase/migrations/|src/integrations/supabase/types\.ts$)' \
              > /tmp/changed-supabase-schema-files.txt || true
            if [[ ! -s /tmp/changed-supabase-schema-files.txt ]]; then
              echo "::warning::Generated Supabase types drift exists on the base branch; this PR does not change the schema or generated types."
              exit 0
            fi
            diff -u src/integrations/supabase/types.ts /tmp/supabase-types.ts || true
            echo "Supabase types are stale and cannot be committed from this event." >&2
            exit 1
          fi

          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "chore: regenerate Supabase types"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Type-check Explore Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          check_with_retry() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4; do
              echo "Deno check attempt ${attempt}/4: ${file}"
              if deno check "$file"; then
                return 0
              fi
              if [[ "$attempt" -lt 4 ]]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          check_with_retry supabase/functions/explore-import/index.ts
          check_with_retry supabase/functions/explore-sync/index.ts
          check_with_retry supabase/functions/explore-review/index.ts

      - name: Run dry-run import smoke test
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"

          db_container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)
          if [[ -z "$db_container" ]]; then
            echo "Unable to locate the local Supabase database container." >&2
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            exit 1
          fi
          echo "Using database container: $db_container"

          mkdir -p /tmp/explore-fixture
          cat > /tmp/explore-fixture/entities.json <<'JSON'
          {
            "records": [
              {
                "id": "step-4-verification-entity",
                "name": "Step 4 Verification Entity",
                "latitude": 30.2672,
                "longitude": -97.7431,
                "description": "Deterministic local verification fixture"
              }
            ]
          }
          JSON

          python3 -m http.server 8765 --directory /tmp/explore-fixture >/tmp/explore-fixture-server.log 2>&1 &
          fixture_pid=$!

          source_id=$(docker exec "$db_container" psql -U postgres -d postgres -qAtc "
            insert into public.explore_import_sources
              (name, source_type, endpoint, enabled, configuration, cursor)
            values
              ('Step 4 verification source', 'custom', 'http://host.docker.internal:8765/entities.json', true, '{}'::jsonb, '{}'::jsonb)
            returning id;
          ")

          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          EXPLORE_IMPORT_SECRET="step-4-verification" \
          supabase functions serve explore-import --no-verify-jwt >/tmp/explore-import.log 2>&1 &
          function_pid=$!

          cleanup() {
            kill "$fixture_pid" "$function_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail --output /dev/null --request OPTIONS http://127.0.0.1:54321/functions/v1/explore-import; then
              break
            fi
            sleep 1
          done

          response_file=/tmp/explore-dry-run-response.json
          http_status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-import-secret: step-4-verification" \
            --data "{\"sourceId\":\"${source_id}\",\"executionMode\":\"dry-run\"}" \
            http://127.0.0.1:54321/functions/v1/explore-import)

          cat "$response_file"
          test "$http_status" = "200"
          job_id=$(jq -r '.jobId' "$response_file")
          test -n "$job_id"
          test "$(jq -r '.statistics.parsed' "$response_file")" = "1"
          test "$(jq -r '.statistics.normalized' "$response_file")" = "1"
          test "$(jq -r '.statistics.inserted' "$response_file")" = "1"

          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc "
            select case when execution_mode = 'dry-run' then 1 else 0 end
            from public.explore_import_jobs
            where id = '${job_id}';
          " | grep -qx 1

          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc "
            select case
              when action = 'insert'
               and review_status = 'pending'
               and normalized_payload->>'externalId' = 'step-4-verification-entity'
               and jsonb_array_length(validation_issues) = 0
              then 1 else 0 end
            from public.explore_import_records
            where job_id = '${job_id}';
          " | grep -qx 1

      - name: Run tests
        run: pnpm test

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Lint Explore Step 4
        run: |
          pnpm exec eslint \
            "src/services/explore/**/*.{ts,tsx}" \
            "src/hooks/explore/**/*.{ts,tsx}" \
            "src/schemas/explore/**/*.{ts,tsx}" \
            "src/types/explore/**/*.{ts,tsx}" \
            "src/routes/admin/explore/**/*.{ts,tsx}" \
            "supabase/functions/explore-*/*.ts"

      - name: Build production application
        run: pnpm build

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-step-4-verification-diagnostics
          path: |
            /tmp/explore-import.log
            /tmp/explore-fixture-server.log
            /tmp/explore-dry-run-response.json
            /tmp/supabase-types.ts
          if-no-files-found: ignore

