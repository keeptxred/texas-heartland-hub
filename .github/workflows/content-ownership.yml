name: Validate Cross-Site Content Ownership

on:
  push:
    branches: [main]
    paths:
      - 'src/shared/platform-core/**'
      - 'src/routes/api.content-disposition.ts'
      - 'scripts/shared/validate-content-ownership.ts'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/content-ownership.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/shared/platform-core/**'
      - 'src/routes/api.content-disposition.ts'
      - 'scripts/shared/validate-content-ownership.ts'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/content-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate content ownership behavior
        run: bun scripts/shared/validate-content-ownership.ts
      - name: Build application
        run: bun run build
