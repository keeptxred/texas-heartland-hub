name: Run Legacy Article Repair

on:
  workflow_dispatch:

permissions:
  contents: read

# Revision 3: require the live pickle article structure and hero remediation.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke published production article structure repair
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://keeptxred.com/api/public/hooks/repair-article-structure'
          for attempt in $(seq 1 32); do
            echo "Repair attempt ${attempt}/32"
            status=$(curl -sS -o /tmp/repair.json -w '%{http_code}' --max-time 30 "$endpoint" || true)
            cat /tmp/repair.json 2>/dev/null || true
            echo
            if [[ "$status" == "200" ]] && jq -e '
              .ok == true and
              .revision >= 3 and
              .pickleFound == true and
              .pickleStructured == true and
              .pickleImageReady == true
            ' /tmp/repair.json >/dev/null 2>&1; then
              echo 'Legacy article repair completed successfully, including pickle structure and hero.'
              exit 0
            fi
            echo "Published production is not yet on repair revision 3 or remediation is incomplete (HTTP $status)."
            sleep 15
          done
          echo 'Repair endpoint did not complete revision 3 successfully within retry window.'
          exit 1
