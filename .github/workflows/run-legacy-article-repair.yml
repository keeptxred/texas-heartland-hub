name: Run Legacy Article Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-legacy-article-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

# Revision 3: only pass after the deployed endpoint confirms the BBQ row is structured.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invoke production article structure repair
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://keeptxred.com/api/public/hooks/repair-article-structure'
          for attempt in $(seq 1 24); do
            echo "Repair attempt ${attempt}/24"
            status=$(curl -sS -o /tmp/repair.json -w '%{http_code}' --max-time 30 "$endpoint" || true)
            cat /tmp/repair.json 2>/dev/null || true
            echo
            if [[ "$status" == "200" ]] && jq -e '.ok == true and .bbqFound == true and .bbqStructured == true and (.bbqHeadings | length) == 5' /tmp/repair.json >/dev/null 2>&1; then
              echo 'Legacy article repair completed and BBQ semantic structure verified.'
              exit 0
            fi
            echo "Endpoint not ready or BBQ repair not yet verified (HTTP $status)."
            sleep 15
          done
          echo 'Repair endpoint did not verify the BBQ article within retry window.'
          exit 1
