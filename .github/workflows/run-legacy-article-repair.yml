name: Run Legacy Article Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-legacy-article-repair.yml'
      - 'src/routes/api/public/hooks/repair-article-structure.ts'
      - 'src/lib/featured-image.functions.ts'
      - '.lovable-redeploy-trigger'
  workflow_dispatch:

permissions:
  contents: read

# Revision 4: require live BBQ and pickle article remediation before passing.
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke production article structure repair
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://keeptxred.com/api/public/hooks/repair-article-structure'
          for attempt in $(seq 1 32); do
            echo "Repair attempt ${attempt}/32"
            status=$(curl -sS -o /tmp/repair.json -w '%{http_code}' --max-time 30 "$endpoint" || true)
            cat /tmp/repair.json 2>/dev/null || true
            echo
            if [[ "$status" == "200" ]] && jq -e '
              .ok == true and
              .revision >= 3 and
              .bbqFound == true and
              .bbqStructured == true and
              (.bbqHeadings | length) == 5 and
              .pickleFound == true and
              .pickleStructured == true and
              .pickleImageReady == true
            ' /tmp/repair.json >/dev/null 2>&1; then
              echo 'Legacy article repair completed successfully, including BBQ and pickle remediation.'
              exit 0
            fi
            echo "Production repair is incomplete or not yet deployed (HTTP $status)."
            sleep 15
          done
          echo 'Repair endpoint did not verify BBQ and pickle remediation within retry window.'
          exit 1
