name: One-shot commerce secret recovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/commerce-secret-recovery-execute

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.head_ref == 'run-commerce-secret-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_LIVE_API_KEY_LEGACY: ${{ secrets.STRIPE_LIVE_API_KEY }}
      LOVABLE_API_KEY_LEGACY: ${{ secrets.LOVABLE_API_KEY }}
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_SANDBOX_WEBHOOK_SECRET }}
      ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
      WORKER_NAME: keeptxred-site

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Report recoverable secret names without values
        shell: bash
        run: |
          set -euo pipefail
          for name in STRIPE_LIVE_SECRET_KEY STRIPE_SANDBOX_SECRET_KEY PRINTIFY_API_TOKEN PRINTIFY_SHOP_ID PAYMENTS_LIVE_WEBHOOK_SECRET PAYMENTS_SANDBOX_WEBHOOK_SECRET ADMIN_PASSCODE; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name: present"
            else
              echo "$name: missing"
            fi
          done
          [[ -n "${STRIPE_LIVE_API_KEY_LEGACY:-}" ]] && echo "STRIPE_LIVE_API_KEY (legacy Lovable connector key): present" || echo "STRIPE_LIVE_API_KEY (legacy Lovable connector key): missing"
          [[ -n "${LOVABLE_API_KEY_LEGACY:-}" ]] && echo "LOVABLE_API_KEY (legacy): present" || echo "LOVABLE_API_KEY (legacy): missing"

      - name: Restore valid secrets to Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Cloudflare deploy credentials are unavailable"
            exit 1
          fi

          restore_secret() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Skipping $name (not present in GitHub Actions secrets)"
              return 0
            fi
            printf '%s' "$value" | bunx wrangler secret put "$name" --name "$WORKER_NAME" >/dev/null
            echo "Restored $name"
          }

          restore_secret STRIPE_LIVE_SECRET_KEY
          restore_secret STRIPE_SANDBOX_SECRET_KEY
          restore_secret PRINTIFY_API_TOKEN
          restore_secret PRINTIFY_SHOP_ID
          restore_secret PAYMENTS_LIVE_WEBHOOK_SECRET
          restore_secret PAYMENTS_SANDBOX_WEBHOOK_SECRET
          restore_secret ADMIN_PASSCODE

      - name: Audit resulting Cloudflare secret names
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")"
          python3 - "$response" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get('success') is not True:
              raise SystemExit(payload.get('errors'))
          names = sorted({x.get('name') for x in payload.get('result', []) if x.get('name')})
          wanted = [
              'STRIPE_LIVE_SECRET_KEY','STRIPE_SANDBOX_SECRET_KEY','PRINTIFY_API_TOKEN','PRINTIFY_SHOP_ID',
              'PAYMENTS_LIVE_WEBHOOK_SECRET','PAYMENTS_SANDBOX_WEBHOOK_SECRET','ADMIN_PASSCODE'
          ]
          for name in wanted:
              print(f"Cloudflare {name}: {'present' if name in names else 'missing'}")
          PY
