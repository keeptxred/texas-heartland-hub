name: Verify production GEO discovery

on:
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/geo-readiness-production-smoke.yml"
      - ".github/workflows/deploy-cloudflare-after-verify.yml"
      - "src/routes/robots[.]txt.ts"
      - "src/routes/sitemap[.]xml.ts"
      - "src/routes/sitemap-*.ts"
      - "src/lib/sitemap-shared.ts"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-geo-readiness-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://keeptxred.com

    steps:
      - name: Verify robots policy for AI discovery crawlers
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --location --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -o "$body" "$SITE_URL/robots.txt"

          python3 - "$body" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          lines = [line.strip() for line in text.splitlines()]

          required_agents = {
              "OAI-SearchBot",
              "GPTBot",
              "ChatGPT-User",
              "ClaudeBot",
              "Claude-Web",
              "anthropic-ai",
              "PerplexityBot",
              "Perplexity-User",
              "Google-Extended",
              "Applebot-Extended",
              "Amazonbot",
              "Meta-ExternalAgent",
              "CCBot",
              "Bytespider",
          }

          groups = []
          agents = []
          rules = []
          for line in lines + [""]:
              if not line or line.startswith("#"):
                  if agents and rules:
                      groups.append((tuple(agents), tuple(rules)))
                      agents, rules = [], []
                  continue
              key, sep, value = line.partition(":")
              if not sep:
                  continue
              key = key.strip().lower()
              value = value.strip()
              if key == "user-agent":
                  if rules:
                      groups.append((tuple(agents), tuple(rules)))
                      agents, rules = [], []
                  agents.append(value)
              elif key in {"allow", "disallow"} and agents:
                  rules.append((key, value))

          missing = []
          blocked = []
          for required in sorted(required_agents):
              matching = [rules for agents, rules in groups if any(agent.lower() == required.lower() for agent in agents)]
              if not matching:
                  missing.append(required)
                  continue
              for group_rules in matching:
                  if ("disallow", "/") in group_rules:
                      blocked.append(required)
                  if ("allow", "/") not in group_rules:
                      raise SystemExit(f"{required} does not inherit an explicit Allow: / rule")

          if missing:
              raise SystemExit(f"robots.txt is missing explicit AI crawler agents: {', '.join(missing)}")
          if blocked:
              raise SystemExit(f"robots.txt blocks AI crawlers at the root: {', '.join(sorted(set(blocked)))}")

          sitemap = "Sitemap: https://keeptxred.com/sitemap.xml"
          if sitemap not in text:
              raise SystemExit(f"robots.txt is missing canonical sitemap declaration: {sitemap}")

          print("Production robots.txt explicitly permits all required AI discovery crawlers and declares the sitemap.")
          PY

      - name: Verify XML sitemap index
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          curl --location --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -D "$headers" -o "$body" "$SITE_URL/sitemap.xml"

          python3 - "$headers" "$body" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          headers = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").lower()
          body_path = pathlib.Path(sys.argv[2])
          if "content-type: application/xml" not in headers and "content-type: text/xml" not in headers:
              raise SystemExit("Production sitemap.xml did not return an XML content type")

          root = ET.parse(body_path).getroot()
          if not root.tag.endswith("sitemapindex"):
              raise SystemExit(f"Expected sitemapindex root, got {root.tag!r}")

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locations = [node.text.strip() for node in root.findall("sm:sitemap/sm:loc", ns) if node.text]
          required = {
              "https://keeptxred.com/sitemap-pages.xml",
              "https://keeptxred.com/sitemap-news.xml",
              "https://keeptxred.com/sitemap-evergreen.xml",
              "https://keeptxred.com/sitemap-elections.xml",
          }
          missing = sorted(required.difference(locations))
          if missing:
              raise SystemExit(f"Production sitemap index is missing required child sitemaps: {', '.join(missing)}")
          if len(locations) < 4:
              raise SystemExit("Production sitemap index contains too few child sitemaps")

          print(f"Production sitemap.xml is valid and advertises {len(locations)} child sitemaps.")
          PY
