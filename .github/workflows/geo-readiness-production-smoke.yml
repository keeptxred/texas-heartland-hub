name: Verify production GEO discovery

on:
  workflow_run:
    workflows: ["Deploy KeepTXRed to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-geo-readiness-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://keeptxred.com
      FETCH_ORIGIN: https://keeptxred-site.freddy-coppola.workers.dev

    steps:
      - name: Inspect raw live election and schema signals
        shell: bash
        run: |
          set -euo pipefail
          election_headers="$(mktemp)"
          election_body="$(mktemp)"
          home_headers="$(mktemp)"
          home_body="$(mktemp)"
          trap 'rm -f "$election_headers" "$election_body" "$home_headers" "$home_body"' EXIT

          fetch_page() {
            local path="$1"
            local headers="$2"
            local body="$3"
            curl --location --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --silent --show-error \
              -H 'X-Forwarded-Host: keeptxred.com' \
              -D "$headers" -o "$body" -w '%{http_code}' "${FETCH_ORIGIN%/}$path"
          }

          election_status="$(fetch_page "/elections/2026" "$election_headers" "$election_body")"
          home_status="$(fetch_page "/" "$home_headers" "$home_body")"

          echo "Election page HTTP status: $election_status"
          grep -Ei '^(cache-control|cf-cache-status|age|content-type|server):' "$election_headers" || true
          echo "Home page HTTP status: $home_status"
          grep -Ei '^(cache-control|cf-cache-status|age|content-type|server):' "$home_headers" || true

          if [[ "$election_status" != "200" || "$home_status" != "200" ]]; then
            echo "Deployed Worker did not return HTTP 200 for the required HTML GEO checks." >&2
            exit 1
          fi

          python3 - "$election_body" "$home_body" <<'PY'
          import pathlib
          import re
          import sys

          election = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          home = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")

          strong_h1 = "2026 Texas Election Central: Races, Candidates, Polls & Results"
          if strong_h1 not in election:
              h1s = re.findall(r"<h1\b[^>]*>(.*?)</h1>", election, flags=re.I | re.S)
              simplified = [re.sub(r"<[^>]+>", "", value).strip() for value in h1s]
              raise SystemExit(f"Live election HTML is missing the strengthened H1; observed h1={simplified!r}")

          for marker in ('"Organization"', '"NewsMediaOrganization"'):
              if marker not in election:
                  raise SystemExit(f"Live election HTML is missing JSON-LD marker {marker}")

          if '"FAQPage"' not in home:
              raise SystemExit("Live home HTML is missing FAQPage JSON-LD")

          print("Raw live HTML contains the strengthened election H1, Organization/NewsMediaOrganization JSON-LD, and home FAQPage JSON-LD.")
          PY

      - name: Verify XML sitemap index
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          curl --location --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -H 'X-Forwarded-Host: keeptxred.com' \
            -D "$headers" -o "$body" "${FETCH_ORIGIN%/}/sitemap.xml"

          python3 - "$headers" "$body" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          headers = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").lower()
          body_path = pathlib.Path(sys.argv[2])
          if "content-type: application/xml" not in headers and "content-type: text/xml" not in headers:
              raise SystemExit("Production sitemap.xml did not return an XML content type")

          root = ET.parse(body_path).getroot()
          if not root.tag.endswith("sitemapindex"):
              raise SystemExit(f"Expected sitemapindex root, got {root.tag!r}")

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locations = [node.text.strip() for node in root.findall("sm:sitemap/sm:loc", ns) if node.text]
          required = {
              "https://keeptxred.com/sitemap-pages.xml",
              "https://keeptxred.com/sitemap-news.xml",
              "https://keeptxred.com/sitemap-evergreen.xml",
              "https://keeptxred.com/sitemap-elections.xml",
          }
          missing = sorted(required.difference(locations))
          if missing:
              raise SystemExit(f"Production sitemap index is missing required child sitemaps: {', '.join(missing)}")
          if len(locations) < 4:
              raise SystemExit("Production sitemap index contains too few child sitemaps")

          print(f"Production sitemap.xml is valid and advertises {len(locations)} child sitemaps.")
          PY

      - name: Verify robots policy for AI discovery crawlers
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --location --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --fail-with-body --silent --show-error \
            -H 'X-Forwarded-Host: keeptxred.com' \
            -o "$body" "${FETCH_ORIGIN%/}/robots.txt"

          python3 - "$body" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          lines = [line.strip() for line in text.splitlines()]

          required_agents = {
              "OAI-SearchBot",
              "GPTBot",
              "ChatGPT-User",
              "ClaudeBot",
              "Claude-Web",
              "anthropic-ai",
              "PerplexityBot",
              "Perplexity-User",
              "Google-Extended",
              "Applebot-Extended",
              "Amazonbot",
              "Meta-ExternalAgent",
              "CCBot",
              "Bytespider",
          }

          groups = []
          agents = []
          rules = []
          for line in lines + [""]:
              if not line or line.startswith("#"):
                  if agents and rules:
                      groups.append((tuple(agents), tuple(rules)))
                      agents, rules = [], []
                  continue
              key, sep, value = line.partition(":")
              if not sep:
                  continue
              key = key.strip().lower()
              value = value.strip()
              if key == "user-agent":
                  if rules:
                      groups.append((tuple(agents), tuple(rules)))
                      agents, rules = [], []
                  agents.append(value)
              elif key in {"allow", "disallow"} and agents:
                  rules.append((key, value))

          missing = []
          blocked = []
          for required in sorted(required_agents):
              matching = [rules for agents, rules in groups if any(agent.lower() == required.lower() for agent in agents)]
              if not matching:
                  missing.append(required)
                  continue
              for group_rules in matching:
                  if ("disallow", "/") in group_rules:
                      blocked.append(required)
                  if ("allow", "/") not in group_rules:
                      raise SystemExit(f"{required} does not inherit an explicit Allow: / rule")

          if missing:
              raise SystemExit(f"robots.txt is missing explicit AI crawler agents: {', '.join(missing)}")
          if blocked:
              raise SystemExit(f"robots.txt blocks AI crawlers at the root: {', '.join(sorted(set(blocked)))}")

          sitemap = "Sitemap: https://keeptxred.com/sitemap.xml"
          if sitemap not in text:
              raise SystemExit(f"robots.txt is missing canonical sitemap declaration: {sitemap}")

          print("Production robots.txt explicitly permits all required AI discovery crawlers and declares the sitemap.")
          PY
