name: Newsroom Phase 13 Rejected Shadow Retest

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: keeptxred-newsroom-shadow-retest
  cancel-in-progress: false

jobs:
  shadow-retest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 574 &&
       github.event.comment.body == '/run-phase13-shadow-retest')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_URL: https://keeptxred.com
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify required credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required credential: $name" >&2
              exit 1
            fi
          done

      - name: Wait for current main to be verified and deployed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            main_sha="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-cloudflare-after-verify.yml/runs?branch=main&head_sha=$main_sha&per_page=10")"
            deployed="$(printf '%s' "$runs" | python3 -c '
import json, sys
data = json.load(sys.stdin)
matches = data.get("workflow_runs", [])
print("yes" if any(r.get("status") == "completed" and r.get("conclusion") == "success" for r in matches) else "no")
')"
            if [[ "$deployed" == "yes" ]]; then
              curl --retry 10 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
                "$PRODUCTION_URL/api/public/hooks/health" >/dev/null
              echo "Current main $main_sha is verified and deployed."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for current main deployment" >&2
          exit 1

      - name: Refresh zero-AI research packets
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --max-time 60 --fail-with-body --silent --show-error -X POST \
            "$PRODUCTION_URL/api/public/hooks/build-newsroom-research-packets")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("ok") is not True or int(data.get("aiCalls") or 0) != 0:
              raise SystemExit(f"Research packet refresh failed or used AI: {data}")
          print(json.dumps({"built": data.get("built"), "sourceItems": data.get("sourceItems"), "aiCalls": data.get("aiCalls")}, sort_keys=True))
          PY

      - name: Retest three rejected shadow drafts
        shell: bash
        run: |
          set -euo pipefail
          hook_token="$(openssl rand -hex 32)"
          echo "::add-mask::$hook_token"

          cleanup() {
            set +e
            curl --silent --show-error -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets/NEWSROOM_HOOK_TOKEN" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" >/dev/null
            echo "Temporary NEWSROOM_HOOK_TOKEN removed."
          }
          trap cleanup EXIT

          payload="$(python3 - "$hook_token" <<'PY'
          import json, sys
          print(json.dumps({"name":"NEWSROOM_HOOK_TOKEN","text":sys.argv[1],"type":"secret_text"}))
          PY
          )"
          curl --fail-with-body --silent --show-error -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" >/dev/null

          for i in 1 2 3; do
            response_file="$(mktemp)"
            status=""
            for auth_attempt in $(seq 1 12); do
              status="$(curl --max-time 110 --silent --show-error -o "$response_file" -w '%{http_code}' -X POST \
                "$PRODUCTION_URL/api/public/hooks/retest-newsroom-shadow" \
                -H "x-newsroom-hook-token: $hook_token")"
              if [[ "$status" == "401" ]]; then
                echo "Shadow retest token not live yet (attempt $auth_attempt/12); retrying auth only."
                sleep 5
                continue
              fi
              break
            done
            response="$(cat "$response_file")"
            rm -f "$response_file"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Shadow retest $i failed with HTTP $status: $response" >&2
              exit 1
            fi
            python3 - "$response" "$i" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          index = sys.argv[2]
          if data.get("ok") is not True or data.get("generated") is not True:
              raise SystemExit(f"Shadow retest {index} did not generate: reason={data.get('reason')} error={data.get('error')}")
          if data.get("published") is True or data.get("mode") != "shadow" or data.get("retest") is not True:
              raise SystemExit(f"Shadow retest {index} violated shadow isolation")
          if int(data.get("aiCalls") or 0) > 1:
              raise SystemExit(f"Shadow retest {index} used more than one AI call")
          validation = data.get("validation") or {}
          print(json.dumps({
              "retest": int(index),
              "candidateId": data.get("candidateId"),
              "draftId": data.get("draftId"),
              "validationOk": validation.get("ok"),
              "mainWordCount": validation.get("mainWordCount"),
              "validationReasons": validation.get("reasons"),
              "attempts": data.get("attempts"),
              "published": data.get("published"),
          }, sort_keys=True))
          PY
          done

          cleanup
          trap - EXIT
