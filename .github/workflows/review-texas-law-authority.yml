name: Review Texas law authority sources

on:
  schedule:
    # Monthly, with January 20 capturing the beginning of odd-year regular sessions.
    - cron: "0 14 20 * *"
    # Post-November general-election prompt: do not wait 17 days to flag elapsed election-specific guidance.
    - cron: "0 14 4 11 *"
  workflow_dispatch:
  # Verify the source audit once after the protected implementation merges; do not
  # run another sitewide scan on ordinary editorial or deployment commits.
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-texas-law-authority.yml'
      - 'scripts/laws/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/review-texas-law-authority.yml'
      - 'scripts/laws/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: keeptxred-law-authority-review
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate all source-only law review checks without network
        run: |
          node --test scripts/laws/test-review-authority-guides.mjs scripts/laws/test-check-authority-source-links.mjs scripts/laws/test-reconcile-statute-digests.mjs
          node --check scripts/laws/check-authority-source-links.mjs

      # Validate actual official-law URL fetches on review-workflow/code PRs.
      # Ordinary guide/content changes do not trigger this PR job, so this is
      # not a full-site crawl on every publication or deployment.
      - name: Verify bounded official-source fetch and save evidence
        run: node scripts/laws/check-authority-source-links.mjs

      - name: Retain PR source-link network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-laws-pr-source-link-evidence
          path: artifacts/texas-laws-source-links.json
          retention-days: 14
          if-no-files-found: warn

  review:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Verify zero-dependency review logic
        run: node --test scripts/laws/test-review-authority-guides.mjs scripts/laws/test-check-authority-source-links.mjs scripts/laws/test-reconcile-statute-digests.mjs

      - name: Inventory and report unreviewed laws
        id: review
        shell: bash
        run: |
          set -euo pipefail
          node scripts/laws/review-authority-guides.mjs | tee /tmp/texas-law-review.md

      - name: Check official guide source URLs with a bounded request budget
        id: sourcecheck
        run: node scripts/laws/check-authority-source-links.mjs

      - name: Retain actual source-link audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-laws-official-source-links
          path: artifacts/texas-laws-source-links.json
          retention-days: 14
          if-no-files-found: warn

      # Fingerprint comparison reuses the exact official-URL responses above.
      # Only snapshots from the GitHub Actions bot may serve as history.
      # Content changes are review leads, never an automated legal conclusion.
      - name: Reconcile official statute-text fingerprints with bot-only history
        id: statutes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/2938/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            > /tmp/texas-law-statute-bot-comments.txt
          node scripts/laws/reconcile-statute-digests.mjs \
            /tmp/texas-law-statute-bot-comments.txt artifacts/texas-laws-source-links.json

      - name: Record changed statute fingerprints for legal review
        if: ${{ steps.statutes.outputs.publish_snapshot == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2938 --body-file /tmp/texas-law-statute-monitor.md

      - name: Post only actionable review reminders to master tracker
        if: ${{ steps.review.outputs.due_count != '0' || steps.sourcecheck.outputs.broken_count != '0' || steps.sourcecheck.outputs.inconclusive_count != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_MONTH: ${{ steps.review.outputs.month_key }}
        run: |
          set -euo pipefail
          marker="law-review:${REVIEW_MONTH}"
          # Search every page, not only the newest or oldest 100 comments.
          # Materialize before grep to avoid grep -q causing a SIGPIPE under pipefail.
          gh api --method GET --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/2938/comments?per_page=100" \
            --jq '.[].body' > /tmp/texas-law-review-comments.txt
          if grep -Fq "${marker}" /tmp/texas-law-review-comments.txt; then
            echo "A review reminder for ${REVIEW_MONTH} already exists; not posting a duplicate."
            exit 0
          fi
          if [[ "${{ steps.sourcecheck.outputs.broken_count }}" != '0' || "${{ steps.sourcecheck.outputs.inconclusive_count }}" != '0' ]]; then
            printf '\n' >> /tmp/texas-law-review.md
            cat /tmp/texas-law-source-links.md >> /tmp/texas-law-review.md
          fi
          gh issue comment 2938 --body-file /tmp/texas-law-review.md
