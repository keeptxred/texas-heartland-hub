name: Trigger Cloudflare Production Deploy After Merge

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'wrangler.jsonc'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-cloudflare-production.yml'
      - '.github/workflows/deploy-cloudflare-pr-merge-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: keeptxred-cloudflare-production-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production Cloudflare workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare-production.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f activate_custom_domain=false \
            -f production_hostname=keeptxred.com
