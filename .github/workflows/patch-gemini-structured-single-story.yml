name: Patch Gemini Structured Single Story

on:
  push:
    branches: [agent/gemini-structured-single-story]
    paths: ['.github/workflows/patch-gemini-structured-single-story.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-structured-single-story
      - name: Forward schema and serialize rewrites
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          server = Path('src/server.ts')
          s = server.read_text()
          old = '''      generationConfig: {
        responseMimeType: "application/json",
        maxOutputTokens: Math.min(Math.max(Number(body.max_tokens) || 1024, 256), 12000),
        temperature: 0.1,
      },'''
          new = '''      generationConfig: {
        responseMimeType: "application/json",
        ...(body.response_format?.type === "json_schema" && body.response_format.json_schema
          ? { responseJsonSchema: body.response_format.json_schema }
          : {}),
        maxOutputTokens: Math.min(Math.max(Number(body.max_tokens) || 1024, 256), 12000),
        temperature: 0.1,
      },'''
          if old not in s:
              raise SystemExit('Gemini generationConfig block not found')
          s = s.replace(old, new, 1)
          server.write_text(s)

          news = Path('src/routes/api/public/hooks/generate-news.ts')
          n = news.read_text()
          if '      max_tokens: 9000,' not in n:
              raise SystemExit('max_tokens 9000 not found')
          n = n.replace('      max_tokens: 9000,', '      max_tokens: 12000,', 1)

          start = n.index('async function rewriteWithAi(items: ScoredItem[], lovableApiKey: string) {')
          end = n.index('\n\nexport const Route = createFileRoute', start)
          replacement = '''async function rewriteWithAi(items: ScoredItem[], lovableApiKey: string) {
  const selected = items.slice(0, 10);
  const combined: RewrittenArticle[] = [];

  // Free-tier Gemini is more reliable when each long-form story gets its own
  // structured-output request and full output-token budget.
  for (let index = 0; index < selected.length; index += 1) {
    const story = selected[index];
    try {
      const rewritten = await rewriteBatchWithAi([story], lovableApiKey);
      const article = rewritten.find((candidate) => candidate.source_index === 1);
      if (article) {
        combined.push({ ...article, source_index: index + 1 });
      } else {
        console.warn("[generate-news] individual story produced no editorially valid article", {
          sourceIndex: index + 1,
          title: story.title,
        });
      }
    } catch (storyError) {
      if (isQuotaOrRateLimitError(storyError)) throw storyError;
      console.warn("[generate-news] individual story rewrite skipped after one attempt", {
        sourceIndex: index + 1,
        title: story.title,
        error: String(storyError),
      });
    }

    if (index < selected.length - 1) {
      await new Promise((resolve) => setTimeout(resolve, 1000));
    }
  }

  return combined.slice(0, 10);
}'''
          n = n[:start] + replacement + n[end:]
          news.write_text(n)
          PY
          grep -q 'responseJsonSchema' src/server.ts
          grep -q 'max_tokens: 12000' src/routes/api/public/hooks/generate-news.ts
          grep -q 'individual story produced no editorially valid article' src/routes/api/public/hooks/generate-news.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/routes/api/public/hooks/generate-news.ts
          git rm .github/workflows/patch-gemini-structured-single-story.yml
          git commit -m "Constrain Gemini rewrites to structured single-story output"
          git push origin HEAD:agent/gemini-structured-single-story
