name: Patch Gemini Structured Single Story

on:
  push:
    branches:
      - agent/gemini-structured-single-story
    paths:
      - .github/workflows/patch-gemini-structured-single-story.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-structured-single-story
      - name: Apply patch
        run: python3 .github/scripts/patch-gemini-structured-single-story.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/routes/api/public/hooks/generate-news.ts
          git rm .github/workflows/patch-gemini-structured-single-story.yml
          git rm .github/scripts/patch-gemini-structured-single-story.py
          git commit -m "Constrain Gemini rewrites to structured single-story output"
          git push origin HEAD:agent/gemini-structured-single-story
