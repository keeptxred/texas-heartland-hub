name: Verify live school-tax authority page

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-school-tax-live.yml
      - scripts/authority/verify-school-tax-production.py
      - src/routes/news.isd-tax-burdens.tsx
      - src/data/tea-2026-final-mcr.json
  workflow_run:
    workflows:
      - Deploy verified KeepTXRed to Cloudflare
      - Ensure Cloudflare Production Matches Main
      - Deploy KeepTXRed to Cloudflare
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '31 14 * * *'

permissions:
  contents: read

jobs:
  live-school-tax:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Identify checked commit and deployed source
        shell: bash
        run: |
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Trigger: ${{ github.event_name }}"
          echo "Upstream deploy SHA: ${{ github.event.workflow_run.head_sha }}"
          if [[ "${{ github.event_name }}" == "workflow_run" && "${{ github.event.workflow_run.head_sha }}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error title=Deployment SHA mismatch::Checked-out main does not equal triggering deploy SHA; refusing to certify an unverified deployment."
            exit 1
          fi

      - name: Verify production Worker renders complete TEA district directory
        env:
          SITE_URL: https://keeptxred-site.freddy-coppola.workers.dev
        run: python3 scripts/authority/verify-school-tax-production.py

      - name: Verify public browser SSR authority content
        env:
          SITE_URL: https://keeptxred.com
          SCHOOL_TAX_USER_AGENT: Mozilla/5.0 (compatible; KeepTXRed-QA/1.0)
        run: python3 scripts/authority/verify-school-tax-production.py

      - name: Verify public Googlebot SSR authority content
        env:
          SITE_URL: https://keeptxred.com
          SCHOOL_TAX_USER_AGENT: Googlebot
        run: python3 scripts/authority/verify-school-tax-production.py

      - name: Diagnose public custom-domain article response
        shell: bash
        run: |
          set -euo pipefail
          for agent in 'Mozilla/5.0 (compatible; KeepTXRed-QA/1.0)' 'Googlebot'; do
            echo "Checking public article as $agent"
            status="$(curl --connect-timeout 10 --max-time 25 --silent --show-error \
              -H 'cache-control: no-cache' \
              -H 'x-keeptxred-deployment-smoke: canonical' \
              -A "$agent" \
              -o /tmp/school-tax-public.html -w '%{http_code}' \
              'https://keeptxred.com/news/isd-tax-burdens')"
            echo "Public article HTTP $status as $agent"
            if [[ "$status" != '200' ]]; then
              head -c 500 /tmp/school-tax-public.html || true
              echo
              echo "::error title=Public school-tax route unavailable::Custom-domain response $status as $agent"
              exit 1
            fi
          done

      - name: Inspect exact live SEO canonical and robots for browser and Googlebot
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          url = "https://keeptxred.com/news/isd-tax-burdens"

          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonicals = []
                  self.robots = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "link" and "canonical" in a.get("rel", "").lower().split():
                      self.canonicals.append(a.get("href"))
                  if tag == "meta" and a.get("name", "").lower() == "robots":
                      self.robots.append(a.get("content", ""))

          for agent in ("Mozilla/5.0 (compatible; KeepTXRed-QA/1.0)", "Googlebot"):
              with urlopen(Request(url, headers={"User-Agent": agent, "x-keeptxred-deployment-smoke": "canonical"}), timeout=25) as response:
                  if response.status != 200:
                      raise SystemExit(f"{agent}: HTTP {response.status}")
                  html = response.read(2_000_001).decode("utf-8", errors="replace")
                  robots_header = response.headers.get("X-Robots-Tag", "")
              metadata = Metadata()
              metadata.feed(html)
              print(agent, "canonical:", metadata.canonicals, "robots:", metadata.robots, "header:", robots_header)
              if metadata.canonicals != [url]:
                  raise SystemExit(f"{agent}: expected exactly one canonical href equal to {url}")
              if len(metadata.robots) != 1:
                  raise SystemExit(f"{agent}: expected exactly one robots meta")
              directives = {v.strip().lower() for v in metadata.robots[0].split(",")}
              if not {"index", "follow"} <= directives or {"noindex", "nofollow"} & directives:
                  raise SystemExit(f"{agent}: missing index/follow or contradictory robots directive")
              if any(v in robots_header.lower() for v in ("noindex", "nofollow")):
                  raise SystemExit(f"{agent}: unexpected X-Robots-Tag restriction")
              print(f"PASS exact canonical and index/follow for {agent}")
          PY

      - name: Publish durable acceptance evidence
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## School-tax live acceptance"
            echo ""
            echo "- Result: **$JOB_RESULT**"
            echo "- Checked commit: \`$(git rev-parse HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Triggering deployment SHA: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- URL: https://keeptxred.com/news/isd-tax-burdens"
            echo "- Assertions: Worker SSR, public browser SSR, public Googlebot SSR, HTTP 200, canonical, robots index/follow"
            echo "- Evidence: this run's individual step conclusions and logs; a passing run is not proof of a separate TEA refresh"
            echo "- Certification rule: match checked SHA to successful production-current SHA and verify scheduled TEA refresh separately"
          } >> "$GITHUB_STEP_SUMMARY"
