name: Newsroom Phase 13 AI Canary

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of distinct shadow drafts to generate
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: keeptxred-newsroom-ai-canary
  cancel-in-progress: false

jobs:
  canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Run Phase 13 AI shadow canary')) ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 574 &&
        (github.event.comment.body == '/run-phase13-shadow-canary' ||
         github.event.comment.body == '/run-phase13-shadow-canary-1' ||
         github.event.comment.body == '/run-phase13-publish-canary-1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_URL: https://keeptxred.com
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_MODE: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/run-phase13-publish-canary-1' && 'publish' || 'shadow' }}
      CANARY_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || (github.event_name == 'issue_comment' && (github.event.comment.body == '/run-phase13-shadow-canary-1' || github.event.comment.body == '/run-phase13-publish-canary-1') && '1' || '3') }}

    steps:
      - name: Verify required credentials and inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required credential: $name" >&2
              exit 1
            fi
          done
          case "$CANARY_COUNT" in
            1|3) ;;
            *) echo "Invalid canary count: $CANARY_COUNT" >&2; exit 1 ;;
          esac
          case "$RUN_MODE" in
            shadow|publish) ;;
            *) echo "Invalid canary mode: $RUN_MODE" >&2; exit 1 ;;
          esac
          if [[ "$RUN_MODE" == "publish" && "$CANARY_COUNT" != "1" ]]; then
            echo 'Publish canary is intentionally limited to one article.' >&2
            exit 1
          fi

      - name: Wait for current main to be verified and deployed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            main_sha="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-cloudflare-after-verify.yml/runs?branch=main&head_sha=$main_sha&per_page=10")"

            deployed="$(printf '%s' "$runs" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          matches = data.get("workflow_runs", [])
          if any(r.get("status") == "completed" and r.get("conclusion") == "success" for r in matches):
              print("yes")
          elif any(r.get("status") == "completed" and r.get("conclusion") in {"failure", "timed_out"} for r in matches):
              print("failed")
          else:
              print("no")
          ')"

            if [[ "$deployed" == "yes" ]]; then
              echo "Current main $main_sha has a successful verified Cloudflare deployment."
              curl --retry 10 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
                "$PRODUCTION_URL/api/public/hooks/health" >/dev/null
              exit 0
            fi
            if [[ "$deployed" == "failed" ]]; then
              echo "Current main $main_sha has a failed production deployment." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for a successful deployment of current main." >&2
          exit 1

      - name: Enrich zero-AI RSS evidence
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --max-time 90 --fail-with-body --silent --show-error -X POST \
            "$PRODUCTION_URL/api/public/hooks/enrich-newsroom-rss-evidence")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit(f"RSS evidence enrichment failed: {data.get('error')}")
          if int(data.get("aiCalls") or 0) != 0:
              raise SystemExit(f"RSS evidence enrichment unexpectedly used AI: {data.get('aiCalls')}")
          print(json.dumps({
              "feedsChecked": data.get("feedsChecked"),
              "feedsSucceeded": data.get("feedsSucceeded"),
              "evidenceItems": data.get("evidenceItems"),
              "matchedRows": data.get("matchedRows"),
              "updatedRows": data.get("updatedRows"),
              "evidenceCharsWritten": data.get("evidenceCharsWritten"),
              "failures": data.get("failures"),
              "aiCalls": data.get("aiCalls"),
          }, sort_keys=True))
          PY

      - name: Refresh deterministic zero-AI newsroom ranking
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in normalize-newsroom-feed cluster-newsroom-stories score-newsroom-stories decide-newsroom-packages; do
            response="$(curl --max-time 90 --fail-with-body --silent --show-error -X POST \
              "$PRODUCTION_URL/api/public/hooks/$endpoint")"
            python3 - "$response" "$endpoint" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          endpoint = sys.argv[2]
          if data.get("ok") is not True:
              raise SystemExit(f"{endpoint} failed: {data.get('error')}")
          if int(data.get("aiCalls") or 0) != 0:
              raise SystemExit(f"{endpoint} unexpectedly used AI: {data.get('aiCalls')}")
          print(endpoint, json.dumps(data, sort_keys=True))
          PY
          done

      - name: Refresh zero-AI research packets
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --max-time 180 --fail-with-body --silent --show-error -X POST \
            "$PRODUCTION_URL/api/public/hooks/build-newsroom-research-packets")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit(f"Research packet refresh failed: {data.get('error')}")
          if int(data.get("aiCalls") or 0) != 0:
              raise SystemExit(f"Research packet refresh unexpectedly used AI: {data.get('aiCalls')}")
          print(json.dumps({
              "built": data.get("built"),
              "sourceItems": data.get("sourceItems"),
              "primarySourceItems": data.get("primarySourceItems"),
              "aiCalls": data.get("aiCalls"),
          }, sort_keys=True))
          PY

      - name: Generate isolated newsroom canary
        shell: bash
        run: |
          set -euo pipefail
          hook_token="$(openssl rand -hex 32)"
          echo "::add-mask::$hook_token"

          cleanup() {
            set +e
            delete_response="$(curl --silent --show-error -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets/NEWSROOM_HOOK_TOKEN" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json")"
            python3 - "$delete_response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("success") is not True:
              raise SystemExit(f"Cloudflare did not confirm hook-token cleanup: {data.get('errors')!r}")
          print("Temporary NEWSROOM_HOOK_TOKEN removed.")
          PY
          }
          trap cleanup EXIT

          payload="$(python3 - "$hook_token" <<'PY'
          import json, sys
          print(json.dumps({"name":"NEWSROOM_HOOK_TOKEN","text":sys.argv[1],"type":"secret_text"}))
          PY
          )"
          put_response="$(curl --fail-with-body --silent --show-error -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          python3 - "$put_response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("success") is not True:
              raise SystemExit(f"Cloudflare did not accept temporary hook token: {data.get('errors')!r}")
          print("Temporary newsroom hook token installed.")
          PY

          generated_count=0
          for i in $(seq 1 "$CANARY_COUNT"); do
            response_file="$(mktemp)"
            status=""
            for auth_attempt in $(seq 1 12); do
              status="$(curl --max-time 240 --silent --show-error -o "$response_file" -w '%{http_code}' -X POST \
                "$PRODUCTION_URL/api/public/hooks/generate-newsroom?mode=$RUN_MODE" \
                -H "x-newsroom-hook-token: $hook_token")"
              if [[ "$status" == "401" ]]; then
                echo "Canary hook token not live on custom domain yet (attempt $auth_attempt/12); retrying auth only."
                sleep 5
                continue
              fi
              break
            done

            response="$(cat "$response_file")"
            rm -f "$response_file"
            if [[ "$status" == "401" ]]; then
              echo "Temporary canary hook token never propagated to production." >&2
              exit 1
            fi
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Newsroom canary request $i failed with HTTP $status: $response" >&2
              exit 1
            fi
            if [[ -z "$response" ]]; then
              echo "Newsroom canary request $i returned an empty response." >&2
              exit 1
            fi

            if jq -e '.ok == true and .no_items == true' <<<"$response" >/dev/null 2>&1; then
              reason="$(jq -r '.reason // "unknown"' <<<"$response")"
              if [[ "$RUN_MODE" == "publish" ]]; then
                echo "Publish canary had no eligible candidate: $reason" >&2
                exit 1
              fi
              echo "Shadow canary exhausted eligible evidence after ${generated_count} draft(s): $reason"
              break
            fi

            python3 - "$response" "$i" "$RUN_MODE" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          index = sys.argv[2]
          mode = sys.argv[3]
          if data.get("ok") is not True or data.get("generated") is not True:
              raise SystemExit(f"Newsroom canary {index} did not generate a draft: reason={data.get('reason')} error={data.get('error')}")
          if data.get("mode") != mode and mode == "shadow":
              raise SystemExit(f"Shadow canary {index} returned unexpected mode {data.get('mode')!r}")
          if int(data.get("aiCalls") or 0) > 2:
              raise SystemExit(f"Newsroom canary {index} used more than the bounded two AI calls")
          if mode == "shadow" and data.get("published") is True:
              raise SystemExit(f"Shadow canary {index} unexpectedly published content")
          if mode == "publish" and data.get("published") is not True:
              raise SystemExit(f"Publish canary {index} did not publish: validation={data.get('validation')}")
          validation = data.get("validation") or {}
          print(json.dumps({
              "canary": int(index),
              "mode": mode,
              "candidateId": data.get("candidateId"),
              "clusterId": data.get("clusterId"),
              "draftId": data.get("draftId"),
              "slug": data.get("slug"),
              "sourceCount": data.get("sourceCount"),
              "primarySourceCount": data.get("primarySourceCount"),
              "validationOk": validation.get("ok"),
              "mainWordCount": validation.get("mainWordCount"),
              "firstValidationReasons": data.get("firstValidationReasons"),
              "validationReasons": validation.get("reasons"),
              "repairAttempted": data.get("repairAttempted"),
              "provider": data.get("provider"),
              "model": data.get("model"),
              "attempts": data.get("attempts"),
              "aiCalls": data.get("aiCalls"),
              "published": data.get("published"),
          }, sort_keys=True))
          PY
            generated_count=$((generated_count + 1))

            if [[ "$RUN_MODE" == "publish" ]]; then
              slug="$(jq -r '.slug // empty' <<<"$response")"
              if [[ -z "$slug" ]]; then
                echo 'Publish canary response omitted slug.' >&2
                exit 1
              fi
              curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
                "$PRODUCTION_URL/news/$slug" >/dev/null
              echo "Verified live clustered newsroom article: /news/$slug"
            fi
          done

          cleanup
          trap - EXIT
