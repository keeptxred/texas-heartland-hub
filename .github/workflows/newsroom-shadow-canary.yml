name: Newsroom Phase 13 AI Shadow Canary

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of distinct shadow drafts to generate
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: keeptxred-newsroom-shadow-canary
  cancel-in-progress: false

jobs:
  shadow-canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Run Phase 13 AI shadow canary')) ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 574 &&
        (github.event.comment.body == '/run-phase13-shadow-canary' || github.event.comment.body == '/run-phase13-shadow-canary-1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      WORKER_NAME: keeptxred-site
      PRODUCTION_URL: https://keeptxred.com
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      CANARY_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || (github.event_name == 'issue_comment' && github.event.comment.body == '/run-phase13-shadow-canary-1' && '1' || '3') }}

    steps:
      - name: Verify required credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required credential: $name" >&2
              exit 1
            fi
          done
          case "$CANARY_COUNT" in
            1|3) ;;
            *) echo "Invalid canary count: $CANARY_COUNT" >&2; exit 1 ;;
          esac

      - name: Wait for current main to be verified and deployed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            main_sha="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-cloudflare-after-verify.yml/runs?branch=main&head_sha=$main_sha&per_page=10")"

            deployed="$(printf '%s' "$runs" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          matches = data.get("workflow_runs", [])
          if any(r.get("status") == "completed" and r.get("conclusion") == "success" for r in matches):
              print("yes")
          elif any(r.get("status") == "completed" and r.get("conclusion") in {"failure", "timed_out"} for r in matches):
              print("failed")
          else:
              print("no")
          ')"

            if [[ "$deployed" == "yes" ]]; then
              echo "Current main $main_sha has a successful verified Cloudflare deployment."
              curl --retry 10 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
                "$PRODUCTION_URL/api/public/hooks/health" >/dev/null
              exit 0
            fi
            if [[ "$deployed" == "failed" ]]; then
              echo "Current main $main_sha has a failed production deployment." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for a successful deployment of current main." >&2
          exit 1

      - name: Enrich zero-AI RSS evidence
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --max-time 90 --fail-with-body --silent --show-error -X POST \
            "$PRODUCTION_URL/api/public/hooks/enrich-newsroom-rss-evidence")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit(f"RSS evidence enrichment failed: {data.get('error')}")
          if int(data.get("aiCalls") or 0) != 0:
              raise SystemExit(f"RSS evidence enrichment unexpectedly used AI: {data.get('aiCalls')}")
          print(json.dumps({
              "feedsChecked": data.get("feedsChecked"),
              "feedsSucceeded": data.get("feedsSucceeded"),
              "evidenceItems": data.get("evidenceItems"),
              "matchedRows": data.get("matchedRows"),
              "updatedRows": data.get("updatedRows"),
              "evidenceCharsWritten": data.get("evidenceCharsWritten"),
              "failures": data.get("failures"),
              "aiCalls": data.get("aiCalls"),
          }, sort_keys=True))
          PY

      - name: Refresh zero-AI research packets
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --max-time 60 --fail-with-body --silent --show-error -X POST \
            "$PRODUCTION_URL/api/public/hooks/build-newsroom-research-packets")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit(f"Research packet refresh failed: {data.get('error')}")
          if int(data.get("aiCalls") or 0) != 0:
              raise SystemExit(f"Research packet refresh unexpectedly used AI: {data.get('aiCalls')}")
          print(json.dumps({
              "built": data.get("built"),
              "sourceItems": data.get("sourceItems"),
              "primarySourceItems": data.get("primarySourceItems"),
              "aiCalls": data.get("aiCalls"),
          }, sort_keys=True))
          PY

      - name: Generate isolated AI shadow drafts
        shell: bash
        run: |
          set -euo pipefail
          hook_token="$(openssl rand -hex 32)"
          echo "::add-mask::$hook_token"

          cleanup() {
            set +e
            delete_response="$(curl --silent --show-error -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets/NEWSROOM_HOOK_TOKEN" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json")"
            python3 - "$delete_response" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit("Could not parse Cloudflare secret cleanup response")
          if data.get("success") is not True:
              raise SystemExit(f"Cloudflare did not confirm hook-token cleanup: {data.get('errors')!r}")
          print("Temporary NEWSROOM_HOOK_TOKEN removed.")
          PY
          }
          trap cleanup EXIT

          payload="$(python3 - "$hook_token" <<'PY'
          import json, sys
          print(json.dumps({"name":"NEWSROOM_HOOK_TOKEN","text":sys.argv[1],"type":"secret_text"}))
          PY
          )"
          put_response="$(curl --fail-with-body --silent --show-error -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          python3 - "$put_response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("success") is not True:
              raise SystemExit(f"Cloudflare did not accept temporary hook token: {data.get('errors')!r}")
          print("Temporary shadow-only hook token installed.")
          PY

          # Cloudflare secret writes create a new Worker version. The API may confirm
          # the write before the custom domain serves that version. Retry only 401s:
          # those are rejected at auth before any AI reservation or generation call.
          for i in $(seq 1 "$CANARY_COUNT"); do
            response_file="$(mktemp)"
            status=""
            for auth_attempt in $(seq 1 12); do
              status="$(curl --max-time 110 --silent --show-error -o "$response_file" -w '%{http_code}' -X POST \
                "$PRODUCTION_URL/api/public/hooks/generate-newsroom?mode=shadow" \
                -H "x-newsroom-hook-token: $hook_token")"
              if [[ "$status" == "401" ]]; then
                echo "Shadow hook token not live on custom domain yet (attempt $auth_attempt/12); retrying auth only."
                sleep 5
                continue
              fi
              break
            done

            response="$(cat "$response_file")"
            rm -f "$response_file"
            if [[ "$status" == "401" ]]; then
              echo "Temporary shadow hook token never propagated to production." >&2
              exit 1
            fi
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Shadow generation request $i failed with HTTP $status: $response" >&2
              exit 1
            fi
            if [[ -z "$response" ]]; then
              echo "Shadow generation request $i returned an empty response." >&2
              exit 1
            fi
            python3 - "$response" "$i" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          index = sys.argv[2]
          if data.get("ok") is not True or data.get("generated") is not True:
              raise SystemExit(f"Shadow canary {index} did not generate a draft: reason={data.get('reason')} error={data.get('error')}")
          if data.get("published") is True:
              raise SystemExit(f"Shadow canary {index} unexpectedly published content")
          if data.get("mode") != "shadow":
              raise SystemExit(f"Shadow canary {index} returned unexpected mode {data.get('mode')!r}")
          if int(data.get("aiCalls") or 0) > 1:
              raise SystemExit(f"Shadow canary {index} used more than one AI call")
          validation = data.get("validation") or {}
          print(json.dumps({
              "canary": int(index),
              "candidateId": data.get("candidateId"),
              "clusterId": data.get("clusterId"),
              "draftId": data.get("draftId"),
              "validationOk": validation.get("ok"),
              "mainWordCount": validation.get("mainWordCount"),
              "validationReasons": validation.get("reasons"),
              "provider": data.get("provider"),
              "model": data.get("model"),
              "attempts": data.get("attempts"),
              "published": data.get("published"),
          }, sort_keys=True))
          PY
          done

          cleanup
          trap - EXIT
