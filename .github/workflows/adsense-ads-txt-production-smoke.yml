name: AdSense ads.txt production smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adsense-ads-txt-production-smoke.yml'
      - 'public/ads.txt'
      - 'src/server.ts'
      - 'src/routes/robots[.]txt.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-ads-txt-production-smoke.yml'
      - 'public/ads.txt'
      - 'src/server.ts'
      - 'src/routes/robots[.]txt.ts'
  workflow_run:
    workflows:
      - Deploy verified KeepTXRed to Cloudflare
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-adsense-ads-txt-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live AdSense ads.txt
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          expected = 'google.com, pub-1891256141359926, DIRECT, f08c47fec0942fa0'
          ads_urls = [
              'http://keeptxred.com/ads.txt',
              'https://keeptxred.com/ads.txt',
              'https://www.keeptxred.com/ads.txt',
          ]
          strict_deployed_policy = os.environ.get('GITHUB_EVENT_NAME') != 'pull_request'

          def fetch(url, user_agent):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': user_agent,
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return (
                      response.status,
                      response.geturl(),
                      (response.headers.get('content-type') or '').lower(),
                      (response.headers.get('cf-mitigated') or '').lower(),
                      response.read().decode('utf-8', errors='replace').strip(),
                  )

          for url in ads_urls:
              last_reason = 'not attempted'
              for attempt in range(1, 7):
                  try:
                      status, final_url, content_type, mitigated, body = fetch(
                          url,
                          'KeepTXRed-AdSense-Smoke/2.0',
                      )
                      failures = []
                      if status != 200:
                          failures.append(f'HTTP {status}')
                      if mitigated == 'challenge':
                          failures.append('Cloudflare challenge')
                      if not content_type.startswith('text/plain'):
                          failures.append(f'unexpected content type {content_type!r}')
                      if body != expected:
                          failures.append(f'unexpected body {body!r}')

                      if not failures:
                          print(
                              f'PASS ads.txt: {url} -> {final_url}; '
                              f'HTTP {status}; text/plain; exact publisher declaration present.'
                          )
                          break

                      last_reason = '; '.join(failures)
                      print(f'RETRY {url} attempt {attempt}: {last_reason}')
                  except (urllib.error.URLError, TimeoutError, OSError) as error:
                      last_reason = f'request error: {error}'
                      print(f'RETRY {url} attempt {attempt}: {last_reason}')

                  if attempt < 6:
                      time.sleep(5)
              else:
                  raise SystemExit(f'Live AdSense ads.txt verification failed for {url}: {last_reason}')

          robots_url = 'https://keeptxred.com/robots.txt'
          status, final_url, content_type, mitigated, robots = fetch(
              robots_url,
              'KeepTXRed-AdSense-Smoke/2.0',
          )
          failures = []
          if status != 200:
              failures.append(f'HTTP {status}')
          if mitigated == 'challenge':
              failures.append('Cloudflare challenge')
          if not content_type.startswith('text/plain'):
              failures.append(f'unexpected content type {content_type!r}')
          if 'Disallow: /ads.txt' in robots:
              failures.append('ads.txt is explicitly disallowed')
          if strict_deployed_policy:
              if 'User-agent: Mediapartners-Google' not in robots:
                  failures.append('Mediapartners-Google is not explicitly named')
              if 'Allow: /ads.txt' not in robots:
                  failures.append('ads.txt is not explicitly allowed')

          if failures:
              raise SystemExit(
                  f'Live robots.txt AdSense verification failed for {robots_url}: '
                  + '; '.join(failures)
              )

          if strict_deployed_policy:
              print(
                  f'PASS robots.txt: {robots_url} -> {final_url}; '
                  'AdSense crawler named and /ads.txt explicitly allowed.'
              )
          else:
              print(
                  f'PASS robots.txt: {robots_url} -> {final_url}; '
                  'current production does not block /ads.txt.'
              )
          PY
