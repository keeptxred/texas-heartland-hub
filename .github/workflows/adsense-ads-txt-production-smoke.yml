name: AdSense ads.txt production smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adsense-ads-txt-production-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-ads-txt-production-smoke.yml'
  workflow_run:
    workflows:
      - Deploy verified KeepTXRed to Cloudflare
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-adsense-ads-txt-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live AdSense ads.txt
        shell: bash
        run: |
          python3 <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = 'https://keeptxred.com/ads.txt'
          expected = 'google.com, pub-1891256141359926, DIRECT, f08c47fec0942fa0'
          last_reason = 'not attempted'

          for attempt in range(1, 7):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'KeepTXRed-AdSense-Smoke/1.0',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      content_type = (response.headers.get('content-type') or '').lower()
                      challenged = (response.headers.get('cf-mitigated') or '').lower() == 'challenge'
                      body = response.read().decode('utf-8', errors='replace').strip()

                  failures = []
                  if status != 200:
                      failures.append(f'HTTP {status}')
                  if challenged:
                      failures.append('Cloudflare challenge')
                  if not content_type.startswith('text/plain'):
                      failures.append(f'unexpected content type {content_type!r}')
                  if body != expected:
                      failures.append(f'unexpected body {body!r}')

                  if not failures:
                      print(f'PASS ads.txt: HTTP {status}; text/plain; exact AdSense publisher declaration present.')
                      raise SystemExit(0)

                  last_reason = '; '.join(failures)
                  print(f'RETRY attempt {attempt}: {last_reason}')
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  last_reason = f'request error: {error}'
                  print(f'RETRY attempt {attempt}: {last_reason}')

              if attempt < 6:
                  time.sleep(5)

          raise SystemExit(f'Live AdSense ads.txt verification failed: {last_reason}')
          PY
