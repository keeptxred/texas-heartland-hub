name: One-shot Etsy Halloween SEO update

on:
  push:
    branches:
      - ops/etsy-halloween-seo-2026-09-11
    paths:
      - .github/workflows/etsy-halloween-seo-once.yml

jobs:
  update-halloween-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke deployed Printify to Etsy update
        shell: bash
        run: |
          set -euo pipefail
          url="https://keeptxred-site.freddy-coppola.workers.dev/api/public/ops/etsy-halloween-seo-20260911"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          code="$(curl --location --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --max-time 120 -D "$headers" -o "$body" -w '%{http_code}' "$url")"
          echo "HTTP $code"
          cat "$headers"
          echo '--- BODY ---'
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            exit 1
          fi
          if [[ ! -s "$body" ]]; then
            echo 'Empty 200 response from operation endpoint' >&2
            exit 2
          fi
          python3 - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          if data.get('ok') is not True:
              raise SystemExit(f"Halloween Etsy update failed: {data!r}")
          if data.get('updated') != 4:
              raise SystemExit(f"Expected four updated listings: {data!r}")
          print('Four Halloween listings updated through Printify and publish requested to Etsy')
          PY
