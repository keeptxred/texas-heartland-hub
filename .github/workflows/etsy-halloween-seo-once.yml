name: One-shot Etsy Halloween SEO update

on:
  push:
    branches:
      - ops/etsy-halloween-seo-2026-09-11
    paths:
      - .github/workflows/etsy-halloween-seo-once.yml

jobs:
  update-halloween-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke deployed Printify to Etsy update
        shell: bash
        run: |
          set -euo pipefail
          url="https://keeptxred-site.freddy-coppola.workers.dev/api/public/ops/etsy-halloween-seo-20260911"
          response="$(curl --retry 5 --retry-delay 3 --retry-all-errors --fail-with-body --silent --show-error --max-time 120 "$url")"
          echo "$response"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get('ok') is not True:
              raise SystemExit(f"Halloween Etsy update failed: {data!r}")
          if data.get('updated') != 4:
              raise SystemExit(f"Expected four updated listings: {data!r}")
          print('Four Halloween listings updated through Printify and publish requested to Etsy')
          PY
