name: One-time culture festival photorealism fix

on:
  push:
    branches:
      - fix/culture-festival-photorealism

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/culture-festival-photorealism
      - name: Patch culture prompt and tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/featured-image-core.ts')
          s = p.read_text()
          old = '''  if (subject.domain === "legal") {\n    return `${correction}${evidenceLock}Professional documentary photojournalism photograph, horizontal 16:9. Story: ${subject.title}. Photograph ${DOMAIN_STEER.legal}. Natural daylight or realistic courtroom lighting, 35mm camera, lifelike stone and wood, true photographic depth of field, realistic architecture, neutral news photography. PRIMARY SUBJECT: a believable real Texas courthouse or courtroom representing the judicial ruling. ${loc ? `Location context: ${loc}, Texas.` : "Texas setting."} Election-law context may appear only as subtle ordinary paperwork or voting materials in the background. Do not use a politician, Texas-shaped graphic, map, flagpole, capitol dome, campaign rally, podium, poster, illustration, vector art, cartoon, infographic, collage, text overlay, seal, logo, or symbolic state graphic.`.slice(0, 1800);\n  }\n  return `${correction}${evidenceLock}${militaryHonorsLock}Professional photorealistic editorial news photograph'''
          new = '''  if (subject.domain === "legal") {\n    return `${correction}${evidenceLock}Professional documentary photojournalism photograph, horizontal 16:9. Story: ${subject.title}. Photograph ${DOMAIN_STEER.legal}. Natural daylight or realistic courtroom lighting, 35mm camera, lifelike stone and wood, true photographic depth of field, realistic architecture, neutral news photography. PRIMARY SUBJECT: a believable real Texas courthouse or courtroom representing the judicial ruling. ${loc ? `Location context: ${loc}, Texas.` : "Texas setting."} Election-law context may appear only as subtle ordinary paperwork or voting materials in the background. Do not use a politician, Texas-shaped graphic, map, flagpole, capitol dome, campaign rally, podium, poster, illustration, vector art, cartoon, infographic, collage, text overlay, seal, logo, or symbolic state graphic.`.slice(0, 1800);\n  }\n  if (subject.domain === "culture") {\n    return `${correction}${evidenceLock}REAL DOCUMENTARY PHOTOGRAPH ONLY, horizontal 16:9, candid Texas event photojournalism captured with a physical 35mm camera, natural daylight, realistic lens depth, real materials, real food and real venue architecture. Story: ${subject.title}. PRIMARY SUBJECT: ${subject.concreteSubject}. Depict ${DOMAIN_STEER.culture}. ${loc ? `Location context: ${loc}, Texas.` : "Believable Texas setting."} For a festival move or planned event, prefer a believable outdoor venue, festival-ground preparation, food-vendor setup, tables, tents, or ordinary event infrastructure rather than inventing a packed crowd. The image must look like an unedited newspaper photograph, not promotional artwork. Absolutely no event flyer, advertisement, poster, banner, signboard, mascot, giant novelty object, typography, readable words, title text, logo, vector shapes, illustration, painting, cartoon, collage, or graphic design.`.slice(0, 1800);\n  }\n  return `${correction}${evidenceLock}${militaryHonorsLock}Professional photorealistic editorial news photograph'''
          if s.count(old) != 1:
              raise SystemExit(f'culture prompt insertion match count={s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = '''  if (subject.domain === "military" && MILITARY_HONORS_RE.test(`${subject.title} ${subject.firstParagraph}`)) items.push(\n    "politician", "governor", "press conference", "capitol building", "government signing ceremony",\n    "generic military base", "generic aircraft", "hangar", "unrelated combat", "generic troops",\n  );\n  if (rejectedReason)'''
          new2 = '''  if (subject.domain === "military" && MILITARY_HONORS_RE.test(`${subject.title} ${subject.firstParagraph}`)) items.push(\n    "politician", "governor", "press conference", "capitol building", "government signing ceremony",\n    "generic military base", "generic aircraft", "hangar", "unrelated combat", "generic troops",\n  );\n  if (subject.domain === "culture") items.push(\n    "event flyer", "advertisement", "promotional graphic", "event poster", "banner", "signboard",\n    "readable signage", "typography", "mascot", "giant novelty object", "oversized food mascot",\n  );\n  if (rejectedReason)'''
          if s.count(old2) != 1:
              raise SystemExit(f'culture negative insertion match count={s.count(old2)}')
          p.write_text(s.replace(old2, new2, 1))

          t = Path('src/lib/culture-image-photorealism.test.ts')
          t.write_text('''import { describe, expect, it } from "vitest";\nimport { buildImagePrompt, buildNegativeImagePrompt, type SubjectExtract } from "./featured-image-core";\n\nconst subject: SubjectExtract = {\n  title: "Texas Pickle Festival Moves to Helotes",\n  firstParagraph: "Organizers are moving the festival to the Helotes Festival Grounds.",\n  entities: ["Texas Pickle Festival", "Helotes Festival Grounds"],\n  locations: ["Helotes"],\n  domain: "culture",\n  concreteSubject: "Texas Pickle Festival moving to the Helotes Festival Grounds",\n};\n\ndescribe("culture image photorealism steering", () => {\n  it("forces festival coverage into documentary photography rather than promotional graphics", () => {\n    const prompt = buildImagePrompt(subject);\n    expect(prompt).toContain("REAL DOCUMENTARY PHOTOGRAPH ONLY");\n    expect(prompt).toContain("unedited newspaper photograph");\n    expect(prompt).toContain("Absolutely no event flyer");\n    expect(prompt).toContain("rather than inventing a packed crowd");\n  });\n\n  it("adds culture-specific promotional-art motifs to the negative prompt", () => {\n    const negative = buildNegativeImagePrompt(subject, "graphic design with text overlay");\n    expect(negative).toContain("event flyer");\n    expect(negative).toContain("promotional graphic");\n    expect(negative).toContain("readable signage");\n    expect(negative).toContain("rejected visual motif: graphic design with text overlay");\n  });\n});\n''')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-culture-festival-photorealism.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/featured-image-core.ts src/lib/culture-image-photorealism.test.ts .github/workflows/one-time-culture-festival-photorealism.yml
          git commit -m 'Force festival images toward documentary photography'
          git push origin HEAD:fix/culture-festival-photorealism
