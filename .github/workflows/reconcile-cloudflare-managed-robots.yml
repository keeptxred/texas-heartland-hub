name: Reconcile Cloudflare Managed Robots Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-cloudflare-managed-robots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-cloudflare-managed-robots
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_ZONE_NAME: keeptxred.com
      PRODUCTION_HOSTNAME: keeptxred.com

    steps:
      - name: Verify Cloudflare credentials are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_DEPLOY_API_TOKEN:-}" && -z "${CLOUDFLARE_FALLBACK_API_TOKEN:-}" ]]; then
            echo "No Cloudflare API token is available to reconcile the zone robots policy." >&2
            exit 1
          fi

      - name: Disable only Cloudflare managed robots.txt
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          reconciled=false
          attempted=0

          resolve_zone() {
            local token="$1"
            local response
            response="$(curl --silent --show-error \
              -H "Authorization: Bearer $token" \
              "$api/zones?name=$PRODUCTION_ZONE_NAME&status=active&per_page=50" 2>/dev/null || true)"
            python3 - "$response" "$PRODUCTION_ZONE_NAME" <<'PY'
          import json, sys
          raw, expected = sys.argv[1], sys.argv[2]
          try:
              data = json.loads(raw)
          except Exception:
              raise SystemExit(1)
          rows = [row for row in (data.get("result") or []) if row.get("name") == expected and row.get("id")]
          if data.get("success") is not True or len(rows) != 1:
              raise SystemExit(1)
          print(rows[0]["id"])
          PY
          }

          for token in "$CLOUDFLARE_DEPLOY_API_TOKEN" "$CLOUDFLARE_FALLBACK_API_TOKEN"; do
            [[ -n "$token" ]] || continue
            attempted=$((attempted + 1))
            zone_id="$(resolve_zone "$token" || true)"
            if [[ -z "$zone_id" ]]; then
              echo "Cloudflare token candidate $attempted cannot resolve the active zone; trying next candidate."
              continue
            fi

            before_file="$(mktemp)"
            update_file="$(mktemp)"
            after_file="$(mktemp)"
            before_status="$(curl --silent --show-error -o "$before_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "$api/zones/$zone_id/bot_management" || true)"
            if [[ "$before_status" != 2* ]]; then
              echo "Cloudflare token candidate $attempted cannot read Bot Management (HTTP $before_status); trying next candidate."
              rm -f "$before_file" "$update_file" "$after_file"
              continue
            fi

            managed_before="$(python3 - "$before_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          if data.get("success") is not True:
              raise SystemExit(1)
          print("true" if (data.get("result") or {}).get("is_robots_txt_managed") is True else "false")
          PY
            )"
            echo "Cloudflare managed robots.txt before reconciliation: $managed_before"

            if [[ "$managed_before" == "true" ]]; then
              update_status="$(curl --silent --show-error -o "$update_file" -w '%{http_code}' \
                -X PUT \
                -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/json' \
                --data '{"is_robots_txt_managed":false}' \
                "$api/zones/$zone_id/bot_management" || true)"
              if [[ "$update_status" != 2* ]]; then
                echo "Cloudflare token candidate $attempted cannot update Bot Management (HTTP $update_status); trying next candidate."
                rm -f "$before_file" "$update_file" "$after_file"
                continue
              fi
              if ! python3 - "$update_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          if data.get("success") is not True:
              raise SystemExit(1)
          PY
              then
                echo "Cloudflare token candidate $attempted returned an unsuccessful update response; trying next candidate."
                rm -f "$before_file" "$update_file" "$after_file"
                continue
              fi
            else
              echo "Cloudflare managed robots.txt is already disabled; no mutation needed."
            fi

            after_status="$(curl --silent --show-error -o "$after_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "$api/zones/$zone_id/bot_management" || true)"
            if [[ "$after_status" != 2* ]]; then
              echo "Cloudflare token candidate $attempted cannot verify Bot Management after reconciliation (HTTP $after_status); trying next candidate."
              rm -f "$before_file" "$update_file" "$after_file"
              continue
            fi

            if python3 - "$after_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          result = data.get("result") or {}
          if data.get("success") is not True or result.get("is_robots_txt_managed") is not False:
              raise SystemExit(1)
          PY
            then
              echo "Cloudflare managed robots.txt is disabled; site-owned robots policy is authoritative."
              reconciled=true
              rm -f "$before_file" "$update_file" "$after_file"
              break
            fi

            rm -f "$before_file" "$update_file" "$after_file"
          done

          if [[ "$reconciled" != "true" ]]; then
            echo "No configured Cloudflare token has sufficient zone Bot Management access to disable managed robots.txt." >&2
            echo "Required scope: read and edit Bot Management for the keeptxred.com zone." >&2
            exit 1
          fi

      - name: Verify live site-owned AI crawler policy
        shell: bash
        run: |
          set -euo pipefail
          robots_url="https://$PRODUCTION_HOSTNAME/robots.txt"
          robots_body=""

          for attempt in $(seq 1 20); do
            robots_body="$(curl --fail-with-body --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${robots_url}?geo-policy-check=${GITHUB_RUN_ID}-${attempt}" || true)"
            if ROBOTS_BODY="$robots_body" python3 - <<'PY'
          import os, sys
          body = os.environ.get("ROBOTS_BODY", "")
          required = [
              "OAI-SearchBot", "GPTBot", "ChatGPT-User", "ClaudeBot", "Claude-Web",
              "anthropic-ai", "PerplexityBot", "Perplexity-User", "Google-Extended",
              "Applebot-Extended", "Amazonbot", "Meta-ExternalAgent", "CCBot", "Bytespider",
          ]
          groups = {}
          active = []
          for raw in body.splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or ":" not in line:
                  continue
              key, value = [part.strip() for part in line.split(":", 1)]
              lower = key.lower()
              if lower == "user-agent":
                  active = [value]
                  groups.setdefault(value.lower(), [])
              elif lower in {"allow", "disallow"} and active:
                  for agent in active:
                      groups.setdefault(agent.lower(), []).append((lower, value))
          failures = []
          for agent in required:
              directives = groups.get(agent.lower(), [])
              if ("allow", "/") not in directives:
                  failures.append(f"{agent} missing explicit Allow: /")
              if ("disallow", "/") in directives:
                  failures.append(f"{agent} still has Disallow: /")
          if "Sitemap: https://keeptxred.com/sitemap.xml" not in body:
              failures.append("canonical sitemap directive missing")
          if failures:
              print("; ".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY
            then
              echo "Live robots.txt is site-owned and explicitly allows all required AI crawlers."
              exit 0
            fi
            echo "Live robots policy has not converged yet (attempt $attempt/20)."
            sleep 5
          done

          echo "Live robots.txt did not converge after Cloudflare managed robots.txt was disabled." >&2
          printf '%s\n' "$robots_body" >&2
          exit 1
