name: Backend separation

on:
  push:
    paths:
      - 'src/routes/**'
      - 'src/pages/tools/**'
      - 'src/components/moving-checklist.tsx'
      - 'src/components/vehicle-registration-guide.tsx'
      - 'src/lib/moving-checklist.ts'
      - 'src/lib/vehicle-registration.ts'
      - 'src/lib/content-quality.ts'
      - 'src/data/texas-cities.ts'
      - 'src/components/city-page.tsx'
      - 'src/shared/texas-platform/registry.ts'
      - 'src/shared/texas-platform/texas-life-*'
      - 'src/platform/governance-persistence.ts'
      - 'public/llms.txt'
      - 'scripts/shared/validate-backend-separation.mjs'
      - 'scripts/shared/validate-retired-lifestyle-code.mjs'
      - '.github/workflows/backend-separation.yml'
  pull_request:
    paths:
      - 'src/routes/**'
      - 'src/pages/tools/**'
      - 'src/components/moving-checklist.tsx'
      - 'src/components/vehicle-registration-guide.tsx'
      - 'src/lib/moving-checklist.ts'
      - 'src/lib/vehicle-registration.ts'
      - 'src/lib/content-quality.ts'
      - 'src/data/texas-cities.ts'
      - 'src/components/city-page.tsx'
      - 'src/shared/texas-platform/registry.ts'
      - 'src/shared/texas-platform/texas-life-*'
      - 'src/platform/governance-persistence.ts'
      - 'public/llms.txt'
      - 'scripts/shared/validate-backend-separation.mjs'
      - 'scripts/shared/validate-retired-lifestyle-code.mjs'
      - '.github/workflows/backend-separation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun scripts/shared/validate-backend-separation.mjs
      - run: bun scripts/shared/validate-retired-lifestyle-code.mjs
