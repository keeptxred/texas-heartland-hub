name: Sync Texas legislator authority profiles

on:
  workflow_dispatch:
  schedule:
    # Weekly (Mondays): promptly catch vacancies, resignations and new members.
    - cron: "17 12 * * 1"
    # Explicit quarterly backstop: Jan/Apr/Jul/Oct 2nd, even if Monday jobs are delayed.
    - cron: "41 12 2 1,4,7,10 *"
  push:
    branches: [main]
    paths:
      - scripts/legislators/sync-official-roster.mjs
      - .github/workflows/sync-texas-legislators.yml

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: texas-legislator-authority-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate official roster profiles
        run: node scripts/legislators/sync-official-roster.mjs
      - name: Validate complete district coverage and generated-source integrity
        run: node scripts/legislators/validate-roster.mjs

      - name: Validate and publish refreshed authority data as PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Refresh Texas legislator authority profiles
          PR_BODY: Automated official-roster refresh. The existing protected verify check must pass before the trusted same-repository auto-merge workflow can merge and deploy this data.
          COMMIT_MESSAGE: "data: refresh Texas legislator authority profiles"
        shell: bash
        run: |
          set -euo pipefail
          target='src/data/texas-legislators.generated.ts'
          if git diff --quiet -- "$target"; then
            echo 'Texas legislator authority data is already current.'
            exit 0
          fi
          unexpected=$(git status --short | awk '{print $2}' | grep -vxF "$target" || true)
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing to publish unexpected generated files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh texas-legislators "$target"

      - name: Alert on roster refresh failure without duplicate issues
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Texas legislator roster sync failed"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          details="Official-member roster refresh failed on $(date -u +%F). Inspect [the failed GitHub run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) before trusting a new roster. Previous verified data remains published; do not silently overwrite it."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$details"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$details"
          fi
