name: Sync Texas legislator authority profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"
  push:
    branches: [main]
    paths:
      - scripts/legislators/sync-official-roster.mjs
      - .github/workflows/sync-texas-legislators.yml

permissions:
  contents: write

concurrency:
  group: texas-legislator-authority-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate official roster profiles
        run: node scripts/legislators/sync-official-roster.mjs
      - name: Validate and commit refreshed authority data
        shell: bash
        run: |
          set -euo pipefail
          target='src/data/texas-legislators.generated.ts'
          if git diff --quiet -- "$target"; then
            echo 'Texas legislator authority data is already current.'
            exit 0
          fi

          unexpected=$(git status --short | awk '{print $2}' | grep -vxF "$target" || true)
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing to publish unexpected generated files:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'main advanced during generation; refusing to publish stale authority data.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'data: refresh Texas legislator authority profiles'
          git push origin HEAD:main
