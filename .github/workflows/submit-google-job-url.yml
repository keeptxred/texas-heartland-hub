name: Submit qualifying job URLs to Google

on:
  workflow_dispatch:
    inputs:
      submission_mode:
        description: "Submit one URL or every URL in the job manifest"
        required: true
        default: single_url
        type: choice
        options:
          - single_url
          - job_manifest
      url:
        description: "For single_url mode: full https://keeptxred.com/jobs/... URL"
        required: false
        type: string
      notification_type:
        description: "URL_UPDATED for a live/changed job; URL_DELETED after removal"
        required: true
        default: URL_UPDATED
        type: choice
        options:
          - URL_UPDATED
          - URL_DELETED
      eligibility_confirmation:
        description: "Type I_CONFIRM_JOBPOSTING after checking Google's requirements"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-job-indexing-${{ inputs.submission_mode }}-${{ inputs.url || 'manifest' }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require JobPosting eligibility confirmation
        env:
          CONFIRMATION: ${{ inputs.eligibility_confirmation }}
          SUBMISSION_MODE: ${{ inputs.submission_mode }}
          JOB_URL: ${{ inputs.url }}
        run: |
          if [ "$CONFIRMATION" != "I_CONFIRM_JOBPOSTING" ]; then
            echo "Submission blocked: confirm Google's JobPosting requirements."
            exit 1
          fi
          if [ "$SUBMISSION_MODE" = "single_url" ] && [ -z "$JOB_URL" ]; then
            echo "Submission blocked: single_url mode requires a URL."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit one URL notification
        if: ${{ inputs.submission_mode == 'single_url' }}
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          JOB_URL: ${{ inputs.url }}
          NOTIFICATION_TYPE: ${{ inputs.notification_type }}
        run: node scripts/seo/submit-google-job-url.mjs "$JOB_URL" "$NOTIFICATION_TYPE"

      - name: Submit job manifest notifications
        if: ${{ inputs.submission_mode == 'job_manifest' }}
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          NOTIFICATION_TYPE: ${{ inputs.notification_type }}
        run: node scripts/seo/submit-google-job-urls.mjs "$NOTIFICATION_TYPE"
