name: Diagnose Content Opportunities Vitest failure

on:
  push:
    branches:
      - fix/content-opportunity-canonical-queue
    paths:
      - '.github/workflows/diagnose-content-opportunity-vitest.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/content-opportunity-canonical-queue
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Print concise failing test output
        shell: bash
        run: |
          set +e
          bun run test > /tmp/vitest.log 2>&1
          code=$?
          set -e
          echo "exit_code=${code}"
          echo '--- failure lines ---'
          grep -nE 'FAIL|AssertionError|expected|Received|Test Files|Tests ' /tmp/vitest.log | tail -n 160 || true
          echo '--- tail ---'
          tail -n 260 /tmp/vitest.log
          exit "$code"
