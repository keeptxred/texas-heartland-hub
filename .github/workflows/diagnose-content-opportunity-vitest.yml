name: Diagnose Content Opportunities Vitest failure

on:
  push:
    branches:
      - fix/content-opportunity-canonical-queue
    paths:
      - '.github/workflows/diagnose-content-opportunity-vitest.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/content-opportunity-canonical-queue
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture concise failing test output
        shell: bash
        run: |
          set +e
          bun run test > /tmp/vitest.log 2>&1
          code=$?
          set -e
          mkdir -p diagnostics
          {
            echo "exit_code=${code}"
            echo '--- failure lines ---'
            grep -nE 'FAIL|AssertionError|expected|Received|Test Files|Tests ' /tmp/vitest.log | tail -n 120 || true
            echo '--- tail ---'
            tail -n 220 /tmp/vitest.log
          } > diagnostics/content-opportunity-vitest.log
          rm .github/workflows/diagnose-content-opportunity-vitest.yml
      - name: Commit diagnostic evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/content-opportunity-vitest.log .github/workflows/diagnose-content-opportunity-vitest.yml
          git commit -m 'Capture Content Opportunities Vitest failure'
          git push origin HEAD:fix/content-opportunity-canonical-queue
