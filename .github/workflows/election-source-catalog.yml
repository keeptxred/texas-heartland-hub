name: Maintain Election Central source catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/elections/rebuild-sources.mjs"
      - "scripts/elections/validate-sources.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-source-catalog.yml"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: election-source-catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild source catalog
        run: bun run elections:sources
      - name: Validate source references
        run: node scripts/elections/validate-sources.mjs
      - name: Validate election data
        run: bun run elections:validate
      - name: Publish source catalog as protected PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: Rebuild Election Central source catalog
          PR_BODY: Automated Election Central source-catalog rebuild. Source references and election data were validated before this PR opened; protected verify still gates merge and deployment.
          COMMIT_MESSAGE: Rebuild election source catalog
        shell: bash
        run: |
          set -euo pipefail
          target='src/data/elections/2026/sources.json'
          if git diff --quiet -- "$target"; then
            echo "Source catalog is already current."
            exit 0
          fi
          changed="$(git status --short | awk '{print $2}')"
          unexpected_files="$(grep -v '^src/data/elections/2026/sources.json$' <<<"$changed" || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the source-catalog allowlist:"
            echo "$unexpected_files"
            exit 1
          fi
          bash scripts/ci/publish-automation-pr.sh election-source-catalog "$target"
