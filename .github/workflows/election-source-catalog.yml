name: Maintain Election Central source catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/elections/rebuild-sources.mjs"
      - "scripts/elections/validate-sources.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/election-source-catalog.yml"

permissions:
  contents: write

concurrency:
  group: election-source-catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild source catalog
        run: bun run elections:sources

      - name: Validate source references
        run: node scripts/elections/validate-sources.mjs

      - name: Validate election data
        run: bun run elections:validate

      - name: Commit source catalog
        shell: bash
        run: |
          if git diff --quiet -- src/data/elections/2026/sources.json; then
            echo "Source catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/elections/2026/sources.json
          unexpected_files="$(git diff --cached --name-only | grep -v '^src/data/elections/2026/sources.json$' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "Refusing to publish files outside the source-catalog allowlist:"
            echo "$unexpected_files"
            exit 1
          fi
          git commit -m "Rebuild election source catalog"
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo "Main advanced during source-catalog generation; refusing to publish stale data."
            exit 1
          fi
          git push origin HEAD:main
