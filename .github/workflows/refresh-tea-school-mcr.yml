name: Refresh official 2026 TEA school district MCRs

on:
  push:
    branches: [main]
    paths:
      - scripts/authority/refresh-tea-2026-mcr.py
      - .github/workflows/refresh-tea-school-mcr.yml
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: refresh-tea-2026-school-mcr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Import and validate all district rates
        id: import
        run: python3 scripts/authority/refresh-tea-2026-mcr.py
      - name: Record verified dataset changes before PR action
        id: dataset_diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/tea-2026-final-mcr.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update reviewable dataset PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: refresh verified TEA 2026 district MCRs"
          branch: automation/tea-2026-district-mcr
          delete-branch: true
          title: "data: refresh verified official 2026 TEA district MCRs"
          body: |
            Automatically regenerated from TEA's final August 27, 2026 PDF.
            Parser rejects duplicate IDs, incomplete statewide rows, out-of-range
            rates and official reference mismatches. This is Tier One MCR only,
            not an adopted school property tax rate.
          add-paths: src/data/tea-2026-final-mcr.json

      - name: Fail if changed TEA data did not produce a reviewable PR
        id: pr_guard
        if: steps.import.outcome == 'success' && steps.pr.outcome == 'success'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          DATASET_CHANGED: ${{ steps.dataset_diff.outputs.changed }}
        run: |
          set -euo pipefail
          # create-pull-request normally resets the worktree after creating its branch.
          # Its operation output is authoritative: empty or none means no dataset change.
          if [[ "${DATASET_CHANGED:-}" == "true" && -z "${PR_NUMBER:-}" ]]; then
            echo "::error title=TEA refresh PR missing::Dataset changed (operation=$PR_OPERATION) but no reviewable pull request was created."
            exit 1
          fi
          echo "TEA PR result: operation=${PR_OPERATION:-none}; number=${PR_NUMBER:-none}"

      - name: Report TEA refresh and PR creation evidence
        if: always()
        shell: bash
        env:
          REFRESH_STATUS: ${{ steps.import.outcome }}
          PR_STATUS: ${{ steps.pr.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## Official TEA 2026 MCR refresh"
            echo "- Source: https://tea.texas.gov/about-tea/state-funding/ty2026-final-mcrs.pdf"
            echo "- Import validation: $REFRESH_STATUS"
            echo "- PR creation/update step: $PR_STATUS"
            echo "- PR operation: ${PR_OPERATION:-none (no dataset change)}"
            echo "- PR number: ${PR_NUMBER:-none}"
            echo "- PR URL: ${PR_URL:-none}"
            echo "- Dataset changes: see create-pull-request logs and operation above"
            echo "- If a changed dataset cannot produce a PR, inspect repository Actions setting 'Allow GitHub Actions to create and approve pull requests' and token permissions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish discoverable TEA refresh status on checked main
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_GUARD_OUTCOME: ${{ steps.pr_guard.outcome }}
          DIFF_OUTCOME: ${{ steps.dataset_diff.outcome }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          current_main="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$sha" != "$current_main" ]]; then
            echo "::warning title=Stale TEA refresh::main advanced during this run; do not overwrite newer commit's status"
            exit 0
          fi
          state=failure
          description="TEA refresh failed; inspect parser or PR creation logs"
          if [[ "$IMPORT_OUTCOME" == "success" && "$PR_OUTCOME" == "success" && "$PR_GUARD_OUTCOME" == "success" && "$DIFF_OUTCOME" == "success" ]]; then
            state=success
            description="Official TEA validation and change-only PR step passed"
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$sha" \
            -f state="$state" \
            -f context="keeptxred-tea-mcr-refresh" \
            -f target_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID" \
            -f description="$description"
          echo "TEA refresh $state on $sha; PR operation: ${PR_OPERATION:-none}; PR: ${PR_URL:-none}"
          [[ "$state" == "success" ]]
