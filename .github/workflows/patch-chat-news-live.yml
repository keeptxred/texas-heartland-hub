name: Patch chat news fallback integration

on:
  push:
    branches: [fix/chat-news-live-fallback]
    paths:
      - 'scripts/patch-chat-news-live.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/chat-news-live-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-chat-news-live.mjs
      - name: Commit integration
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'keeptxred'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/evergreen.functions.ts
          git commit -m 'fix: render chat news when database publication is unavailable'
          git push origin HEAD:fix/chat-news-live-fallback
