name: Temporary KTR publication hold retry patch

on:
  push:
    branches:
      - fix/ktr-publication-hold-retry-20260917
    paths:
      - '.github/workflows/tmp-ktr-hold-retry-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ktr-publication-hold-retry-20260917
          fetch-depth: 0
      - name: Apply narrow retry UX patch
        shell: python
        run: |
          from pathlib import Path

          component = Path('src/components/admin/ContentOpportunityPanel.tsx')
          text = component.read_text(encoding='utf-8')

          old = '''function canAttemptArticlePublish(preflight: RewritePreflightResult | undefined): boolean {
            return !!preflight && (preflight.rewriteable || preflight.reason === "PENDING_EXTRACTION");
          }'''
          new = '''function canAttemptArticlePublish(preflight: RewritePreflightResult | undefined): boolean {
            return !!preflight && (
              preflight.rewriteable ||
              preflight.reason === "PENDING_EXTRACTION" ||
              preflight.reason === "PUBLICATION_HOLD"
            );
          }'''
          if old not in text:
            raise SystemExit('canAttemptArticlePublish target not found')
          text = text.replace(old, new, 1)

          old_label = '''                                : preflight?.reason === "PENDING_EXTRACTION"
                                ? "Check Source & Publish"
                                : "Publish to Keep Texas Red"}'''
          new_label = '''                                : preflight?.reason === "PENDING_EXTRACTION"
                                ? "Check Source & Publish"
                                : preflight?.reason === "PUBLICATION_HOLD"
                                ? "Recheck & Publish"
                                : "Publish to Keep Texas Red"}'''
          if old_label not in text:
            raise SystemExit('publish button label target not found')
          text = text.replace(old_label, new_label, 1)
          component.write_text(text, encoding='utf-8')

          test = Path('src/lib/content-opportunity-pending-extraction.test.ts')
          test_text = test.read_text(encoding='utf-8')
          anchor = '''  it("refreshes persisted preflight after a failed publish attempt", () => {'''
          addition = '''  it("keeps publication holds manually recheckable without bypassing backend verification", () => {
            expect(source).toContain('preflight.reason === "PUBLICATION_HOLD"');
            expect(source).toContain('"Recheck & Publish"');
            expect(source).toContain('const res = await publishFeedItem(r.id);');
          });

'''
          if addition not in test_text:
            if anchor not in test_text:
              raise SystemExit('test insertion anchor not found')
            test_text = test_text.replace(anchor, addition + anchor, 1)
            test.write_text(test_text, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/admin/ContentOpportunityPanel.tsx src/lib/content-opportunity-pending-extraction.test.ts
          git diff --cached --check
          git commit -m 'Keep publication holds manually retryable'
          git push origin HEAD:fix/ktr-publication-hold-retry-20260917
