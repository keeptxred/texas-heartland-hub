name: Sync OpenAI image key to KeepTXRed Worker

on:
  workflow_run:
    workflows: ["Deploy verified KeepTXRed to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeptxred-openai-worker-secret
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN OPENAI_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Sync OpenAI API key to production Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | bunx wrangler secret put OPENAI_API_KEY --name keeptxred-site
